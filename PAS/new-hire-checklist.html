<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Employee Onboarding Checklist — Children of Promise LLC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11pt; line-height: 1.4; color: #333;
            padding: 0.5in 0.75in;
        }
        .header {
            text-align: center; border-bottom: 2px solid #2c5282;
            padding-bottom: 12px; margin-bottom: 20px;
        }
        .header h1 { font-size: 14pt; color: #2c5282; margin-bottom: 4px; }
        .header .org-name { font-size: 11pt; color: #666; margin-bottom: 6px; }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 20px;
        }
        .info-grid.three-col {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .info-field {
            display: flex; align-items: baseline; gap: 8px;
        }
        .info-field label { font-weight: 600; white-space: nowrap; font-size: 10pt; }
        .info-field .line {
            flex: 1; border-bottom: 1px solid #999;
            min-width: 80px; height: 1.2em;
        }
        .section-title {
            font-size: 11pt; font-weight: 700; color: #2c5282;
            margin-top: 18px; margin-bottom: 10px;
            border-bottom: 1px solid #cbd5e0; padding-bottom: 4px;
        }
        .checklist { list-style: none; margin-bottom: 16px; }
        .checklist li {
            font-size: 10pt; padding: 4px 0 4px 24px;
            position: relative; border-bottom: 1px solid #f0f0f0;
        }
        /* The box is a real element now so it can be clicked, rather than a ::before mark. */
        .checklist li .box {
            position: absolute; left: 0; top: 3px;
            font-size: 13pt; line-height: 1;
        }
        .checklist li .date-col {
            float: right; width: 110px;
            border-bottom: 1px solid #ccc;
            font-size: 9pt; color: #444;
            text-align: center; min-height: 1.2em;
        }
        /* A faint prompt on screen only, so the empty date space is obviously clickable
           without printing the word "date" on a filed document. */
        .checklist li .date-col:empty::after { content: 'date'; color: #c0c6cf; }
        .checklist li .hint {
            display: block; font-size: 8.5pt; color: #166534; margin-top: 2px;
        }
        .done-note { font-size: 9pt; color: #64748b; margin: -8px 0 14px; }
        .signature-section {
            margin-top: 25px; display: grid;
            grid-template-columns: 2fr 1fr; gap: 24px;
        }
        .sig-field label {
            font-weight: 600; font-size: 10pt; display: block; margin-bottom: 18px;
        }
        .sig-field .sig-line { border-bottom: 1px solid #333; margin-top: 22px; }
        .footer {
            margin-top: 25px; padding-top: 10px;
            border-top: 1px solid #cbd5e0; display: flex;
            justify-content: space-between; font-size: 9pt; color: #666;
        }
        @media print {
            body { padding: 0; }
            @page { margin: 0.4in 0.5in; size: letter; }
            .no-print { display: none; }
            .checklist li .date-col:empty::after { content: ''; }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="/pas/logo-sm.png" alt="Children of Promise" style="height:60px;margin-bottom:8px;">
        <div class="org-name">Children of Promise LLC — Millstadt, IL</div>
        <h1>New Employee Onboarding Checklist</h1>
    </div>

    <div class="info-grid">
        <div class="info-field">
            <label>Employee Name:</label><div class="line" data-k="employeeName"></div>
        </div>
        <div class="info-field">
            <label>Position:</label><div class="line" data-k="position"></div>
        </div>
        <div class="info-field">
            <label>Hire Date:</label><div class="line" data-k="hireDate"></div>
        </div>
        <div class="info-field">
            <label>Supervisor:</label><div class="line" data-k="supervisor"></div>
        </div>
        <div class="info-field">
            <label>Mentor Assigned:</label><div class="line" data-k="mentor"></div>
        </div>
        <div class="info-field">
            <label>Orientation Dates:</label><div class="line" data-k="orientationDates"></div>
        </div>
    </div>

    <!-- Where the hire date came from, and how much of the list is ticked. -->
    <div class="no-print done-note" id="progressNote"></div>

    <!-- The list is rendered from the data below so every item has a stable name and a
         completion date that saves with it. -->
    <div id="lists"></div>

    <div class="signature-section">
        <div class="sig-field"><label>Supervisor Signature:<div class="sig-line" data-k="supervisorSig"></div></label></div>
        <div class="sig-field"><label>Date:<div class="sig-line" data-k="supervisorSigDate"></div></label></div>
    </div>
    <div class="signature-section">
        <div class="sig-field"><label>Employee Signature:<div class="sig-line" data-k="employeeSig"></div></label></div>
        <div class="sig-field"><label>Date:<div class="sig-line" data-k="employeeSigDate"></div></label></div>
    </div>

    <div class="footer">
        <span>PAS Documentation — Confidential</span>
        <span>Children of Promise LLC — New Employee Onboarding Checklist</span>
    </div>

<script src="pas-store.js"></script>
<script src="/staff/auth.js"></script>
<script src="pas-form.js"></script>
<script>
/* One record per person: onboarding happens once. Scope is 'staff', so the toolbar's
   dropdown doubles as the list of who has an onboarding record and who does not.

   Each item carries an explicit id rather than relying on its position, so re-ordering
   or inserting a step later cannot silently re-point a saved tick at a different task.
   Each tick has its own single-cell group, which behaves as a checkbox: click to tick,
   click again to clear. */

const SECTIONS = [
    { title: 'Pre-Start (Before First Day)', items: [
        ['offerLetter', 'Offer letter signed and returned'],
        ['backgroundCheck', 'Background check completed'],
        ['w4i9', 'W-4 and I-9 forms completed'],
        ['emergencyContact', 'Emergency contact information collected'],
        ['assignMentor', 'Assign mentor/buddy'],
        ['workspace', 'Prepare workspace/classroom access'],
        ['scheduleOrientation', 'Schedule orientation dates']
    ] },
    { title: 'Day 1\u20133: Orientation Week 1', items: [
        ['tour', 'Welcome and building tour'],
        ['introStaff', 'Introduce to all staff members'],
        ['employeeHandbook', 'Provide Employee Handbook'],
        ['parentHandbook', 'Provide Parent Handbook'],
        ['jobDescription', 'Review job description'],
        ['personnelPolicies', 'Review personnel policies'],
        ['healthSafety', 'Review health and safety procedures'],
        ['brightwheel', 'Set up Brightwheel account'],
        ['emailAccess', 'Set up email/technology access'],
        ['emergencyProcedures', 'Review emergency procedures and exits']
    ] },
    { title: 'Day 4\u201310: Orientation Week 2', items: [
        ['observeClassroom', 'Observe in assigned classroom'],
        ['meetFamilies', 'Meet children and families'],
        ['curriculum', 'Review curriculum (Creative Curriculum)'],
        ['assessmentTools', 'Review assessment tools (Teaching Strategies, ASQ)'],
        ['dailySchedule', 'Review classroom daily schedule'],
        ['behaviorGuidance', 'Review behavior guidance policies'],
        ['foodProgram', 'Review food program procedures'],
        ['allergyProtocols', 'Review allergy/medical condition protocols'],
        ['signInOut', 'Review sign-in/sign-out procedures']
    ] },
    { title: 'Within 30 Days', items: [
        ['cprFirstAid', 'Complete CPR/First Aid certification (if not current)'],
        ['mandatedReporter', 'Complete mandatory reporter training'],
        ['foodHandler', 'Complete food handler certification'],
        ['initialModules', 'Complete initial required training modules'],
        ['mentorCheckIn1', 'Mentor check-in meeting #1'],
        ['gatewaysRegistry', 'Register on Gateways to Opportunity']
    ] },
    { title: 'Within 60 Days', items: [
        ['mentorCheckIn2', 'Mentor check-in meeting #2'],
        ['pdPlanStarted', 'Begin Individual Professional Development Plan'],
        ['firstObservation', 'First classroom observation by supervisor'],
        ['initialPerformance', 'Review of initial performance']
    ] },
    { title: 'Within 90 Days', items: [
        ['ninetyDayReview', '90-Day Introductory Review completed'],
        ['orientationFeedback', 'Orientation Feedback Form completed'],
        ['pdPlanFinal', 'Individual Professional Development Plan finalized'],
        ['employmentDecision', 'Decision: extend to regular employment / extend probation / terminate'],
        ['mentorConcluded', 'Mentor assignment concluded or extended']
    ] },
    { title: 'Ongoing (First Year)', items: [
        ['firstEvaluation', 'Jan 15 OR Jun 30: First formal performance evaluation'],
        ['pdHours20', 'Complete minimum 20 hours professional development'],
        ['staffMeetings', 'Attend all-staff meetings'],
        ['programEvaluation', 'Complete Staff Program Evaluation Survey (when distributed)']
    ] }
];

function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.getElementById('lists').innerHTML = SECTIONS.map(sec =>
    '<div class="section-title">' + esc(sec.title) + '</div><ul class="checklist">'
    + sec.items.map(([id, text]) =>
        '<li><span class="box" data-radio="chk_' + id + '" data-val="yes">\u2610</span>'
        + '<span class="date-col" data-k="date_' + id + '"></span>'
        + esc(text)
        + '<span class="hint" id="hint_' + id + '"></span></li>').join('')
    + '</ul>').join('');

const TOTAL = SECTIONS.reduce((n, s) => n + s.items.length, 0);

function ticked() {
    return [...document.querySelectorAll('.checklist [data-radio]')]
        .filter(el => el.textContent.trim() === '\u2611').length;
}

let hireText = '';
function updateProgress() {
    const note = document.getElementById('progressNote');
    if (note) note.textContent = hireText + ticked() + ' of ' + TOTAL + ' steps ticked.';
}

PasForm.init({
    key: 'pas_new_hire_checklist',
    scope: 'staff',
    prefill: function (staff) {
        const hire = PasForm.hireDate(staff);
        hireText = hire
            ? 'Hire date read from the staff notes'
              + (hire.precision === 'month' ? ' (month only, so the day is approximate). ' : '. ')
            : 'No start date could be read from this staff record. ';

        /* What the staff record already shows is offered as a note rather than as a tick:
           a registry id proves registration, but nothing else on the record proves a step
           on this list was actually done, and a wrongly pre-ticked compliance box is worse
           than an empty one. */
        const reg = document.getElementById('hint_gatewaysRegistry');
        if (reg) {
            reg.textContent = String(staff.RegistryId || '').trim()
                ? 'Registry ID ' + staff.RegistryId + ' is already on the staff record.'
                : '';
        }

        return {
            employeeName: staff.Name,
            position: PasForm.position(staff),
            hireDate: hire ? PasForm.fmtDate(hire.d) : ''
        };
    },
    onLoad: updateProgress
});

document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.checklist [data-radio]')) updateProgress();
});
</script>
</body>
</html>
