<!DOCTYPE html>
<html lang="en">
<head>

    <title>PAS Self-Assessment Tool — Children of Promise LLC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .print-btn {
            position: fixed; top: 16px; right: 16px;
            padding: 10px 20px; background: #2c5282; color: white;
            border: none; border-radius: 6px; font-size: 10pt;
            font-weight: 600; cursor: pointer; z-index: 9999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .print-btn:hover { background: #1a365d; }

        .card {
            background: white; border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            width: 100%; max-width: 800px;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Header */
        .card-header {
            text-align: center; padding: 20px 24px 16px;
            border-bottom: 2px solid #2c5282;
        }
        .card-header img { height: 50px; margin-bottom: 6px; }
        .card-header .org-name { font-size: 10pt; color: #666; margin-bottom: 4px; }
        .card-header h1 { font-size: 14pt; color: #2c5282; font-weight: 700; }

        /* Progress section */
        .progress-section { padding: 16px 24px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .progress-label {
            font-size: 9pt; font-weight: 600; color: #64748b;
            text-transform: uppercase; letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .progress-bar-wrap {
            width: 100%; height: 6px; background: #e2e8f0;
            border-radius: 3px; overflow: hidden; margin-bottom: 8px;
        }
        .progress-bar-fill {
            height: 100%; background: #2c5282; border-radius: 3px;
            transition: width 0.3s ease;
        }
        .item-title {
            font-size: 13pt; font-weight: 700; color: #1e3a8a;
        }

        /* Body */
        .card-body {
            padding: 24px; flex: 1; overflow-y: auto;
            max-height: calc(100vh - 340px);
        }

        /* Indicator sections */
        .indicator-section {
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 8px; padding: 16px; margin-bottom: 14px;
        }
        .indicator-header {
            font-size: 10pt; font-weight: 700; color: #2c5282;
            margin-bottom: 10px;
        }
        .criteria-list { list-style: none; padding: 0; }
        .criteria-list li {
            display: flex; align-items: flex-start; gap: 8px;
            padding: 5px 0; font-size: 9.5pt; color: #334155;
        }
        .criteria-list li input[type="checkbox"] {
            margin-top: 2px; width: 16px; height: 16px;
            accent-color: #2c5282; cursor: pointer; flex-shrink: 0;
        }
        .criteria-list li label { cursor: pointer; line-height: 1.4; }

        /* Score section */
        .score-section {
            margin-top: 18px; padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }
        .score-label {
            font-size: 9pt; font-weight: 600; color: #64748b;
            text-transform: uppercase; letter-spacing: 0.04em;
            margin-bottom: 12px;
        }
        .score-scale {
            display: flex; justify-content: space-between;
            gap: 4px; max-width: 500px; margin: 0 auto;
        }
        .score-option {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; cursor: pointer;
        }
        .score-circle {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid #cbd5e0; display: flex;
            align-items: center; justify-content: center;
            font-size: 11pt; font-weight: 700; color: #64748b;
            transition: all 0.2s;
        }
        .score-circle:hover {
            border-color: #2c5282; color: #2c5282;
            background: #edf2f7;
        }
        .score-option.selected .score-circle {
            background: #2c5282; color: white;
            border-color: #2c5282;
        }
        .score-desc {
            font-size: 7pt; color: #94a3b8; text-align: center;
            max-width: 60px; line-height: 1.2;
        }
        .score-option.selected .score-desc { color: #2c5282; font-weight: 600; }

        .notes-section label {
            font-size: 9pt; font-weight: 600; color: #64748b;
            text-transform: uppercase; letter-spacing: 0.04em;
            display: block; margin-bottom: 6px;
        }

            border-radius: 6px; padding: 10px; font-family: inherit;
            font-size: 9.5pt; resize: vertical;
        }
        .notes-section textarea:focus { outline: none; border-color: #2c5282; }

        /* Navigation */
        .card-nav {
            padding: 16px 24px; border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .nav-buttons {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 14px;
        }
        .nav-btn {
            padding: 10px 20px; border: none; border-radius: 6px;

        }
        .nav-btn-prev { background: #e2e8f0; color: #475569; }
        .nav-btn-prev:hover { background: #cbd5e0; }
        .nav-btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn-next { background: #2c5282; color: white; }
        .nav-btn-next:hover { background: #1a365d; }

            font-size: 7pt; font-weight: 700; color: #94a3b8;

        .item-dot.current {
            border-color: #2c5282; color: #2c5282;
            box-shadow: 0 0 0 3px rgba(44,82,130,0.2);
        }
        .item-dot.scored {

        }

            content: '✓'; position: absolute;
            font-size: 9px; color: #48bb78; font-weight: 900;
            top: -6px; right: -4px;
        }

            .card-body { max-height: none; overflow: visible; }

            .score-desc { font-size: 6pt; }

const SCORE_LABELS = {
    1: 'Inadequate',
    2: '',
    3: 'Minimally Adequate',
    4: '',
    5: 'Good',
    6: '',
    7: 'Excellent'
};

const STORAGE_KEY = 'pas_self_assessment';
const SYNC_KEY = 'pas_item_scores';

// State
let state = {
    currentItem: 0,
    scores: {},
    checks: {},
    notes: {}
};

// Load state from localStorage
function loadState() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
        try {
            const parsed = JSON.parse(stored);
            state.currentItem = parsed.currentItem || 0;
            state.scores = parsed.scores || {};
            state.checks = parsed.checks || {};
            state.notes = parsed.notes || {};
        } catch (e) {
            console.error('Error loading state:', e);
        }
    }
}

// Save state to localStorage
function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    syncToSummaryProfile();
}

// Sync scores to PAS Item Summary Profile format
function syncToSummaryProfile() {
    const scoredCount = Object.keys(state.scores).length;
    if (scoredCount > 0) {
        // Load existing summary profile data or create new
        let profileData = {};
        const existing = localStorage.getItem(SYNC_KEY);
        if (existing) {
            try { profileData = JSON.parse(existing); } catch(e) {}
        }
        // Update scores
        profileData.scores = profileData.scores || {};
        Object.keys(state.scores).forEach(key => {
            profileData.scores[key] = String(state.scores[key]);
        });
        localStorage.setItem(SYNC_KEY, JSON.stringify(profileData));
    }
}

// Render current item
function renderItem() {
    const item = PAS_ASSESSMENT[state.currentItem];
    const body = document.getElementById('cardBody');

    // Update progress
    document.getElementById('progressLabel').textContent = `Item ${state.currentItem + 1} of 25`;
    document.getElementById('progressBar').style.width = ((state.currentItem + 1) / 25 * 100) + '%';
    document.getElementById('itemTitle').textContent = `${item.num}. ${item.name}`;

    // Update scored count
    const scoredCount = Object.keys(state.scores).length;
    document.getElementById('scoredCount').textContent = `${scoredCount} of 25 scored`;

    // Build content
    let html = '';

    // Indicators with criteria
    item.indicators.forEach(indicator => {
        html += `<div class="indicator-section">`;
        html += `<div class="indicator-header">${indicator.id} — ${indicator.theme}</div>`;
        html += `<ul class="criteria-list">`;
        indicator.criteria.forEach((criterion, cIdx) => {
            const checkId = `${indicator.id}_${cIdx}`;
            const checked = state.checks[checkId] ? 'checked' : '';
            html += `<li>
                <input type="checkbox" id="chk_${checkId}" ${checked} onchange="toggleCheck('${checkId}', this.checked)">
                <label for="chk_${checkId}">${criterion}</label>
            </li>`;
        });
        html += `</ul></div>`;
    });

    // Score section
    html += `<div class="score-section">`;
    html += `<div class="score-label">Score for Item ${item.num}</div>`;
    html += `<div class="score-scale">`;
    for (let s = 1; s <= 7; s++) {
        const selected = state.scores[item.num] === s ? 'selected' : '';
        html += `<div class="score-option ${selected}" onclick="setScore(${item.num}, ${s})">
            <div class="score-circle">${s}</div>
            <div class="score-desc">${SCORE_LABELS[s]}</div>
        </div>`;
    }
    html += `</div></div>`;

    // Notes
    const noteVal = state.notes[item.num] || '';
    html += `<div class="notes-section">
        <label for="itemNotes">Notes / Observations</label>
        <textarea id="itemNotes" placeholder="Enter observations for this item..." onchange="setNotes(${item.num}, this.value)" oninput="setNotes(${item.num}, this.value)">${noteVal}</textarea>
    </div>`;

    body.innerHTML = html;

    // Update navigation buttons
    document.getElementById('btnPrev').disabled = state.currentItem === 0;
    document.getElementById('btnNext').disabled = state.currentItem === 24;

    // Update dots
    renderDots();

    // Show completion banner if all scored
    const banner = document.getElementById('completionBanner');
    if (scoredCount === 25) {
        banner.classList.add('show');
    } else {
        banner.classList.remove('show');
    }

    // Scroll body to top
    body.scrollTop = 0;
}

// Render navigation dots
function renderDots() {
    const dotsContainer = document.getElementById('itemDots');
    let html = '';
    for (let i = 0; i < 25; i++) {
        const item = PAS_ASSESSMENT[i];
        const isCurrent = i === state.currentItem ? 'current' : '';
        const isScored = state.scores[item.num] ? 'scored' : '';
        html += `<div class="item-dot ${isCurrent} ${isScored}" onclick="goToItem(${i})" title="Item ${item.num}: ${item.name}">${item.num}</div>`;
    }
    dotsContainer.innerHTML = html;
}

// Navigation
function navigate(dir) {
    const newIdx = state.currentItem + dir;
    if (newIdx >= 0 && newIdx < 25) {
        state.currentItem = newIdx;
        saveState();
        renderItem();
    }
}

function goToItem(idx) {
    state.currentItem = idx;
    saveState();
    renderItem();
}

// Score
function setScore(itemNum, score) {
    state.scores[itemNum] = score;
    saveState();
    renderItem();
}

// Checkbox
function toggleCheck(checkId, isChecked) {
    if (isChecked) {
        state.checks[checkId] = true;
    } else {
        delete state.checks[checkId];
    }
    saveState();
}

// Notes
let notesTimeout;
function setNotes(itemNum, value) {
    state.notes[itemNum] = value;
    clearTimeout(notesTimeout);
    notesTimeout = setTimeout(() => saveState(), 500);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
});

// Initialize
loadState();
renderItem();
</script>
</body>
</html>
