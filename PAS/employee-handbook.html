<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children of Promise LLC — PAS Documentation &amp; Employee Handbook</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --accent2: #27ae60;
            --light-bg: #f8f9fa;
            --border: #dee2e6;
            --text: #333;
            --muted: #6c757d;
            --warning: #e74c3c;
            --highlight: #fff3cd;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.7; color: var(--text);
            max-width: 1100px; margin: 0 auto; padding: 2rem; background: #fff;
        }
        header { text-align: center; padding: 2rem 0; border-bottom: 3px solid var(--primary); margin-bottom: 2rem; }
        header h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.25rem; }
        header h2 { color: var(--accent); font-size: 1.2rem; font-weight: 400; }
        header p { color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
        nav { background: var(--light-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem 2rem; margin-bottom: 2.5rem; }
        nav h2 { color: var(--primary); margin-bottom: 1rem; font-size: 1.2rem; }
        nav ol { padding-left: 1.5rem; columns: 2; }
        nav ol li { margin-bottom: 0.3rem; font-size: 0.9rem; }
        nav a { color: var(--accent); text-decoration: none; }
        nav a:hover { text-decoration: underline; }
