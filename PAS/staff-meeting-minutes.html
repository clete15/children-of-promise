<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Meeting Minutes — Children of Promise LLC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11pt; line-height: 1.4; color: #333;
            padding: 0.5in 0.75in;
        }
        .header {
            text-align: center; border-bottom: 2px solid #2c5282;
            padding-bottom: 12px; margin-bottom: 20px;
        }
        .header h1 { font-size: 14pt; color: #2c5282; margin-bottom: 4px; }
        .header .org-name { font-size: 11pt; color: #666; margin-bottom: 6px; }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 16px;
        }
        .info-field {
            display: flex; align-items: baseline; gap: 8px;
        }
        .info-field label { font-weight: 600; white-space: nowrap; font-size: 10pt; }
        .info-field .line {
            flex: 1; border-bottom: 1px solid #999; min-width: 80px; height: 1.2em;
        }
        .section-title {
            font-size: 11pt; font-weight: 700; color: #2c5282;
            margin-top: 16px; margin-bottom: 8px;
            border-bottom: 1px solid #cbd5e0; padding-bottom: 4px;
        }
        .write-lines {
            border-bottom: 1px solid #999; height: 1.4em; margin-bottom: 6px;
        }
        .attendees-box {
            border: 1px solid #cbd5e0; padding: 10px;
            min-height: 60px; margin-bottom: 16px;
        }
        .minutes-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .minutes-table th, .minutes-table td {
            border: 1px solid #cbd5e0; padding: 6px 8px;
            text-align: left; font-size: 9.5pt; vertical-align: top;
        }
        .minutes-table th {
            background-color: #edf2f7; font-weight: 600;
            color: #2c5282; font-size: 9pt;
        }
        .minutes-table td { height: 2.5em; }
        .narrative-section { margin-bottom: 14px; }
        .narrative-section p { font-weight: 600; margin-bottom: 6px; font-size: 10pt; }
        .footer {
            margin-top: 25px; padding-top: 10px;
            border-top: 1px solid #cbd5e0; display: flex;
            justify-content: space-between; font-size: 9pt; color: #666;
        }
        @media print {
            body { padding: 0; }
            @page { margin: 0.5in 0.6in; size: letter; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
<button onclick="window.print()" class="no-print" style="position:fixed;top:16px;right:16px;padding:10px 20px;background:#2c5282;color:white;border:none;border-radius:6px;font-size:10pt;font-weight:600;cursor:pointer;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);">🖨️ Print</button>
    <div class="header">
        <img src="/pas/logo-sm.png" alt="Children of Promise" style="height:60px;margin-bottom:8px;">
        <div class="org-name">Children of Promise LLC — Millstadt, IL</div>
        <h1>Staff Meeting Minutes</h1>
    </div>

    <div class="info-grid">
        <div class="info-field">
            <label>Meeting Date:</label><div class="line"></div>
        </div>
        <div class="info-field">
            <label>Time:</label><div class="line"></div>
        </div>
        <div class="info-field">
            <label>Location:</label><div class="line"></div>
        </div>
        <div class="info-field">
            <label>Facilitator:</label><div class="line"></div>
        </div>
    </div>

    <div class="section-title">Attendees</div>
    <div class="attendees-box"></div>

    <div class="section-title">Agenda Items</div>
    <table class="minutes-table">
        <thead>
            <tr>
                <th style="width:18%">Topic</th>
                <th style="width:30%">Discussion Notes</th>
                <th style="width:22%">Action Item</th>
                <th style="width:15%">Responsible</th>
                <th style="width:15%">Due Date</th>
            </tr>
        </thead>
        <tbody>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
        </tbody>
    </table>

    <div class="section-title">Follow-Up from Previous Meeting</div>
    <div class="write-lines"></div><div class="write-lines"></div>
    <div class="write-lines"></div><div class="write-lines"></div>

    <div class="section-title">Next Meeting</div>
    <div class="info-field" style="margin-bottom:16px;">
        <label>Date/Time:</label><div class="line"></div>
    </div>

    <div style="margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="info-field">
            <label>Minutes Prepared By:</label><div class="line"></div>
        </div>
        <div class="info-field">
            <label>Date Distributed:</label><div class="line"></div>
        </div>
    </div>

    <div class="footer">
        <span>PAS Documentation — Confidential</span>
        <span>Children of Promise LLC — Staff Meeting Minutes</span>
    </div>
</body>
</html>
