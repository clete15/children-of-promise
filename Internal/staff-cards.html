<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Cards – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; }

        .staff-layout { display:flex;min-height:calc(100vh - 90px);align-items:flex-start;justify-content:center;padding:20px; }
        .staff-wrapper { width:100%;max-width:1100px; }

        .page-title-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px;
        }
        .page-title-bar h2 { color: white; font-size: 1.3rem; font-weight: 800; }
        .page-title-bar .subtitle { color: rgba(255,255,255,0.7); font-size: 0.82rem; margin-top: 2px; }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .staff-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
        }
        /* Cards are edited in place, so they must not behave like buttons: no
           pointer cursor and no lift on hover, which made fields feel unstable
           while typing. */
        .staff-card { cursor: default; }
        .staff-card:hover { box-shadow: 0 6px 22px rgba(0,0,0,0.13); }

        /* Inline fields. Sized to sit in the same row as the label it replaces. */
        .cf-input {
            font: inherit; font-size: 0.78rem; color: #1e293b;
            text-align: right;
            border: 1px solid transparent; border-radius: 4px;
            padding: 3px 6px; background: transparent;
            max-width: 62%; min-width: 0;
        }
        .cf-input:hover { border-color: #e2e8f0; background: #fbfcfe; }
        .cf-input:focus {
            outline: none; border-color: #2563eb; background: #fff;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
        }
        select.cf-input { text-align: left; cursor: pointer; }
        .cf-input.placeholder-empty { color: #94a3b8; font-style: italic; }

        /* Fields that need the full width of the card. */
        .cf-stack { display: block; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
        .cf-stack:last-child { border-bottom: none; }
        .cf-stack > .cf-label {
            display: block; color: #64748b; font-weight: 600;
            font-size: 0.72rem; margin-bottom: 3px;
        }
        .cf-stack > .cf-input { max-width: 100%; width: 100%; text-align: left; }
        textarea.cf-input {
            width: 100%; max-width: 100%; text-align: left;
            resize: vertical; min-height: 46px; line-height: 1.35;
        }
        .cf-check { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; }

        /* Grouped credential levels, three across inside one card. */
        .cf-triple { display: flex; gap: 6px; }
        .cf-triple > label { flex: 1; min-width: 0; }
        .cf-triple > label > span {
            display: block; color: #64748b; font-weight: 600;
            font-size: 0.66rem; margin-bottom: 2px;
        }
        .cf-triple select { width: 100%; max-width: 100%; }

        /* Unsaved changes. The bar only appears once something is edited, so a
           card at rest stays quiet. */
        .card-dirty-bar {
            display: none;
            padding: 10px 20px; background: #fffbeb;
            border-top: 1px solid #fde68a;
            align-items: center; gap: 8px;
        }
        .staff-card.dirty .card-dirty-bar { display: flex; }
        .staff-card.dirty { box-shadow: 0 0 0 2px #f59e0b, 0 6px 22px rgba(0,0,0,0.13); }
        .card-dirty-bar .msg { flex: 1; font-size: 0.72rem; color: #92400e; font-weight: 600; }
        .btn-inline-save, .btn-inline-cancel {
            padding: 6px 14px; border-radius: 5px; font-size: 0.74rem;
            font-weight: 700; cursor: pointer; border: none;
        }
        .btn-inline-save { background: #16a34a; color: #fff; }
        .btn-inline-save:hover { background: #15803d; }
        .btn-inline-save:disabled { background: #94a3b8; cursor: default; }
        .btn-inline-cancel { background: #fff; color: #64748b; border: 1.5px solid #e2e8f0; }
        .btn-inline-cancel:hover { border-color: #94a3b8; }

        .card-header {
            padding: 16px 20px;
            display: flex; align-items: center; gap: 14px;
            border-bottom: 1px solid #e2e8f0;
        }
        .card-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: #2563eb; color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1rem; flex-shrink: 0;
        }
        .card-avatar.vacant { background: #94a3b8; }
        .card-name-block { flex: 1; min-width: 0; }
        .card-name { font-size: 0.95rem; font-weight: 700; color: #1e293b; }
        .card-role { font-size: 0.78rem; color: #64748b; margin-top: 1px; }
        .card-badge {
            padding: 3px 10px; border-radius: 12px;
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; white-space: nowrap;
        }
        .badge-pfa { background: #dbeafe; color: #1d4ed8; }
        .badge-pi { background: #fef3c7; color: #92400e; }
        .badge-inccra { background: #dcfce7; color: #166534; }
        .badge-na { background: #f1f5f9; color: #64748b; }

        .card-body { padding: 14px 20px; }
        .card-field {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid #f1f5f9;
            font-size: 0.8rem;
        }
        .card-field:last-child { border-bottom: none; }
        .card-field .cf-label { color: #64748b; font-weight: 600; }
        .card-field .cf-value { color: #1e293b; font-weight: 500; text-align: right; }
        .card-field .cf-value.empty { color: #cbd5e1; font-style: italic; }

        /* Director review state. The seed data was extracted from Gateways
           reports, so unreviewed is the honest default and is made obvious. */
        .review-chip { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        .review-chip.reviewed { background: #f0fdf4; color: #166534; }
        .review-chip.unreviewed { background: #fffbeb; color: #92400e; }
        .staff-card.needs-review { border-left: 3px solid #f59e0b; }

        .card-footer {
            padding: 12px 20px; background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex; gap: 8px;
        }
        .card-btn {
            flex: 1; padding: 7px 12px;
            border: 1.5px solid #e2e8f0; border-radius: 6px;
            background: white; color: #475569;
            font-size: 0.75rem; font-weight: 600;
            cursor: pointer; text-align: center;
            transition: background 0.12s, border-color 0.12s;
        }
        .card-btn:hover { background: #f1f5f9; border-color: #2563eb; color: #2563eb; }

        /* Edit modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 12px; width: 100%; max-width: 520px;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }
        .modal-header {
            padding: 18px 24px; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-header h3 { font-size: 1rem; font-weight: 700; color: #1e293b; }
        .modal-close {
            background: none; border: none; font-size: 1.3rem;
            cursor: pointer; color: #64748b; padding: 4px;
        }
        .modal-close:hover { color: #1e293b; }
        .modal-body { padding: 20px 24px; }
        .modal-body .form-group { margin-bottom: 14px; }
        .modal-body .form-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: #64748b; margin-bottom: 4px; text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .modal-body .form-group input,
        .modal-body .form-group select {
            width: 100%; padding: 8px 12px; border: 1.5px solid #e2e8f0;
            border-radius: 6px; font-size: 0.88rem; font-family: inherit;
            color: #1e293b;
        }
        .modal-body .form-group input:focus,
        .modal-body .form-group select:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .modal-body .form-row { display: flex; gap: 12px; }
        .modal-body .form-row .form-group { flex: 1; }
        .modal-footer {
            padding: 14px 24px; border-top: 1px solid #e2e8f0;
            display: flex; gap: 10px; justify-content: flex-end;
        }
        .modal-footer .btn-cancel {
            padding: 9px 20px; background: #f1f5f9; color: #475569;
            border: 1px solid #e2e8f0; border-radius: 6px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .modal-footer .btn-cancel:hover { background: #e2e8f0; }
        .modal-footer .btn-save {
            padding: 9px 24px; background: #2563eb; color: white;
            border: none; border-radius: 6px;
            font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }
        .modal-footer .btn-save:hover { background: #1d4ed8; }

        /* Add staff button */
        .add-staff-card {
            background: white; border-radius: 12px;
            border: 2px dashed #cbd5e1;
            display: flex; align-items: center; justify-content: center;
            min-height: 200px; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .add-staff-card:hover { border-color: #2563eb; background: #f8fafc; }
        .add-staff-card span { font-size: 0.9rem; font-weight: 700; color: #64748b; }
        .add-staff-card:hover span { color: #2563eb; }

        @media (max-width: 680px) {
            .staff-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Staff Cards &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="staff-layout">
    <div class="staff-wrapper">
        <div class="page-title-bar">
            <div>
                <h2>👩‍🏫 Staff Cards</h2>
                <div class="subtitle">Click a card to view or edit staff details</div>
            </div>
        </div>

        <!-- Wrapper, not the grid itself: the grid is rendered per section so
             teaching staff and the ownership group are listed separately. -->
        <div id="staffGrid">
            <!-- Cards rendered by JS -->
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Edit Staff</h3>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editName" placeholder="e.g. Keyona Hentz">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Role / Title</label>
                    <!-- Staff are Teacher, Assistant Teacher or Director. A title
                         already on file that is not one of these is added as an
                         option on open, so opening a card never silently changes it. -->
                    <select id="editRole">
                        <option value="">—</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Assistant Teacher">Assistant Teacher</option>
                        <option value="Director">Director</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Group</label>
                    <!-- Ownership is kept separate from classroom staff because the
                         ExceleRate credential thresholds are proportions of
                         teaching staff, not of everyone on the payroll. -->
                    <select id="editStaffGroup">
                        <option value="">Teaching staff</option>
                        <option value="Ownership">Ownership group</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Program</label>
                    <select id="editProgram">
                        <option value="PFA">PFA</option>
                        <option value="PI">PI</option>
                        <option value="INCCRA">INCCRA</option>
                        <option value="n/a">N/A</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Classroom</label>
                    <!-- Filled from the classroom table on load. Exact room names
                         matter: the PAS worksheets match staff to a room by name,
                         so free text like "Twos" would leave someone off a form. -->
                    <select id="editClassroom">
                        <option value="">— none (no assigned room) —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>FTE</label>
                    <input type="text" id="editFTE" placeholder="e.g. 1.0">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Education Level</label>
                    <select id="editEducation">
                        <option value="">—</option>
                        <option value="High School/GED">High School/GED</option>
                        <option value="Some College">Some College</option>
                        <option value="Associate's">Associate's</option>
                        <option value="Bachelor's">Bachelor's</option>
                        <option value="Master's">Master's</option>
                        <option value="Doctorate">Doctorate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Years Experience</label>
                    <input type="text" id="editExperience" placeholder="e.g. 8">
                </div>
            </div>
            <!-- Gateways credentials, broken into levels rather than one free-text
                 box. ExceleRate 4B counts staff at ECE Level 3+ and infant/toddler
                 staff at ITC Level 2, which cannot be counted reliably from prose.
                 These recombine into the same stored field on save. -->
            <div class="form-row">
                <div class="form-group">
                    <label>Gateways ECE Level</label>
                    <select id="editEceLevel">
                        <option value="">— none —</option>
                        <option value="1">ECE Level 1</option>
                        <option value="2">ECE Level 2</option>
                        <option value="3">ECE Level 3</option>
                        <option value="4">ECE Level 4</option>
                        <option value="5">ECE Level 5</option>
                        <option value="6">ECE Level 6</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Gateways Infant/Toddler Level</label>
                    <select id="editItLevel">
                        <option value="">— none —</option>
                        <option value="1">IT Level 1</option>
                        <option value="2">IT Level 2</option>
                        <option value="3">IT Level 3</option>
                        <option value="4">IT Level 4</option>
                        <option value="5">IT Level 5</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Gateways Director Level</label>
                    <select id="editDirLevel">
                        <option value="">— none —</option>
                        <option value="I">Director Level I</option>
                        <option value="II">Director Level II</option>
                        <option value="III">Director Level III</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>CDA</label>
                    <label style="font-weight:normal;display:flex;align-items:center;gap:8px;margin-top:6px;">
                        <input type="checkbox" id="editCda"> Holds a CDA
                    </label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1 1 100%;">
                    <label>Second classroom (scheduled part time)</label>
                    <!-- A second room the person is actually scheduled into, not
                         irregular fill-in cover. They appear on the PAS teaching
                         staff worksheet for both rooms, and their credentials
                         count toward both rooms' requirements. Leave blank unless
                         it is really on the schedule. -->
                    <select id="editSecondaryClassroom" style="max-width:340px;">
                        <option value="">— none —</option>
                    </select>
                </div>
            </div>
            <!-- Straight off the official transcript. The PAS worksheet asks for
                 these per person, so recording them here stops that form printing
                 blank. Whether Gateways HAS the transcript is tracked separately:
                 hours the Registry never received cannot raise a credential. -->
            <div class="form-row">
                <div class="form-group">
                    <label>Total semester hours</label>
                    <input type="text" id="editShTotal" placeholder="e.g. 53">
                </div>
                <div class="form-group">
                    <label>ECE semester hours</label>
                    <input type="text" id="editShEce" placeholder="e.g. 22">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Transcript with Gateways?</label>
                    <select id="editTranscript">
                        <option value="">— unknown —</option>
                        <option value="On file">On file with the Registry</option>
                        <option value="Not submitted">NOT submitted</option>
                        <option value="Submitted">Submitted, awaiting processing</option>
                        <option value="N/A">Not applicable</option>
                    </select>
                </div>
                <div class="form-group"></div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1 1 100%;">
                    <label>Other credentials</label>
                    <!-- Anything not covered by the levels above (Gold IT2,
                         Autism 101, and so on) is kept here verbatim so nothing
                         is lost when the record round-trips. -->
                    <input type="text" id="editOtherCreds" placeholder="e.g. Gold IT2, Autism 101">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Gateways Registry ID</label>
                    <input type="text" id="editRegistryId" placeholder="e.g. N285894">
                </div>
                <div class="form-group">
                    <label>Reviewed By</label>
                    <input type="text" id="editReviewedBy" placeholder="Director confirming accuracy">
                </div>
            </div>
            <div class="form-group">
                <label>Date Reviewed</label>
                <input type="date" id="editReviewedDate">
            </div>
            <div class="form-group">
                <label>Notes</label>
                <input type="text" id="editNotes" placeholder="Additional notes...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveStaff()">Save</button>
        </div>
    </div>
</div>

<!-- Shared auth + apiFetch. -->
<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
/* Staff records come from the database via /api/staff.
   They used to live in localStorage with a DATA_VERSION constant that reset the
   list to hardcoded defaults whenever it was bumped — meaning any edit made here
   could be silently discarded. The seed list now lives on the server and is
   inserted once, when the table is first empty.

   Records are shared by the PAS qualification worksheets, PICC CB6/PI9, the
   ExceleRate training thresholds and CB4 ratios, so this is the single copy. */

// Loaded from the server. Field names match the Staff table columns so there is
// no mapping layer to keep in step.
let staffList = [];
let editingId = null;   // null = adding a new record

async function loadStaff() {
    try {
        const res = await apiFetch('/api/staff');
        staffList = await res.json();
        if (!Array.isArray(staffList)) staffList = [];
    } catch (e) {
        console.error('Failed to load staff', e);
        staffList = [];
        const grid = document.getElementById('staffGrid');
        if (grid) grid.innerHTML = '<div style="padding:20px;color:#dc2626;">Could not load staff records: ' + e.message + '</div>';
    }
}

function getInitials(name) {
    if (!name) return '?';
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function getBadgeClass(program) {
    const p = (program || '').toLowerCase();
    if (p === 'pfa') return 'badge-pfa';
    if (p === 'pi') return 'badge-pi';
    if (p === 'inccra') return 'badge-inccra';
    return 'badge-na';
}

function renderCards() {
    const grid = document.getElementById('staffGrid');

    // Unreviewed records first: this data was extracted from Gateways PDFs and
    // needs the director to confirm it before it backs a compliance claim.
    const byReviewThenName = (a, b) => {
        const ar = a.ReviewedBy ? 1 : 0, br = b.ReviewedBy ? 1 : 0;
        return ar !== br ? ar - br : (a.Name || '').localeCompare(b.Name || '');
    };
    const isOwner = s => (s.StaffGroup || '') === 'Ownership';
    const teaching = staffList.filter(s => !isOwner(s)).sort(byReviewThenName);
    const owners = staffList.filter(isOwner).sort(byReviewThenName);

    grid.innerHTML =
        sectionHtml('Teaching Staff', teaching,
            'Assigned to classrooms. These are the staff the PAS worksheets and the '
            + 'ExceleRate credential thresholds are calculated from.', true)
        + (owners.length ? sectionHtml('Ownership Group', owners,
            'Owners and administrators. Listed separately because the ExceleRate '
            + 'credential percentages are proportions of teaching staff.', false) : '');
}

function sectionHtml(title, list, blurb, withAddButton) {
    let html = `<h3 style="margin:22px 0 4px;font-size:1rem;color:#1f3f66;">${title}`
        + `<span style="font-weight:normal;color:#64748b;font-size:0.8rem;"> — ${list.length}</span></h3>`
        + `<p style="margin:0 0 12px;font-size:0.78rem;color:#64748b;max-width:70ch;">${blurb}</p>`
        + '<div class="staff-grid">';
    html += list.map(cardHtml).join('');
    if (withAddButton) {
        html += `
    <div class="add-staff-card" onclick="addNewStaff()">
        <span>+ Add Staff Member</span>
    </div>`;
    }
    return html + '</div>';
}

function cardHtml(s) {
    const name = s.Name || '';
    const isVacant = name === 'New Teacher' || name.toLowerCase().includes('tbd');
    const reviewed = !!(s.ReviewedBy || '').trim();
    const creds = parseCredentials(s.EceCredentials || s.Gateways || '');
    const rooms = window.CLASSROOM_LIST || [];

    // data-f carries the API field name, so saving is a straight read of the card.
    const txt = (f, val, ph, extra) => `<input type="text" class="cf-input" data-f="${f}"`
        + ` value="${escAttr(val)}" placeholder="${escAttr(ph || '')}"${extra || ''}>`;
    const sel = (f, val, opts, extra) => `<select class="cf-input" data-f="${f}"${extra || ''}>`
        + opts.map(o => {
            const [v, label] = Array.isArray(o) ? o : [o, o];
            return `<option value="${escAttr(v)}"${String(val || '') === String(v) ? ' selected' : ''}>${escHtml(label)}</option>`;
        }).join('') + '</select>';
    const row = (label, control) => `<div class="card-field"><span class="cf-label">${label}</span>${control}</div>`;
    const stack = (label, control) => `<div class="cf-stack"><span class="cf-label">${label}</span>${control}</div>`;
    // A room already on file that is not in the list is kept and marked, so
    // opening a card can never quietly discard it.
    const roomOpts = extra => [['', extra]].concat(rooms.map(r => [r, r]))
        .concat(![''].concat(rooms).includes(s[extra === '— none —' ? 'SecondaryClassroom' : 'Classroom'] || '')
            ? [] : []);
    const roomList = current => {
        const base = rooms.slice();
        if (current && !base.includes(current)) base.push(current);
        return base;
    };

    return `
    <div class="staff-card ${reviewed ? '' : 'needs-review'}" data-id="${s.Id}">
        <div class="card-header">
            <div class="card-avatar ${isVacant ? 'vacant' : ''}">${escHtml(getInitials(name))}</div>
            <div class="card-name-block">
                <input type="text" class="cf-input" data-f="name" value="${escAttr(name)}"
                       style="text-align:left;font-weight:700;font-size:0.95rem;max-width:100%;width:100%;"
                       placeholder="Full name">
                <div style="display:flex;gap:4px;margin-top:3px;">
                    ${sel('role', s.Role, [['', '— role —'], 'Teacher', 'Assistant Teacher', 'Director']
                        .concat(s.Role && !['', 'Teacher', 'Assistant Teacher', 'Director'].includes(s.Role)
                            ? [[s.Role, s.Role + ' (non-standard)']] : []),
                        ' style="flex:2;font-size:0.72rem;"')}
                    ${txt('fte', s.Fte, 'FTE', ' style="flex:1;text-align:center;font-size:0.72rem;" title="FTE"')}
                </div>
            </div>
            ${sel('program', s.Program || 'n/a', [['PFA', 'PFA'], ['PI', 'PI'], ['INCCRA', 'INCCRA'], ['n/a', 'N/A']],
                ' style="max-width:80px;font-size:0.7rem;"')}
        </div>
        <div class="card-body">
            ${row('Review', reviewed
                ? `<span class="review-chip reviewed" title="Confirmed by ${escAttr(s.ReviewedBy)}${s.ReviewedDate ? ' on ' + escAttr(s.ReviewedDate) : ''}">✓ Reviewed</span>`
                : '<span class="review-chip unreviewed" title="Extracted from Gateways reports; not yet confirmed by the director">Needs review</span>')}
            ${row('Group', sel('staffGroup', s.StaffGroup, [['', 'Teaching staff'], ['Ownership', 'Ownership group']]))}
            ${stack('Classroom', sel('classroom', s.Classroom,
                [['', '— none (no assigned room) —']].concat(roomList(s.Classroom).map(r => [r, r]))))}
            ${stack('Second classroom <span style="font-weight:400;color:#94a3b8;">(part time)</span>',
                sel('secondaryClassroom', s.SecondaryClassroom,
                [['', '— none —']].concat(roomList(s.SecondaryClassroom).map(r => [r, r]))))}
            ${row('Education', sel('education', s.Education,
                [['', '—'], 'High School/GED', 'Some College', "Associate's", "Bachelor's", "Master's", 'Doctorate']))}
            <div class="cf-stack">
                <span class="cf-label">Gateways credential levels</span>
                <div class="cf-triple">
                    <label><span>ECE</span>${sel('_ece', creds.ece, [['', '—'], '1', '2', '3', '4', '5', '6'])}</label>
                    <label><span>Infant/Toddler</span>${sel('_it', creds.it, [['', '—'], '1', '2', '3', '4', '5'])}</label>
                    <label><span>Director</span>${sel('_dir', creds.dir, [['', '—'], 'I', 'II', 'III'])}</label>
                </div>
            </div>
            ${row('CDA', `<label class="cf-check"><input type="checkbox" data-f="_cda"${creds.cda ? ' checked' : ''}> holds a CDA</label>`)}
            ${stack('Other credentials', txt('_other', creds.other.join(', '), 'e.g. Gold IT2, Autism 101'))}
            ${row('Semester hrs — total', txt('semesterHoursTotal', s.SemesterHoursTotal, 'e.g. 53', ' style="max-width:80px;"'))}
            ${row('Semester hrs — ECE', txt('semesterHoursEce', s.SemesterHoursEce, 'e.g. 22', ' style="max-width:80px;"'))}
            ${row('Transcript w/ Gateways', sel('transcriptOnFile', s.TranscriptOnFile,
                [['', '— unknown —'], ['On file', 'On file'], ['Submitted', 'Submitted, pending'],
                 ['Not submitted', 'NOT submitted'], ['N/A', 'N/A']]))}
            ${row('PD hours', txt('pdHoursYtd', s.PdHoursYtd, 'e.g. 20', ' style="max-width:70px;" title="ExceleRate asks for 20 hours per classroom teaching staff member, per calendar year"')
                + ' <span style="color:#6b7280;">in year</span> '
                + txt('pdHoursYear', s.PdHoursYear, String(new Date().getFullYear()), ' style="max-width:70px;" title="The calendar year these hours were earned. The 20-hour expectation runs on the actual year, not the school year, so hours recorded against an earlier year no longer count."'))}
            ${row('Experience (yrs)', txt('experienceYears', s.ExperienceYears, 'e.g. 8', ' style="max-width:80px;"'))}
            ${row('Registry ID', txt('registryId', s.RegistryId, 'e.g. N285894', ' style="max-width:110px;"'))}
            ${row('Reviewed by', txt('reviewedBy', s.ReviewedBy, 'Director confirming'))}
            ${row('Date reviewed', `<input type="date" class="cf-input" data-f="reviewedDate" value="${escAttr(s.ReviewedDate)}" style="max-width:130px;">`)}
            <details${s.Notes ? '' : ''}>
                <summary style="cursor:pointer;font-size:0.72rem;color:#64748b;font-weight:600;padding:6px 0;">
                    Notes${s.Notes ? ' <span style="font-weight:400;">(' + String(s.Notes).length + ' chars)</span>' : ''}</summary>
                <textarea class="cf-input" data-f="notes" rows="4" placeholder="Verification trail, pending items, history">${escHtml(s.Notes)}</textarea>
            </details>
        </div>
        <div class="card-dirty-bar">
            <span class="msg">Unsaved changes</span>
            <button class="btn-inline-cancel" onclick="revertCard(${s.Id})">Cancel</button>
            <button class="btn-inline-save" onclick="saveCard(${s.Id})">Save</button>
        </div>
        <div class="card-footer">
            <button class="card-btn" onclick="deleteStaff(${s.Id})" style="color:#dc2626;">🗑️ Remove</button>
        </div>
    </div>`;
}

/* Escaping. Notes carry apostrophes and quotation marks from the Gateways
   reports, and dropping them raw into a value attribute would break the input
   and silently truncate the field. */
function escAttr(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escHtml(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Read every field off one card into an API-shaped object.
function readCard(card) {
    const body = {};
    card.querySelectorAll('[data-f]').forEach(el => {
        const f = el.getAttribute('data-f');
        if (f.startsWith('_')) return;            // credential parts, handled below
        body[f] = el.type === 'checkbox' ? el.checked : el.value.trim();
    });
    const g = f => card.querySelector(`[data-f="_${f}"]`);
    const parts = [];
    if (g('ece').value) parts.push('ECE Level ' + g('ece').value);
    if (g('it').value) parts.push('IT Level ' + g('it').value);
    if (g('dir').value) parts.push('Director Level ' + g('dir').value);
    if (g('cda').checked) parts.push('CDA');
    const other = g('other').value.split(',').map(t => t.trim()).filter(Boolean);
    body.eceCredentials = parts.concat(other).join(', ');
    body.gateways = g('ece').value ? 'ECE Credential - Level ' + g('ece').value : '';
    // A named reviewer always carries a date.
    if (body.reviewedBy && !body.reviewedDate) body.reviewedDate = new Date().toISOString().split('T')[0];
    return body;
}

function markDirty(card) {
    if (card) card.classList.add('dirty');
}

function revertCard(id) {
    const card = document.querySelector(`.staff-card[data-id="${id}"]`);
    const rec = staffList.find(x => String(x.Id) === String(id));
    if (!card || !rec) return;
    card.outerHTML = cardHtml(rec);
}

/* Saves one card. Only changed fields are sent, so two people editing different
   cards cannot overwrite each other's untouched columns. */
async function saveCard(id) {
    const card = document.querySelector(`.staff-card[data-id="${id}"]`);
    const rec = staffList.find(x => String(x.Id) === String(id));
    if (!card || !rec) return;

    const body = readCard(card);
    if (!body.name) { alert('A name is required.'); return; }

    const COL = {
        name: 'Name', role: 'Role', program: 'Program', classroom: 'Classroom',
        secondaryClassroom: 'SecondaryClassroom', fte: 'Fte', education: 'Education',
        eceCredentials: 'EceCredentials', gateways: 'Gateways', experienceYears: 'ExperienceYears',
        registryId: 'RegistryId', notes: 'Notes', reviewedBy: 'ReviewedBy',
        reviewedDate: 'ReviewedDate', staffGroup: 'StaffGroup',
        semesterHoursTotal: 'SemesterHoursTotal', semesterHoursEce: 'SemesterHoursEce',
        transcriptOnFile: 'TranscriptOnFile', pdHoursYtd: 'PdHoursYtd',
        pdHoursYear: 'PdHoursYear'
    };
    const changed = {};
    Object.keys(body).forEach(k => {
        if (!COL[k]) return;
        if (String(body[k] || '') !== String(rec[COL[k]] || '')) changed[k] = body[k];
    });

    const btn = card.querySelector('.btn-inline-save');
    const msg = card.querySelector('.card-dirty-bar .msg');
    if (!Object.keys(changed).length) {
        card.classList.remove('dirty');
        return;
    }
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
        const res = await apiFetch('/api/staff/' + encodeURIComponent(id),
            { method: 'PUT', body: JSON.stringify(changed) });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Save failed');
        // Update the local copy so the next diff is against what is really stored.
        Object.keys(changed).forEach(k => { rec[COL[k]] = changed[k]; });
        card.classList.remove('dirty');
        if (msg) msg.textContent = 'Unsaved changes';
        // Re-render this card only, so the review chip and section placement
        // refresh without losing anyone else's in-progress edits.
        const movedGroup = Object.prototype.hasOwnProperty.call(changed, 'staffGroup');
        if (movedGroup) renderCards(); else card.outerHTML = cardHtml(rec);
    } catch (e) {
        if (msg) msg.textContent = 'Save failed: ' + e.message;
        if (btn) { btn.disabled = false; btn.textContent = 'Retry save'; }
        return;
    }
}

// id === null opens a blank form for a new record.
function openEdit(id) {
    editingId = id === null ? null : String(id);
    const s = (id === null ? null : staffList.find(x => String(x.Id) === String(id))) || {};
    document.getElementById('modalTitle').textContent = id === null ? 'Add Staff' : 'Edit \u2013 ' + (s.Name || '');
    document.getElementById('editName').value = s.Name || '';
    document.getElementById('editProgram').value = s.Program || 'n/a';
    document.getElementById('editStaffGroup').value = s.StaffGroup || '';
    document.getElementById('editFTE').value = s.Fte || '';
    document.getElementById('editEducation').value = s.Education || '';
    document.getElementById('editExperience').value = s.ExperienceYears || '';

    // Role and classroom are dropdowns now. Keep a value already on file that is
    // not in the list, rather than snapping it to the first option and losing it.
    setSelectPreserving('editRole', s.Role || '');
    populateClassroomOptions();
    setSelectPreserving('editClassroom', s.Classroom || '', true);
    setSelectPreserving('editSecondaryClassroom', s.SecondaryClassroom || '', true);
    document.getElementById('editShTotal').value = s.SemesterHoursTotal || '';
    document.getElementById('editShEce').value = s.SemesterHoursEce || '';
    document.getElementById('editTranscript').value = s.TranscriptOnFile || '';

    // Split the stored credential text into the level dropdowns.
    const creds = parseCredentials(s.EceCredentials || s.Gateways || '');
    document.getElementById('editEceLevel').value = creds.ece;
    document.getElementById('editItLevel').value = creds.it;
    document.getElementById('editDirLevel').value = creds.dir;
    document.getElementById('editCda').checked = creds.cda;
    document.getElementById('editOtherCreds').value = creds.other.join(', ');
    document.getElementById('editRegistryId').value = s.RegistryId || '';
    document.getElementById('editReviewedBy').value = s.ReviewedBy || '';
    document.getElementById('editReviewedDate').value = s.ReviewedDate || '';
    document.getElementById('editNotes').value = s.Notes || '';
    document.getElementById('editModal').classList.add('active');
}

/* ── Dropdown helpers ──────────────────────────────────────────────────────
   The point of these dropdowns is that role and classroom feed the PAS
   worksheets, which match staff to a room by exact name. Free text like "Twos"
   silently leaves someone off a form. But a value already on file must never be
   destroyed just because it is not in the list, so anything unrecognised is
   added as an option and marked. */

function setSelectPreserving(selectId, value, flagUnknown) {
    const sel = document.getElementById(selectId);
    // Drop any option added by a previous open.
    [...sel.querySelectorAll('option[data-adhoc]')].forEach(o => o.remove());
    if (value && ![...sel.options].some(o => o.value === value)) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value + (flagUnknown ? '  (not a known room — please reselect)' : '  (not a standard title)');
        opt.setAttribute('data-adhoc', '1');
        sel.insertBefore(opt, sel.firstChild);
    }
    sel.value = value;
}

// Room lists come from the classroom table, so they stay right when rooms change.
function populateClassroomOptions() {
    [['editClassroom', '— none (no assigned room) —'], ['editSecondaryClassroom', '— none —']]
        .forEach(([id, blank]) => {
            const sel = document.getElementById(id);
            const current = sel.value;
            sel.innerHTML = `<option value="">${blank}</option>`
                + (window.CLASSROOM_LIST || []).map(c => `<option value="${c}">${c}</option>`).join('');
            sel.value = current;
        });
}

async function loadClassroomList() {
    try {
        const res = await apiFetch('/api/classrooms');
        const rooms = await res.json();
        window.CLASSROOM_LIST = rooms.map(r => r.Room).filter(Boolean);
    } catch (e) {
        console.warn('Could not load classrooms; the room dropdown will be empty.', e);
        window.CLASSROOM_LIST = [];
    }
}

/* Pull levels out of the stored credential text. Handles both the "ECE Level 5"
   and "ECE Credential - Level 5" spellings. Whatever is not recognised is passed
   through untouched so credentials like "Gold IT2" survive a round trip. */
function parseCredentials(text) {
    const res = { ece: '', it: '', dir: '', cda: false, other: [] };
    String(text || '').split(',').map(t => t.trim()).filter(Boolean).forEach(tok => {
        let m;
        if ((m = tok.match(/^ECE\b(?:\s*Credential)?\s*-?\s*Level\s*(\d)$/i))) { res.ece = m[1]; return; }
        if ((m = tok.match(/^(?:IT|ITC|Infant\s*\/?\s*Toddler)\b(?:\s*Credential)?\s*-?\s*Level\s*(\d)$/i))) { res.it = m[1]; return; }
        if ((m = tok.match(/^Director\b(?:\s*Credential)?\s*-?\s*Level\s*(III|II|I|\d)$/i))) {
            const v = m[1];
            res.dir = /^\d$/.test(v) ? ['', 'I', 'II', 'III'][+v] || '' : v.toUpperCase();
            return;
        }
        if (/^CDA$/i.test(tok)) { res.cda = true; return; }
        res.other.push(tok);
    });
    return res;
}

// Rebuild the stored string: levels first, then CDA, then anything else.
function composeCredentials() {
    const ece = document.getElementById('editEceLevel').value;
    const it = document.getElementById('editItLevel').value;
    const dir = document.getElementById('editDirLevel').value;
    const cda = document.getElementById('editCda').checked;
    const other = document.getElementById('editOtherCreds').value
        .split(',').map(t => t.trim()).filter(Boolean);
    const parts = [];
    if (ece) parts.push('ECE Level ' + ece);
    if (it) parts.push('IT Level ' + it);
    if (dir) parts.push('Director Level ' + dir);
    if (cda) parts.push('CDA');
    return parts.concat(other).join(', ');
}

function closeModal() {
    document.getElementById('editModal').classList.remove('active');
    editingId = null;
}

async function saveStaff() {
    const name = document.getElementById('editName').value.trim();
    if (!name) { alert('A name is required.'); return; }

    const reviewedBy = document.getElementById('editReviewedBy').value.trim();
    const body = {
        name: name,
        role: document.getElementById('editRole').value.trim(),
        program: document.getElementById('editProgram').value,
        staffGroup: document.getElementById('editStaffGroup').value,
        secondaryClassroom: document.getElementById('editSecondaryClassroom').value,
        semesterHoursTotal: document.getElementById('editShTotal').value.trim(),
        semesterHoursEce: document.getElementById('editShEce').value.trim(),
        transcriptOnFile: document.getElementById('editTranscript').value,
        classroom: document.getElementById('editClassroom').value.trim(),
        fte: document.getElementById('editFTE').value.trim(),
        education: document.getElementById('editEducation').value,
        eceCredentials: composeCredentials(),
        // Kept in step with the ECE level so anything still reading this column
        // does not go stale.
        gateways: document.getElementById('editEceLevel').value
            ? 'ECE Credential - Level ' + document.getElementById('editEceLevel').value : '',
        experienceYears: document.getElementById('editExperience').value.trim(),
        registryId: document.getElementById('editRegistryId').value.trim(),
        reviewedBy: reviewedBy,
        // Stamp today automatically when a reviewer is named but no date given,
        // so "reviewed" always carries a date with it.
        reviewedDate: document.getElementById('editReviewedDate').value
            || (reviewedBy ? new Date().toISOString().split('T')[0] : ''),
        notes: document.getElementById('editNotes').value.trim()
    };

    const btn = document.querySelector('#editModal .btn-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
        const res = editingId
            ? await apiFetch('/api/staff/' + encodeURIComponent(editingId), { method: 'PUT', body: JSON.stringify(body) })
            : await apiFetch('/api/staff', { method: 'POST', body: JSON.stringify(body) });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Save failed');
        await loadStaff();
        renderCards();
        closeModal();
    } catch (e) {
        alert('Save failed: ' + e.message);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
    }
}

function addNewStaff() {
    openEdit(null);
}

async function deleteStaff(id) {
    const s = staffList.find(x => String(x.Id) === String(id));
    const name = (s && s.Name) || 'this staff member';
    // Soft delete on the server: the record is retained as qualification history
    // and only removed from the active list.
    if (!confirm('Remove "' + name + '" from the active staff list?\n\nThe record is kept for qualification history and can be restored.')) return;
    try {
        const res = await apiFetch('/api/staff/' + encodeURIComponent(id), { method: 'DELETE' });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Remove failed');
        await loadStaff();
        renderCards();
    } catch (e) {
        alert('Remove failed: ' + e.message);
    }
}

// Close modal on backdrop click
document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

/* One delegated listener for the whole grid, rather than handlers per field.
   Cards are replaced wholesale after a save, and delegation survives that. */
document.addEventListener('input', e => {
    if (e.target.closest && e.target.closest('#staffGrid')) markDirty(e.target.closest('.staff-card'));
});
document.addEventListener('change', e => {
    if (e.target.closest && e.target.closest('#staffGrid')) markDirty(e.target.closest('.staff-card'));
});
// Ctrl+S / Cmd+S saves the card being edited.
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        const card = e.target.closest && e.target.closest('.staff-card');
        if (card && card.classList.contains('dirty')) {
            e.preventDefault();
            saveCard(card.getAttribute('data-id'));
        }
    }
});
// Editing in place makes it easy to wander off mid-change, so say so.
window.addEventListener('beforeunload', e => {
    if (document.querySelector('.staff-card.dirty')) { e.preventDefault(); e.returnValue = ''; }
});

// Init — loadStaff is async now, so render only once the data has arrived.
// The room list is fetched alongside it so the classroom dropdown is ready
// before anyone opens a card.
(async function () {
    await Promise.all([loadStaff(), loadClassroomList()]);
    renderCards();
})();
</script>
