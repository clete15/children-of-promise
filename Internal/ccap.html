<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCAP Management – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; }
        .ccap-layout { display:flex;height:calc(100vh - 90px);align-items:flex-start;justify-content:center;padding:20px; }
        .ccap-wrapper { display:flex;max-height:calc(100vh - 130px);width:100%;max-width:1100px; }
        .ccap-sidebar { width:180px;flex-shrink:0;background:rgba(255,255,255,0.12);overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .ccap-sidebar button { display:block;width:100%;text-align:left;padding:14px 16px;border:none;cursor:pointer;background:transparent;transition:background 0.15s; }
        .ccap-sidebar button.active { background:rgba(255,255,255,0.2); }
        .ccap-sidebar button:hover:not(.active) { background:rgba(255,255,255,0.1); }
        .ccap-sidebar button div { font-size:0.82rem;font-weight:700;color:white; }
        .ccap-sidebar button span { font-size:0.68rem;color:rgba(255,255,255,0.6); }
        .ccap-card { background:white;flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;box-shadow:0 4px 24px rgba(0,0,0,0.2);max-height:calc(100vh - 130px); }
        .ccap-header { padding:14px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px; }
        .ccap-header h2 { font-size:1rem;font-weight:800;color:#1e3a8a;margin:0; }
        .ccap-header span { font-size:0.72rem;color:#64748b; }
        .ccap-body { overflow-y:auto;flex:1;padding:20px 24px; }
        table { width:100%;border-collapse:collapse;font-size:0.78rem; }
        thead tr { background:#f8fafc;border-bottom:2px solid #e5e7eb; }
        th { padding:7px 10px;text-align:left;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#64748b; }
        td { padding:6px 10px;border-bottom:1px solid #f3f4f6; }
        .btn-export { padding:6px 14px;background:#16a34a;color:white;border:none;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer; }
        .btn-export:hover { background:#15803d; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>CCAP Management &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="ccap-layout">
    <div class="ccap-wrapper">
        <div class="ccap-sidebar">
            <button class="active" id="navRoster" onclick="showTab('roster')">
                <div>📋 Full CCAP Roster</div>
                <span id="rosterCount"></span>
            </button>
            <button id="navEligible" onclick="showTab('eligible')">
                <div>👨‍👩‍👧 Potentially Eligible</div>
                <span id="eligibleCount"></span>
            </button>
            <button id="navThresholds" onclick="showTab('thresholds')">
                <div>📊 Income Thresholds</div>
                <span>IL CCAP 225% FPL</span>
            </button>
        </div>
        <div class="ccap-card">
            <div class="ccap-header">
                <h2 id="ccapTitle">Full CCAP Roster</h2>
                <span id="ccapSubtitle"></span>
                <div style="flex:1;"></div>
                <button class="btn-export" id="exportBtn" onclick="exportCCAP()">📥 Export</button>
            </div>
            <div class="ccap-body" id="ccapBody">
                <div>Loading...</div>
            </div>
        </div>
    </div>
</div>

<script>
const AUTH = 'Basic ' + btoa(':cofpadmin');
function apiFetch(url, opts = {}) {
    opts.headers = Object.assign({ 'Authorization': AUTH, 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(url, opts);
}
function isTruthy(v) { return v === true || v === 1 || v === '1' || (typeof v === 'string' && v.toLowerCase() === 'yes'); }

// IL CCAP thresholds (225% FPL) - effective July 1
const now = new Date();
const usdaYear = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
const CCAP_GUIDELINES = {
    2025: [35213,47588,59963,72338,84713,97088,109463,121838],
    2026: [35910,48690,61470,74250,87030,99810,112590,125370],
};
const CCAP_THRESHOLDS = CCAP_GUIDELINES[usdaYear] || CCAP_GUIDELINES[Object.keys(CCAP_GUIDELINES).pop()];

let students = [];
let classrooms = [];
let activeTab = 'roster';

async function init() {
    try {
        const [sRes, cRes] = await Promise.all([apiFetch('/api/students'), apiFetch('/api/classrooms')]);
        students = await sRes.json();
        classrooms = await cRes.json();
        showTab('roster');
    } catch (e) {
        document.getElementById('ccapBody').innerHTML = '<div style="color:red;padding:20px;">Error loading data: ' + e.message + '</div>';
    }
}

function getRoom(rn) { const c = classrooms.find(r => String(r.RoomNumber) === String(rn)); return c ? c.Room : ''; }

function showTab(tab) {
    activeTab = tab;
    ['navRoster','navEligible','navThresholds'].forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');

    if (tab === 'roster') renderRoster();
    else if (tab === 'eligible') renderEligible();
    else renderThresholds();
}

function renderRoster() {
    document.getElementById('ccapTitle').textContent = 'Full CCAP Roster';
    const ccap = students.filter(s => isTruthy(s.Active) && s.Category === 'CCAP');
    document.getElementById('rosterCount').textContent = ccap.length + ' students';
    document.getElementById('ccapSubtitle').textContent = ccap.length + ' active CCAP students';
    document.getElementById('exportBtn').style.display = '';

    if (!ccap.length) { document.getElementById('ccapBody').innerHTML = '<p style="color:#64748b;padding:20px;">No CCAP students found.</p>'; return; }

    document.getElementById('ccapBody').innerHTML = `
        <table>
            <thead><tr>
                <th>Student</th>
                <th>Room</th>
                <th style="text-align:right;">Income</th>
                <th style="text-align:center;">HH Size</th>
                <th style="text-align:right;">Threshold</th>
                <th style="text-align:center;">Start Date</th>
            </tr></thead>
            <tbody>${ccap.map(s => {
                const hhIdx = Math.max(1, Math.min(parseInt(s.HouseholdSize)||1, 8)) - 1;
                const threshold = CCAP_THRESHOLDS[hhIdx];
                return `<tr>
                    <td style="font-weight:600;">${s.Last_Name}, ${s.First_Name}</td>
                    <td>${getRoom(s.RoomNumber)}</td>
                    <td style="text-align:right;">${s.HouseholdIncome ? '$'+parseInt(s.HouseholdIncome).toLocaleString() : '—'}</td>
                    <td style="text-align:center;">${s.HouseholdSize || '—'}</td>
                    <td style="text-align:right;color:#16a34a;font-weight:600;">$${threshold.toLocaleString()}</td>
                    <td style="text-align:center;">${s.CCAPStartDate || '—'}</td>
                </tr>`;
            }).join('')}</tbody>
        </table>`;
}

function renderEligible() {
    document.getElementById('ccapTitle').textContent = 'Families Potentially Eligible';
    document.getElementById('exportBtn').style.display = '';

    const eligible = students.filter(s => {
        if (!isTruthy(s.Active)) return false;
        if (s.Category === 'CCAP' || s.Category === 'Foster') return false;
        const income = parseInt(s.HouseholdIncome) || 0;
        const hhSize = parseInt(s.HouseholdSize) || 0;
        if (!income || !hhSize) return false;
        const idx = Math.max(1, Math.min(hhSize, 8)) - 1;
        return income <= CCAP_THRESHOLDS[idx];
    });

    document.getElementById('eligibleCount').textContent = eligible.length + ' families';
    document.getElementById('ccapSubtitle').textContent = eligible.length + ' families under 225% FPL not currently on CCAP';

    if (!eligible.length) { document.getElementById('ccapBody').innerHTML = '<p style="color:#16a34a;font-weight:600;padding:20px;">✓ All eligible families are already on CCAP</p>'; return; }

    document.getElementById('ccapBody').innerHTML = `
        <table>
            <thead><tr>
                <th>Student</th>
                <th>Room</th>
                <th>Pay Type</th>
                <th style="text-align:right;">Income</th>
                <th style="text-align:center;">HH Size</th>
                <th style="text-align:right;">Threshold</th>
                <th>Under By</th>
            </tr></thead>
            <tbody>${eligible.map(s => {
                const hhIdx = Math.max(1, Math.min(parseInt(s.HouseholdSize)||1, 8)) - 1;
                const threshold = CCAP_THRESHOLDS[hhIdx];
                const income = parseInt(s.HouseholdIncome) || 0;
                const diff = threshold - income;
                return `<tr>
                    <td style="font-weight:600;">${s.Last_Name}, ${s.First_Name}</td>
                    <td>${getRoom(s.RoomNumber)}</td>
                    <td>${s.Category || '—'}</td>
                    <td style="text-align:right;">$${income.toLocaleString()}</td>
                    <td style="text-align:center;">${s.HouseholdSize}</td>
                    <td style="text-align:right;color:#16a34a;font-weight:600;">$${threshold.toLocaleString()}</td>
                    <td style="color:#2563eb;font-weight:600;">$${diff.toLocaleString()}</td>
                </tr>`;
            }).join('')}</tbody>
        </table>`;
}

function renderThresholds() {
    document.getElementById('ccapTitle').textContent = 'IL CCAP Income Thresholds';
    document.getElementById('ccapSubtitle').textContent = '225% Federal Poverty Level — Effective July 1, ' + usdaYear;
    document.getElementById('exportBtn').style.display = 'none';

    document.getElementById('ccapBody').innerHTML = `
        <p style="font-size:0.82rem;color:#64748b;margin-bottom:16px;">Families with income at or below these thresholds may be eligible for Illinois Child Care Assistance Program (CCAP) subsidies.</p>
        <table style="max-width:500px;">
            <thead><tr>
                <th style="text-align:center;">Household Size</th>
                <th style="text-align:right;">Max Annual Income</th>
                <th style="text-align:right;">Max Monthly Income</th>
            </tr></thead>
            <tbody>${CCAP_THRESHOLDS.map((t, i) => `<tr>
                <td style="text-align:center;font-weight:700;">${i + 1}</td>
                <td style="text-align:right;font-weight:600;">$${t.toLocaleString()}</td>
                <td style="text-align:right;color:#64748b;">$${Math.round(t/12).toLocaleString()}</td>
            </tr>`).join('')}</tbody>
        </table>
        <p style="font-size:0.75rem;color:#94a3b8;margin-top:12px;">Source: Illinois DHS CCAP guidelines. Updated annually each July 1.</p>`;
}

function exportCCAP() {
    let csv = '';
    if (activeTab === 'roster') {
        csv = 'Last Name,First Name,Room,Income,HH Size,Start Date\n';
        students.filter(s => isTruthy(s.Active) && s.Category === 'CCAP').forEach(s => {
            csv += ['"'+s.Last_Name+'"','"'+s.First_Name+'"','"'+getRoom(s.RoomNumber)+'"',s.HouseholdIncome||'',s.HouseholdSize||'','"'+(s.CCAPStartDate||'')+'"'].join(',') + '\n';
        });
    } else {
        csv = 'Last Name,First Name,Room,Pay Type,Income,HH Size,Threshold\n';
        students.filter(s => {
            if (!isTruthy(s.Active) || s.Category === 'CCAP' || s.Category === 'Foster') return false;
            const income = parseInt(s.HouseholdIncome)||0, hh = parseInt(s.HouseholdSize)||0;
            if (!income || !hh) return false;
            return income <= CCAP_THRESHOLDS[Math.max(0,Math.min(hh-1,7))];
        }).forEach(s => {
            const idx = Math.max(0,Math.min((parseInt(s.HouseholdSize)||1)-1,7));
            csv += ['"'+s.Last_Name+'"','"'+s.First_Name+'"','"'+getRoom(s.RoomNumber)+'"','"'+(s.Category||'')+'"',s.HouseholdIncome||'',s.HouseholdSize||'',CCAP_THRESHOLDS[idx]].join(',') + '\n';
        });
    }
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'CCAP_' + activeTab + '_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
}

init();
</script>
</body>
</html>
