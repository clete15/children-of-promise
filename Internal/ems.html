<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Management – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; }
        .em-layout { display:flex;align-items:flex-start;justify-content:center;padding:20px; }
        .em-wrapper { display:flex;max-height:calc(100vh - 130px);width:100%;max-width:960px; }
        .em-sidebar { width:180px;flex-shrink:0;background:rgba(255,255,255,0.12);overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .em-sidebar button { display:block;width:100%;text-align:left;padding:10px 16px;border:none;cursor:pointer;background:transparent;transition:background 0.15s; }
        .em-sidebar button.active { background:rgba(255,255,255,0.2); }
        .em-sidebar button:hover:not(.active) { background:rgba(255,255,255,0.1); }
        .em-room { font-size:0.82rem;font-weight:700;color:white; }
        .em-room-count { font-size:0.68rem;color:rgba(255,255,255,0.6);margin-top:2px; }
        .em-card { background:white;flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;box-shadow:0 4px 24px rgba(0,0,0,0.2);max-height:calc(100vh - 130px); }
        .em-navbar { padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;position:relative; }
        .em-active-toggle { position:absolute;right:20px;display:flex;align-items:center;gap:6px;font-size:0.72rem;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap; }
        .em-active-toggle input { width:auto;accent-color:var(--primary); }
        .em-inactive-badge { display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:#fef2f2;color:var(--danger);font-size:0.65rem;font-weight:700;vertical-align:middle; }
        .em-form-scroll { overflow-y:auto;padding:16px 20px;flex:1; }

        .student-nav-arrow {
            display:flex;align-items:center;justify-content:center;
            background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:700;
            width:32px;height:32px;min-height:32px;font-size:0.85rem;flex-shrink:0;
            transition:background 0.15s, transform 0.15s;
        }
        .student-nav-arrow:hover:not(:disabled) { background:var(--primary-dark, #1d4ed8);transform:translateY(-1px); }
        .student-nav-arrow:disabled { background:#e2e8f0;color:#94a3b8;cursor:not-allowed; }
        #viewStudentName { font-size:1rem;font-weight:800;color:var(--text); }
        #viewRecordCounter { font-size:0.72rem;color:var(--text-muted);margin-top:2px; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Enrollment Management &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="em-layout">
    <div class="em-wrapper">
        <div class="em-sidebar" id="viewSidebar"></div>

        <div class="em-card">
            <div class="em-navbar">
                <button class="student-nav-arrow" id="btnPrev" onclick="navigate(-1)" disabled>
                    <span class="arrow-icon">◀</span>
                </button>
                <div style="text-align:center;">
                    <div id="viewStudentName"></div>
                    <div id="viewRecordCounter"></div>
                </div>
                <button class="student-nav-arrow" id="btnNext" onclick="navigate(1)" disabled>
                    <span class="arrow-icon">▶</span>
                </button>
                <label class="em-active-toggle" title="Uncheck to include withdrawn/inactive students">
                    <input type="checkbox" id="emsActiveOnly" checked onchange="onActiveOnlyChange()">
                    Active only
                </label>
            </div>

            <div class="em-form-scroll">
                <div class="form-container">

                    <!-- Identity -->
                    <div class="card">
                        <div class="card-title">Student Identity</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name <span class="required">*</span></label>
                                <input type="text" id="firstName">
                            </div>
                            <div class="form-group">
                                <label>Last Name <span class="required">*</span></label>
                                <input type="text" id="lastName">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Birth Date</label>
                                <input type="date" id="birthDate" onchange="calcDaysOld()">
                            </div>
                            <div class="form-group">
                                <label>Start Date</label>
                                <input type="date" id="startDate">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>City / Town</label>
                                <input type="text" id="cityTown">
                            </div>
                            <div class="form-group">
                                <label>Days Old</label>
                                <input type="number" id="daysOld" readonly>
                            </div>
                        </div>
                    </div>

                    <!-- Enrollment -->
                    <div class="card">
                        <div class="card-title">Enrollment Details</div>
                        <div class="form-group">
                            <label>Room</label>
                            <select id="roomNumber"></select>
                        </div>
                        <div class="form-group">
                            <label>Active</label>
                            <select id="active">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Pay Type</label>
                            <select id="category">
                                <option value="">-- Select --</option>
                                <option>Paid</option>
                                <option>CCAP</option>
                                <option value="Half Price">Half Price</option>
                                <option>Free</option>
                                <option>Foster</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Days Attending</label>
                            <div class="checkbox-grid">
                                <div class="checkbox-item"><input type="checkbox" id="monday"><label for="monday">Mon</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="tuesday"><label for="tuesday">Tue</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="wednesday"><label for="wednesday">Wed</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="thursday"><label for="thursday">Thu</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="friday"><label for="friday">Fri</label></div>
                            </div>
                        </div>
                    </div>

                    <!-- Program flags -->
                    <div class="card" style="grid-column: 1 / -1;">
                        <div class="card-title">Program Flags</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Program Type</label>
                                <select id="pfaPiNa">
                                    <option value="">-- Select --</option>
                                    <option value="PFA">PFA</option>
                                    <option value="PI">PI</option>
                                    <option value="INCCRA">INCCRA</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Food Program</label>
                                <input type="text" id="frpFood" readonly style="background:#f8fafc;font-weight:700;">
                            </div>
                            <div class="form-group" style="display:none;align-items:flex-end;gap:16px;padding-bottom:2px;">
                                <div class="checkbox-item"><input type="checkbox" id="iep"><label for="iep">IEP</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="military"><label for="military">Military</label></div>
                            </div>
                        </div>
                        <!-- Benefits are managed on the Benefits Roster page; kept here for F/R/P calc. -->
                        <div class="form-group" style="display:none;margin-top:8px;">
                            <label>Public Benefits</label>
                            <div class="checkbox-grid">
                                <div class="checkbox-item"><input type="checkbox" id="benWIC" onchange="calcFRP('householdIncome','householdSize','frpFood','')"><label for="benWIC">WIC</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="benMedicaid" onchange="calcFRP('householdIncome','householdSize','frpFood','')"><label for="benMedicaid">Medicaid</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="benSNAP" onchange="calcFRP('householdIncome','householdSize','frpFood','')"><label for="benSNAP">SNAP</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="benTANF" onchange="calcFRP('householdIncome','householdSize','frpFood','')"><label for="benTANF">TANF</label></div>
                                <div class="checkbox-item"><input type="checkbox" id="benCCAP" onchange="calcFRP('householdIncome','householdSize','frpFood','');autoPayType()"><label for="benCCAP">CCAP</label></div>
                            </div>
                        </div>
                    </div>

                    <!-- Income (managed on the Benefits Roster page; kept for F/R/P calc) -->
                    <div class="card" style="grid-column: 1 / -1; display:none;">
                        <div class="card-title">Household Income</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Annual Household Income</label>
                                <input type="number" id="householdIncome" placeholder="e.g. 42000" max="100000" min="0" oninput="calcFRP('householdIncome','householdSize','frpFood','')">
                            </div>
                            <div class="form-group">
                                <label>Household Size</label>
                                <input type="number" id="householdSize" placeholder="e.g. 4" min="1" max="15" oninput="calcFRP('householdIncome','householdSize','frpFood','')">
                            </div>
                            <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:2px;">
                                <div class="checkbox-item"><input type="checkbox" id="proofOfIncome"><label for="proofOfIncome">Proof of Income</label></div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <button class="btn btn-save" id="btnNewStudent" onclick="startNewStudent()" style="padding:8px 14px;font-size:0.78rem;">➕ New Student</button>
                        <button class="btn btn-secondary" id="btnCancel" onclick="cancelNew()" style="display:none;">Cancel</button>
                        <button class="btn btn-update" id="btnUpdate" onclick="updateStudent()">Update Student</button>
                        <button class="btn btn-save" id="btnSaveNew" onclick="saveStudent()" style="display:none;">Save New Student</button>
                        <button class="btn btn-secondary" id="btnParentCode" onclick="generateParentCode()" style="padding:8px 14px;font-size:0.72rem;" title="Generate or view parent portal access code">🔑 Parent Code</button>
                        <button class="btn btn-secondary" id="btnConference" onclick="startConference()" style="padding:8px 14px;font-size:0.72rem;" title="Start a video conference with this student's parent">📹 Conference</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
let filtered = [];
let currentIndex = 0;
let activeRoom = null;
let roomList = [];
let activeRoomIndex = 0;
let isNewMode = false;
let waitlistId = null;

async function init() {
    await Promise.all([loadClassrooms(), loadStudents()]);
    populateRoomDropdowns();
    buildRoomNav();
    applyFilter();
    maybePrefillFromWaitlist();
}

// ── ROOM SIDEBAR / NAV ──
function populateRoomDropdowns() {
    document.getElementById('roomNumber').innerHTML = classrooms.map(r =>
        `<option value="${r.RoomNumber}">${r.Room} — (${r.TeacherDescription})</option>`
    ).join('');
}

function buildRoomNav() {
    roomList = classrooms.map(r => r.RoomNumber);
    buildViewSidebar();
    updateRoomNavDisplay();
}

// True when the "Active only" toggle is on (the default).
function activeOnly() {
    return document.getElementById('emsActiveOnly')?.checked !== false;
}

// Students in a room, honoring the Active-only toggle, alphabetical.
function roomStudents(rn) {
    return students
        .filter(s => String(s.RoomNumber) === String(rn) && (!activeOnly() || isTruthy(s.Active)))
        .sort(sortByName);
}

function onActiveOnlyChange() {
    buildViewSidebar();
    applyFilter();
}

function buildViewSidebar() {
    const sidebar = document.getElementById('viewSidebar');
    if (!sidebar) return;
    const rooms = classrooms.map(r => r.RoomNumber);
    if ((!activeRoom || activeRoom === 'All') && rooms.length) { activeRoom = rooms[0]; activeRoomIndex = 0; }
    const hideInactive = activeOnly();
    sidebar.innerHTML = rooms.map(rn => {
        const cr = getClassroom(rn);
        const inRoom = students.filter(s => String(s.RoomNumber) === String(rn));
        const activeCount = inRoom.filter(s => isTruthy(s.Active)).length;
        const inactiveCount = inRoom.length - activeCount;
        const count = hideInactive ? activeCount : inRoom.length;
        const isActive = String(activeRoom) === String(rn);
        // When showing everyone, call out how many of them are inactive.
        const note = (!hideInactive && inactiveCount)
            ? ` <span style="color:#fca5a5;">(${inactiveCount} inactive)</span>` : '';
        return `<button class="${isActive ? 'active' : ''}" onclick="setRoomFilter('${rn}')">
            <div class="em-room">${cr ? cr.Room : rn}</div>
            <div class="em-room-count">${count} student${count !== 1 ? 's' : ''}${note}</div>
        </button>`;
    }).join('');
}

function setRoomFilter(room) {
    activeRoom = room;
    activeRoomIndex = Math.max(0, roomList.indexOf(room));
    buildViewSidebar();
    updateRoomNavDisplay();
    applyFilter();
}

function updateRoomNavDisplay() {
    const nameEl = document.getElementById('viewStudentName');
    const counterEl = document.getElementById('viewRecordCounter');
    if (!nameEl || !counterEl) return;
    if (filtered.length > 0 && filtered[currentIndex]) {
        const s = filtered[currentIndex];
        nameEl.textContent = `${s.First_Name} ${s.Last_Name}`;
        // Flag inactive records so a withdrawn student is never mistaken for enrolled.
        if (!isTruthy(s.Active)) {
            const badge = document.createElement('span');
            badge.className = 'em-inactive-badge';
            badge.textContent = 'Inactive';
            nameEl.appendChild(badge);
        }
        counterEl.textContent = `${currentIndex + 1} of ${filtered.length}`;
    } else {
        nameEl.textContent = activeOnly() ? 'No active students' : 'No students';
        counterEl.textContent = '';
    }
}

function applyFilter() {
    filtered = roomStudents(activeRoom);
    currentIndex = 0;
    if (filtered.length > 0 && !isNewMode) loadRecord(0);
    else if (!isNewMode) clearForm();
    updateNavButtons();
    updateRoomNavDisplay();
}

function navigate(dir) {
    if (isNewMode) return;
    currentIndex = Math.max(0, Math.min(filtered.length - 1, currentIndex + dir));
    loadRecord(currentIndex);
    updateNavButtons();
    updateRoomNavDisplay();
}

function updateNavButtons() {
    const prev = document.getElementById('btnPrev');
    const next = document.getElementById('btnNext');
    if (isNewMode) { prev.disabled = true; next.disabled = true; return; }
    prev.disabled = currentIndex <= 0;
    next.disabled = currentIndex >= filtered.length - 1;
}

// ── RECORD LOAD / CLEAR ──
function loadRecord(i) {
    const s = filtered[i];
    if (!s) return;
    document.getElementById('firstName').value   = s.First_Name || '';
    document.getElementById('lastName').value    = s.Last_Name || '';
    document.getElementById('birthDate').value   = formatDateInput(s.Birth_date);
    document.getElementById('startDate').value   = formatDateInput(s.Start_Date);
    document.getElementById('cityTown').value    = s.City_Town || '';
    document.getElementById('daysOld').value     = s.Days_Old || '';
    calcDaysOld();
    document.getElementById('roomNumber').value  = s.RoomNumber || '';
    document.getElementById('active').value      = isTruthy(s.Active) ? 'Yes' : 'No';
    document.getElementById('category').value    = normalizePayType(s.Category);
    document.getElementById('monday').checked    = isTruthy(s.Monday);
    document.getElementById('tuesday').checked   = isTruthy(s.Tuesday);
    document.getElementById('wednesday').checked = isTruthy(s.Wednesday);
    document.getElementById('thursday').checked  = isTruthy(s.Thursday);
    document.getElementById('friday').checked    = isTruthy(s.Friday);
    document.getElementById('pfaPiNa').value     = s.PFA_PI_na || '';
    document.getElementById('frpFood').value     = s.F_R_P_Food || '';
    document.getElementById('iep').checked       = isTruthy(s.IEP);
    document.getElementById('military').checked  = isTruthy(s.Military);
    document.getElementById('householdIncome').value = s.HouseholdIncome || '';
    document.getElementById('householdSize').value   = s.HouseholdSize || '';

    const ben = s.PublicBenefits || '';
    document.getElementById('benWIC').checked      = ben.includes('WIC');
    document.getElementById('benMedicaid').checked = ben.includes('Medicaid');
    document.getElementById('benSNAP').checked     = ben.includes('SNAP');
    document.getElementById('benTANF').checked     = ben.includes('TANF');
    document.getElementById('benCCAP').checked     = ben.includes('CCAP');
    document.getElementById('proofOfIncome').checked = (s.ProofOfIncomeUploaded === '1' || s.ProofOfIncomeUploaded === 1);

    calcFRP('householdIncome','householdSize','frpFood','');
}

function clearForm() {
    ['firstName','lastName','birthDate','startDate','cityTown','daysOld','householdIncome','householdSize']
        .forEach(id => document.getElementById(id).value = '');
    ['monday','tuesday','wednesday','thursday','friday','iep','military','benWIC','benMedicaid','benSNAP','benTANF','benCCAP','proofOfIncome']
        .forEach(id => document.getElementById(id).checked = false);
    document.getElementById('active').value = 'Yes';
    document.getElementById('category').value = '';
    document.getElementById('pfaPiNa').value = '';
    document.getElementById('frpFood').value = '';
}

function calcDaysOld() {
    const bd = document.getElementById('birthDate').value;
    const el = document.getElementById('daysOld');
    if (!bd) { el.value = ''; return; }
    const diff = Math.floor((Date.now() - new Date(bd).getTime()) / 86400000);
    el.value = diff > 0 ? diff : '';
}

// Checking CCAP as a benefit implies the CCAP pay type (and unchecking clears it).
function autoPayType() {
    const ccapChecked = document.getElementById('benCCAP')?.checked;
    const payType = document.getElementById('category');
    if (!payType) return;
    if (ccapChecked && (payType.value === '' || payType.value === 'Paid')) payType.value = 'CCAP';
    else if (!ccapChecked && payType.value === 'CCAP') payType.value = '';
}

// ── NEW STUDENT ──
function startNewStudent() {
    isNewMode = true;
    clearForm();
    document.getElementById('viewStudentName').textContent = 'New Student';
    document.getElementById('viewRecordCounter').textContent = '';
    document.getElementById('btnUpdate').style.display = 'none';
    document.getElementById('btnNewStudent').style.display = 'none';
    document.getElementById('btnSaveNew').style.display = '';
    document.getElementById('btnCancel').style.display = '';
    document.getElementById('btnPrev').disabled = true;
    document.getElementById('btnNext').disabled = true;
}

function cancelNew() {
    isNewMode = false;
    waitlistId = null;
    // Clear the "needs attention" highlights applied by highlightEmptyFields().
    document.querySelectorAll('[style*="fffbeb"]').forEach(el => { el.style.background = ''; el.style.borderColor = ''; });
    document.getElementById('btnUpdate').style.display = '';
    document.getElementById('btnNewStudent').style.display = '';
    document.getElementById('btnSaveNew').style.display = 'none';
    document.getElementById('btnCancel').style.display = 'none';
    if (window.location.search) history.replaceState(null, '', window.location.pathname);
    sessionStorage.removeItem('enrollFromWaitlist');
    applyFilter();
}

// ── SAVE / UPDATE ──
function buildBody() {
    const val = id => document.getElementById(id);
    return {
        firstName:  val('firstName').value.trim(),
        lastName:   val('lastName').value.trim(),
        birthDate:  val('birthDate').value,
        startDate:  val('startDate').value,
        cityTown:   val('cityTown').value,
        daysOld:    val('daysOld').value,
        roomNumber: val('roomNumber').value,
        active:     val('active').value,
        category:   val('category').value,
        monday:     val('monday').checked,
        tuesday:    val('tuesday').checked,
        wednesday:  val('wednesday').checked,
        thursday:   val('thursday').checked,
        friday:     val('friday').checked,
        pfaPiNa:    val('pfaPiNa').value,
        frpFood:    val('frpFood').value,
        iep:        val('iep').checked,
        military:   val('military').checked,
        householdIncome: val('householdIncome') ? val('householdIncome').value : '',
        householdSize:   val('householdSize') ? val('householdSize').value : '',
        publicBenefits:  collectBenefits(''),
        proofOfIncome:   val('proofOfIncome') ? val('proofOfIncome').checked : false,
    };
}

async function updateStudent() {
    const s = filtered[currentIndex];
    if (!s) return showNotification('No student selected', 'error');
    const btn = document.getElementById('btnUpdate');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
        const res = await apiFetch(`/api/students/${encodeURIComponent(s.First_Name)}/${encodeURIComponent(s.Last_Name)}`, {
            method: 'PUT', body: JSON.stringify(buildBody())
        });
        const data = await res.json();
        if (data.success) {
            showNotification('Student updated successfully', 'success');
            await loadStudents();
            buildViewSidebar();
            applyFilter();
        } else {
            showNotification('Update failed: ' + (data.error || 'Unknown error'), 'error');
        }
    } catch (e) { showNotification('Network error', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Update Student'; }
}

async function saveStudent() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName  = document.getElementById('lastName').value.trim();
    if (!firstName || !lastName) return showNotification('First and last name are required', 'error');
    try {
        const res = await apiFetch('/api/students', { method: 'POST', body: JSON.stringify(buildBody()) });
        const data = await res.json();
        if (!data.success) {
            showNotification('Save failed: ' + (data.error || 'Unknown error'), 'error');
            return;
        }
        showNotification('Student saved successfully', 'success');
        // When enrolling from the waiting list, mark that entry Enrolled.
        if (waitlistId) {
            try {
                const wlRes = await apiFetch(`/api/waitinglist/${waitlistId}`, {
                    method: 'PUT', body: JSON.stringify({ status: 'Enrolled' })
                });
                const wlData = await wlRes.json();
                if (!wlData.success) showNotification('Warning: waiting list status may not have updated', 'error');
            } catch (e) { showNotification('Warning: could not update waiting list status', 'error'); }
            sessionStorage.removeItem('enrollFromWaitlist');
            showNotification('Student enrolled and waiting list updated.', 'success');
            waitlistId = null;
        }
        cancelNew();
        await loadStudents();
        buildViewSidebar();
        applyFilter();
    } catch (e) { showNotification('Network error', 'error'); }
}

// ── ENROLL FROM WAITING LIST (?enroll=1) ──
function maybePrefillFromWaitlist() {
    if (new URLSearchParams(window.location.search).get('enroll') !== '1') return;
    const raw = sessionStorage.getItem('enrollFromWaitlist');
    if (!raw) return;
    const d = JSON.parse(raw);
    waitlistId = d.waitlistId;
    startNewStudent();

    document.getElementById('firstName').value = d.firstName || '';
    document.getElementById('lastName').value  = d.lastName || '';
    document.getElementById('cityTown').value  = d.cityTown || '';
    document.getElementById('birthDate').value = d.birthDate || '';
    document.getElementById('iep').checked      = !!d.iep;
    document.getElementById('military').checked = !!d.military;
    document.getElementById('householdIncome').value = d.householdIncome || '';
    document.getElementById('householdSize').value   = d.householdSize || '';

    if (d.publicBenefits) {
        const ben = d.publicBenefits.toLowerCase();
        document.getElementById('benWIC').checked      = ben.includes('wic');
        document.getElementById('benMedicaid').checked = ben.includes('medicaid');
        document.getElementById('benSNAP').checked     = ben.includes('snap');
        document.getElementById('benTANF').checked     = ben.includes('tanf');
        document.getElementById('benCCAP').checked     = ben.includes('ccap');
    }
    if (d.fosterAdopted) document.getElementById('category').value = 'Foster';

    calcDaysOld();
    calcFRP('householdIncome','householdSize','frpFood','');
    highlightEmptyFields();
    showNotification(`Pre-filling from waiting list: ${d.firstName} ${d.lastName}. Complete highlighted fields.`, 'info');
}

// Flags required-but-empty fields in amber until the user fills them in.
function highlightEmptyFields() {
    const fields = ['firstName','lastName','birthDate','startDate','roomNumber','category','pfaPiNa','householdIncome','householdSize'];
    fields.forEach(id => {
        const el = document.getElementById(id);
        if (!el || el.value) return;
        el.style.background = '#fffbeb';
        el.style.borderColor = '#f59e0b';
        const clear = function handler() {
            if (this.value) {
                this.style.background = '';
                this.style.borderColor = '';
                this.removeEventListener('change', handler);
                this.removeEventListener('input', handler);
            }
        };
        el.addEventListener('change', clear);
        el.addEventListener('input', clear);
    });

    const dayIds = ['monday','tuesday','wednesday','thursday','friday'];
    if (!dayIds.some(id => document.getElementById(id)?.checked)) {
        dayIds.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.parentElement.style.background = '#fffbeb';
            el.parentElement.style.borderRadius = '4px';
            el.addEventListener('change', function handler() {
                dayIds.forEach(d => {
                    const p = document.getElementById(d)?.parentElement;
                    if (p) p.style.background = '';
                });
                el.removeEventListener('change', handler);
            });
        });
    }
}

// ── PARENT CODE & CONFERENCE ──
async function generateParentCode() {
    const s = filtered[currentIndex];
    if (!s || !s.Id) { showNotification('Select a student first', 'error'); return; }
    try {
        const existRes = await apiFetch('/api/parent-codes');
        const codes = await existRes.json();
        const existing = codes.find(c => String(c.StudentId) === String(s.Id));
        if (existing) {
            const regenerate = confirm(
                'Parent code for ' + s.First_Name + ' ' + s.Last_Name + ':\n\n' +
                '    ' + existing.Code + '\n\n' +
                'Share this with the parent. They go to:\n' +
                'childrenofpromisedaycare.com/parent\n\n' +
                'Click OK to generate a NEW code (invalidates old one)\n' +
                'Click Cancel to keep the current code.'
            );
            if (!regenerate) return;
        }
        const res = await apiFetch('/api/parent-codes', {
            method: 'POST', body: JSON.stringify({ studentId: s.Id })
        });
        const data = await res.json();
        if (data.success) {
            alert(
                'Parent code for ' + s.First_Name + ' ' + s.Last_Name + ':\n\n' +
                '    ' + data.code + '\n\n' +
                'Give this to the parent. They visit:\n' +
                'childrenofpromisedaycare.com/parent\n' +
                'and enter the code to sign forms.'
            );
        } else {
            showNotification('Failed to generate code: ' + (data.error || ''), 'error');
        }
    } catch (e) { showNotification('Error: ' + e.message, 'error'); }
}

function startConference() {
    const s = filtered[currentIndex];
    if (!s || !s.Id) { showNotification('Select a student first', 'error'); return; }
    const roomName = 'CofP-' + s.Last_Name.replace(/[^a-zA-Z]/g, '') + '-' + s.Id + '-' + new Date().toISOString().split('T')[0];
    const meetUrl = 'https://meet.jit.si/' + roomName;
    // Record the link so the parent portal can show it, then open the room either way.
    apiFetch('/api/conference', {
        method: 'POST', body: JSON.stringify({ studentId: s.Id, meetUrl: meetUrl })
    }).then(res => res.json()).then(data => {
        window.open(meetUrl, '_blank');
        if (data.success) showNotification('Conference started! Parent can join from their portal.', 'success');
    }).catch(() => { window.open(meetUrl, '_blank'); });
}

init();
