<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting List – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; margin: 0; }

        /* ── TOOLBAR ── */
        .wl-toolbar {
            max-width: 100%;
            margin: 12px 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .wl-search {
            flex: 1;
            min-width: 180px;
            max-width: 320px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: inherit;
            background: rgba(255,255,255,0.9);
        }
        .wl-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .wl-count { font-size: 0.78rem; color: rgba(255,255,255,0.8); white-space: nowrap; }

        /* ── TABS ── */
        .mode-toggle { display:flex; background:rgba(255,255,255,0.15); border-radius:10px; padding:4px; gap:4px; }
        .toggle-btn { padding:8px 14px; border:none; border-radius:7px; font-size:0.78rem; font-weight:700; cursor:pointer; color:rgba(255,255,255,0.8); background:transparent; transition:background 0.18s,color 0.18s; white-space:nowrap; text-align:center; line-height:1.3; }
        .toggle-btn.active { background:white; color:var(--primary); box-shadow:0 1px 6px rgba(0,0,0,0.12); }
        .tab-count { font-size: 0.72rem; font-weight: 600; opacity: 0.75; }
        .tab-pending { font-size: 0.62rem; font-weight: 700; color: #fca5a5; }
        .toggle-btn.active .tab-pending { color: #dc2626; }

        /* ── TABLE CONTAINER ── */
        .wl-container {
            margin: 10px 20px 30px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
        }
        .wl-scroll-wrap {
            overflow: auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            flex: 1;
            /* Show scrollbar at top via CSS */
            direction: ltr;
        }
        /* Top scrollbar trick */
        .wl-scroll-top {
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: var(--radius) var(--radius) 0 0;
            background: white;
        }
        .wl-scroll-top-inner {
            height: 1px;
        }

        /* ── TABLE ── */
        .wl-table {
            width: 100%;
            min-width: 1000px;
            border-collapse: collapse;
            background: white;
            font-size: 0.76rem;
        }
        .wl-table thead tr {
            background: #f8fafc;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .wl-table th {
            padding: 8px 8px;
            text-align: left;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .wl-table td {
            padding: 8px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .wl-table tbody tr:last-child td { border-bottom: none; }
        .wl-table tbody tr:hover { background: #f8fafc; }
        .wl-table tbody tr.row-pending { background: #fffde7; }
        .wl-table tbody tr.row-pending:hover { background: #fff9c4; }

        /* ── NOTES ── */
        .notes-cell { min-width: 180px; max-width: 220px; height: 100%; }
        .notes-input {
            width: 100%;
            height: calc(100% - 24px);
            padding: 5px 7px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.72rem;
            font-family: inherit;
            resize: none;
            min-height: 60px;
            color: var(--text);
        }
        .notes-input:focus { outline: none; border-color: var(--primary); }
        .btn-save-notes {
            margin-top: 3px;
            padding: 3px 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-save-notes:hover { background: var(--primary-dark); }

        /* ── BADGES ── */
        .score-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.72rem;
            white-space: nowrap;
        }
        .score-high   { background: #fef2f2; color: var(--danger); }
        .score-medium { background: #fffbeb; color: #b45309; }
        .score-low    { background: #f0fdf4; color: var(--success); }

        .flag-list { display: flex; flex-wrap: wrap; gap: 3px; max-width: 180px; }
        .flag {
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.62rem;
            font-weight: 700;
            background: #eff6ff;
            color: var(--primary);
            white-space: nowrap;
        }
        .flag.high { background: #fef2f2; color: var(--danger); }

        .status-select {
            padding: 5px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            min-width: 100px;
        }
        .status-select:focus { outline: none; border-color: var(--primary); }

        .wl-empty {
            text-align: center;
            padding: 48px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .submitted-date { font-size: 0.68rem; color: var(--text-muted); }

        /* ── ENROLL MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: white;
            border-radius: var(--radius);
            padding: 28px 32px;
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .modal-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-group { display: flex; flex-direction: column; gap: 4px; }
        .modal-group.full { grid-column: 1 / -1; }
        .modal-group label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
        .modal-group input, .modal-group select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.82rem; font-family: inherit; color: var(--text); }
        .modal-group input:focus, .modal-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .modal-group input[readonly] { background: #f8fafc; color: var(--text-muted); }
        .modal-teacher-hint { font-size: 0.72rem; color: var(--danger); font-weight: 600; min-height: 1em; }
        .modal-days { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .modal-days label { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .modal-days input[type=checkbox] { width: auto; accent-color: var(--primary); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
        .modal-note { font-size: 0.75rem; color: var(--text-muted); background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Pre-Enrollment Waiting List &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="wl-toolbar">
    <div class="mode-toggle">
        <button class="toggle-btn active" id="tab-infant" onclick="setTab('infant')">🍼 Infant <span class="tab-count" id="count-infant"></span><div class="tab-pending" id="pending-infant"></div></button>
        <button class="toggle-btn" id="tab-toddler" onclick="setTab('toddler')">👶 Toddler <span class="tab-count" id="count-toddler"></span><div class="tab-pending" id="pending-toddler"></div></button>
        <button class="toggle-btn" id="tab-2-3" onclick="setTab('2-3')">🧒 2-Year Olds <span class="tab-count" id="count-2-3"></span><div class="tab-pending" id="pending-2-3"></div></button>
        <button class="toggle-btn" id="tab-3-5" onclick="setTab('3-5')">🎨 Pre-School <span class="tab-count" id="count-3-5"></span><div class="tab-pending" id="pending-3-5"></div></button>
    </div>
    <input class="wl-search" type="text" id="searchInput" placeholder="Search by name, phone, or email…" oninput="renderTable()">
    <span class="wl-count" id="wlCount"></span>
</div>

<div class="wl-container">
    <!-- Top scrollbar that syncs with table -->
    <div class="wl-scroll-top" id="scrollTop" onscroll="document.getElementById('scrollMain').scrollLeft=this.scrollLeft">
        <div class="wl-scroll-top-inner" id="scrollTopInner"></div>
    </div>
    <div class="wl-scroll-wrap" id="scrollMain" onscroll="document.getElementById('scrollTop').scrollLeft=this.scrollLeft">
        <table class="wl-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Contact</th>
                    <th>City</th>
                    <th>Children</th>
                    <th>Score</th>
                    <th>Risk Factors</th>
                    <th style="background:#fffbeb;color:#92400e;">Income</th>
                    <th>Submitted</th>
                    <th>Status</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="wlBody">
                <tr><td colspan="11" class="wl-empty">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const AUTH = 'Basic ' + btoa(':cofpadmin');
let allRows = [];
let classrooms = [];
let activeTab = 'infant';

// Sync top scrollbar width with table
function syncScrollbar() {
    const main = document.getElementById('scrollMain');
    const inner = document.getElementById('scrollTopInner');
    if (main && inner) {
        inner.style.width = main.scrollWidth + 'px';
    }
}

async function load() {
    try {
        const [wlRes] = await Promise.all([
            fetch('/api/waitinglist', { headers: { 'Authorization': AUTH } }),
        ]);
        allRows = await wlRes.json();
        updateTabCounts();
        renderTable();
    } catch (e) {
        document.getElementById('wlBody').innerHTML = `<tr><td colspan="11" class="wl-empty">Failed to load waiting list.</td></tr>`;
    }
}

function updateTabCounts() {
    ['infant','toddler','2-3','3-5'].forEach(tab => {
        const count = getFilteredRows(tab).length;
        const el = document.getElementById(`count-${tab}`);
        if (el) el.textContent = count ? `(${count})` : '';
        const pendingCount = getFilteredRows(tab).filter(r => !r.WaitlistStatus || r.WaitlistStatus === 'Pending' || r.WaitlistStatus === 'NULL').length;
        const pendEl = document.getElementById(`pending-${tab}`);
        if (pendEl) pendEl.textContent = pendingCount > 0 ? `${pendingCount} pending` : '';
    });
}

function getChildAgeMonths(r) {
    const bd = r.ChildBirthDate || r.BirthDate;
    if (!bd) return null;
    const born = new Date(bd);
    const now = new Date();
    return (now.getFullYear() - born.getFullYear()) * 12 + (now.getMonth() - born.getMonth());
}

function getFilteredRows(tab) {
    return allRows.filter(r => {
        if (r.WaitlistStatus === 'Declined' || r.WaitlistStatus === 'Enrolled') return false;
        if (tab === 'infant') {
            if (r.AgeGroup !== '0-2') return false;
            const months = getChildAgeMonths(r);
            return months === null || months < 12;
        }
        if (tab === 'toddler') {
            if (r.AgeGroup !== '0-2') return false;
            const months = getChildAgeMonths(r);
            return months !== null && months >= 12;
        }
        return r.AgeGroup === tab;
    });
}

function setTab(tab) {
    activeTab = tab;
    ['infant','toddler','2-3','3-5'].forEach(t => document.getElementById(`tab-${t}`).classList.toggle('active', t === tab));
    renderTable();
}

function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const rows = getFilteredRows(activeTab).filter(r =>
        (!q || `${r.FirstName} ${r.LastName}`.toLowerCase().includes(q) ||
         (r.Phone || '').toLowerCase().includes(q) ||
         (r.Email || '').toLowerCase().includes(q))
    );

    document.getElementById('wlCount').textContent = `${rows.length} record${rows.length !== 1 ? 's' : ''}`;

    if (!rows.length) {
        document.getElementById('wlBody').innerHTML = `<tr><td colspan="11" class="wl-empty">No records found.</td></tr>`;
        syncScrollbar();
        return;
    }

    // Sort: Pending first, then Contacted, by score descending
    rows.sort((a, b) => {
        const getOrder = s => (!s || s === 'Pending' || s === 'NULL') ? 0 : 1;
        const oa = getOrder(a.WaitlistStatus), ob = getOrder(b.WaitlistStatus);
        if (oa !== ob) return oa - ob;
        return (parseInt(b.Score)||0) - (parseInt(a.Score)||0);
    });

    document.getElementById('wlBody').innerHTML = rows.map((r, i) => {
        const score = parseInt(r.Score) || 0;
        const scoreClass = score >= 50 ? 'score-high' : score >= 10 ? 'score-medium' : 'score-low';
        const flags = buildFlags(r);
        const date = r.SubmittedAt ? r.SubmittedAt.split(' ')[0] : '—';
        const status = (!r.WaitlistStatus || r.WaitlistStatus === 'NULL') ? 'Pending' : r.WaitlistStatus;
        const notes = (!r.Notes || r.Notes === 'NULL') ? '' : r.Notes;
        const isPending = status === 'Pending';

        return `<tr class="${isPending ? 'row-pending' : ''}">
            <td style="font-size:0.7rem;color:var(--text-muted);">${i + 1}</td>
            <td style="white-space:nowrap;"><strong style="font-size:0.76rem;">${r.LastName}, ${r.FirstName}</strong></td>
            <td style="font-size:0.72rem;">
                <div>${r.Phone || '—'}</div>
                <div style="color:var(--text-muted);font-size:0.66rem;">${r.Email || ''}</div>
            </td>
            <td style="font-size:0.72rem;white-space:nowrap;">${r.City || '—'}</td>
            <td style="font-size:0.72rem;max-width:120px;">${r.ChildrenInfo || '—'}</td>
            <td><span class="score-badge ${scoreClass}">${score} pts</span></td>
            <td><div class="flag-list">${flags}</div></td>
            <td style="background:#fffbeb;font-weight:600;font-size:0.74rem;">${r.HouseholdIncome || '<span style="color:#92400e;">—</span>'}</td>
            <td><span class="submitted-date">${date}</span></td>
            <td>
                <select class="status-select" id="status-${r.Id}" onchange="handleStatusChange(${parseInt(r.Id)}, this)">
                    <option value="Pending" ${status==='Pending'?'selected':''}>Pending</option>
                    <option value="Contacted" ${status==='Contacted'?'selected':''}>Contacted</option>
                    <option value="Enroll">Enroll →</option>
                    <option value="Declined">Declined</option>
                </select>
            </td>
            <td class="notes-cell">
                <textarea class="notes-input" id="notes-${r.Id}" placeholder="Add notes…">${notes}</textarea>
                <button class="btn-save-notes" onclick="saveNotes(${r.Id})">Save</button>
            </td>
        </tr>`;
    }).join('');

    syncScrollbar();
}

function buildFlags(r) {
    const flags = [];
    const hi = l => `<span class="flag high">${l}</span>`;
    const lo = l => `<span class="flag">${l}</span>`;
    if (r.Homeless === 'Yes')           flags.push(hi('Homeless'));
    if (r.FosterAdopted === 'Yes')      flags.push(hi('Foster/Adopted'));
    if (r.IEP === 'Yes')                flags.push(lo('IEP'));
    if (r.EarlyIntervention === 'Yes')  flags.push(lo('Early Intervention'));
    if (r.AbuseHistory === 'Yes')       flags.push(lo('Abuse/DV'));
    if (r.MentalIllness === 'Yes')      flags.push(lo('Mental/Chronic Illness'));
    if (r.DcfsInvolvement === 'Yes')    flags.push(lo('DCFS'));
    if (r.SubstanceAbuse === 'Yes')     flags.push(lo('Substance Abuse'));
    if (r.CaregiverOther === 'Yes')     flags.push(lo('Non-Parent Caregiver'));
    if (r.FamilyDeath === 'Yes')        flags.push(lo('Family Death'));
    if (r.LowBirthWeight === 'Yes')     flags.push(lo('Low Birth Weight'));
    if (r.ParentIncarcerated === 'Yes') flags.push(lo('Parent Incarcerated'));
    if (r.TeenParent === 'Yes')         flags.push(lo('Teen Parent'));
    if (r.NoHSDiploma === 'Yes')        flags.push(lo('No HS Diploma'));
    if (r.BornOutsideUS === 'Yes')      flags.push(lo('Immigrant/Refugee'));
    if (r.NonEnglishHome === 'Yes')     flags.push(lo('Non-English Home'));
    if (r.ActiveMilitary === 'Yes')     flags.push(lo('Military'));
    if (r.PublicBenefits)               flags.push(lo('Public Benefits'));
    if (r.LivingSituation === 'Single Parent') flags.push(lo('Single Parent'));
    return flags.join('') || '<span style="color:var(--text-muted);font-size:0.68rem;">None</span>';
}

function handleStatusChange(id, selectEl) {
    const val = selectEl.value;

    if (val === 'Declined') {
        if (!confirm('Are you sure you want to remove this family from the waiting list? This cannot be undone.')) {
            const row = allRows.find(r => r.Id == id);
            selectEl.value = row ? row.WaitlistStatus : 'Pending';
            return;
        }
        updateStatusAPI(id, 'Declined').then(() => {
            const row = allRows.find(r => r.Id == id);
            if (row) row.WaitlistStatus = 'Declined';
            updateTabCounts();
            renderTable();
        });
        return;
    }

    if (val === 'Enroll') {
        const row = allRows.find(r => r.Id == id);
        selectEl.value = row ? row.WaitlistStatus : 'Pending';
        openEnrollModal(id);
        return;
    }

    updateStatusAPI(id, val).then(() => {
        const row = allRows.find(r => r.Id == id);
        if (row) row.WaitlistStatus = val;
    });
}

async function updateStatusAPI(id, status) {
    try {
        await fetch(`/api/waitinglist/${id}`, {
            method: 'PUT',
            headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
    } catch (e) { alert('Failed to update status'); }
}

async function saveNotes(id) {
    const el = document.getElementById(`notes-${id}`);
    // Notes must stay single-line: the API returns rows as pipe-delimited text split
    // on newlines, so an embedded newline would break that record into bogus rows.
    let notes = el.value.replace(/[\r\n]+/g, '  ').trim();
    // Append a timestamp when there's content to stamp. Skip if it already ends
    // with one, so re-saving unchanged text doesn't stack duplicates.
    if (notes) {
        const stampRe = /—\s*\d{1,2}\/\d{1,2}\/\d{4},?\s+\d{1,2}:\d{2}\s*(?:AM|PM)\s*$/i;
        if (!stampRe.test(notes)) {
            const now = new Date().toLocaleString('en-US', {
                month: 'numeric', day: 'numeric', year: 'numeric',
                hour: 'numeric', minute: '2-digit'
            });
            notes = notes + '  — ' + now;
        }
    }
    el.value = notes;
    try {
        const res = await fetch(`/api/waitinglist/${id}`, {
            method: 'PUT',
            headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes })
        });
        const data = await res.json();
        if (data.success) {
            const btn = document.querySelector(`#notes-${id} + button`);
            if (btn) { btn.textContent = 'Saved ✓'; setTimeout(() => btn.textContent = 'Save', 2000); }
        }
    } catch (e) { alert('Failed to save notes'); }
}

// ── ENROLL ──
function openEnrollModal(id) {
    const r = allRows.find(x => x.Id == id);
    if (!r) return;

    sessionStorage.setItem('enrollFromWaitlist', JSON.stringify({
        waitlistId:      r.Id,
        firstName:       r.ChildName ? r.ChildName.split(' ')[0] : r.FirstName || '',
        lastName:        r.ChildName ? r.ChildName.split(' ').slice(1).join(' ') || r.LastName : r.LastName || '',
        cityTown:        r.City || '',
        birthDate:       r.ChildBirthDate || '',
        iep:             r.IEP === 'Yes',
        military:        r.ActiveMilitary === 'Yes',
        householdIncome: r.HouseholdIncome || '',
        householdSize:   r.HouseholdSize || '',
        publicBenefits:  r.PublicBenefits || '',
        fosterAdopted:   r.FosterAdopted === 'Yes',
    }));

    window.location.href = 'ems.html?enroll=1';
}

load();
</script>
</body>
</html>
