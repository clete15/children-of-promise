<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting List – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; margin: 0; }

        /* ── TOOLBAR ── */
        .wl-toolbar {
            /* Same cap and centring as the table below, so the tabs and search sit
               over the columns rather than off to the far edges. */
            max-width: 1300px;
            width: 100%;
            margin: 12px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .wl-search {
            flex: 1;
            min-width: 180px;
            max-width: 340px;
            padding: 8px 12px;
            border: 1px solid var(--sp-border-in);
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: inherit;
            background: var(--sp-field-bg);
            color: var(--sp-text);
        }
        .wl-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .wl-count { font-size: 0.85rem; color: var(--sp-muted); white-space: nowrap; }

        /* ── TABS ── */
        .mode-toggle { display:flex; background:var(--sp-surface-2); border:1px solid var(--sp-border); border-radius:10px; padding:4px; gap:4px; }
        .toggle-btn { padding:9px 15px; border:none; border-radius:7px; font-size:0.86rem; font-weight:700; cursor:pointer; color:var(--sp-muted); background:transparent; transition:background 0.18s,color 0.18s; white-space:nowrap; text-align:center; line-height:1.3; }
        .toggle-btn.active { background:var(--sp-surface); color:var(--primary); box-shadow:0 1px 6px rgba(0,0,0,0.12); }
        .tab-count { font-size: 0.78rem; font-weight: 600; opacity: 0.75; }
        .tab-pending { font-size: 0.62rem; font-weight: 700; color: var(--sp-bad-br); }
        .toggle-btn.active .tab-pending { color: var(--danger); }

        /* ── TABLE CONTAINER ── */
        .wl-container {
            /* Capped and centred so the columns sit at a readable density instead of
               being stretched edge-to-edge across a wide screen. On narrower screens
               it still fills the width and scrolls horizontally. */
            max-width: 1300px;
            margin: 10px auto 30px;
            padding: 0 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
        }
        .wl-scroll-wrap {
            overflow: auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            flex: 1;
            /* Show scrollbar at top via CSS */
            direction: ltr;
        }
        /* Top scrollbar trick */
        .wl-scroll-top {
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: var(--radius) var(--radius) 0 0;
            background: var(--sp-surface);
        }
        .wl-scroll-top-inner {
            height: 1px;
        }

        /* ── TABLE ── */
        .wl-table {
            width: 100%;
            min-width: 1000px;
            border-collapse: collapse;
            background: var(--sp-surface);
            font-size: 0.86rem;
        }
        .wl-table thead tr {
            background: var(--sp-surface-2);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .wl-table th {
            padding: 9px 8px;
            text-align: left;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .wl-table td {
            padding: 8px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .wl-table tbody tr:last-child td { border-bottom: none; }
        .wl-table tbody tr:hover { background: var(--sp-surface-2); }
        .wl-table tbody tr.row-pending { background: var(--sp-warn-bg); }
        .wl-table tbody tr.row-pending:hover { background: var(--sp-warn-bg); filter: brightness(0.97); }

        /* ── NOTES ── */
        .notes-cell { min-width: 180px; max-width: 220px; height: 100%; }
        .notes-input {
            width: 100%;
            height: calc(100% - 24px);
            padding: 5px 7px;
            /* A visible recessed well with a clear border, so the box reads as an
               editable field against the row rather than blending into it. */
            border: 1px solid var(--sp-border-in);
            border-radius: 4px;
            font-size: 0.82rem;
            font-family: inherit;
            resize: none;
            min-height: 60px;
            color: var(--sp-text);
            background: var(--sp-field-bg);
        }
        .notes-input:focus { outline: none; border-color: var(--primary); }
        .btn-save-notes {
            margin-top: 3px;
            padding: 3px 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-save-notes:hover { background: var(--primary-dark); }
        /* Remove (hard delete) — quiet by default, red on hover, so it does not read
           as a primary action next to Save. For test/junk entries only. */
        .btn-delete-wl {
            margin-top: 3px; margin-left: 4px; padding: 3px 10px;
            background: transparent; color: var(--sp-muted);
            border: 1px solid var(--sp-border); border-radius: 4px;
            font-size: 0.68rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
        }
        .btn-delete-wl:hover { background: var(--danger); color: white; border-color: var(--danger); }
        /* Highlight rows whose program was never set, so they stand out as needing triage */
        .program-unassigned { border-color: var(--sp-warn-br) !important; background: var(--sp-warn-bg) !important; }

        /* ── BADGES ── */
        .score-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .score-high   { background: var(--sp-bad-bg); color: var(--sp-bad-fg); }
        .score-medium { background: var(--sp-warn-bg); color: var(--sp-warn-fg); }
        .score-low    { background: var(--sp-good-bg); color: var(--sp-good-fg); }

        /* Risk factors listed one per line in a single column, each as its own pill,
           so a family's flags read down the cell instead of wrapping side to side. */
        .flag-list { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-width: 200px; }
        .flag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.74rem;
            font-weight: 700;
            background: var(--sp-accent-soft);
            color: var(--primary);
            white-space: nowrap;
        }
        .flag.high { background: var(--sp-bad-bg); color: var(--sp-bad-fg); }

        .status-select {
            padding: 6px 8px;
            border: 1px solid var(--sp-border-in);
            border-radius: 4px;
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            min-width: 100px;
        }
        .status-select:focus { outline: none; border-color: var(--primary); }
        /* Wider Program column: the age-group labels ("2-Year Olds", "Before & After")
           were cramped. Give the program picker and its header more room. */
        .col-program { min-width: 160px; }
        select[id^="prog-"] { min-width: 150px; }

        .wl-empty {
            text-align: center;
            padding: 48px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .submitted-date { font-size: 0.8rem; color: var(--text-muted); }

        /* ── ENROLL MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--sp-surface);
            border-radius: var(--radius);
            padding: 28px 32px;
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .modal-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-group { display: flex; flex-direction: column; gap: 4px; }
        .modal-group.full { grid-column: 1 / -1; }
        .modal-group label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
        .modal-group input, .modal-group select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.82rem; font-family: inherit; color: var(--text); }
        .modal-group input:focus, .modal-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .modal-group input[readonly] { background: var(--sp-surface-2); color: var(--text-muted); }
        .modal-teacher-hint { font-size: 0.72rem; color: var(--danger); font-weight: 600; min-height: 1em; }
        .modal-days { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .modal-days label { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .modal-days input[type=checkbox] { width: auto; accent-color: var(--primary); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
        .modal-note { font-size: 0.75rem; color: var(--sp-warn-fg); background: var(--sp-warn-bg); border: 1px solid var(--sp-warn-br); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Pre-Enrollment Waiting List &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <div class="header-actions">
        <button type="button" class="header-theme-btn" id="spTheme" aria-pressed="false">☾ Dark mode</button>
        <a class="header-back" href="/staff/">← Staff Portal</a>
    </div>
</header>

<!-- Shared Enrollment Management sub-nav (see ems.html for the note). -->
<style>
    .em-subnav {
        display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
        max-width: 1400px; margin: 0 auto; padding: 10px 20px 0;
    }
    .em-subnav .em-subnav-label {
        font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--sp-quiet); margin-right: 10px;
    }
    .em-subnav a {
        font-size: 0.9rem; font-weight: 700; text-decoration: none; color: var(--sp-text-2);
        padding: 8px 15px; border-radius: 8px 8px 0 0; border-bottom: 3px solid transparent;
        transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .em-subnav a:hover { color: var(--sp-text); background: var(--sp-surface-2); }
    .em-subnav a.on { color: var(--sp-accent); border-bottom-color: var(--sp-accent); }
    .em-subnav-wrap { border-bottom: 1.5px solid var(--sp-border); }
</style>
<div class="em-subnav-wrap">
    <nav class="em-subnav" aria-label="Enrollment management">
        <a href="/staff/waitinglist.html" class="on" aria-current="page">Waiting List</a>
        <a href="/staff/ems.html">Enrolled Students</a>
        <a href="/staff/benefits.html">Benefits &amp; Eligibility</a>
        <a href="/staff/attendance.html">Attendance</a>
    </nav>
</div>

<div class="wl-toolbar">
    <div class="mode-toggle">
        <button class="toggle-btn active" id="tab-infant" onclick="setTab('infant')">🍼 Infant <span class="tab-count" id="count-infant"></span><div class="tab-pending" id="pending-infant"></div></button>
        <button class="toggle-btn" id="tab-toddler" onclick="setTab('toddler')">👶 Toddler <span class="tab-count" id="count-toddler"></span><div class="tab-pending" id="pending-toddler"></div></button>
        <button class="toggle-btn" id="tab-2-3" onclick="setTab('2-3')">🧒 2-Year Olds <span class="tab-count" id="count-2-3"></span><div class="tab-pending" id="pending-2-3"></div></button>
        <button class="toggle-btn" id="tab-3-5" onclick="setTab('3-5')">🎨 Pre-School <span class="tab-count" id="count-3-5"></span><div class="tab-pending" id="pending-3-5"></div></button>
        <button class="toggle-btn" id="tab-ba" onclick="setTab('ba')">🎒 Before &amp; After <span class="tab-count" id="count-ba"></span><div class="tab-pending" id="pending-ba"></div></button>
        <button class="toggle-btn" id="tab-other" onclick="setTab('other')" title="Submissions with a missing or unrecognized program">❓ Unassigned <span class="tab-count" id="count-other"></span><div class="tab-pending" id="pending-other"></div></button>
    </div>
    <input class="wl-search" type="text" id="searchInput" placeholder="Search by name, phone, or email…" oninput="renderTable()">
    <span class="wl-count" id="wlCount"></span>
</div>

<div class="wl-container">
    <!-- Top scrollbar that syncs with table -->
    <div class="wl-scroll-top" id="scrollTop" onscroll="document.getElementById('scrollMain').scrollLeft=this.scrollLeft">
        <div class="wl-scroll-top-inner" id="scrollTopInner"></div>
    </div>
    <div class="wl-scroll-wrap" id="scrollMain" onscroll="document.getElementById('scrollTop').scrollLeft=this.scrollLeft">
        <table class="wl-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name &amp; Contact</th>
                    <th>Children</th>
                    <th class="col-program">Program</th>
                    <th>Score</th>
                    <th>Risk Factors</th>
                    <th style="background:var(--sp-warn-bg);color:var(--sp-warn-fg);">Income</th>
                    <th title="Looks eligible for CCAP by income and household size (225% FPL). Families are not on CCAP until they opt in, enroll, and are approved by the state.">CCAP Eligible?</th>
                    <th>Submitted</th>
                    <th>Requested Start</th>
                    <th>Status</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="wlBody">
                <tr><td colspan="12" class="wl-empty">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
// AUTH and apiFetch come from app.js. This page has its own data model
// (allRows from /api/waitinglist), so it does not use app.js's students list.
let allRows = [];
let activeTab = 'infant';
// Every tab shown in the toolbar. 'other' catches unrecognized/missing programs
// so a real submission can never be invisible to staff.
const WL_TABS = ['infant', 'toddler', '2-3', '3-5', 'ba', 'other'];

// Sync top scrollbar width with table
function syncScrollbar() {
    const main = document.getElementById('scrollMain');
    const inner = document.getElementById('scrollTopInner');
    if (main && inner) {
        inner.style.width = main.scrollWidth + 'px';
    }
}

async function load() {
    try {
        // loadGuidelines() (app.js) refreshes CCAP_THRESHOLDS from the server so the
        // "Eligible for CCAP" column uses the authoritative 225% FPL figures.
        const [wlRes] = await Promise.all([
            apiFetch('/api/waitinglist'),
            loadGuidelines(),
        ]);
        allRows = await wlRes.json();
        updateTabCounts();
        renderTable();
    } catch (e) {
        document.getElementById('wlBody').innerHTML = `<tr><td colspan="12" class="wl-empty">Failed to load waiting list.</td></tr>`;
    }
}

function updateTabCounts() {
    WL_TABS.forEach(tab => {
        const count = getFilteredRows(tab).length;
        const el = document.getElementById(`count-${tab}`);
        if (el) el.textContent = count ? `(${count})` : '';
        const pendingCount = getFilteredRows(tab).filter(r => !r.WaitlistStatus || r.WaitlistStatus === 'Pending' || r.WaitlistStatus === 'NULL').length;
        const pendEl = document.getElementById(`pending-${tab}`);
        if (pendEl) pendEl.textContent = pendingCount > 0 ? `${pendingCount} pending` : '';
    });
}

function getChildAgeMonths(r) {
    const bd = r.ChildBirthDate || r.BirthDate;
    if (!bd) return null;
    const born = new Date(bd);
    const now = new Date();
    return (now.getFullYear() - born.getFullYear()) * 12 + (now.getMonth() - born.getMonth());
}

// Program values the public pre-enrollment form can submit, with staff-facing labels.
const PROGRAM_OPTIONS = [
    { value: '0-2', label: 'Infant & Toddler' },
    { value: '2-3', label: '2-Year Olds' },
    { value: '3-5', label: 'Pre-School' },
    { value: 'ba',  label: 'Before & After' },
];
const KNOWN_AGE_GROUPS = PROGRAM_OPTIONS.map(o => o.value);

// Editable program picker. Records with a missing/unknown program get an
// "unassigned" placeholder so staff can file them into the right tab.
function programSelect(r) {
    const current = r.AgeGroup || '';
    const known = KNOWN_AGE_GROUPS.includes(current);
    const opts = PROGRAM_OPTIONS.map(o =>
        `<option value="${o.value}" ${current === o.value ? 'selected' : ''}>${o.label}</option>`
    ).join('');
    const placeholder = known ? '' : `<option value="" selected>— unassigned —</option>`;
    return `<select class="status-select${known ? '' : ' program-unassigned'}" id="prog-${r.Id}"
        onchange="handleProgramChange(${parseInt(r.Id)}, this)"
        title="Program the family applied for. Changing this moves the record to that tab.">
        ${placeholder}${opts}
    </select>`;
}

async function handleProgramChange(id, selectEl) {
    const newGroup = selectEl.value;
    if (!newGroup) return; // placeholder chosen, nothing to save
    selectEl.disabled = true;
    try {
        const res = await apiFetch(`/api/waitinglist/${id}`, {
            method: 'PUT',
            body: JSON.stringify({ ageGroup: newGroup })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'save failed');
        // Update local state, then re-render so the row lands on the right tab
        // and every tab count stays accurate.
        const row = allRows.find(r => String(r.Id) === String(id));
        if (row) row.AgeGroup = newGroup;
        updateTabCounts();
        renderTable();
    } catch (e) {
        alert('Failed to update program: ' + e.message);
        selectEl.disabled = false;
    }
}

function getFilteredRows(tab) {
    return allRows.filter(r => {
        if (r.WaitlistStatus === 'Declined' || r.WaitlistStatus === 'Enrolled') return false;
        // Infant and Toddler both come from the 0-2 program, split at 12 months.
        if (tab === 'infant') {
            if (r.AgeGroup !== '0-2') return false;
            const months = getChildAgeMonths(r);
            return months === null || months < 12;
        }
        if (tab === 'toddler') {
            if (r.AgeGroup !== '0-2') return false;
            const months = getChildAgeMonths(r);
            return months !== null && months >= 12;
        }
        // Catch-all so a submission with a missing or unexpected program is still visible.
        if (tab === 'other') return !KNOWN_AGE_GROUPS.includes(r.AgeGroup);
        return r.AgeGroup === tab;
    });
}

function setTab(tab) {
    activeTab = tab;
    WL_TABS.forEach(t => document.getElementById(`tab-${t}`).classList.toggle('active', t === tab));
    renderTable();
}

function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const rows = getFilteredRows(activeTab).filter(r =>
        (!q || `${r.FirstName} ${r.LastName}`.toLowerCase().includes(q) ||
         (r.Phone || '').toLowerCase().includes(q) ||
         (r.Email || '').toLowerCase().includes(q))
    );

    document.getElementById('wlCount').textContent = `${rows.length} record${rows.length !== 1 ? 's' : ''}`;

    if (!rows.length) {
        document.getElementById('wlBody').innerHTML = `<tr><td colspan="12" class="wl-empty">No records found.</td></tr>`;
        syncScrollbar();
        return;
    }

    // Sort: Pending first, then Contacted, by score descending
    rows.sort((a, b) => {
        const getOrder = s => (!s || s === 'Pending' || s === 'NULL') ? 0 : 1;
        const oa = getOrder(a.WaitlistStatus), ob = getOrder(b.WaitlistStatus);
        if (oa !== ob) return oa - ob;
        return (parseInt(b.Score)||0) - (parseInt(a.Score)||0);
    });

    document.getElementById('wlBody').innerHTML = rows.map((r, i) => {
        const score = parseInt(r.Score) || 0;
        const scoreClass = score >= 50 ? 'score-high' : score >= 10 ? 'score-medium' : 'score-low';
        const flags = buildFlags(r);
        const date = r.SubmittedAt ? r.SubmittedAt.split(' ')[0] : '—';
        // The family's requested start date from the pre-enrollment form (ChildStartDate).
        const reqStart = (r.ChildStartDate && r.ChildStartDate !== 'NULL')
            ? r.ChildStartDate.split(' ')[0] : '—';
        const status = (!r.WaitlistStatus || r.WaitlistStatus === 'NULL') ? 'Pending' : r.WaitlistStatus;
        const notes = (!r.Notes || r.Notes === 'NULL') ? '' : r.Notes;
        const isPending = status === 'Pending';

        return `<tr class="${isPending ? 'row-pending' : ''}">
            <td style="font-size:0.8rem;color:var(--text-muted);">${i + 1}</td>
            <td style="white-space:nowrap;">
                <strong style="font-size:0.9rem;">${r.LastName}, ${r.FirstName}</strong>
                <div style="font-size:0.82rem;margin-top:3px;">${fmtPhone(r.Phone) || '—'}</div>
                <div style="color:var(--text-muted);font-size:0.82rem;">${r.Email || ''}</div>
                ${r.City ? `<div style="color:var(--text-muted);font-size:0.82rem;">${r.City}</div>` : ''}
            </td>
            <td style="font-size:0.82rem;max-width:140px;">${r.ChildrenInfo || '—'}</td>
            <td>${programSelect(r)}</td>
            <td><span class="score-badge ${scoreClass}">${score} pts</span></td>
            <td><div class="flag-list">${flags}</div></td>
            <td style="background:var(--sp-warn-bg);color:var(--sp-warn-fg);font-weight:700;font-size:0.86rem;">${r.HouseholdIncome ? fmtMoney(r.HouseholdIncome) : '—'}</td>
            <td>${ccapEligibleCell(r)}</td>
            <td><span class="submitted-date">${date}</span></td>
            <td><span class="submitted-date">${reqStart}</span></td>
            <td>
                <select class="status-select" id="status-${r.Id}" onchange="handleStatusChange(${parseInt(r.Id)}, this)">
                    <option value="Pending" ${status==='Pending'?'selected':''}>Pending</option>
                    <option value="Contacted" ${status==='Contacted'?'selected':''}>Contacted</option>
                    <option value="Enroll">Enroll →</option>
                    <option value="Declined">Declined</option>
                </select>
            </td>
            <td class="notes-cell">
                <textarea class="notes-input" id="notes-${r.Id}" placeholder="Add notes…">${notes}</textarea>
                <button class="btn-save-notes" onclick="saveNotes(${r.Id})">Save</button>
                <button class="btn-delete-wl" onclick="deleteRecord(${parseInt(r.Id)}, '${(r.LastName + ', ' + r.FirstName).replace(/'/g, "\\'")}')" title="Delete this pre-enrollment record (for test/junk entries — real families are marked Declined instead)">Remove</button>
            </td>
        </tr>`;
    }).join('');

    syncScrollbar();
}

/* Looks-eligible-for-CCAP by income and household size (225% FPL). This is a hint,
   not a status: a family is only ON CCAP once they opt in, enroll, and are approved by
   the state — hence the wording and the tooltip on the header. Uses the server-loaded
   CCAP_THRESHOLDS (app.js), indexed by household size (capped at 8). */
function ccapEligibleCell(r) {
    const income = parseInt(r.HouseholdIncome) || 0;
    const hh = parseInt(r.HouseholdSize) || 0;
    if (!income || !hh) {
        return '<span style="color:var(--sp-quiet);font-size:0.8rem;">—</span>';
    }
    const threshold = CCAP_THRESHOLDS[Math.max(0, Math.min(hh - 1, 7))];
    if (income <= threshold) {
        return '<span class="score-badge score-low" title="Income '
            + fmtMoney(income) + ' for a household of ' + hh + ' is at or below the CCAP limit ('
            + fmtMoney(threshold) + ').">Eligible</span>';
    }
    return '<span style="color:var(--sp-muted);font-size:0.8rem;" title="Income '
        + fmtMoney(income) + ' for a household of ' + hh + ' is above the CCAP limit ('
        + fmtMoney(threshold) + ').">Not eligible</span>';
}

function buildFlags(r) {
    const flags = [];
    const hi = l => `<span class="flag high">${l}</span>`;
    const lo = l => `<span class="flag">${l}</span>`;
    if (r.Homeless === 'Yes')           flags.push(hi('Homeless'));
    if (r.FosterAdopted === 'Yes')      flags.push(hi('Foster/Adopted'));
    if (r.IEP === 'Yes')                flags.push(lo('IEP'));
    if (r.EarlyIntervention === 'Yes')  flags.push(lo('Early Intervention'));
    if (r.AbuseHistory === 'Yes')       flags.push(lo('Abuse/DV'));
    if (r.MentalIllness === 'Yes')      flags.push(lo('Mental/Chronic Illness'));
    if (r.DcfsInvolvement === 'Yes')    flags.push(lo('DCFS'));
    if (r.SubstanceAbuse === 'Yes')     flags.push(lo('Substance Abuse'));
    if (r.CaregiverOther === 'Yes')     flags.push(lo('Non-Parent Caregiver'));
    if (r.FamilyDeath === 'Yes')        flags.push(lo('Family Death'));
    if (r.LowBirthWeight === 'Yes')     flags.push(lo('Low Birth Weight'));
    if (r.ParentIncarcerated === 'Yes') flags.push(lo('Parent Incarcerated'));
    if (r.TeenParent === 'Yes')         flags.push(lo('Teen Parent'));
    if (r.NoHSDiploma === 'Yes')        flags.push(lo('No HS Diploma'));
    if (r.BornOutsideUS === 'Yes')      flags.push(lo('Immigrant/Refugee'));
    if (r.NonEnglishHome === 'Yes')     flags.push(lo('Non-English Home'));
    if (r.ActiveMilitary === 'Yes')     flags.push(lo('Military'));
    if (r.PublicBenefits)               flags.push(lo('Public Benefits'));
    if (r.LivingSituation === 'Single Parent') flags.push(lo('Single Parent'));
    return flags.join('') || '<span style="color:var(--text-muted);font-size:0.8rem;">None</span>';
}

function handleStatusChange(id, selectEl) {
    const val = selectEl.value;

    if (val === 'Declined') {
        if (!confirm('Are you sure you want to remove this family from the waiting list? This cannot be undone.')) {
            const row = allRows.find(r => r.Id == id);
            selectEl.value = row ? row.WaitlistStatus : 'Pending';
            return;
        }
        updateStatusAPI(id, 'Declined').then(() => {
            const row = allRows.find(r => r.Id == id);
            if (row) row.WaitlistStatus = 'Declined';
            updateTabCounts();
            renderTable();
        });
        return;
    }

    if (val === 'Enroll') {
        const row = allRows.find(r => r.Id == id);
        selectEl.value = row ? row.WaitlistStatus : 'Pending';
        openEnrollModal(id);
        return;
    }

    updateStatusAPI(id, val).then(() => {
        const row = allRows.find(r => r.Id == id);
        if (row) row.WaitlistStatus = val;
    });
}

async function updateStatusAPI(id, status) {
    try {
        await apiFetch(`/api/waitinglist/${id}`, {
            method: 'PUT',
            body: JSON.stringify({ status })
        });
    } catch (e) { alert('Failed to update status'); }
}

async function saveNotes(id) {
    const el = document.getElementById(`notes-${id}`);
    // Notes must stay single-line: the API returns rows as pipe-delimited text split
    // on newlines, so an embedded newline would break that record into bogus rows.
    let notes = el.value.replace(/[\r\n]+/g, '  ').trim();
    // Append a timestamp when there's content to stamp. Skip if it already ends
    // with one, so re-saving unchanged text doesn't stack duplicates.
    if (notes) {
        const stampRe = /—\s*\d{1,2}\/\d{1,2}\/\d{4},?\s+\d{1,2}:\d{2}\s*(?:AM|PM)\s*$/i;
        if (!stampRe.test(notes)) {
            const now = new Date().toLocaleString('en-US', {
                month: 'numeric', day: 'numeric', year: 'numeric',
                hour: 'numeric', minute: '2-digit'
            });
            notes = notes + '  — ' + now;
        }
    }
    el.value = notes;
    try {
        const res = await apiFetch(`/api/waitinglist/${id}`, {
            method: 'PUT',
            body: JSON.stringify({ notes })
        });
        const data = await res.json();
        if (data.success) {
            const btn = document.querySelector(`#notes-${id} + button`);
            if (btn) { btn.textContent = 'Saved ✓'; setTimeout(() => btn.textContent = 'Save', 2000); }
        }
    } catch (e) { alert('Failed to save notes'); }
}

/* Hard-delete a pre-enrollment record — for test submissions and junk. A real family
   that decides against a spot is marked Declined (a status), so this asks for explicit
   confirmation naming the record, to keep the two apart. */
async function deleteRecord(id, label) {
    if (!confirm('Permanently delete this pre-enrollment record?\n\n' + (label || '')
        + '\n\nThis is for test or junk entries. A real family who declined a spot should '
        + 'be set to "Declined" instead. This cannot be undone.')) return;
    try {
        const res = await apiFetch(`/api/waitinglist/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
        // Drop it from the loaded set and re-render rather than reload the page.
        allRows = allRows.filter(x => String(x.Id) !== String(id));
        renderTable();
    } catch (e) {
        alert('Could not delete that record: ' + (e.message || e));
    }
}

// ── ENROLL ──
function openEnrollModal(id) {
    const r = allRows.find(x => x.Id == id);
    if (!r) return;

    sessionStorage.setItem('enrollFromWaitlist', JSON.stringify({
        waitlistId:      r.Id,
        firstName:       r.ChildName ? r.ChildName.split(' ')[0] : r.FirstName || '',
        lastName:        r.ChildName ? r.ChildName.split(' ').slice(1).join(' ') || r.LastName : r.LastName || '',
        cityTown:        r.City || '',
        birthDate:       r.ChildBirthDate || '',
        iep:             r.IEP === 'Yes',
        military:        r.ActiveMilitary === 'Yes',
        householdIncome: r.HouseholdIncome || '',
        householdSize:   r.HouseholdSize || '',
        publicBenefits:  r.PublicBenefits || '',
        fosterAdopted:   r.FosterAdopted === 'Yes',
    }));

    window.location.href = 'ems.html?enroll=1';
}

load();
</script>
