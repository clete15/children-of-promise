<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCCRA – SSWG Documents – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; }
        .gl-layout { display:flex;align-items:flex-start;justify-content:center;padding:20px; }
        .gl-wrapper { width:100%;max-width:900px; }
        .gl-card {
            background: var(--sp-surface); border:1px solid var(--sp-border);
            border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.12); overflow:hidden;
        }
        .gl-header { padding:14px 20px;border-bottom:1px solid var(--sp-border);display:flex;align-items:center;gap:12px; }
        .gl-header h2 { font-size:1rem;font-weight:800;color:var(--sp-text);margin:0; }
        .gl-msg { font-size:0.75rem;color:var(--sp-muted);margin-left:auto; }

        /* Breadcrumb + up control */
        .gl-crumbbar { display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--sp-border);background:var(--sp-surface-2);flex-wrap:wrap; }
        .gl-up {
            padding:5px 11px;border:1.5px solid var(--sp-border);border-radius:6px;background:var(--sp-surface);
            color:var(--sp-text-2);font-size:0.76rem;font-weight:700;cursor:pointer;white-space:nowrap;
        }
        .gl-up:hover:not(:disabled) { border-color:var(--sp-accent);color:var(--sp-accent); }
        .gl-up:disabled { opacity:0.45;cursor:default; }
        .gl-crumbs { display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:0.8rem;min-width:0; }
        .gl-crumb { color:var(--sp-accent);cursor:pointer;font-weight:600;text-decoration:none; }
        .gl-crumb:hover { text-decoration:underline; }
        .gl-crumb.here { color:var(--sp-text);cursor:default;font-weight:800; }
        .gl-crumb.here:hover { text-decoration:none; }
        .gl-sep { color:var(--sp-quiet);font-size:0.72rem; }

        .gl-body { padding:8px 0 12px; }
        .gl-row {
            display:flex;align-items:center;gap:12px;padding:10px 20px;
            border-top:1px solid var(--sp-border);font-size:0.85rem;
        }
        .gl-row:first-child { border-top:none; }
        .gl-icon { font-size:1.15rem;flex-shrink:0;width:1.4em;text-align:center; }
        .gl-name { flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sp-text); }
        .gl-folder { cursor:pointer; }
        .gl-folder:hover { background:var(--sp-surface-2); }
        .gl-folder .gl-name { font-weight:700; }
        .gl-size { font-size:0.7rem;color:var(--sp-quiet);flex-shrink:0;white-space:nowrap; }
        .gl-chev { color:var(--sp-quiet);flex-shrink:0;font-size:0.9rem; }
        .gl-btn {
            padding:5px 12px;border:1.5px solid var(--sp-border);border-radius:6px;
            background:var(--sp-surface);color:var(--sp-text-2);font-size:0.74rem;font-weight:700;
            text-decoration:none;cursor:pointer;white-space:nowrap;flex-shrink:0;
        }
        .gl-btn:hover { border-color:var(--sp-accent);color:var(--sp-accent); }
        .gl-empty { padding:26px 20px;text-align:center;color:var(--sp-muted);font-size:0.85rem; }
        .gl-empty code { background:var(--sp-surface-2);padding:2px 6px;border-radius:4px;font-size:0.78rem; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>INCCRA – SSWG Documents &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <div class="header-actions">
        <button type="button" class="header-theme-btn" id="spTheme" aria-pressed="false">☾ Dark mode</button>
        <a class="header-back" href="/staff/inccra.html">← INCCRA Grants</a>
    </div>
</header>

<div class="gl-layout">
    <div class="gl-wrapper">
        <div class="gl-card">
            <div class="gl-header">
                <h2>📂 INCCRA – SSWG Documents</h2>
                <span class="gl-msg" id="glMsg"></span>
            </div>
            <div class="gl-crumbbar">
                <button type="button" class="gl-up" id="glUp" disabled>↑ Up</button>
                <div class="gl-crumbs" id="glCrumbs"></div>
            </div>
            <div class="gl-body" id="glBody">
                <div class="gl-empty">Reading the grant folder…</div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
/* A file explorer over the INCCRA – SSWG grant folder, served by /api/grant-folder.
   It opens on the newest submission round and lets you walk into any archived folder.
   Files open through /api/doc-file — the same authenticated library plumbing the rest
   of the site uses, so no Microsoft sign-in and no second copy. Word/Excel get an Edit
   button when the OnlyOffice editor is configured on the server.

   The current location is kept in the URL hash so Back and refresh land in place. */

let officeEnabled = false;
let officeEditable = [];
let didAutoLandNewest = false;

function esc(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function extIcon(ext) {
    if (ext === '.pdf') return '📕';
    if (['.doc', '.docx'].includes(ext)) return '📘';
    if (['.xls', '.xlsx', '.csv'].includes(ext)) return '📗';
    if (['.png', '.jpg', '.jpeg', '.gif', '.webp'].includes(ext)) return '🖼️';
    return '📄';
}

function fmtSize(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

async function probeOffice() {
    try {
        const r = await apiFetch('/api/office-status');
        if (!r.ok) return;
        const d = await r.json();
        officeEnabled = !!(d && d.enabled);
        officeEditable = (d && d.editable) || [];
    } catch (e) { /* editing stays off */ }
}

// Reads the sub-path to browse from the URL hash (empty = grant root).
function currentSub() {
    if (!location.hash) return '';
    try { return decodeURIComponent(location.hash.slice(1)); }
    catch (e) { return location.hash.slice(1); }
}

function go(sub) {
    const h = '#' + encodeURIComponent(sub || '');
    if (location.hash === h) load();     // same target: reload in place
    else location.hash = h;              // triggers hashchange -> load()
}

function crumbRow(crumbs) {
    const box = document.getElementById('glCrumbs');
    box.innerHTML = crumbs.map((c, i) => {
        const last = i === crumbs.length - 1;
        const label = esc(c.name);
        const sep = i > 0 ? '<span class="gl-sep">›</span>' : '';
        if (last) return sep + '<span class="gl-crumb here">' + label + '</span>';
        return sep + '<a class="gl-crumb" data-sub="' + esc(c.sub) + '">' + label + '</a>';
    }).join('');
    box.querySelectorAll('.gl-crumb[data-sub]').forEach(a =>
        a.addEventListener('click', () => go(a.getAttribute('data-sub'))));
}

function folderRow(f) {
    return '<div class="gl-row gl-folder" data-sub="' + esc(f.sub) + '">'
        + '<span class="gl-icon">📁</span>'
        + '<span class="gl-name" title="' + esc(f.name) + '">' + esc(f.name) + '</span>'
        + '<span class="gl-chev">›</span>'
        + '</div>';
}

function fileRow(f) {
    const href = '/api/doc-file?path=' + encodeURIComponent(f.rel);
    const canEdit = officeEnabled && officeEditable.indexOf(f.ext) !== -1;
    return '<div class="gl-row">'
        + '<span class="gl-icon">' + extIcon(f.ext) + '</span>'
        + '<span class="gl-name" title="' + esc(f.name) + '">' + esc(f.name) + '</span>'
        + '<span class="gl-size">' + fmtSize(f.size) + '</span>'
        + '<a class="gl-btn" href="' + href + '" target="_blank" rel="noopener">Open</a>'
        + (canEdit
            ? '<a class="gl-btn" href="office.html?path=' + encodeURIComponent(f.rel)
              + '" target="_blank" rel="noopener" title="Edit in the browser and save straight back">Edit</a>'
            : '')
        + '</div>';
}

function render(data) {
    const body = document.getElementById('glBody');
    const up = document.getElementById('glUp');

    if (!data || !data.ok) {
        document.getElementById('glCrumbs').innerHTML = '';
        up.disabled = true;
        const why = (data && data.error) ? esc(data.error) : 'The grant folder could not be read.';
        body.innerHTML = '<div class="gl-empty">' + why
            + (data && data.folder ? '<br><br>Expected folder: <code>' + esc(data.folder) + '</code>' : '')
            + '</div>';
        return;
    }

    crumbRow(data.crumbs || [{ name: data.folder, sub: '' }]);
    const atRoot = !data.here;
    up.disabled = atRoot;
    up.onclick = atRoot ? null : () => go(data.parent || '');

    const folders = data.folders || [];
    const files = data.files || [];
    if (!folders.length && !files.length) {
        body.innerHTML = '<div class="gl-empty">This folder is empty.</div>';
        return;
    }
    body.innerHTML = folders.map(folderRow).join('') + files.map(fileRow).join('');
    body.querySelectorAll('.gl-folder[data-sub]').forEach(row =>
        row.addEventListener('click', () => go(row.getAttribute('data-sub'))));
}

async function load() {
    const msg = document.getElementById('glMsg');
    msg.textContent = 'Loading…';
    const sub = currentSub();
    try {
        const res = await apiFetch('/api/grant-folder?path=' + encodeURIComponent(sub));
        const data = await res.json();

        /* First visit lands at the root, then hops straight to the newest round so the
           thing people want open is open. Only once, and only from the root, so walking
           back up to the root afterwards does not keep bouncing you forward. */
        if (!didAutoLandNewest && !sub && data && data.ok && data.newest) {
            didAutoLandNewest = true;
            go(data.newest);
            return;
        }
        didAutoLandNewest = true;
        render(data);
        msg.textContent = data && data.ok ? '' : '';
    } catch (e) {
        document.getElementById('glBody').innerHTML =
            '<div class="gl-empty">Could not read the grant library: ' + esc(e.message) + '</div>';
        msg.textContent = '';
    }
}

window.addEventListener('hashchange', load);

(async function () {
    await probeOffice();
    await load();
})();
</script>
</body>
</html>
