<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Scheduler – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; margin: 0; }
        /* A touch less left inset than the other Enrollment pages (15%) because the
           week grid is wide; it still opens in line with the sub-nav. */
        .sch-layout { display:flex;align-items:flex-start;justify-content:flex-start;padding:20px 20px 20px 4%; }
        .sch-card { background:var(--sp-surface);border:1px solid var(--sp-border);flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.12);max-height:calc(100vh - 130px); }
        .sch-head { padding:14px 20px;border-bottom:1px solid var(--sp-border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap; }
        .sch-title { font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary); }
        .sch-body { overflow:auto;flex:1;padding:16px 20px; }

        /* Week navigation strip */
        .sch-weeknav { display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap; }
        .sch-weeknav .wk-label { font-size:1rem;font-weight:700;color:var(--sp-text); min-width:230px; }
        .wk-btn { padding:6px 12px;background:var(--sp-surface-2);color:var(--sp-text-2);border:1px solid var(--sp-border);border-radius:6px;font-size:0.8rem;font-weight:700;cursor:pointer; }
        .wk-btn:hover { filter:brightness(1.05);color:var(--sp-text); }

        .sch-table { width:100%;border-collapse:collapse;font-size:0.82rem; }
        .sch-table thead th { position:sticky;top:0;z-index:2;background:var(--sp-surface-2);border-bottom:2px solid var(--sp-border);padding:7px 6px;text-align:center;font-size:0.72rem;font-weight:700;color:var(--sp-muted); }
        .sch-table th.name-col { text-align:left;min-width:150px;padding-left:12px; }
        .sch-table td { padding:4px 5px;border-bottom:1px solid var(--sp-border);vertical-align:middle;text-align:center; }
        .sch-table td.name-cell { text-align:left;padding-left:12px;font-weight:600;color:var(--sp-text); white-space:nowrap; }
        .sch-table td.name-cell .role { display:block;font-size:0.68rem;font-weight:400;color:var(--sp-muted); }

        /* Classroom group header rows (Infants, Toddler, 2s, …) */
        .sch-grouprow td { background:var(--sp-surface-2);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
            font-size:0.68rem;color:var(--primary);padding:6px 12px;text-align:left;border-bottom:1px solid var(--sp-border); }

        /* A shift cell: the time input plus an OFF toggle sitting under it. */
        .cell-wrap { display:flex;flex-direction:column;align-items:stretch;gap:2px; }
        .sch-table input.time {
            width:100%;box-sizing:border-box;padding:5px 4px;border:1px solid var(--sp-border-in);border-radius:5px;
            font-size:0.8rem;font-family:inherit;background:var(--sp-field-bg);color:var(--sp-text);text-align:center;
        }
        .sch-table input.time:focus { outline:none;border-color:var(--sp-accent); }
        /* OFF cells carry the same yellow the paper schedule uses. */
        td.is-off input.time { background:#f7e463;color:#4a4a00;font-weight:700;border-color:#e6cf3a; }
        .off-toggle { font-size:0.6rem;color:var(--sp-muted);cursor:pointer;user-select:none; display:flex;align-items:center;justify-content:center;gap:3px; }
        .off-toggle input { margin:0; }

        /* A NO SCHOOL column: greyed, with the toggle living in the header. */
        .noschool-toggle { display:block;font-size:0.6rem;font-weight:700;margin-top:3px;cursor:pointer;color:var(--sp-muted);user-select:none; }
        th.noschool, td.noschool { background:repeating-linear-gradient(45deg,var(--sp-surface-2),var(--sp-surface-2) 6px,rgba(0,0,0,0.04) 6px,rgba(0,0,0,0.04) 12px); }
        td.noschool input.time { opacity:0.5; }
        .noschool-flag { font-size:0.6rem;font-weight:700;color:#b45309;letter-spacing:0.04em; }

        .sch-btn { padding:6px 14px;background:var(--sp-accent);color:#fff;border:none;border-radius:6px;font-size:0.76rem;font-weight:700;cursor:pointer; }
        .sch-btn:hover { filter:brightness(1.05); }
        .sch-btn[disabled] { opacity:0.4;cursor:default; }
        .sch-btn-plain { background:var(--sp-surface-2);color:var(--sp-text-2);border:1px solid var(--sp-border); }
        .btn-row-save { padding:4px 9px;background:var(--sp-accent);color:#fff;border:none;border-radius:5px;font-size:0.7rem;font-weight:700;cursor:pointer;opacity:0.4; }
        .btn-row-save:not([disabled]) { opacity:1; }
        .sch-empty { padding:24px;color:var(--sp-muted);font-size:0.88rem;text-align:center; }

        /* Print: just the chart, landscape, no chrome. */
        @media print {
            body { background:#fff;color:#000; }
            .site-header, .em-subnav-wrap, .sch-head, .wk-btn, .off-toggle, .noschool-toggle, .btn-row-save { display:none !important; }
            .sch-layout { padding:0; }
            .sch-card { border:none;box-shadow:none;max-height:none; }
            .sch-body { overflow:visible;padding:0; }
            .sch-table input.time { border:none;background:transparent;color:#000; }
            td.is-off input.time { background:#f7e463 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact; }
            .wk-label { color:#000; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Staff Scheduler &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <div class="header-actions">
        <button type="button" class="header-theme-btn" id="spTheme" aria-pressed="false">☾ Dark mode</button>
        <a class="header-back" href="/staff/">← Staff Portal</a>
    </div>
</header>

<!-- Shared Enrollment Management sub-nav (see ems.html for the note). -->
<style>
    .em-subnav { display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0;padding:10px 20px 0 15%; }
    .em-subnav a {
        font-size:0.9rem;font-weight:700;text-decoration:none;color:var(--sp-text-2);
        padding:8px 15px;border-radius:8px 8px 0 0;border-bottom:3px solid transparent;
        transition:color 0.12s,background 0.12s,border-color 0.12s;
    }
    .em-subnav a:hover { color:var(--sp-text);background:var(--sp-surface-2); }
    .em-subnav a.on { color:var(--sp-accent);border-bottom-color:var(--sp-accent); }
    .em-subnav-wrap { border-bottom:1.5px solid var(--sp-border); }
</style>
<div class="em-subnav-wrap">
    <nav class="em-subnav" aria-label="Enrollment management">
        <a href="/staff/waitinglist.html">Waiting List</a>
        <a href="/staff/ems.html">Enrolled Students</a>
        <a href="/staff/attendance.html">Attendance</a>
        <a href="/staff/benefits.html">Benefits &amp; Eligibility</a>
        <a href="/staff/roster.html">Room Roster</a>
        <a href="/staff/rooms.html">Classrooms &amp; Staffing</a>
        <a href="/staff/scheduler.html" class="on" aria-current="page">Staff Scheduler</a>
    </nav>
</div>

<div class="sch-layout">
    <div class="sch-card">
        <div class="sch-head">
            <div class="sch-title">Staff Scheduler</div>
            <div style="display:flex;gap:8px;">
                <button class="sch-btn" id="schSaveAll" onclick="saveAll()" disabled>Save All Changes</button>
                <button class="sch-btn sch-btn-plain" onclick="window.print()">&#x1F5A8;&#xFE0F; Print</button>
            </div>
        </div>
        <div class="sch-body">
            <div class="sch-weeknav">
                <button class="wk-btn" onclick="shiftWeek(-1)">&lsaquo; Previous</button>
                <button class="wk-btn" onclick="goThisWeek()">This week</button>
                <button class="wk-btn" onclick="shiftWeek(1)">Next &rsaquo;</button>
                <span class="wk-label" id="wkLabel">Loading…</span>
            </div>
            <table class="sch-table">
                <thead><tr id="schHeadRow"></tr></thead>
                <tbody id="schBody"><tr><td class="sch-empty" colspan="6">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
/* Staff Scheduler — the weekly work schedule chart, admin-edited. Mirrors the paper
   schedule: staff grouped by classroom, a Mon-Fri shift per person, OFF cells, and
   days the centre is closed (NO SCHOOL). Saves per person per week through
   /api/staff-schedule. A staff member sees only their own week, read-only, from their
   portal — this page is the editor for the whole chart. */

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const DAY_FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

/* The classroom buckets on the paper schedule, and which room numbers fall in each.
   Rooms are grouped youngest-first to match every other room-ordered view. Anyone
   whose primary room is not one of these (or who has none) lands in "Unassigned" so
   nobody is dropped from the chart. */
const BUCKETS = [
    { label: 'Infants',     rooms: [1, 2] },
    { label: 'Toddler',     rooms: [3, 4] },
    { label: '2s',          rooms: [5, 7] },
    { label: 'Preschool',   rooms: [6] },
    { label: 'Afterschool', rooms: [8] },
];

let staff = [];              // active staff rows from /api/staff
let weekStart = null;        // ISO 'YYYY-MM-DD', the Monday on screen
let noSchoolDays = new Set();// day indices (0..4) the centre is closed this week
let schedule = {};           // StaffId -> { Mon,Tue,Wed,Thu,Fri }
let dirty = new Set();       // StaffIds with unsaved edits

function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// ── Week math ───────────────────────────────────────────────────────────────
function mondayOf(d) {
    const x = new Date(d);
    const dow = (x.getDay() + 6) % 7;   // 0=Mon..6=Sun
    x.setDate(x.getDate() - dow);
    return isoDate(x);
}
function isoDate(x) {
    const m = String(x.getMonth() + 1).padStart(2, '0');
    const day = String(x.getDate()).padStart(2, '0');
    return x.getFullYear() + '-' + m + '-' + day;
}
// A date for a given day offset (0=Mon) within the current week.
function dayDate(offset) {
    const [y, m, d] = weekStart.split('-').map(Number);
    const x = new Date(y, m - 1, d);
    x.setDate(x.getDate() + offset);
    return x;
}
function fmtDay(x) {
    const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getMonth()];
    return x.getDate() + '-' + mon;   // e.g. "13-Oct", matching the paper chart
}
function weekLabel() {
    const a = dayDate(0), b = dayDate(4);
    return 'Week of ' + fmtDay(a) + ' – ' + fmtDay(b) + ', ' + a.getFullYear();
}

// ── Load ─────────────────────────────────────────────────────────────────────
async function loadStaff() {
    try {
        const res = await apiFetch('/api/staff');
        if (res.ok) {
            const data = await res.json();
            staff = Array.isArray(data)
                ? data.filter(s => String(s.Name || '').trim() && !/^new teacher$/i.test(s.Name))
                : [];
        }
    } catch (e) { staff = []; }
}

async function loadWeek() {
    schedule = {};
    noSchoolDays = new Set();
    try {
        const res = await apiFetch('/api/staff-schedule?weekStart=' + encodeURIComponent(weekStart));
        if (res.ok) {
            const data = await res.json();
            (data.rows || []).forEach(r => {
                schedule[String(r.StaffId)] = { Mon: r.Mon, Tue: r.Tue, Wed: r.Wed, Thu: r.Thu, Fri: r.Fri };
            });
            String(data.noSchoolDays || '').split(',').forEach(n => {
                const i = parseInt(n, 10);
                if (!isNaN(i)) noSchoolDays.add(i);
            });
        }
    } catch (e) { /* a blank week renders empty, which is correct */ }
}

// ── Grouping ──────────────────────────────────────────────────────────────────
function bucketOf(s) {
    const rn = parseInt(s.RoomNumber, 10);
    const b = BUCKETS.find(x => x.rooms.indexOf(rn) !== -1);
    return b ? b.label : 'Unassigned';
}
// Staff grouped into bucket order, each group's people sorted by name.
function groupedStaff() {
    const order = BUCKETS.map(b => b.label).concat(['Unassigned']);
    const groups = {};
    staff.forEach(s => {
        const b = bucketOf(s);
        (groups[b] = groups[b] || []).push(s);
    });
    return order
        .filter(label => groups[label] && groups[label].length)
        .map(label => ({
            label: label,
            people: groups[label].sort((a, b) => String(a.Name).localeCompare(String(b.Name)))
        }));
}

// ── Render ─────────────────────────────────────────────────────────────────────
function renderHead() {
    const row = document.getElementById('schHeadRow');
    let html = '<th class="name-col">Name</th>';
    for (let i = 0; i < 5; i++) {
        const closed = noSchoolDays.has(i);
        html += '<th class="' + (closed ? 'noschool' : '') + '">'
            + DAY_FULL[i] + '<br>' + fmtDay(dayDate(i))
            + '<label class="noschool-toggle"><input type="checkbox" ' + (closed ? 'checked' : '')
            + ' onchange="toggleNoSchool(' + i + ', this.checked)"> no school</label>'
            + '</th>';
    }
    html += '<th style="width:56px;">Save</th>';
    row.innerHTML = html;
}

function renderBody() {
    dirty = new Set();
    const all = document.getElementById('schSaveAll');
    if (all) all.disabled = true;

    const tbody = document.getElementById('schBody');
    const groups = groupedStaff();
    if (!groups.length) {
        tbody.innerHTML = '<tr><td class="sch-empty" colspan="6">No staff to schedule.</td></tr>';
        return;
    }
    let html = '';
    groups.forEach(g => {
        html += '<tr class="sch-grouprow"><td colspan="6">' + esc(g.label) + '</td></tr>';
        g.people.forEach(s => {
            const id = String(s.Id);
            const sc = schedule[id] || {};
            html += '<tr data-staff="' + id + '">';
            html += '<td class="name-cell">' + esc(s.Name)
                + (s.Role ? '<span class="role">' + esc(s.Role) + '</span>' : '') + '</td>';
            for (let i = 0; i < 5; i++) {
                const val = sc[DAYS[i]] || '';
                const isOff = /^off$/i.test(val);
                const closed = noSchoolDays.has(i);
                html += '<td class="' + (isOff ? 'is-off ' : '') + (closed ? 'noschool' : '') + '">'
                    + '<div class="cell-wrap">'
                    + '<input class="time" type="text" value="' + esc(val) + '" '
                    + 'placeholder="' + (closed ? '—' : '6:15-4:15') + '" '
                    + 'id="c_' + id + '_' + i + '" oninput="onEdit(\'' + id + '\')">'
                    + '<label class="off-toggle"><input type="checkbox" ' + (isOff ? 'checked' : '')
                    + ' onchange="toggleOff(\'' + id + '\',' + i + ',this.checked)">OFF</label>'
                    + '</div></td>';
            }
            html += '<td><button class="btn-row-save" id="save_' + id + '" onclick="saveRow(\'' + id + '\')" disabled>Save</button></td>';
            html += '</tr>';
        });
    });
    tbody.innerHTML = html;
}

function render() {
    document.getElementById('wkLabel').textContent = weekLabel();
    renderHead();
    renderBody();
}

// ── Edit tracking ───────────────────────────────────────────────────────────────
function markDirty(id) {
    dirty.add(String(id));
    const btn = document.getElementById('save_' + id);
    if (btn) btn.disabled = false;
    const all = document.getElementById('schSaveAll');
    if (all) all.disabled = false;
}
function onEdit(id) {
    // A cell typed into is no longer "OFF" unless it literally says OFF; keep the
    // yellow in sync with the text so the two never disagree.
    for (let i = 0; i < 5; i++) {
        const input = document.getElementById('c_' + id + '_' + i);
        if (!input) continue;
        const td = input.closest('td');
        if (td) td.classList.toggle('is-off', /^off$/i.test(input.value.trim()));
    }
    markDirty(id);
}
function toggleOff(id, dayIdx, on) {
    const input = document.getElementById('c_' + id + '_' + dayIdx);
    if (!input) return;
    input.value = on ? 'OFF' : '';
    const td = input.closest('td');
    if (td) td.classList.toggle('is-off', on);
    markDirty(id);
}

/* NO SCHOOL is a per-week fact, not per-person, so toggling a column broadcasts the
   new closed-days list to every row of the week in one call, then re-renders. */
async function toggleNoSchool(dayIdx, on) {
    if (on) noSchoolDays.add(dayIdx); else noSchoolDays.delete(dayIdx);
    const list = Array.from(noSchoolDays).sort().join(',');
    try {
        const res = await apiFetch('/api/staff-schedule', {
            method: 'POST',
            body: JSON.stringify({ weekStart: weekStart, noSchoolDays: list, broadcastNoSchool: true })
        });
        const data = await res.json();
        if (!data.success) { showNotification('Could not update no-school days: ' + (data.error || ''), 'error'); }
    } catch (e) { showNotification('Network error', 'error'); }
    render();
}

// ── Save ───────────────────────────────────────────────────────────────────────
function readRow(id) {
    const out = {};
    for (let i = 0; i < 5; i++) {
        const input = document.getElementById('c_' + id + '_' + i);
        out[DAYS[i].toLowerCase()] = input ? input.value.trim() : '';
    }
    return out;
}
async function putRow(id) {
    const body = Object.assign({
        weekStart: weekStart,
        staffId: parseInt(id, 10),
        noSchoolDays: Array.from(noSchoolDays).sort().join(',')
    }, readRow(id));
    try {
        const res = await apiFetch('/api/staff-schedule', { method: 'POST', body: JSON.stringify(body) });
        const data = await res.json();
        if (data.success) {
            schedule[id] = { Mon: body.mon, Tue: body.tue, Wed: body.wed, Thu: body.thu, Fri: body.fri };
            dirty.delete(String(id));
            const btn = document.getElementById('save_' + id);
            if (btn) btn.disabled = true;
            return true;
        }
        showNotification('Save failed: ' + (data.error || ''), 'error');
        return false;
    } catch (e) { showNotification('Network error', 'error'); return false; }
}
async function saveRow(id) {
    const ok = await putRow(id);
    if (ok) {
        const s = staff.find(x => String(x.Id) === String(id));
        showNotification('Saved ' + (s ? s.Name : 'schedule'), 'success');
        if (!dirty.size) { const all = document.getElementById('schSaveAll'); if (all) all.disabled = true; }
    }
}
async function saveAll() {
    const ids = Array.from(dirty);
    if (!ids.length) return;
    let saved = 0, failed = 0;
    for (const id of ids) { (await putRow(id)) ? saved++ : failed++; }
    if (saved) showNotification('Saved ' + saved + ' schedule' + (saved === 1 ? '' : 's') + (failed ? ', ' + failed + ' failed' : ''), failed ? 'error' : 'success');
    if (!dirty.size) { const all = document.getElementById('schSaveAll'); if (all) all.disabled = true; }
}

// ── Week navigation ──────────────────────────────────────────────────────────────
function warnIfDirty() {
    return !dirty.size || confirm('You have unsaved changes that will be lost. Continue?');
}
async function shiftWeek(delta) {
    if (!warnIfDirty()) return;
    const [y, m, d] = weekStart.split('-').map(Number);
    const x = new Date(y, m - 1, d);
    x.setDate(x.getDate() + delta * 7);
    weekStart = isoDate(x);
    await loadWeek();
    render();
}
async function goThisWeek() {
    if (!warnIfDirty()) return;
    weekStart = mondayOf(new Date());
    await loadWeek();
    render();
}

async function init() {
    weekStart = mondayOf(new Date());
    await loadStaff();
    await loadWeek();
    render();
}

init();
</script>
</body>
</html>
