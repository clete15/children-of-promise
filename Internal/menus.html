<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; }
        .menu-layout { display:flex;align-items:flex-start;justify-content:center;padding:20px;min-height:calc(100vh - 90px); }
        .menu-container { background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.2);width:100%;max-width:1200px;overflow:hidden; }
        .menu-header { padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px; }
        .menu-header h2 { font-size:1.1rem;font-weight:800;color:#1e3a8a;margin:0; }
        .menu-controls { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
        .menu-controls button, .menu-controls a { padding:6px 14px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;text-decoration:none;display:inline-block; }
        .btn-primary { background:#2563eb;color:white; }
        .btn-primary:hover { background:#1d4ed8; }
        .btn-green { background:#16a34a;color:white; }
        .btn-purple { background:#7c3aed;color:white; }
        .btn-orange { background:#ea580c;color:white; }
        .menu-body { padding:24px;overflow-y:auto;max-height:calc(100vh - 180px); }
        .menu-section { margin-bottom:28px; }
        .menu-section-title { font-size:0.85rem;font-weight:700;color:#1e3a8a;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #2563eb; }
        .menu-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:8px; }
        .menu-day { border:1px solid #e5e7eb;border-radius:8px;overflow:hidden; }
        .menu-day-header { background:#f1f5f9;padding:8px 10px;font-size:0.72rem;font-weight:700;color:#374151;text-align:center;border-bottom:1px solid #e5e7eb; }
        .menu-day-header .day-date { font-size:0.65rem;font-weight:400;color:#6b7280;margin-top:2px; }
        .menu-day.holiday .menu-day-header { background:#fef2f2;color:#dc2626; }
        .menu-meal { padding:5px 8px;border-bottom:1px solid #f3f4f6; }
        .menu-meal:last-child { border-bottom:none; }
        .menu-meal-label { font-size:0.58rem;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:2px; }
        .menu-meal textarea { width:100%;border:1px solid #e5e7eb;border-radius:4px;padding:4px 6px;font-size:0.7rem;font-family:inherit;resize:vertical;min-height:62px;height:62px;transition:border-color 0.15s; }
        .menu-meal textarea:focus { outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,0.1); }
        .seasonal-banner { text-align:center;padding:8px;font-size:0.8rem;font-weight:700;border-radius:6px;margin-bottom:12px; }

        @media print {
            body { background:white !important; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
            .site-header, .menu-controls, .header-back, .menu-body, .menu-header { display:none !important; }
            .menu-layout { display:none !important; }
            #printArea { display:block !important; }
        }
        #printArea { display:none; }
        #printArea .print-sheet { page-break-after:always;padding:14px;font-family:Arial,sans-serif;max-height:100vh;overflow:hidden; }
        #printArea .print-sheet:last-child { page-break-after:auto; }
        #printArea .print-header { display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px; }
        #printArea .print-header img { width:120px;height:120px;margin-left:15px; }
        #printArea .print-header h1 { font-size:32px;font-weight:700;color:#1e3a8a;margin:0;text-align:center;font-family:'Dancing Script',cursive; }
        #printArea .print-subtitle { text-align:center;font-size:14px;color:#6b7280;margin-bottom:12px;font-weight:600;font-family:'Fredoka',sans-serif; }
        #printArea table { width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed; }
        #printArea th { background:#1e3a8a;color:white;padding:10px 6px;font-weight:700;text-transform:uppercase;font-size:11px;text-align:center;border:1px solid #1e3a8a; }
        #printArea td { border:1px solid #d1d5db;padding:14px 8px;text-align:center;vertical-align:middle;font-size:12px;line-height:1.6; }
        #printArea .meal-label { background:#f1f5f9;font-weight:800;color:#1e3a8a;text-align:center;width:100px;font-size:11px;text-transform:uppercase; }
        #printArea .holiday-cell { background:#f0fdf4;color:#16a34a;font-weight:700;font-size:14px; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Weekly Menu Planner &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="menu-layout">
    <div class="menu-container">
        <div class="menu-header">
            <h2>🍽️ Weekly Menu — <span id="weekLabel"></span> <span id="rotationLabel" style="font-size:0.65rem;font-weight:400;color:#6b7280;margin-left:8px;"></span></h2>
            <div class="menu-controls">
                <button class="btn-primary" onclick="prevWeek()">← Prev</button>
                <button class="btn-primary" onclick="nextWeek()">Next →</button>
                <button class="btn-primary" onclick="goToThisWeek()">This Week</button>
                <button class="btn-green" onclick="saveMenus()">💾 Update Menu</button>
                <button class="btn-purple" onclick="printMenus()">🖨️ Print</button>
            </div>
        </div>
        <div class="menu-body">
            <div id="seasonalBanner"></div>
            <!-- Shown only when the shared menu could NOT be read. Staying silent
                 here is what let one laptop's copy pass for the centre's menu. -->
            <div id="menuLoadWarning"></div>
            <div class="menu-section">
                <div class="menu-section-title">📚 Preschool</div>
                <div class="menu-grid" id="pfaGrid"></div>
            </div>
            <div class="menu-section">
                <div class="menu-section-title">🏫 Birth to Three</div>
                <div class="menu-grid" id="otherGrid"></div>
            </div>
        </div>
    </div>
</div>

<script src="/staff/auth.js"></script>
<script>
/* Credentials come from the Staff Portal sign-in, never from source. Use
   CofpAuth.headers() (the personal token AND the shared password when present),
   not header() alone: after the move to personal session sign-in a signed-in user
   holds a TOKEN and no stored shared password, so header() would be null and this
   page sent NO auth at all — the 401 "not connected" symptom. headers() lets the
   token ride along so the one sign-in at the front door carries through here. */
function apiFetch(url, opts = {}) {
    opts.headers = Object.assign({ 'Content-Type': 'application/json' },
        (window.CofpAuth && CofpAuth.headers) ? CofpAuth.headers() : {},
        opts.headers || {});
    return fetch(url, opts);
}

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const MEALS = ['Breakfast','AM Snack','Lunch','PM Snack'];

/* ------------------------------------------------------------------ *
 * Shared seasonal art library (inline SVG — no package, no build).
 *
 * Why SVG and not emoji: emoji render differently per OS and FONT, and
 * routinely print as empty boxes (□) on the Windows print path this page
 * uses. Inline SVG is identical on screen and on paper, scales crisply,
 * and inherits colour via `currentColor` so one icon serves every theme.
 *
 * Each icon is a function(size, color) -> svg string so the same shape
 * works tiny (banner, 22px) and large (print corner art, 110px).
 * ------------------------------------------------------------------ */
const ART = (() => {
    const wrap = (size, body, extra) =>
        `<svg viewBox="0 0 60 60" width="${size}" height="${size}" `
        + `style="vertical-align:middle;${extra || ''}" aria-hidden="true">${body}</svg>`;

    return {
        snowflake: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g stroke="${c}" stroke-width="2" fill="${c}" opacity="${o}">`
            + `<path d="M30 5v50M5 30h50M12 12l36 36M48 12L12 48" fill="none"/>`
            + `<circle cx="30" cy="30" r="4"/><circle cx="30" cy="10" r="2"/>`
            + `<circle cx="30" cy="50" r="2"/><circle cx="10" cy="30" r="2"/>`
            + `<circle cx="50" cy="30" r="2"/><circle cx="16" cy="16" r="2"/>`
            + `<circle cx="44" cy="44" r="2"/><circle cx="44" cy="16" r="2"/>`
            + `<circle cx="16" cy="44" r="2"/></g>`),
        snowman: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><circle cx="30" cy="40" r="14" fill="#fff" stroke="${c}" stroke-width="2"/>`
            + `<circle cx="30" cy="20" r="9" fill="#fff" stroke="${c}" stroke-width="2"/>`
            + `<circle cx="27" cy="18" r="1.4" fill="${c}"/><circle cx="33" cy="18" r="1.4" fill="${c}"/>`
            + `<polygon points="30,21 38,23 30,25" fill="#ea580c"/>`
            + `<circle cx="30" cy="36" r="1.5" fill="${c}"/><circle cx="30" cy="42" r="1.5" fill="${c}"/>`
            + `<path d="M18 32 L8 28 M42 32 L52 28" stroke="${c}" stroke-width="2" fill="none"/></g>`),
        leaf: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}">`
            // Maple-leaf silhouette: lobed top/side points around a center, plus a stem.
            + `<path d="M30 7 L34 17 L43 13 L40 23 L52 24 L43 31 L50 39 L39 38 L40 48 `
            + `L32 42 L30 53 L28 42 L20 48 L21 38 L10 39 L17 31 L8 24 L20 23 L17 13 `
            + `L26 17 Z" fill="${c}" stroke="${c}" stroke-width="1" stroke-linejoin="round"/>`
            + `<line x1="30" y1="22" x2="30" y2="53" stroke="#fff" stroke-width="1.4" opacity="0.5"/>`
            + `<line x1="30" y1="30" x2="40" y2="26" stroke="#fff" stroke-width="1" opacity="0.4"/>`
            + `<line x1="30" y1="30" x2="20" y2="26" stroke="#fff" stroke-width="1" opacity="0.4"/></g>`),
        acorn: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><ellipse cx="30" cy="38" rx="13" ry="15" fill="${c}"/>`
            + `<path d="M16 28 Q30 18 44 28 Q44 34 16 34 Z" fill="#78350f"/>`
            + `<rect x="28" y="12" width="4" height="8" rx="2" fill="#78350f"/></g>`),
        // The sun keeps its own warm gold regardless of the theme colour — a
        // blue/purple sun looks wrong, so it ignores `c` like the firework does.
        sun: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><circle cx="30" cy="30" r="12" fill="#fbbf24"/>`
            + `<circle cx="30" cy="30" r="12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>`
            + `<g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">`
            + `<line x1="30" y1="2" x2="30" y2="12"/><line x1="30" y1="48" x2="30" y2="58"/>`
            + `<line x1="2" y1="30" x2="12" y2="30"/><line x1="48" y1="30" x2="58" y2="30"/>`
            + `<line x1="10" y1="10" x2="17" y2="17"/><line x1="43" y1="43" x2="50" y2="50"/>`
            + `<line x1="50" y1="10" x2="43" y2="17"/><line x1="17" y1="43" x2="10" y2="50"/></g></g>`),
        wave: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round">`
            + `<path d="M4 24 Q14 14 24 24 T44 24 T64 24"/>`
            + `<path d="M4 36 Q14 26 24 36 T44 36 T64 36"/>`
            + `<path d="M4 48 Q14 38 24 48 T44 48 T64 48"/></g>`),
        flower: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><circle cx="30" cy="18" r="9" fill="${c}" opacity="0.6"/>`
            + `<circle cx="18" cy="30" r="9" fill="${c}" opacity="0.6"/>`
            + `<circle cx="42" cy="30" r="9" fill="${c}" opacity="0.6"/>`
            + `<circle cx="22" cy="42" r="9" fill="${c}" opacity="0.6"/>`
            + `<circle cx="38" cy="42" r="9" fill="${c}" opacity="0.6"/>`
            + `<circle cx="30" cy="30" r="6" fill="#f59e0b"/></g>`),
        butterfly: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}">`
            // Upper wings (large, rounded) + lower wings (smaller, teardrop),
            // mirrored around a central body. Small dots give it detail at size.
            + `<g stroke="${c}" stroke-width="1">`
            + `<path d="M30 30 C18 8 2 12 8 24 C11 31 22 31 30 30Z" fill="${c}"/>`
            + `<path d="M30 30 C42 8 58 12 52 24 C49 31 38 31 30 30Z" fill="${c}"/>`
            + `<path d="M30 31 C20 38 8 40 12 50 C16 56 26 50 30 34Z" fill="${c}" opacity="0.75"/>`
            + `<path d="M30 31 C40 38 52 40 48 50 C44 56 34 50 30 34Z" fill="${c}" opacity="0.75"/></g>`
            + `<circle cx="18" cy="20" r="2.4" fill="#fff" opacity="0.8"/>`
            + `<circle cx="42" cy="20" r="2.4" fill="#fff" opacity="0.8"/>`
            + `<ellipse cx="30" cy="33" rx="2.4" ry="12" fill="#374151"/>`      // body
            + `<path d="M30 22 q-4 -8 -8 -10 M30 22 q4 -8 8 -10" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>`), // antennae
        heart: (s, c = 'currentColor', o = 1) => wrap(s,
            `<path opacity="${o}" d="M30 52C30 52 3 36 3 19C3 10 10 3 19 3C24 3 28 6 30 11C32 6 36 3 41 3C50 3 57 10 57 19C57 36 30 52 30 52Z" fill="${c}"/>`),
        star: (s, c = 'currentColor', o = 1) => wrap(s,
            `<polygon opacity="${o}" points="30,3 37,22 57,22 41,35 47,55 30,43 13,55 19,35 3,22 23,22" fill="${c}"/>`),
        tree: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><polygon points="30,3 8,48 52,48" fill="${c}"/>`
            + `<rect x="25" y="48" width="10" height="10" fill="#78350f"/>`
            + `<circle cx="25" cy="22" r="3" fill="#dc2626"/><circle cx="35" cy="30" r="3" fill="#f59e0b"/>`
            + `<circle cx="28" cy="38" r="3" fill="#2563eb"/><polygon points="30,1 32,8 28,8" fill="#f59e0b"/></g>`),
        holly: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><path d="M30 20 Q18 24 20 36 Q32 34 30 20Z" fill="#16a34a"/>`
            + `<path d="M30 20 Q42 24 40 36 Q28 34 30 20Z" fill="#15803d"/>`
            + `<path d="M30 22 Q22 34 30 46 Q38 34 30 22Z" fill="#16a34a"/>`
            + `<circle cx="27" cy="42" r="4" fill="#dc2626"/><circle cx="34" cy="44" r="4" fill="#dc2626"/>`
            + `<circle cx="30" cy="48" r="4" fill="#b91c1c"/></g>`),
        pumpkin: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><ellipse cx="30" cy="36" rx="22" ry="20" fill="${c}"/>`
            + `<ellipse cx="20" cy="36" rx="10" ry="18" fill="${c}" opacity="0.75"/>`
            + `<ellipse cx="40" cy="36" rx="10" ry="18" fill="${c}" opacity="0.75"/>`
            + `<rect x="27" y="8" width="6" height="14" rx="3" fill="#16a34a"/>`
            + `<path d="M30 8C30 8 37 3 43 6" stroke="#16a34a" stroke-width="2.5" fill="none"/></g>`),
        ghost: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><path d="M14 50 V26 a16 16 0 0 1 32 0 V50 l-5-5 -5 5 -6-5 -6 5 -4-5Z" fill="#fff" stroke="${c}" stroke-width="2"/>`
            + `<circle cx="24" cy="26" r="3" fill="${c}"/><circle cx="36" cy="26" r="3" fill="${c}"/>`
            + `<ellipse cx="30" cy="34" rx="3" ry="4" fill="${c}"/></g>`),
        turkey: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}">`
            // Fanned tail: five fat feather "petals" radiating behind the body,
            // alternating warm colours so the fan still reads when small.
            + `<g stroke="#92400e" stroke-width="1" stroke-linejoin="round">`
            + `<path d="M30 34 L14 10 Q22 18 30 34Z" fill="#d97706"/>`
            + `<path d="M30 34 L46 10 Q38 18 30 34Z" fill="#d97706"/>`
            + `<path d="M30 34 L21 7 Q27 17 30 34Z" fill="#f59e0b"/>`
            + `<path d="M30 34 L39 7 Q33 17 30 34Z" fill="#f59e0b"/>`
            + `<path d="M30 34 L30 5 Q31 18 30 34Z" fill="#b45309"/></g>`
            // Round body + head, kept simple and bold.
            + `<ellipse cx="30" cy="44" rx="12" ry="12" fill="${c}"/>`
            + `<circle cx="30" cy="36" r="6" fill="#7c2d12"/>`
            + `<circle cx="28" cy="35" r="1.2" fill="#fff"/><circle cx="32" cy="35" r="1.2" fill="#fff"/>`
            + `<polygon points="30,37 35,39 30,41" fill="#f59e0b"/>`         // beak
            + `<path d="M30 39 q4 2 2 6" stroke="#dc2626" stroke-width="2" fill="none"/>` // wattle
            + `<path d="M22 50 l-3 4 M26 52 l-1 4 M34 52 l1 4 M38 50 l3 4" stroke="#f59e0b" stroke-width="1.5"/></g>`),
        egg: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><ellipse cx="30" cy="32" rx="18" ry="24" fill="${c}"/>`
            + `<path d="M12 26h36" stroke="#fff" stroke-width="2.5"/>`
            + `<path d="M12 38h36" stroke="#fff" stroke-width="2.5"/>`
            + `<circle cx="20" cy="32" r="3" fill="#fff" opacity="0.8"/>`
            + `<circle cx="30" cy="32" r="3" fill="#fff" opacity="0.8"/>`
            + `<circle cx="40" cy="32" r="3" fill="#fff" opacity="0.8"/></g>`),
        bunny: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><ellipse cx="22" cy="18" rx="4" ry="13" fill="${c}"/>`
            + `<ellipse cx="38" cy="18" rx="4" ry="13" fill="${c}"/>`
            + `<ellipse cx="22" cy="20" rx="2" ry="8" fill="#f9a8d4"/>`
            + `<ellipse cx="38" cy="20" rx="2" ry="8" fill="#f9a8d4"/>`
            + `<circle cx="30" cy="40" r="14" fill="${c}"/>`
            + `<circle cx="25" cy="38" r="1.6" fill="#374151"/><circle cx="35" cy="38" r="1.6" fill="#374151"/>`
            + `<path d="M30 42 l-2 2 h4 Z" fill="#f9a8d4"/></g>`),
        shamrock: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}" fill="${c}">`
            // Three identical heart leaves rotated 120° apart around the centre
            // (30,28). A heart's point sits at the centre so all three meet there;
            // a stem drops straight down. This reads as a shamrock at any size.
            + `<g>`
            + `<path d="M30 28 C24 18 12 20 15 11 C17 5 27 6 30 16 C33 6 43 5 45 11 C48 20 36 18 30 28Z"/>`
            + `<path d="M30 28 C24 18 12 20 15 11 C17 5 27 6 30 16 C33 6 43 5 45 11 C48 20 36 18 30 28Z" transform="rotate(120 30 28)"/>`
            + `<path d="M30 28 C24 18 12 20 15 11 C17 5 27 6 30 16 C33 6 43 5 45 11 C48 20 36 18 30 28Z" transform="rotate(240 30 28)"/>`
            + `</g>`
            + `<path d="M30 28 Q30 44 33 55" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`),
        rainbow: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}" fill="none" stroke-width="4">`
            + `<path d="M8 46 a22 22 0 0 1 44 0" stroke="#dc2626"/>`
            + `<path d="M14 46 a16 16 0 0 1 32 0" stroke="#f59e0b"/>`
            + `<path d="M20 46 a10 10 0 0 1 20 0" stroke="#16a34a"/>`
            + `<path d="M26 46 a4 4 0 0 1 8 0" stroke="#2563eb"/></g>`),
        // A festive burst: 12 trails radiating from the centre, each ending in a
        // bright dot, alternating red/gold/blue. Keeps its own colours (ignores
        // `c`) so it stays celebratory on the navy 4th-of-July sheet.
        // A festive burst: 12 trails radiating from the centre, each ending in a
        // bright dot, cycling pink/purple/blue/red (4 colours over 12 rays = 3
        // each) so it glows like a real firework and the blue ties back to the
        // navy 4th-of-July sheet. Keeps its own colours (ignores `c`).
        firework: (s, c = 'currentColor', o = 1) => {
            const cols = ['#ec4899', '#a855f7', '#2563eb', '#dc2626']; // pink, purple, blue, red
            let rays = '';
            for (let i = 0; i < 12; i++) {
                const a = (i * 30) * Math.PI / 180;
                const col = cols[i % 4];
                const r1 = 7;                       // trail starts away from centre
                const r2 = i % 2 === 0 ? 26 : 20;   // alternate long/short trails
                const x1 = 30 + Math.cos(a) * r1, y1 = 30 + Math.sin(a) * r1;
                const x2 = 30 + Math.cos(a) * r2, y2 = 30 + Math.sin(a) * r2;
                rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="2"/>`;
                rays += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2.3" fill="${col}"/>`;
                // A faint mid-trail spark on the long rays for a sense of scatter.
                if (i % 2 === 0) {
                    const xm = 30 + Math.cos(a) * 15, ym = 30 + Math.sin(a) * 15;
                    rays += `<circle cx="${xm.toFixed(1)}" cy="${ym.toFixed(1)}" r="1.1" fill="${col}" opacity="0.7"/>`;
                }
            }
            return wrap(s,
                `<g opacity="${o}" stroke-linecap="round">${rays}`
                + `<circle cx="30" cy="30" r="3.5" fill="#f9a8d4"/></g>`);
        },
        flag: (s, c = 'currentColor', o = 1) => wrap(s,
            `<g opacity="${o}"><rect x="12" y="10" width="36" height="24" fill="#dc2626"/>`
            + `<rect x="12" y="10" width="36" height="4" fill="#fff"/>`

/* On-screen seasonal banner. Derived from the SAME theme as the print sheet
   (getSeasonalTheme) so what staff see on screen matches what prints — the two
   used to drift because they were two separate month/day ladders. The little
   icons are the shared SVG set, not emoji, so nothing shows as a box. */
function getSeasonalBanner(weekStart) {
    const t = getSeasonalTheme(weekStart);
    if (!t) return null;
    // If the theme has a colour palette (Fall's leaf mix), the two flanking
    // icons use different colours; otherwise both use the single cornerColour.
    const pal = (t.iconPalette && t.iconPalette.length) ? t.iconPalette : [t.cornerColor];
    return {
        text: t.label,
        iconLeft: artRun(t.icon, 22, pal[0], 1),
        iconRight: artRun(t.icon, 22, pal[1 % pal.length], 1),
        bg: t.bannerBg,
        color: t.bannerColor
    };
}

function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff));
}

function formatDate(d) { return (d.getMonth()+1) + '/' + d.getDate(); }
function getWeekKey() { return currentWeekStart.toISOString().split('T')[0]; }

/* The rotation template is a starting point for a week nobody has filled in yet,
   so it is applied ONLY when the week genuinely has no saved menu. Applying it
   after a real menu loaded would quietly refill any meal that had been cleared on
   purpose, undoing a deletion every time the page opened. */
function showWeek() {
    render();
    return loadMenus().then(source => {
        if (source === 'empty') applyTemplate(getRotatingTemplateIndex(), false);
    });
}

function prevWeek() { currentWeekStart.setDate(currentWeekStart.getDate() - 7); showWeek(); }
function nextWeek() { currentWeekStart.setDate(currentWeekStart.getDate() + 7); showWeek(); }
function goToThisWeek() { currentWeekStart = getMonday(new Date()); showWeek(); }

function render() {

    for (let i = 0; i < 5; i++) { const d = new Date(currentWeekStart); d.setDate(d.getDate() + i); dates.push(d); }

            return `<div class="menu-day${isHoliday?' holiday':''}">

function loadTemplate() {
    const idx = getRotatingTemplateIndex();
    const weekNum = prompt('Load template week (1-4):\n(Current rotation: Week ' + (idx+1) + ')', String(idx+1));
    const i = parseInt(weekNum) - 1;
    if (isNaN(i) || i < 0 || i > 3) { alert('Enter 1, 2, 3, or 4'); return; }
    applyTemplate(i, true);
}

function getRotatingTemplateIndex() {
    // Calculate which template week we're on based on ISO week number mod 4
    const d = new Date(currentWeekStart);
    const dayNum = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dayNum + 3);
    const firstThursday = new Date(d.getFullYear(), 0, 4);
    const weekNum = Math.round(((d - firstThursday) / 86400000 + 1) / 7) + 1;
    return (weekNum - 1) % 4;
}

let _saveTimeout = null;
function autoSave() {
    if (_saveTimeout) clearTimeout(_saveTimeout);
    _saveTimeout = setTimeout(() => saveMenus(), 1000);
}

async function saveMenus() {
    const weekKey = getWeekKey();
    const templateIdx = getRotatingTemplateIndex();
    const data = { week: weekKey, pfa: {}, other: {}, templateIndex: templateIdx };
    ['pfa','other'].forEach(section => {
        for (let di = 0; di < 5; di++) {
            MEALS.forEach(meal => {
                const key = DAYS[di] + '_' + meal.replace(/\s/g,'');
                const el = document.getElementById(`${section}_${di}_${meal.replace(/\s/g,'')}`);
                if (el) data[section][key] = el.value;
            });
        }
        /* The in-memory rotation template is deliberately NOT updated here.
           It used to be, which meant the browser that typed a menu saw its edits
           carried into future weeks while every other machine kept the original
           hardcoded template - the same menu reading differently depending on who
           opened it. Nothing persisted that change, so it could not be shared.
           The saved week is the record; TEMPLATES stays a fixed seed for a week
           that has nothing saved. */
    });
    /* A local copy is kept so a failed save is recoverable rather than lost, but
       it is a safety net, NOT the record. The menu is shared across the centre —
       whoever opens it next must see the same thing — so only the server counts.

       This used to report "✓ Saved locally" with a tick when the server refused
       the write, which reads as success. The menu then lived on one laptop and
       silently diverged from every other machine. A failed save must look failed. */
    localStorage.setItem('menu_' + weekKey, JSON.stringify({ pfa: data.pfa, other: data.other }));

    const btn = document.querySelector('.btn-green');
    const settle = (text, colour) => {
        if (!btn) return;
        btn.textContent = text;
        if (colour) btn.style.background = colour;
        setTimeout(() => { btn.textContent = '💾 Update Menu'; btn.style.background = ''; }, colour ? 6000 : 2000);
    };

    try {
        const res = await apiFetch('/api/menus', { method: 'POST', body: JSON.stringify(data) });
        if (!res.ok) {
            // 401 here almost always means the staff login has lapsed in this tab.
            settle(res.status === 401
                ? '⚠ NOT saved — sign in again'
                : '⚠ NOT saved (server ' + res.status + ')', '#b91c1c');
            return;
        }
        const result = await res.json();
        if (result && result.success) settle('✓ Saved');
        else settle('⚠ NOT saved — server rejected it', '#b91c1c');
    } catch (e) {
        settle('⚠ NOT saved — no connection', '#b91c1c');
    }
}

/* Writes a saved menu onto the grid.

   hasOwnProperty, not truthiness: a meal deliberately cleared is stored as an
   empty string, and skipping empties meant a deletion never reached anyone else —
   the field stayed blank here and was then refilled from the rotation template. */
function applyMenuData(data) {
    ['pfa','other'].forEach(section => {
        const sectionData = (data && data[section]) || {};
        for (let di = 0; di < 5; di++) {
            MEALS.forEach(meal => {
                const key = DAYS[di] + '_' + meal.replace(/\s/g,'');
                const el = document.getElementById(`${section}_${di}_${meal.replace(/\s/g,'')}`);
                if (el && Object.prototype.hasOwnProperty.call(sectionData, key)) {
                    el.value = sectionData[key];
                }
            });
        }
    });
}

function showLoadWarning(html) {
    const el = document.getElementById('menuLoadWarning');
    if (el) {
        el.innerHTML = html
            ? '<div style="background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;'
              + 'border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.8rem;'
              + 'line-height:1.5;">' + html + '</div>'
            : '';
    }
}

/* Loads the week's menu. Returns how it was sourced, because the caller must know:
   the rotation template may only be applied to a week that genuinely has no menu.

   The menu is shared across the centre, so the server is the record. This used to
   fall back to this browser's localStorage whenever the response failed a narrow
   test - and since the server returned 200 {} for "no menu", "SQL error" and
   "value too long to read" alike, that fallback was routine rather than rare.
   The result was each machine showing its own copy and nobody noticing. */
async function loadMenus() {
    const weekKey = getWeekKey();
    showLoadWarning('');
    try {
        const res = await apiFetch('/api/menus?week=' + encodeURIComponent(weekKey));
        if (!res.ok) {
            throw new Error(res.status === 401 ? 'your staff sign-in has lapsed'
                                              : 'the server returned ' + res.status);
        }
        const data = await res.json();
        if (data && data.error) throw new Error(data.error);

        if (data && data.saved) {
            applyMenuData(data);
            return 'server';
        }
        /* No menu saved for this week. Deliberately NOT falling back to the local
           copy: an old draft from one browser reappearing as the centre's menu is
           worse than an empty grid, because it looks authoritative. */
        return 'empty';
    } catch (e) {
        // A real failure to read. The local copy is worth showing now - but labelled.
        let usedLocal = false;
        const local = localStorage.getItem('menu_' + weekKey);
        if (local) {
            try { applyMenuData(JSON.parse(local)); usedLocal = true; } catch (_) {}
        }
        showLoadWarning('<strong>Could not load the shared menu</strong> \u2014 ' + e.message + '. '
            + (usedLocal
                ? 'Showing the last copy saved from <em>this</em> browser, which may not match '
                  + 'what the kitchen sees. Do not print this until it reloads cleanly.'
                : 'Nothing is shown for this week.')
            + ' Reload the page to try again.');
        return 'error';
    }
}

                   bannerBg:'#f0f9ff', bannerColor:'#0369a1' },
    spring:      { name:'Spring', label:'Spring is Here!', icon:'flower', scatter:'butterfly',
                   headerBg:'#4c1d95', headerColor:'#faf5ff', cellBg:'#fdf4ff', borderColor:'#a855f7',
                   accentBg:'linear-gradient(135deg,#7c3aed,#ec4899)', cornerColor:'#a855f7',
                   bannerBg:'#fdf4ff', bannerColor:'#9333ea' }
};

function getSeasonalTheme(weekStart) {
    const m = weekStart.getMonth();
    const d = weekStart.getDate();
    // Is a holiday within this Mon-Fri week, or on the weekend right after it?
    function weekNear(month, day) {
        const target = new Date(weekStart.getFullYear(), month, day);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6); // include Sat+Sun
        return target >= weekStart && target <= weekEnd;
    }

    // Holidays first (a specific holiday wins over its surrounding season)
    if (weekNear(6, 4)) return SEASON_THEMES.july4;
    if (weekNear(9, 31)) return SEASON_THEMES.halloween;
    if (weekNear(11, 25)) return SEASON_THEMES.christmas;
    if (weekNear(1, 14)) return SEASON_THEMES.valentines;
    if (weekNear(2, 17)) return SEASON_THEMES.stpatricks;
    if (m === 10 && d >= 18 && d <= 28) return SEASON_THEMES.thanksgiving; // 4th Thu of Nov
    if (m === 3 && d >= 7 && d <= 21) return SEASON_THEMES.easter;         // approx mid-April
    // Seasons
    if (m >= 5 && m <= 7) return SEASON_THEMES.summer;
    if (m >= 8 && m <= 10) return SEASON_THEMES.fall;
    if (m >= 11 || m <= 1) return SEASON_THEMES.winter;
    return SEASON_THEMES.spring;
}

/* A faint tiled watermark of the theme's scatter motif, drawn as a data-URI
   background so it sits behind the table text without affecting layout. Kept
   very low-opacity so it never fights the menu text or the print legibility. */
function themeCellPattern(theme) {
    const f = ART[theme.scatter] || ART[theme.icon];
    if (!f) return '';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">`
        + `<g transform="translate(30 30)">${f(60, theme.cornerColor, 0.06)}</g></svg>`;
    const uri = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    return `background-image:url("${uri}");background-repeat:repeat;background-size:120px 120px;`;
}

/* Decorative inner frame: a row of small motifs along the top edge of the sheet,
   echoing the theme. Returns absolutely-positioned HTML to drop inside .print-sheet. */
function themeFrameStrip(theme) {
    const row = Array.from({ length: 9 }, (_, i) =>
        `<span style="opacity:0.5;">${ART[theme.icon](26, theme.cornerColor, 1)}</span>`).join('');
    return `<div style="position:absolute;left:0;right:0;bottom:6px;display:flex;`
        + `justify-content:space-around;padding:0 40px;pointer-events:none;">${row}</div>`;
}

function printMenus() {
    const dates = [];
    for (let i = 0; i < 5; i++) { const d = new Date(currentWeekStart); d.setDate(d.getDate() + i); dates.push(d); }
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const ordinal = n => { const s=['th','st','nd','rd']; const v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
    const startStr = monthNames[currentWeekStart.getMonth()] + ' ' + ordinal(currentWeekStart.getDate());
    const endStr = (dates[4].getMonth()===currentWeekStart.getMonth()?'':monthNames[dates[4].getMonth()]+' ') + ordinal(dates[4].getDate());
    const dateRange = startStr + ' - ' + endStr;
    const theme = getSeasonalTheme(currentWeekStart);

    const sections = [
        { title: 'PFA', id: 'pfa' },
        { title: 'PI', id: 'other' }
    ];

    // Corner art, mirrored into each corner. When a theme supplies an iconPalette
    // (e.g. Fall's red/orange/gold leaf mix) each corner gets its own colour from
    // it; otherwise all four use the single cornerColour as before.
    const palette = (theme.iconPalette && theme.iconPalette.length) ? theme.iconPalette : null;
    const cornerColorAt = idx => palette ? palette[idx % palette.length] : theme.cornerColor;
    const cornerAt = (pos, flip, idx) =>
        `<div style="position:absolute;${pos};${flip || ''}pointer-events:none;">`
        + `${ART[theme.icon](104, cornerColorAt(idx), 0.4)}</div>`;
    const cellWatermark = themeCellPattern(theme);
    // The holiday "closed" marker, as SVG (a star) instead of the 🎉 emoji box.
    const closedMark = ART.star(22, theme.cornerColor, 1);

    let html = '';
    sections.forEach(sec => {
        html += `<div class="print-sheet" style="border:4px solid ${theme.borderColor};border-radius:12px;padding:10px 16px;position:relative;overflow:hidden;">`;
        // Corner art in all four corners, each mirrored to face inward.
        html += cornerAt('top:10px;left:10px', '', 0);
        html += cornerAt('top:10px;right:10px', 'transform:scaleX(-1);', 1);
        html += cornerAt('bottom:10px;left:10px', 'transform:scaleY(-1);', 2);
        html += cornerAt('bottom:10px;right:10px', 'transform:scale(-1,-1);', 3);
        // Themed banner with a matching icon on each side.
        html += `<div style="position:relative;z-index:1;background:${theme.accentBg};color:white;text-align:center;padding:8px 16px;border-radius:8px;margin-bottom:6px;font-size:16px;font-weight:700;letter-spacing:1px;font-family:'Fredoka',sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;">`
            + `<span style="display:inline-flex;">${ART[theme.icon](24, '#fff', 1)}</span>`
            + `<span>${theme.label}</span>`
            + `<span style="display:inline-flex;transform:scaleX(-1);">${ART[theme.icon](24, '#fff', 1)}</span>`
            + `</div>`;
        // Header: logo left, centered date flanked by the theme motif.
        html += `<div style="position:relative;z-index:1;display:flex;align-items:center;margin-bottom:8px;">
            <img src="logo-sm.png" alt="Children of Promise" style="width:120px;height:120px;">
            <div style="flex:1;text-align:center;padding-right:120px;">
                <h1 style="color:${theme.headerBg};font-family:'Dancing Script',cursive;font-size:32px;margin:0;display:flex;align-items:center;justify-content:center;gap:18px;">
                    <span style="display:inline-flex;">${ART[theme.icon](60, cornerColorAt(0), 1)}</span>
                    <span>${dateRange}</span>
                    <span style="display:inline-flex;transform:scaleX(-1);">${ART[theme.icon](60, cornerColorAt(1), 1)}</span>
                </h1>
            </div>
        </div>`;
        // Table with themed colors and a faint seasonal watermark behind the cells.
        html += `<table style="position:relative;z-index:1;border:2px solid ${theme.borderColor};">`;
        html += `<thead><tr><th style="width:90px;background:${theme.headerBg};color:${theme.headerColor};"></th>`;
        DAYS.forEach(day => html += `<th style="background:${theme.headerBg};color:${theme.headerColor};">${day}</th>`);
        html += '</tr></thead><tbody>';
        MEALS.forEach((meal, mi) => {
            const rowBg = mi % 2 === 0 ? theme.cellBg : '#ffffff';
            html += `<tr><td class="meal-label" style="background:${theme.cellBg};color:${theme.headerBg};border-color:${theme.borderColor};">${meal}</td>`;
            for (let di = 0; di < 5; di++) {
                const el = document.getElementById(sec.id + '_' + di + '_' + meal.replace(/\s/g,''));
                const val = el ? el.value.replace(/\n+$/,'').trim() : '';
                if (val === 'CLOSED - Holiday') {
                    html += `<td class="holiday-cell" style="background:${theme.cellBg};border-color:${theme.borderColor};">`
                        + `<div style="display:flex;align-items:center;justify-content:center;gap:6px;">${closedMark}<span>Closed</span>${closedMark}</div></td>`;
                } else {
                    html += `<td style="background:${rowBg};${cellWatermark}border-color:${theme.borderColor};">${val.replace(/\n/g,'<br>')}</td>`;
                }
            }
            html += '</tr>';
        });
        html += '</tbody></table>';
        // PFA/PI label bottom right (inside the page)
        html += `<div style="position:relative;z-index:1;text-align:right;font-size:11px;font-weight:600;color:#6b7280;margin-top:4px;padding-right:8px;">${sec.title}</div>`;
        html += '</div>';
    });

    const printArea = document.getElementById('printArea');
    printArea.innerHTML = html;
    let styleTag = document.getElementById('printPageStyle');
    if (!styleTag) { styleTag = document.createElement('style'); styleTag.id = 'printPageStyle'; document.head.appendChild(styleTag); }
    styleTag.textContent = '@page { size: landscape; margin: 0.2in; }';
    setTimeout(() => window.print(), 200);
}

render();
// Same rule as week navigation: template only when there is nothing saved.
showWeek();

function applyTemplate(idx, overwrite) {
    ['pfa','other'].forEach(section => {
        const template = TEMPLATES[section][idx];
        DAYS.forEach((day, di) => {
            const dayData = template[day] || {};
            MEALS.forEach(meal => {
                const key = meal.replace(/\s/g,'');
                const el = document.getElementById(`${section}_${di}_${key}`);
                if (el && (overwrite || !el.value)) el.value = dayData[key] || '';
            });
        });
    });
}
</script>
<div id="printArea"></div>
</body>
