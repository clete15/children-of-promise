<!DOCTYPE html>
<html lang="en">
<!-- form-audit: read-only. This page shows what is held about you and links to the forms
     that hold it; the only control on it chooses whose page to look at. Nothing is
     entered here, so the persistence audit should not treat it as a form. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page — Children of Promise</title>
<link rel="stylesheet" href="styles.css">
<style>
    /* ── Colours as variables, so dark mode is a change of values rather than a
       second copy of every rule.

       This page previously hardcoded its colours, including inside the markup the
       script builds. Half of a dark page still glowing white is worse than no dark
       mode at all, so the generated markup now uses classes and everything that
       carries a colour resolves through here. The accent hues stay recognisable
       between the two themes — green still means held, amber still means missing —
       because the meaning is carried by the colour and should not shift with the
       background. */
    :root {
        --sp-bg: #f1f5f9;
        --sp-surface: #ffffff;
        --sp-surface-2: #f8fafc;
        --sp-border: #e2e8f0;
        --sp-border-in: #cbd5e1;
        --sp-text: #1e293b;
        --sp-text-2: #475569;
        --sp-muted: #64748b;
        --sp-quiet: #94a3b8;
        --sp-accent: #2563eb;
        --sp-accent-soft: #f8fbff;

        --sp-good-bg: #f0fdf4;  --sp-good-br: #86efac;  --sp-good-fg: #166534;
        /* "Attention", not alarm. Deliberately blue-slate rather than amber: the
           director does not like the brown/amber look, and on this palette a soft
           indigo reads as "worth noting" without turning the page yellow. */
        --sp-warn-bg: #eef2ff;  --sp-warn-br: #a5b4fc;  --sp-warn-fg: #3730a3;
        --sp-bad-bg:  #fef2f2;  --sp-bad-br:  #fca5a5;  --sp-bad-fg:  #991b1b;
        --sp-pill-bg: #f8fafc;
    }
    body.sp-dark {
        --sp-bg: #0f172a;
        --sp-surface: #1a2235;
        --sp-surface-2: #212b41;
        --sp-border: #2f3b52;
        --sp-border-in: #45526b;
        --sp-text: #e8edf6;
        --sp-text-2: #bcc7da;
        --sp-muted: #9aa7bd;
        --sp-quiet: #7d8a9f;
        --sp-accent: #7ea6ff;
        --sp-accent-soft: #1e2a44;

        --sp-good-bg: #14301f;  --sp-good-br: #2f6b45;  --sp-good-fg: #86efac;
        /* Dark-mode attention: indigo, matching the light theme's shift off amber. */
        --sp-warn-bg: #1e2450;  --sp-warn-br: #4f5bb0;  --sp-warn-fg: #c7d2fe;
        --sp-bad-bg:  #3a1a1c;  --sp-bad-br:  #8a3a3f;  --sp-bad-fg:  #fca5a5;
        --sp-pill-bg: #212b41;
    }

    body {
        background: var(--sp-bg); color: var(--sp-text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .sp-wrap { max-width: 1000px; margin: 0 auto; padding: 18px 16px 60px; }
    .sp-bar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        background: var(--sp-surface); border: 1.5px solid var(--sp-border); border-radius: 10px;
        padding: 12px 16px; margin-bottom: 16px;
    }
    .sp-bar select {
        padding: 6px 10px; border: 1px solid var(--sp-border-in); border-radius: 6px;
        font-size: 0.85rem; background: var(--sp-surface); color: var(--sp-text);
    }
    .sp-bar strong { color: var(--sp-text); }
    .sp-bar a { color: var(--sp-accent); }
    .sp-card {
        background: var(--sp-surface); border: 1.5px solid var(--sp-border); border-radius: 10px;
        padding: 16px 18px; margin-bottom: 16px;
    }
    .sp-card h2 {
        font-size: 1.08rem; font-weight: 800; color: var(--sp-text); margin: 0 0 4px;
    }
    .sp-card .sp-sub {
        font-size: 0.86rem; color: var(--sp-muted); line-height: 1.6; margin-bottom: 12px;
    }
    .sp-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .sp-tile {
        flex: 1 1 170px; min-width: 150px; border: 1.5px solid var(--sp-border);
        border-radius: 9px; padding: 9px 12px; background: var(--sp-surface-2);
    }
    .sp-tile .lbl {
        font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--sp-muted); margin-bottom: 3px;
    }
    .sp-tile .val { font-size: 1.05rem; font-weight: 800; color: var(--sp-text); line-height: 1.2; }
    .sp-tile .note { font-size: 0.76rem; color: var(--sp-muted); margin-top: 5px; line-height: 1.5; }
    .sp-tile.good { background: var(--sp-good-bg); border-color: var(--sp-good-br); }
    .sp-tile.warn { background: var(--sp-warn-bg); border-color: var(--sp-warn-br); }
    .sp-tile.bad  { background: var(--sp-bad-bg);  border-color: var(--sp-bad-br); }
    /* The editable fields on the "keep my record right" card. Kept wider than the
       compact summary tiles so the inputs have room. */
    .sp-tile.sp-field { background: var(--sp-surface); flex-basis: 210px; min-width: 190px; padding: 12px 14px; }
    .sp-tile.sp-field input, .sp-tile.sp-field select {
        width: 100%; box-sizing: border-box; padding: 6px 8px;
        border: 1px solid var(--sp-border-in); border-radius: 5px;
        font-size: 0.88rem; font-family: inherit;
        background: var(--sp-surface); color: var(--sp-text);
    }
    .sp-pill {
        display: inline-block; font-size: 0.74rem; font-weight: 700;
        padding: 2px 9px; border-radius: 11px; white-space: nowrap;
        background: var(--sp-pill-bg); color: var(--sp-muted);
    }
    .sp-pill.done { background: var(--sp-good-bg); color: var(--sp-good-fg); }
    .sp-pill.waiting { background: var(--sp-warn-bg); color: var(--sp-warn-fg); }
    .sp-step {
        border: 1px solid var(--sp-border); border-left: 4px solid var(--sp-accent);
        border-radius: 8px; padding: 11px 14px; margin-bottom: 9px;
        background: var(--sp-surface);
    }
    .sp-step .t { font-size: 0.92rem; font-weight: 700; color: var(--sp-text); }
    .sp-step .d { font-size: 0.85rem; color: var(--sp-text-2); line-height: 1.6; margin-top: 4px; }
    .sp-step.done { border-left-color: #16a34a; background: var(--sp-good-bg); }
    /* Severity variants, replacing the inline border colours the script used to set. */
    .sp-step.alert { border-left-color: #dc2626; margin-top: 12px; }
    .sp-step.caution { border-left-color: var(--sp-warn-br); background: var(--sp-warn-bg); margin-top: 12px; }
    .sp-step.info { border-left-color: var(--sp-accent); background: var(--sp-accent-soft); }
    /* ── Tabs ────────────────────────────────────────────────────────────────
       This page was one column of eight stacked cards. The two credential routes
       alone run to a dozen paragraphs, so "correct my transcript hours" — the thing
       we actually need people to do — sat below all of it, and most staff would
       never scroll that far. Tabs put every job one click from the top.

       Built as a real tablist rather than styled links: role attributes, arrow-key
       movement, and a visible focus ring. This is the one page every member of staff
       uses, several of them on a phone, and a tab strip that only works with a mouse
       would exclude anyone using a keyboard or a screen reader.

       The strip scrolls sideways rather than wrapping, so the tab row stays one line
       and the panel below never shifts down as the window narrows. */
    .sp-tabs {
        display: flex; gap: 2px; margin-bottom: 16px;
        border-bottom: 1.5px solid var(--sp-border);
        overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
    }
    .sp-tabs::-webkit-scrollbar { display: none; }
    .sp-tab {
        appearance: none; -webkit-appearance: none; background: transparent; border: 0;
        font-family: inherit; font-size: 0.92rem; font-weight: 700; cursor: pointer;
        color: var(--sp-muted); padding: 10px 15px 11px; margin-bottom: -1.5px;
        border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0;
        display: flex; align-items: center; gap: 7px; white-space: nowrap;
        transition: color 0.12s, background 0.12s;
    }
    .sp-tab:hover { color: var(--sp-text); background: var(--sp-surface-2); }
    .sp-tab[aria-selected="true"] {
        color: var(--sp-accent); border-bottom-color: var(--sp-accent);
    }
    /* Keyboard focus only, so a mouse click does not leave a ring behind. */
    .sp-tab:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: 2px; }
    /* A count appears only where the person can do something about it, so a badge
       always means "this needs you" rather than decorating every tab. */
    .sp-tab .sp-count {
        font-size: 0.64rem; font-weight: 800; padding: 1px 6px; border-radius: 9px;
        background: var(--sp-warn-bg); color: var(--sp-warn-fg);
    }
    .sp-panel[hidden] { display: none; }
    /* The name sits above the tabs, so it stays visible whichever tab is open. */
    .sp-who { margin-bottom: 14px; }
    .sp-who h2 { font-size: 1.25rem; }
    .sp-who .sp-sub { margin-bottom: 0; font-size: 0.9rem; }
    /* The summary tiles now live inside the name card; a little space sets them off
       from the name/role line above without a second border. */
    .sp-standing { margin-top: 14px; }
    /* Name on the left, the actions (classroom link + Edit) on the right. */
    .sp-who-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .sp-who-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; flex: 0 0 auto; }
    .sp-edit-btn {
        flex: 0 0 auto; appearance: none; -webkit-appearance: none; cursor: pointer;
        font-family: inherit; font-size: 0.86rem; font-weight: 700;
        color: var(--sp-accent); background: var(--sp-accent-soft);
        border: 1.5px solid var(--sp-border); border-radius: 8px; padding: 7px 13px;
        display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
        transition: border-color 0.12s, background 0.12s;
    }
    .sp-edit-btn:hover { border-color: var(--sp-accent); }
    .sp-edit-btn[aria-expanded="true"] { border-color: var(--sp-accent); }
    .sp-edit-btn:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: 2px; }
    .sp-edit-btn .sp-count {
        font-size: 0.64rem; font-weight: 800; padding: 1px 6px; border-radius: 9px;
        background: var(--sp-warn-bg); color: var(--sp-warn-fg);
    }
    /* The self-edit form, revealed under the name card. A rule above the panel sets it
       off from the identity line without adding a whole second card border. */
    .sp-edit-panel { margin-top: 14px; border-top: 1px solid var(--sp-border); padding-top: 14px; }
    /* The form already renders its own .sp-card; drop that nested border so it reads as
       part of the name card rather than a box inside a box. */
    .sp-edit-panel > .sp-card { border: 0; padding: 0; margin: 0; background: transparent; }

    /* Forms grouped by the authority that asks for them (ISBE / Gateways / PAS).
       Each group gets its own accent colour so the three stand apart at a glance:
       the heading takes the colour, and every card in the group carries a matching
       left border. The colours are the group's own hue, not the theme accent, so
       the meaning ("this is an ISBE form") is carried by colour consistently.
         --grp: the accent for the group, set per-group below. */
    .sp-formgroup { margin-top: 18px; --grp: var(--sp-accent); }
    .sp-formgroup:first-of-type { margin-top: 4px; }
    .sp-formgroup-head {
        font-size: 0.82rem; font-weight: 800; color: var(--grp);
        text-transform: uppercase; letter-spacing: 0.03em;
        display: inline-block; padding-bottom: 3px; border-bottom: 2px solid var(--grp);
    }
    .sp-formgroup-note { font-size: 0.8rem; color: var(--sp-muted); margin: 4px 0 9px; line-height: 1.5; }
    /* Cards in a group take that group's accent on their left edge. */
    .sp-formgroup .sp-link { border-left: 4px solid var(--grp); }
    .sp-formgroup .sp-link:hover { border-color: var(--grp); }
    /* The three group hues. Chosen to read distinctly in both themes. */
    .sp-formgroup-isbe     { --grp: #2563eb; }   /* ISBE — blue (the grant/regulatory one) */
    .sp-formgroup-gateways { --grp: #7c3aed; }   /* Gateways — violet (your credential) */
    .sp-formgroup-pas      { --grp: #0d9488; }   /* ExceleRate/PAS — teal (quality rating) */
    body.sp-dark .sp-formgroup-isbe     { --grp: #7ea6ff; }
    body.sp-dark .sp-formgroup-gateways { --grp: #b794f6; }
    body.sp-dark .sp-formgroup-pas      { --grp: #4fd1c5; }
    .sp-links { display: flex; flex-wrap: wrap; gap: 9px; }
    .sp-link {
        display: block; flex: 1 1 220px; min-width: 200px; text-decoration: none;
        border: 1.5px solid var(--sp-border); border-radius: 9px; padding: 11px 13px;
        background: var(--sp-surface);
    }
    .sp-link:hover { border-color: var(--sp-accent); background: var(--sp-accent-soft); }
    .sp-link.waiting { border-color: var(--sp-warn-br); background: var(--sp-warn-bg); }
    .sp-link .n { font-size: 0.92rem; font-weight: 700; color: var(--sp-text); }
    .sp-link .s { font-size: 0.8rem; color: var(--sp-muted); margin-top: 3px; }
    .sp-src { font-size: 0.78rem; color: var(--sp-muted); margin-top: 10px; line-height: 1.6; }
    .sp-src a { color: var(--sp-accent); }

    /* "How to pull your PDR" collapsible. Native <details>, so no JS to wire. */
    .sp-pdr > summary {
        cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--sp-accent);
        list-style: none; display: flex; align-items: center; gap: 8px;
    }
    .sp-pdr > summary::-webkit-details-marker { display: none; }
    .sp-pdr > summary::before { content: '\25B8'; font-size: 0.8rem; transition: transform 0.15s; }
    .sp-pdr[open] > summary::before { transform: rotate(90deg); }
    .sp-pdr-body { font-size: 0.86rem; color: var(--sp-text-2); line-height: 1.6; margin-top: 10px; }
    .sp-pdr-body ol { margin: 8px 0 0 20px; padding: 0; }
    .sp-pdr-body li { margin-bottom: 5px; }
    .sp-pdr-btn {
        display: inline-block; margin-top: 12px; padding: 8px 15px; border-radius: 7px;
        background: var(--sp-accent); color: #fff; font-size: 0.85rem; font-weight: 700;
        text-decoration: none;
    }
    .sp-pdr-btn:hover { filter: brightness(1.08); }

    /* ── Admin: Staff Attainments refresh ── */
    .sp-attn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
    .sp-attn-row input[type="file"] { font-size: 0.85rem; color: var(--sp-text-2); max-width: 100%; }
    .sp-attn-head { margin: 14px 0 6px; }
    .sp-attn-card {
        border: 1.5px solid var(--sp-border); border-left: 4px solid var(--sp-accent);
        border-radius: 9px; padding: 12px 14px; margin-bottom: 10px; background: var(--sp-surface-2);
    }
    .sp-attn-name { font-size: 0.95rem; font-weight: 800; color: var(--sp-text); margin-bottom: 8px; }
    .sp-attn-diff { margin: 6px 0; }
    .sp-attn-diff-lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--sp-muted); }
    .sp-attn-before { font-size: 0.84rem; color: var(--sp-bad-fg); text-decoration: line-through; opacity: 0.8; margin-top: 2px; }
    .sp-attn-after { font-size: 0.84rem; color: var(--sp-good-fg); font-weight: 600; margin-top: 2px; }
    .sp-attn-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }

    /* ── Credential routes, two columns ──────────────────────────────────────
       ECE on the left, Infant Toddler on the right, because the director asked to
       see them side by side and because they are genuinely parallel: same person,
       two ladders. Collapses to one column on a narrow screen so it stays readable
       on a phone, where several staff open this. */
    .sp-cred-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 760px) { .sp-cred-cols { grid-template-columns: 1fr; } }
    .sp-cred-col { min-width: 0; }
    .sp-cred-col > .sp-card { margin-bottom: 0; }
    /* A quiet heading strip above each column so it is obvious which ladder is which. */
    .sp-cred-head {
        display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
    }
    .sp-cred-head .n { font-size: 1rem; font-weight: 800; color: var(--sp-text); }
    .sp-cred-head .lvl {
        font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
        padding: 2px 8px; border-radius: 999px; background: var(--sp-accent-soft); color: var(--sp-accent);
    }

    /* ── Requirement lines ─────────────────────────────────────────────────────
       The three things the next level needs — College, Training, Classroom — as a
       labelled row each. Deliberately plain: a key on the left, the requirement on
       the right, nothing to interact with. */
    .req-list { margin-top: 2px; }
    .req {
        display: flex; gap: 10px; padding: 6px 0;
        border-top: 1px solid var(--sp-border); font-size: 0.87rem; line-height: 1.55;
    }
    .req:first-child { border-top: 0; }
    .req .k {
        flex: 0 0 86px; font-weight: 800; color: var(--sp-muted);
        font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 1px;
    }
    .req .v { flex: 1 1 auto; color: var(--sp-text); }
    /* "optional" tag on the Training row, so it reads as a fallback not a requirement. */
    .req .k .opt {
        display: block; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.03em;
        color: var(--sp-muted); text-transform: none; margin-top: 1px;
    }

    /* Handing in a document. */
    .sp-handin { border-left-color: var(--sp-accent); margin-top: 12px; }
    .sp-handin-row { margin-top: 8px; }
    .sp-handin-row label { font-size: 0.76rem; font-weight: 600; color: var(--sp-text-2); }
    .sp-handin-row input[type="file"] {
        font-size: 0.78rem; margin-top: 4px; color: var(--sp-text-2); max-width: 100%;
    }
    .sp-handin-row button {
        padding: 4px 10px; font-size: 0.72rem; font-weight: 700; border: none;
        border-radius: 5px; background: var(--sp-accent); color: #fff; cursor: pointer;
    }
    .sp-handin-row button:disabled { opacity: 0.6; cursor: default; }
    .sp-quiet { color: var(--sp-quiet); font-weight: 500; }
    .sp-need { color: var(--sp-warn-fg); font-weight: 600; }
    .sp-upmsg { font-size: 0.75rem; }
    .sp-upmsg.good { color: var(--sp-good-fg); }
    .sp-upmsg.warn { color: var(--sp-warn-fg); }
    .sp-upmsg.bad  { color: var(--sp-bad-fg); }

    /* Saving the record. */
    .sp-save {
        padding: 9px 16px; border: none; border-radius: 7px;
        background: var(--sp-accent); color: #fff; font-size: 0.85rem;
        font-weight: 700; cursor: pointer;
    }
    .sp-save:disabled { opacity: 0.6; cursor: default; }
    .sp-cancel {
        padding: 9px 16px; border: 1.5px solid var(--sp-border); border-radius: 7px;
        background: transparent; color: var(--sp-text-2); font-size: 0.85rem;
        font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .sp-cancel:hover { border-color: var(--sp-accent); color: var(--sp-accent); }
    .sp-savemsg { font-size: 0.78rem; }
    .sp-savemsg.good { color: var(--sp-good-fg); }
    .sp-savemsg.bad  { color: var(--sp-bad-fg); }
    .sp-saverow { margin-top: 12px; display: flex; align-items: center; gap: 12px; }
    .sp-err { color: var(--sp-bad-fg); }
    .sp-warntext { color: var(--sp-warn-fg); }

    /* Theme toggle. Looks like the other bar links rather than a control, because it
       is a preference and not part of the task. */
    .sp-theme {
        background: none; border: none; padding: 0; cursor: pointer;
        font: inherit; font-size: 0.76rem; font-weight: 600; color: var(--sp-muted);
    }
    .sp-theme:hover { color: var(--sp-accent); }

    /* ── My Classroom (teacher checklist) ──
       Ported from the ISBE classroom view, but recoloured onto this page's theme
       variables so it works in dark mode and — deliberately — carries no amber:
       the "outstanding"/"on paper?" markers use the indigo attention palette
       (--sp-warn-*) rather than the brown/amber the director asked us to drop. */
    .cls-roompick { display:flex;align-items:center;gap:9px;padding:12px 16px;background:var(--sp-surface-2);border:1px solid var(--sp-border);border-radius:10px;margin-bottom:16px;flex-wrap:wrap; }
    .cls-roompick label { font-size:0.72rem;font-weight:700;color:var(--sp-muted);text-transform:uppercase;letter-spacing:0.04em; }
    .cls-roompick select { padding:6px 10px;border:1px solid var(--sp-border-in);border-radius:6px;font-size:0.85rem;font-weight:600;font-family:inherit;background:var(--sp-surface);color:var(--sp-text); }
    .cls-roompick select:focus { outline:none;border-color:var(--sp-accent);box-shadow:0 0 0 2px rgba(37,99,235,0.1); }
    .cls-roompick #clsTeacher { font-size:0.76rem;color:var(--sp-muted); }
    .cls-batch { border:1px solid var(--sp-border);border-radius:10px;overflow:hidden;margin-bottom:18px; }
    .cls-batch-head { padding:10px 15px;background:var(--sp-surface-2);border-bottom:1px solid var(--sp-border);font-size:0.78rem;font-weight:800;color:var(--sp-text); }
    .cls-batch-row { display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--sp-border);font-size:0.78rem; }
    .cls-batch-row:last-child { border-bottom:none; }
    .cls-batch-label { font-weight:700;color:var(--sp-text-2);flex:1; }
    .cls-batch-count { font-size:0.72rem;color:var(--sp-warn-fg);background:var(--sp-warn-bg);padding:3px 9px;border-radius:11px;font-weight:700;white-space:nowrap; }
    .cls-batch-row a { color:var(--sp-accent);text-decoration:none;font-weight:700;font-size:0.72rem;white-space:nowrap; }
    .cls-batch-row a:hover { text-decoration:underline; }
    .cls-alldone, .cls-empty { padding:16px;border-radius:10px;font-size:0.8rem;margin-bottom:18px; }
    .cls-alldone { background:var(--sp-good-bg);color:var(--sp-good-fg);border:1px solid var(--sp-good-br); }
    .cls-empty { background:var(--sp-surface-2);color:var(--sp-muted);border:1px solid var(--sp-border); }
    .cls-cards { display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px; }
    .cls-card { border:1px solid var(--sp-border);border-radius:10px;padding:13px 15px;background:var(--sp-surface); }
    .cls-card-head { display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px; }
    .cls-name { font-size:0.88rem;font-weight:700;color:var(--sp-text); }
    .cls-meta { font-size:0.69rem;color:var(--sp-quiet);margin-top:2px; }
    .cls-out { font-size:0.66rem;font-weight:700;color:var(--sp-warn-fg);background:var(--sp-warn-bg);padding:3px 9px;border-radius:11px;white-space:nowrap;flex-shrink:0; }
    .cls-ok { font-size:0.66rem;font-weight:700;color:var(--sp-good-fg);background:var(--sp-good-bg);padding:3px 9px;border-radius:11px;white-space:nowrap;flex-shrink:0; }
    .cls-chips { display:flex;flex-wrap:wrap;gap:5px; }
    .cls-chip { display:inline-flex;align-items:center;gap:5px;font-size:0.69rem;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--sp-border);background:var(--sp-surface);color:var(--sp-text-2);text-decoration:none;white-space:nowrap; }
    a.cls-chip:hover { border-color:var(--sp-accent);color:var(--sp-accent);background:var(--sp-accent-soft); }
    .cls-chip-done { background:var(--sp-good-bg);border-color:var(--sp-good-br);color:var(--sp-good-fg); }
    a.cls-chip-done:hover { background:var(--sp-good-bg);border-color:var(--sp-good-br);color:var(--sp-good-fg); }
    .cls-dl { font-size:0.62rem;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:2px; }
    .cls-paper { font-size:0.6rem;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:2px;background:var(--sp-warn-bg);color:var(--sp-warn-fg);cursor:help; }
    .cls-dl-overdue { background:var(--sp-bad-bg);color:var(--sp-bad-fg); }
    .cls-dl-due { background:var(--sp-warn-bg);color:var(--sp-warn-fg); }
</style>
</head>
<body>

<div class="sp-wrap">
    <div class="sp-bar">
        <strong style="font-size:0.9rem;">My Page</strong>
        <!-- The chooser is the director's control. A staff member sees their own name
             instead, because there is nothing for them to choose: the server sends
             them one record, their own. -->
        <select id="spStaff"><option value="">Loading…</option></select>
        <strong id="spWhoName" style="display:none;font-size:0.9rem;"></strong>
        <span id="spMsg" class="sp-quiet" style="font-size:0.76rem;"></span>
        <!-- Outside the staff-only block, so the director gets the theme choice too. -->
        <button type="button" id="spTheme" class="sp-theme" style="margin-left:auto;"
                aria-pressed="false" title="Switch between light and dark"></button>
        <span id="spStaffActions" style="display:none;font-size:0.76rem;">
            <a href="#" id="spChangePw" style="font-weight:600;">Change my password</a>
            &nbsp;·&nbsp;
            <a href="#" id="spSignOut" class="sp-quiet" style="font-weight:600;">Sign out</a>
        </span>
        <span id="spBarNote" class="sp-quiet" style="flex-basis:100%;font-size:0.72rem;">
            Everything here comes from your staff record. If something is wrong, it is wrong
            in the record — tell Megan rather than working around it.
        </span>
    </div>

    <div id="spBody">
        <div class="sp-card"><div class="sp-sub">Loading your record…</div></div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<!-- The PAS worksheet store, so this page can tell which of your forms are done. -->
<script src="/pas/pas-store.js"></script>

<!-- The Gateways ECE and Infant Toddler level tables, for the next-steps cards. -->
<script src="credential-framework.js"></script>

<!-- Child-record form machinery, shared with isbe.html so the My Classroom tab and
     the ISBE roster's [form] links open the very same forms. child-forms.js tells a
     tick from a filed form; sign-pad.js is the signature canvas; pi-forms.js holds
     the PICC document specs; classroom-forms.js is the three modals themselves. -->
<script src="child-forms.js"></script>
<script src="sign-pad.js"></script>
<script src="pi-forms.js"></script>
<script src="classroom-forms.js"></script>
<script>
/* ── One page per staff member ──────────────────────────────────────────────
   Answers the questions a member of staff actually has about their own standing:
   where my credentials are, whether my professional development hours are on track,
   what my learning plan says, and which of my forms are outstanding.

   Everything is read from the staff record, so this page never becomes a second
   place the truth is kept. Where a figure is missing it says so rather than showing
   a zero, because "we have not recorded it" and "you have none" are different.

   On credentials it deliberately stops short of reciting benchmark tables. Staff act
   on this for their careers, so it states only what can be sourced to Gateways and
   links out for the detail rather than inventing requirements. */

let STAFF = [];
let TRAINING = [];
let ROOMS = [];
let current = null;
/* Who the SERVER says is looking. Never inferred from the page, because what this
   page shows and what a person is allowed to change both hang off it. */
let WHO = null;
// Files for whoever is currently displayed, or null while they are being fetched.
let FILES = null;

/* ── My Classroom data ──────────────────────────────────────────────────────
   The classroom checklist needs the children, their tracking flags, their
   screenings and the signature index — none of which the rest of My Page uses.
   So it is loaded lazily the first time the classroom tab is shown, not on every
   visit to the page, and CofpForms reads it through the accessors registered in
   initClassroomForms(). clsState tracks the fetch so the panel can show loading,
   ready or error without guessing. */
let CLS_STUDENTS = [];
let CLS_TRACKING = {};      // by StudentId
let CLS_SCREENING = {};     // by StudentId -> "TYPE|Period"
let CLS_SIGNATURES = {};    // by "studentId|Field|role"
let CLS_YEAR = '';          // active school year, from the tracking endpoint's default
let clsState = 'idle';      // idle | loading | ready | error
let clsError = '';
let activeClsRoom = null;    // room number currently shown in the picker

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Every request on this page goes through the PERSONAL credentials, not the shared
   ones. This page is about one individual, so a session token has to outrank the
   centre password when a browser holds both — otherwise a staff member signing in
   on the office computer gets the director's view of it, which is exactly what
   happened: Paige saw the whole staff list and Clete's record.

   The rest of the site keeps using apiFetch, where the shared password rightly
   wins. Routing those through here instead would mean a forgotten staff token
   quietly narrowing the roster on the director's own admin pages. */
const myFetch = (url, opts) => (window.CofpAuth && CofpAuth.personalFetch)
    ? CofpAuth.personalFetch(url, opts)
    : apiFetch(url, opts);

/* Credential level out of the free-text credential fields. Same regex the PAS pages
   use, so this page and the ExceleRate maths cannot disagree. */
function credLevel(s, kind) {
    const src = [s.EceCredentials, s.Gateways].filter(Boolean).join(', ');
    const re = kind === 'ece' ? /ECE(?:\s*Credential)?\s*-?\s*Level\s*(\d)/i
        : kind === 'it' ? /(?:IT|ITC|Infant\s*\/?\s*Toddler)(?:\s*Credential)?\s*-?\s*Level\s*(\d)/i
        : /Director(?:\s*Credential)?\s*-?\s*Level\s*(III|II|I|\d)/i;
    const m = src.match(re);
    if (!m) return 0;
    if (kind === 'dir') return /^\d$/.test(m[1]) ? +m[1] : ({ I: 1, II: 2, III: 3 }[m[1].toUpperCase()] || 0);
    return +m[1];
}

// What the record says is still in progress, quoted back rather than paraphrased.
function pendingText(s) {
    const src = [s.EceCredentials, s.Gateways, s.Notes].filter(Boolean).join(' ');
    const m = src.match(/\b(?:pending|awaiting)\b[^.;]*/i);
    return m ? m[0].trim() : '';
}

const PD_REQUIRED = 20;

/* PD hours only count for the calendar year they were recorded against. A total with
   no year, or last year's year, is unknown rather than zero - reporting it as zero
   would accuse someone of having done nothing. */
function pdHours(s) {
    const v = String(s.PdHoursYtd || '').trim();
    if (v === '') return null;
    if (String(s.PdHoursYear || '').trim() !== String(new Date().getFullYear())) return null;
    const n = parseFloat(v);
    return isFinite(n) ? n : null;
}

function tile(cls, label, value, note) {
    return '<div class="sp-tile ' + cls + '">'
        + '<div class="lbl">' + esc(label) + '</div>'
        + '<div class="val">' + value + '</div>'
        + (note ? '<div class="note">' + note + '</div>' : '')
        + '</div>';
}

// ── credential next steps ─────────────────────────────────────────────────
/* The level tables now live in credential-framework.js, transcribed from the two
   Gateways framework documents in Internal/documents. They used to be omitted here on
   the grounds that a wrong benchmark sends someone down the wrong path, which was the
   right worry with no authoritative copy to hand; we have both documents now, so the
   benchmarks are stated exactly rather than gestured at.

   If the module fails to load the page still renders, with a line saying so, because a
   blank next-steps card reads as "nothing to do". */
function eceSteps(s) {
    const F = window.CredentialFramework;
    if (!F) return [{ done: false, t: 'Credential requirements unavailable',
        d: 'The credential framework did not load, so next steps cannot be worked out. '
         + 'Nothing is wrong with your record.' }];
    return F.eceSteps(s, credLevel(s, 'ece'));
}

function itSteps(s) {
    const F = window.CredentialFramework;
    if (!F) return [{ done: false, t: 'Credential requirements unavailable',
        d: 'The credential framework did not load, so next steps cannot be worked out. '
         + 'Nothing is wrong with your record.' }];
    return F.itcSteps(s, credLevel(s, 'it'), credLevel(s, 'ece'));
}

// ── forms ─────────────────────────────────────────────────────────────────
function schoolYear() {
    const now = new Date();
    const start = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
    return start + '-' + (start + 1);
}

/* Each form is tagged with the authority that actually asks for it, so the Forms
   tab can group them under ISBE / Gateways / ExceleRate-PAS. Where a form serves
   more than one (the appraisal feeds PICC PI9 AND is a PAS item), it is filed under
   the stronger requirement — the grant one — and the note still names both.
     group: 'isbe' | 'gateways' | 'pas'  */
const MY_FORMS = [
    { key: 'pas_annual_appraisal', group: 'isbe', scope: 'staff-year', href: '/pas/annual-performance-appraisal.html',
      name: 'Annual Performance Appraisal', note: 'Completed with your supervisor at the end of the year. Its goals feed the PICC PI9 plan, and it is also the PAS staff appraisal.' },
    { key: 'pas_work_history', group: 'gateways', scope: 'staff', href: '/pas/staff-work-history.html',
      name: 'My Work History', note: 'Everywhere you have worked with children. Gateways form PD75a, used to verify experience toward a credential level.' },
    { key: 'pas_self_appraisal', group: 'pas', scope: 'staff-year', href: '/pas/staff-self-appraisal.html',
      name: 'My Self-Appraisal', note: 'Your own reflection. Complete this before your review meeting.' },
    { key: 'pas_classroom_observation', group: 'pas', scope: 'staff-year', href: '/pas/classroom-observation-form.html',
      name: 'Classroom Observation', note: 'Completed by whoever observes your room.' },
    { key: 'pas_90_day_review', group: 'pas', scope: 'staff', href: '/pas/90-day-review-form.html',
      name: '90-Day Introductory Review', note: 'One-off, in your first three months.' },
    { key: 'pas_new_hire_checklist', group: 'pas', scope: 'staff', href: '/pas/new-hire-checklist.html',
      name: 'Onboarding Checklist', note: 'One-off. Everything that had to be covered when you started.' },
    { key: 'pas_orientation_feedback', group: 'pas', scope: 'staff', href: '/pas/orientation-feedback-form.html',
      name: 'Orientation Feedback', note: 'One-off. What you made of your own orientation.' }
];

/* The two forms that are not driven off MY_FORMS (they render specially — the goal
   plan has its own URL/copy, the survey is anonymous) still need a home in the
   grouping, so they carry the same group tag here. */
const FORM_GROUPS = [
    { key: 'isbe',     label: 'ISBE \u2014 Preschool for All / Prevention Initiative',
      note: 'Required for the PFA/PI grant (the PICC checklist).' },
    { key: 'gateways', label: 'Gateways to Opportunity',
      note: 'For your own credential \u2014 Gateways uses these to verify and advance your level.' },
    { key: 'pas',      label: 'ExceleRate / PAS',
      note: 'Quality-rating evidence. Not licensing; these build your PAS score and support good practice.' }
];

function formState(f, staffId) {
    const key = f.scope === 'staff'
        ? f.key + '__staff' + staffId
        : f.key + '__staff' + staffId + '_' + schoolYear();
    return !!PasStore.storage.getItem(key);
}

// ── my files ──────────────────────────────────────────────────────────────
/* The personnel documents held for this person: transcript, Gateways report,
   application, work history, goal plan, W4, background check authorisation.

   Only files a human has confirmed as theirs appear. The filenames in the library
   cannot be trusted to say whose they are — one transcript is filed under a former
   surname, another has both names misspelt — and a guess that is wrong here means
   handing someone a colleague's W4. So the server proposes and the director
   confirms, and until then a file belongs to nobody.

   For the director this card is also where that confirming happens. */
/* Takes the staff record, and has to.

   It read a free `s` further down, which resolved to nothing: it is a top-level function,
   so it never saw render()'s local `s`. That went unnoticed because the only line using it
   sits behind `WHO && !WHO.director`, which short-circuits for anyone holding the shared
   password — so the director view worked perfectly and a member of staff signed in as
   themselves got "Could not load your record: s is not defined" instead of their page.
   Found 10 Sep 2026, the day people first signed in personally. */
function filesCard(s) {
    // The id is the target of the "My Files" entry on the portal landing page.
    let html = '<div class="sp-card" id="files"><h2>My files</h2>';

    if (!FILES) {
        return html + '<div class="sp-sub">Looking for your documents…</div></div>';
    }
    if (FILES.error) {
        return html + '<div class="sp-sub sp-err">Could not read the document '
            + 'library: ' + esc(FILES.error) + '</div></div>';
    }
    /* "The library is not reachable" is not "you have no transcript". Someone told
       the second thing would go and order a replacement from their college. */
    if (FILES.libraryReachable === false) {
        return html + '<div class="sp-sub sp-warntext">The document library is not '
            + 'reachable from the server right now, so this cannot say what is on file. '
            + esc(FILES.reason || '') + '</div></div>';
    }

    /* Only this person's own confirmed documents. Nothing undecided, nothing set
       aside, nothing belonging to anybody else — a page headed with someone's name
       should hold their paperwork and no one else's. The filing work moved to its
       own screen, staff-files.html, which is about the library rather than a person. */
    const mine = FILES.mine || [];
    html += '<div class="sp-sub">Your own paperwork, as held by the centre. '
        + 'These open in your browser.</div>';

    if (mine.length) {
        /* Opened through fetchStaffFile() rather than a plain href. A raw <a> is a
           browser navigation that carries no headers, so the personal staff token
           never travelled with it and the server answered "Sign in first" — which is
           the error a signed-in teacher was getting on their own files. Fetching via
           myFetch attaches the token, and the file is then shown from a blob URL, so
           the token never rides in the address bar either. */
        html += '<div class="sp-links">' + mine.map(f => {
            const waiting = f.status === 'Pending';
            return '<a class="sp-link' + (waiting ? ' waiting' : '') + '"'
                + ' href="#" data-file="' + esc(f.rel) + '">'
                + '<div class="n">' + esc(f.category)
                /* Says plainly that it has arrived but not been checked. Without this
                   a handed-in document looks identical to a verified one, and the
                   person would reasonably assume the matter was closed. */
                + (waiting ? ' <span class="sp-pill waiting">waiting to be checked</span>' : '')
                + '</div>'
                + '<div class="s">' + esc(f.name) + '</div></a>';
        }).join('') + '</div>';
    } else {
        html += '<div class="sp-sub sp-warntext">Nothing is filed against you yet. '
            + 'If you have handed documents in, they may be in the library but not yet '
            + 'matched to your name — ask Megan to check.</div>';
    }

    /* ── handing in what is missing ──
       Only offered to the person themselves, and only for documents they obtain from
       somewhere else: a transcript or a Gateways report. W4s and background check
       authorisations are not here on purpose — those are collected at onboarding and
       an upload box for them invites a social security number somewhere unexpected. */
    const uploadable = FILES.uploadable || [];
    const isMe = WHO && !WHO.director && String(WHO.staffId) === String(s.Id);
    if (isMe && uploadable.length) {
        const label = k => k === 'transcript' ? 'college transcript' : 'Gateways education report';
        const absent = uploadable.filter(u => !u.hasOne);

        html += '<div class="sp-step sp-handin">'
            + '<div class="t">' + (absent.length ? 'Hand in what is missing' : 'Send a newer copy') + '</div>'
            + '<div class="d">'
            + (absent.length
                ? 'We do not have your ' + absent.map(m => label(m.key)).join(' or your ') + '. '
                : 'Finished a course since you last sent these? Send the newer one. ')
            + 'A PDF or a clear photo is fine. It goes to Megan to check rather than '
            + 'straight onto your record, and a new copy never replaces the old one.</div>';

        uploadable.forEach(m => {
            html += '<div class="sp-handin-row">'
                + '<label for="up_' + esc(m.key) + '">' + esc(label(m.key))
                /* Says which of the two this is, so "send it" is never ambiguous about
                   whether it is filling a gap or adding a version. */
                + (m.hasOne
                    ? ' <span class="sp-quiet">— one already on file, this adds a newer one</span>'
                    : ' <span class="sp-need">— nothing on file</span>')
                + '</label><br>'
                + '<input type="file" id="up_' + esc(m.key) + '" class="sp-upfile" '
                + 'accept=".pdf,.jpg,.jpeg,.png"> '
                + '<button type="button" class="sp-upbtn" data-key="' + esc(m.key) + '">'
                + (m.hasOne ? 'Send newer' : 'Send it') + '</button>'
                + ' <span class="sp-upmsg" id="upmsg_' + esc(m.key) + '"></span>'
                + '</div>';
        });
        html += '</div>';
    }

    /* The director's filing workbench used to sit here. It moved to
       staff-files.html, because this page is one person's record and the undecided
       pile, the set-aside pile and everybody else's documents are no part of it.
       The server enforces it rather than the page: asked about a specific person it
       sends only that person's confirmed files, so there is nothing here to hide. */

    return html + '</div>';
}

// ── what this person can correct themselves ───────────────────────────────
/* The fields a person knows better than the office does: their transcript hours,
   registry number, credential levels and education. Seven of ten teaching records
   have no semester hours at all, and chasing fourteen people for them beats one
   person transcribing them.

   Role, room, FTE and programme are absent deliberately. Those are assignments,
   not facts about the person, and they feed the ratio and credential calculations
   the ExceleRate and PAS figures are built on. The server enforces the same list,
   so this form is a convenience and not the control. */
const EDU_OPTIONS = ['', 'High School/GED', 'Some College', "Associate's", "Bachelor's", "Master's", 'Doctorate'];
const TRANSCRIPT_OPTIONS = ['', 'On file with Gateways', 'Not submitted'];

function selfEditCard(s) {
    const mayEdit = WHO && (WHO.director || String(WHO.staffId) === String(s.Id));
    if (!mayEdit) return '';

    const field = (id, label, value, hint) =>
        '<div class="sp-tile sp-field">'
        + '<div class="lbl"><label for="' + id + '">' + esc(label) + '</label></div>'
        + '<input id="' + id + '" value="' + esc(value || '') + '">'
        + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>';

    const picker = (id, label, value, options, hint) =>
        '<div class="sp-tile sp-field">'
        + '<div class="lbl"><label for="' + id + '">' + esc(label) + '</label></div>'
        + '<select id="' + id + '">'
        + options.map(o => '<option value="' + esc(o) + '"'
            + (String(value || '') === o ? ' selected' : '') + '>'
            + (o === '' ? '— not recorded —' : esc(o)) + '</option>').join('')
        + '</select>'
        + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>';

    /* Says plainly what is missing and why it matters to the person, rather than
       leaving them to notice an empty box. Semester hours are the gap that actually
       exists — most records have none — and they are the thing that moves a
       credential level, so it is worth asking for directly. */
    const needsHours = !String(s.SemesterHoursTotal || '').trim();
    const needsRegistry = !String(s.RegistryId || '').trim();
    let ask = '';
    if (needsHours || needsRegistry) {
        const bits = [];
        if (needsRegistry) {
            bits.push('your <strong>Gateways Registry number</strong> — without it no '
                + 'credential can be awarded at all');
        }
        if (needsHours) {
            bits.push('your <strong>college credit</strong> from your transcript — these are '
                + 'the hours that move you up the credential levels');
        }
        ask = '<div class="sp-step info">'
            + '<div class="t">We need this from you</div>'
            + '<div class="d">Nothing on your record shows ' + bits.join(', and ') + '. '
            + 'Filling it in here is quicker than anyone chasing it, and it is your '
            + 'credential it affects.</div></div>';
    }

    return '<div class="sp-card">'
        + '<h2>Keep my record right</h2>'
        + '<div class="sp-sub">These are the things you know better than the office does. '
        + 'Saving marks the record as needing Megan\u2019s check again, because these figures '
        + 'back the centre\u2019s compliance reporting.</div>'
        + ask
        + '<div class="sp-grid">'
        + picker('edEducation', 'Highest completed education', s.Education, EDU_OPTIONS,
            'The highest level you actually finished. Coursework without a degree is "Some College".')
        + field('edRegistryId', 'Gateways Registry number', s.RegistryId,
            'The N-number on your Gateways record.')
        /* One credentials field, not two. "Gateways credential" used to sit beside this
           showing the same ECE level again (e.g. "ECE Credential - Level 4" next to
           "ECE Level 4, ..."), which read as the level listed twice. The Gateways
           column is derived from this one on save, so it does not need its own box. */
        + field('edEce', 'Credentials held', s.EceCredentials,
            'For example "ECE Level 2, CDA". Leave off anything still pending.')
        + field('edExperience', 'Years of experience', s.ExperienceYears, 'Decimals are fine, e.g. 9.5.')
        + field('edShTotal', 'Total semester hours', s.SemesterHoursTotal,
            'Add up the credit hours column on your transcript. If it shows quarter '
            + 'hours rather than semester hours, say so in the box below and leave this blank.')
        /* Pointed at the Gateways record rather than left to the person's own
           reading of their course list. Whether a given course counts toward the
           ECE Credential is Gateways' determination, not a judgement to be made
           from a course title, and a wrong figure here moves a credential level and
           feeds the ExceleRate percentages. Blank is a better answer than a guess. */
        + field('edShEce', 'Of those, early childhood hours', s.SemesterHoursEce,
            'Take this from your Gateways Professional Development Record, which states '
            + 'it. Please do not work it out from your course titles — whether a course '
            + 'counts is Gateways\u2019 decision. Leave it blank if you are not sure and '
            + 'Megan will fill it in.')
        + picker('edTranscript', 'Has Gateways got your transcript?', s.TranscriptOnFile,
            TRANSCRIPT_OPTIONS, 'Hours Gateways never received cannot count toward a credential.')
        + field('edPdHours', 'PD clock hours this year', s.PdHoursYtd, 'Against the 20 ExceleRate asks for.')
        + field('edPdYear', 'Which calendar year those hours are for', s.PdHoursYear,
            'So last year\u2019s total is not read as this year\u2019s.')
        + '</div>'
        + '<div class="sp-saverow">'
        + '<button type="button" id="edSave" class="sp-save">Save my changes</button>'
        + '<button type="button" id="edCancel" class="sp-cancel">Cancel</button>'
        + '<span id="edMsg" class="sp-savemsg"></span>'
        + '</div></div>';
}

// ── render ────────────────────────────────────────────────────────────────
/* ── Tabs ──────────────────────────────────────────────────────────────────
   Grouped by the job somebody came here to do rather than by where the data
   happens to live:

     Credentials  the ECE route, the ITC route, and my training completions
     My Classroom my room's checklist, one card per child
     My files     what is on file, and handing in what is not
     Forms        goal plan, self-appraisal, reviews, observations

   Credentials leads because it is what most people open this page to check.
   "Where you stand" (the old Overview) is no longer a tab — it is a summary of
   the person, so it sits under the name card, always visible, rather than being
   somewhere to navigate to. Training sits under Credentials rather than alone,
   because a completion is progression towards a level, not a separate subject.

   The active tab is held here, not in the URL, so a save that redraws the page
   leaves you where you were. A hash still selects a tab on arrival, which keeps
   the "My Files" link on the dashboard landing where it says it will. */
/* "My details" is no longer a tab. It folds into the name card as an Edit button
   that reveals the self-edit form directly beneath it — a person editing their own
   record is not really navigating to a different section, they are correcting the
   card they are already looking at. The self-edit card still exists; it is just
   shown under the header rather than behind a tab. */
const SP_TABS = [
    { key: 'credentials', label: 'Gateways Credentials' },
    { key: 'classroom',   label: 'My Classroom' },
    { key: 'files',       label: 'My files' },
    { key: 'forms',       label: 'Forms' }
];

/* "Where you stand" (the old Overview) is no longer a tab — it sits under the name
   card, always visible. So the default tab is the first remaining one. */
let activeTab = 'credentials';

/* Anything the person can act on, counted for the tab strip. Nothing else gets a badge.

   Wrapped, and every read guarded, because of what happened on 10 Sep 2026: this reached
   into FILES.uploadable while FILES was still null, threw, and took the ENTIRE page down
   with "Could not load your record: Cannot read properties of null". A decorative number
   on a tab must never be able to do that — the page is worth more than the badge, so a
   count that cannot be worked out is simply not shown. */
function tabCount(key, s) {
    try {
        if (key === 'files') {
            /* FILES is null until the fetch returns, and the first render deliberately
               happens before then so the page appears immediately rather than blank.
               filesCard() has always guarded for this; this did not. */
            const up = (FILES && FILES.uploadable) || [];
            return up.filter(u => u && !u.hasOne).length;
        }
        if (key === 'forms') {
            if (!s || !Array.isArray(MY_FORMS)) return 0;
            return MY_FORMS.filter(f => !formState(f, s.Id)).length;
        }
    } catch (e) {
        console.error('[MY PAGE] could not count the ' + key + ' tab', e);
    }
    return 0;
}

/* Clete and Megan get one extra tab the others never see: Admin, holding the
   Staff Attainments refresh and the whole-centre outstanding-Gateways list. Gated
   on WHO.admin, which the server sets only for the two admin logins (and for the
   shared director password). Everyone else's tab strip is unchanged. */
function isAdmin() {
    return !!(WHO && (WHO.admin || WHO.director));
}

function visibleTabs(s) {
    const tabs = SP_TABS.slice();
    if (isAdmin()) tabs.push({ key: 'admin', label: 'Admin' });
    return tabs;
}

function tabBar(s, tabs) {
    return '<div class="sp-tabs" role="tablist" aria-label="My page sections">'
        + tabs.map(t => {
            const on = t.key === activeTab;
            const n = tabCount(t.key, s);
            return '<button type="button" class="sp-tab" role="tab" id="sptab_' + t.key + '" '
                + 'aria-controls="sppanel_' + t.key + '" aria-selected="' + (on ? 'true' : 'false') + '" '
                + 'tabindex="' + (on ? '0' : '-1') + '" data-tab="' + t.key + '">'
                + esc(t.label)
                + (n ? '<span class="sp-count" aria-label="' + n + ' needing attention">' + n + '</span>' : '')
                + '</button>';
        }).join('')
        + '</div>';
}

function tabPanels(s, tabs) {
    const build = {
        classroom: classroomSection,
        credentials: credentialsSection,
        files: filesCard,
        forms: formsSection,
        admin: adminSection
    };
    return tabs.map(t =>
        '<div class="sp-panel" role="tabpanel" id="sppanel_' + t.key + '" '
        + 'aria-labelledby="sptab_' + t.key + '" tabindex="0"'
        + (t.key === activeTab ? '' : ' hidden') + '>'
        + build[t.key](s) + '</div>').join('');
}

/* Clicking, and arrow keys along the strip. Home and End jump to the ends, which is
   what the tablist pattern specifies and what anyone using a keyboard will try. */
function wireTabs(s, tabs) {
    const btns = Array.prototype.slice.call(document.querySelectorAll('.sp-tab'));
    const show = key => {
        activeTab = key;
        btns.forEach(b => {
            const on = b.getAttribute('data-tab') === key;
            b.setAttribute('aria-selected', on ? 'true' : 'false');
            b.setAttribute('tabindex', on ? '0' : '-1');
        });
        tabs.forEach(t => {
            const p = $('sppanel_' + t.key);
            if (p) p.hidden = t.key !== key;
        });
    };
    btns.forEach((b, i) => {
        b.addEventListener('click', () => show(b.getAttribute('data-tab')));
        b.addEventListener('keydown', e => {
            let j = null;
            if (e.key === 'ArrowRight') j = (i + 1) % btns.length;
            else if (e.key === 'ArrowLeft') j = (i - 1 + btns.length) % btns.length;
            else if (e.key === 'Home') j = 0;
            else if (e.key === 'End') j = btns.length - 1;
            if (j === null) return;
            e.preventDefault();
            btns[j].focus();
            show(btns[j].getAttribute('data-tab'));
        });
    });
}

function render() {
    const body = $('spBody');
    if (!current) { body.innerHTML = '<div class="sp-card"><div class="sp-sub">No staff record selected.</div></div>'; return; }
    const s = current;

    const tabs = visibleTabs(s);
    // A tab can vanish between renders — "My details" does, for a viewer who may not
    // edit — so an active tab that no longer exists falls back rather than blanking.
    if (!tabs.some(t => t.key === activeTab)) activeTab = tabs[0].key;

    // "Where you stand" is rendered inside the name card by identityHeader, so the
    // person and their summary sit in one container.
    body.innerHTML = identityHeader(s) + tabBar(s, tabs) + tabPanels(s, tabs);
    wireTabs(s, tabs);
    // Handlers are attached after every render, because the markup above replaces
    // the elements they belong to each time.
    wireCardActions();
    wireDetailsToggle();
    // The classroom panel carries its own controls (room picker, chips, print all).
    if (clsState === 'ready') wireClassroom();
    // The admin tab (Clete/Megan only) carries the attainments uploader.
    if (isAdmin()) wireAdmin();
}

/* Above the tabs, so the name and room stay visible whichever tab is open.

   "My details" now lives here: an Edit button on the name card that reveals the
   self-edit form directly beneath it. The form markup is rendered up front (hidden)
   so the toggle is instant and the save handler wires the same way it always did. */
function identityHeader(s) {
    const rooms = [s.Classroom, s.SecondaryClassroom]
        .map(v => String(v || '').trim()).filter(Boolean).join(' and ');
    const editable = selfEditCard(s);   // '' when this viewer may not edit

    // A small "needs you" count, the same two gaps the old tab badge counted.
    let gaps = 0;
    if (!String(s.RegistryId || '').trim()) gaps++;
    if (!String(s.SemesterHoursTotal || '').trim()) gaps++;

    return '<div class="sp-card sp-who">'
        + '<div class="sp-who-row">'
        + '<div>'
        + '<h2>' + esc(s.Name) + '</h2>'
        + '<div class="sp-sub">' + esc(s.Role || 'Role not recorded')
        + (rooms ? ' \u00b7 ' + esc(rooms) : ' \u00b7 no classroom assigned')
        + (s.RegistryId ? ' \u00b7 Registry ' + esc(s.RegistryId) : '')
        + '</div>'
        + '</div>'
        + '<div class="sp-who-actions">'
        + (editable
            ? '<button type="button" id="edToggle" class="sp-edit-btn" aria-expanded="false" '
              + 'aria-controls="edPanel">\u270e Edit my details'
              + (gaps ? '<span class="sp-count" aria-label="' + gaps
                  + ' needing attention">' + gaps + '</span>' : '')
              + '</button>'
            : '')
        + '</div>'
        + '</div>'
        // The "where you stand" figures live inside this same card, right under the
        // name and role, so the person and their summary read as one thing rather
        // than as two stacked boxes.
        + '<div id="spStanding" class="sp-standing">' + standingTiles(s) + '</div>'
        // Hidden until the button is pressed. Kept inside the name card's flow so it
        // opens directly underneath, which is what was asked for.
        + (editable
            ? '<div id="edPanel" class="sp-edit-panel" hidden>' + editable + '</div>'
            : '')
        + '</div>';
}

/* Show/hide the self-edit form under the name card.

   When it is open the tabs and their panels are hidden, so editing your details is a
   focused view — just your name and the form — rather than the form stacked under
   everything else. The button state survives a re-render (a save redraws the page)
   via the module flag, so a save does not snap the panel shut mid-edit. */
let detailsOpen = false;
function setDetailsOpen(open) {
    detailsOpen = open;
    const btn = document.getElementById('edToggle');
    const panel = document.getElementById('edPanel');
    if (!panel) return;
    panel.hidden = !open;
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    // Hide the tab strip, every tab panel, and the "Where you stand" summary while
    // editing; restore them after, so editing your details is a focused view.
    const tabs = document.querySelector('.sp-tabs');
    if (tabs) tabs.hidden = open;
    const standing = document.getElementById('spStanding');
    if (standing) standing.hidden = open;
    document.querySelectorAll('.sp-panel').forEach(p => {
        // While editing, hide all. When closing, restore only the active tab.
        p.hidden = open ? true : (p.id !== 'sppanel_' + activeTab);
    });
}
function wireDetailsToggle() {
    const btn = document.getElementById('edToggle');
    if (!btn) return;
    setDetailsOpen(detailsOpen);   // reapply after a re-render
    btn.addEventListener('click', () => setDetailsOpen(!detailsOpen));
}

/* Leave the edit view: close the panel and restore the page. "Where you stand"
   lives under the name card now, so finishing an edit simply reveals it again
   along with the tab that was open. Used by both Save and Cancel. */
function closeDetailsToOverview() {
    setDetailsOpen(false);
}

/* ── Overview ── the four figures, and the transcript flag if it applies. The
   pending/credential note and the classroom card moved off here: pending lives on
   the Gateways Credentials tab, the classroom is a link in the name card. */
/* The four "where you stand" figures, WITHOUT a card wrapper, so they can sit
   inside the name card (the summary is part of the person, not a separate box).
   The transcript flag rides along when it applies. */
function standingTiles(s) {
    const hours = pdHours(s);
    const shTotal = parseFloat(s.SemesterHoursTotal);
    const shEce = parseFloat(s.SemesterHoursEce);
    const transcriptMissing = String(s.TranscriptOnFile || '') === 'Not submitted';

    // Compact tiles: just the label and the value, no explanatory note under each —
    // the notes made the cards tall and mostly repeated what the value already says.
    let html = '<div class="sp-grid">'
        + tile(credLevel(s, 'ece') ? 'good' : 'warn', 'ECE Credential',
            credLevel(s, 'ece') ? 'Level ' + credLevel(s, 'ece') : 'Not yet held')
        + tile(credLevel(s, 'it') ? 'good' : '', 'Infant Toddler Credential',
            credLevel(s, 'it') ? 'Level ' + credLevel(s, 'it') : 'Not yet held')
        + tile(hours === null ? 'warn' : (hours >= PD_REQUIRED ? 'good' : 'warn'),
            'PD hours in ' + new Date().getFullYear(),
            hours === null ? 'Not recorded' : hours + ' of ' + PD_REQUIRED)
        + tile(isFinite(shEce) ? '' : 'warn', 'College credit on file',
            isFinite(shTotal) ? shTotal + ' hrs' : 'Not recorded')
        + '</div>';

    if (transcriptMissing) {
        html += '<div class="sp-step alert">'
            + '<div class="t">Your transcript has not reached Gateways</div>'
            + '<div class="d">College credit that Gateways has not received cannot count toward a '
            + 'credential level, however many hours you have earned. Sending the transcript is '
            + 'usually the single biggest step available.</div></div>';
    }

    /* Gateways is waiting on something — pending credential, awaiting work experience,
       awaiting additional coursework, etc. This used to show only on the Credentials
       tab, so it was easy to miss; surfaced here under the name card it is visible on
       every tab, the same way the transcript flag is. pendingText scans the record for
       "pending"/"awaiting", so it covers anyone in that state, not one named person. */
    const waiting = pendingText(s);
    if (waiting) {
        html += '<div class="sp-step caution">'
            + '<div class="t">\u23f3 Gateways is waiting on something</div>'
            + '<div class="d">Your record shows: \u201c' + esc(waiting) + '\u201d. Until that '
            + 'clears, Gateways cannot move the credential forward \u2014 a pending or awaited item '
            + 'does not count until it is awarded. If you think it is already sorted, tell Megan so '
            + 'the record can be updated.</div></div>';
    }
    return html;
}

/* One "next steps" column: a heading strip naming the ladder and the level held,
   then the steps. Shared by both credentials so ECE and ITC render identically. */
function credentialColumn(title, heldLevel, heldWord, steps) {
    return '<div class="sp-cred-col">'
        + '<div class="sp-cred-head">'
        + '<span class="n">' + title + '</span>'
        + '<span class="lvl">' + (heldLevel ? heldWord : 'none held') + '</span>'
        + '</div>'
        + '<div class="sp-card">'
        + steps.map(st => '<div class="sp-step' + (st.done ? ' done' : '') + '">'
            + '<div class="t">' + (st.done ? '\u2713 ' : '') + st.t + '</div>'
            + '<div class="d">' + st.d + '</div></div>').join('')
        + '</div></div>';
}

/* ── Credentials ── the two routes side by side, then what training is recorded.
   The competency checklist was removed on request: this area shows only what the next
   level of each credential needs, in college / training / classroom terms. */
function credentialsSection(s) {
    const heldEce = credLevel(s, 'ece');
    const heldItc = credLevel(s, 'it');

    let html = '';

    /* The "Gateways training report is down" note moved to the shared alerts page
       (alerts.html), and the "Gateways is waiting on something" note moved up to the
       name card (standingTiles) so it shows on every tab rather than only here. Both
       used to render at the top of this section. */

    /* CDA explainer, shown only for someone who holds a CDA. Gateways does not make
       the CDA-vs-ECE-vs-ITC distinction clear, and it is the thing most misread, so
       it is spelled out in plain language above the two ladders. */
    const cdaNote = (window.CredentialFramework && CredentialFramework.cdaLadderNote)
        ? CredentialFramework.cdaLadderNote(s) : '';
    if (cdaNote) {
        html += '<div class="sp-step info" style="margin-bottom:14px;">'
            + '<div class="t">\uD83E\uDE9C How your CDA counts</div>'
            + '<div class="d">' + cdaNote + '</div></div>';
    }

    html += '<div class="sp-cred-cols">'
        + credentialColumn('Preschool (ECE) Credential', heldEce, 'Level ' + heldEce, eceSteps(s))
        + credentialColumn('Infant Toddler Credential', heldItc, 'Level ' + heldItc, itSteps(s))
        + '</div>';

    /* How to pull your PDR. Collapsed by default so it does not crowd the ladders,
       but always available — it is the record that resolves nearly every "waiting on
       something" and missing-competency question, so it belongs right here. */
    html += '<div class="sp-card"><details class="sp-pdr">'
        + '<summary>How to pull your training record (PDR) from Gateways</summary>'
        + '<div class="sp-pdr-body">'
        + '<p>Your Professional Development Record lists every approved course with its '
        + 'Illinois Core Knowledge Areas, dates and credit hours \u2014 it is what we use to '
        + 'confirm your competencies. To pull it:</p>'
        + '<ol>'
        + '<li><b>Log in</b> to the Gateways Registry with your personal account.</li>'
        + '<li>Open your <b>Dashboard</b> (or <b>My Registry</b>) from the top navigation.</li>'
        + '<li>Find the <b>My PDR</b> (Professional Development Record) section or tile.</li>'
        + '<li>Click <b>Print/View PDR</b> to generate your official training record.</li>'
        + '<li><b>Save it as a PDF or print it</b> and hand it in so we can update your '
        + 'record with your specific core competencies.</li>'
        + '</ol>'
        + '<a class="sp-pdr-btn" href="https://registry.ilgateways.com" target="_blank" rel="noopener">'
        + 'Open the Gateways Registry \u2192</a>'
        + '</div></details></div>';

    html += '<div class="sp-card"><div class="sp-src">Level benchmarks are transcribed from the '
        + 'Gateways to Opportunity framework documents in our document library \u2014 '
        + '<a href="documents.html" target="_blank" rel="noopener">ECE Credential Framework</a> and '
        + '<a href="documents.html" target="_blank" rel="noopener">Infant Toddler Credential '
        + 'Framework</a>, both PD229 revised 12/19/2022. Current pages: '
        + '<a href="https://www.ilgateways.com/credentials/ece-credential" target="_blank" rel="noopener">'
        + 'ECE Credential</a> and '
        + '<a href="https://www.ilgateways.com/credentials/infant-toddler-credential" target="_blank" rel="noopener">'
        + 'Infant Toddler Credential</a>.</div></div>';

    return html;
}

/* ── Their classroom ──
   The compliance work for a child is done on the roster, and until now there was
   no route from a staff member to their own room: they had to open the ISBE page
   and pick a room from a list of all of them. The link carries the room, so they
   land on their children rather than on whichever room was looked at last.

   Room names on a staff record are the exact dimClassrooms names (the staff card
   page uses a dropdown for precisely this reason), so an exact match is right here;
   anything unmatched is named without a link rather than guessed at.

   Its own tab now, next to Overview, rather than a card buried under the credential
   figures — for a teacher this is the most-used thing on the page. */
/* The staff member's rooms, resolved to room numbers via the classroom list.
   Room names on a staff record are the exact dimClassrooms names, so an exact
   match is right; an unmatched name is shown but cannot be opened. */
function myClassrooms(s) {
    /* Admins (Clete & Megan) see EVERY room, not just their own assignment, because
       they work across the whole centre. Everyone else sees only the rooms on their
       own record. The per-child view and forms are identical either way — this only
       widens which rooms the picker offers. */
    if (isAdmin() && Array.isArray(ROOMS) && ROOMS.length) {
        return ROOMS
            .slice()
            .sort((a, b) => (parseInt(a.RoomNumber) || 9999) - (parseInt(b.RoomNumber) || 9999))
            .map(r => ({ name: String(r.Room || '').trim() || ('Room ' + r.RoomNumber),
                         roomNumber: String(r.RoomNumber), secondary: false }));
    }
    return [s.Classroom, s.SecondaryClassroom]
        .map(v => String(v || '').trim()).filter(Boolean)
        .map(name => {
            const room = ROOMS.find(r => String(r.Room || '').trim() === name);
            return { name: name, roomNumber: room ? String(room.RoomNumber) : null,
                     secondary: name === String(s.SecondaryClassroom || '').trim() };
        });
}

/* ── My Classroom ──────────────────────────────────────────────────────────
   The full room checklist, native to My Page: a room picker (limited to the
   rooms this person is assigned to), the batch of what is outstanding for the
   room, then one card per child with a chip for each teacher task. The chips
   open the very same Parent Interview / Permission Slip / Screening forms the
   ISBE roster opens, because both pages share classroom-forms.js.

   The data is loaded lazily — this returns a loading state on first paint and
   kicks off loadClassroomData(), which re-renders this panel when it lands. */
function classroomSection(s) {
    const rooms = myClassrooms(s);

    if (!rooms.length) {
        return '<div class="sp-card"><h2>My Classroom</h2>'
            + '<div class="sp-sub">No classroom is recorded against your staff record, so there '
            + 'is no room checklist to show. If you are assigned to a room, it needs adding to '
            + 'your record.</div></div>';
    }

    // Kick off the fetch the first time the tab is rendered.
    if (clsState === 'idle') { setTimeout(loadClassroomData, 0); }

    let inner;
    if (clsState === 'loading' || clsState === 'idle') {
        inner = '<div class="sp-sub">Loading your room\u2019s checklist\u2026</div>';
    } else if (clsState === 'error') {
        inner = '<div class="sp-sub sp-err">Could not load the classroom checklist: '
            + esc(clsError) + '</div>';
    } else {
        inner = classroomChecklistHtml(rooms);
    }

    return '<div class="sp-card"><h2>My Classroom</h2>'
        + '<div class="sp-sub">Your children\u2019s screenings, permission slips and parent '
        + 'interviews. Everything opens and saves here, and a signed paper copy can be checked '
        + 'in against the child.</div>'
        + inner + '</div>';
}

/* The rendered checklist once the data is in. Kept apart from classroomSection so
   renderClassroomPanel can rebuild just this without touching the loading/error
   wrapper logic. */
function classroomChecklistHtml(rooms) {
    // Land on the first assigned room that actually has children, else the first.
    const openable = rooms.filter(r => r.roomNumber);
    if (activeClsRoom === null || !openable.some(r => r.roomNumber === activeClsRoom)) {
        activeClsRoom = openable.length ? openable[0].roomNumber : null;
    }
    if (!activeClsRoom) {
        return '<div class="cls-empty">Your room could not be matched to the classroom list, '
            + 'so its checklist cannot be shown. Worth correcting the room name on your record.</div>';
    }

    // Room picker — only the rooms this person is assigned to.
    const pick = openable.length > 1
        ? '<div class="cls-roompick"><label for="clsRoom">Room</label>'
          + '<select id="clsRoom">'
          + openable.map(r => '<option value="' + esc(r.roomNumber) + '"'
              + (r.roomNumber === activeClsRoom ? ' selected' : '') + '>'
              + esc(r.name) + (r.secondary ? ' (part time)' : '') + '</option>').join('')
          + '</select><span id="clsTeacher"></span></div>'
        : '';

    const roster = classroomRoster(activeClsRoom);
    const cols = CofpForms.COLUMNS;

    if (!roster.length) {
        return pick + '<div class="cls-empty">No active PFA or PI children in this classroom.</div>';
    }

    // Batch actions first: a teacher works a whole task at a time.
    const batch = cols.map(col => {
        const missing = roster.filter(s =>
            !ChildForms.isDone(s.Id, col.field, !!(CLS_TRACKING[s.Id] || {})[col.field]));
        if (!missing.length) return '';
        const label = col.label.replace(/<br>/g, ' ');
        const printBtn = CofpForms.columnHasForm(col.field)
            ? '<a href="#" data-print="' + esc(col.field) + '">print all ' + missing.length + '</a>'
            : '';
        return '<div class="cls-batch-row"><span class="cls-batch-label">' + label + '</span>'
            + '<span class="cls-batch-count">' + missing.length + ' to do</span>' + printBtn + '</div>';
    }).filter(Boolean).join('');

    const batchBlock = batch
        ? '<div class="cls-batch"><div class="cls-batch-head">Outstanding for this classroom</div>' + batch + '</div>'
        : '<div class="cls-alldone">Everything on the classroom checklist is complete for '
            + esc(CLS_YEAR) + '. Nothing outstanding.</div>';

    // One card per child, most urgent first.
    const cards = roster.slice().sort((a, b) => {
        const d = classroomUrgency(a) - classroomUrgency(b);
        return d !== 0 ? d : CofpForms.sortByName(a, b);
    }).map(s => {
        const t = CLS_TRACKING[s.Id] || {};
        const chips = cols.map(col => {
            const st = ChildForms.state(s.Id, col.field, !!t[col.field]);
            const done = st === 'form' || st === 'tick' || st === 'unknown';
            const label = col.label.replace(/<br>/g, ' ');
            let extra = st === 'tick-only'
                ? '<span class="cls-paper" title="Ticked, but nothing is saved here. '
                  + 'If it was done on paper that is fine; otherwise open the form.">on paper?</span>'
                : '';
            let action = '';
            if (col.field === 'BegASQ' || col.field === 'EndASQ' || col.field === 'BegASE' || col.field === 'EndASE') {
                const type = (col.field === 'BegASQ' || col.field === 'EndASQ') ? 'ASQ-3' : 'ASQ:SE-2';
                const period = col.field.indexOf('Beg') === 0 ? 'Beginning' : 'End';
                action = 'screening|' + s.Id + '|' + type + '|' + period;
                if (!done && period === 'Beginning' && CofpForms.isLateEnrollee(s, CLS_YEAR)) {
                    const rec = (CLS_SCREENING[s.Id] || {})[type + '|Beginning'];
                    const dl = CofpForms.screeningDeadline(s, rec && rec.ScreeningDate, CLS_YEAR);
                    if (dl && (dl.state === 'overdue' || dl.state === 'due')) {
                        extra += '<span class="cls-dl cls-dl-' + dl.state + '">' + dl.text + '</span>';
                    }
                }
            } else if (col.field === 'PermissionSlip') {
                action = 'permission|' + s.Id;
            } else if (col.field === 'ParentInterview') {
                action = 'interview|' + s.Id;
            }
            const cls = 'cls-chip' + (done ? ' cls-chip-done' : '');
            const inner = (done ? '\u2713 ' : '') + label + extra;
            return action
                ? '<a href="#" class="' + cls + '" data-act="' + esc(action) + '">' + inner + '</a>'
                : '<span class="' + cls + '">' + inner + '</span>';
        }).join('');

        const outstanding = cols.filter(col =>
            !ChildForms.isDone(s.Id, col.field, !!t[col.field])).length;
        const status = outstanding
            ? '<span class="cls-out">' + outstanding + ' outstanding</span>'
            : '<span class="cls-ok">complete</span>';

        return '<div class="cls-card"><div class="cls-card-head">'
            + '<div><div class="cls-name">' + esc(s.Last_Name + ', ' + s.First_Name) + '</div>'
            + '<div class="cls-meta">' + esc(s.PFA_PI_na || '')
            + (s.Birth_date ? ' \u00b7 born ' + esc(s.Birth_date) : '')
            + (s.Start_Date ? ' \u00b7 enrolled ' + esc(s.Start_Date) : '') + '</div></div>'
            + status + '</div>'
            + '<div class="cls-chips">' + chips + '</div></div>';
    }).join('');

    return pick + batchBlock + '<div class="cls-cards">' + cards + '</div>';
}

/* Wire the classroom panel's controls after each render: the room picker, the chip
   clicks (which open the shared forms), and the Print All links. Delegated through
   data- attributes rather than inline onclick, so the handlers survive the CSP and
   there is no global leakage. */
function wireClassroom() {
    const teacher = document.getElementById('clsTeacher');
    if (teacher && activeClsRoom != null) {
        teacher.textContent = CofpForms.getTeacher(activeClsRoom) || '';
    }
    const sel = document.getElementById('clsRoom');
    if (sel) sel.addEventListener('change', () => {

        renderClassroomPanel();

    document.querySelectorAll('#sppanel_classroom [data-act]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();

            else if (parts[0] === 'permission') CofpForms.openPermissionSlip(parseInt(parts[1], 10));

}
