<!DOCTYPE html>
<html lang="en">
<!-- form-audit: read-only. This page shows what is held about you and links to the forms
     that hold it; the only control on it chooses whose page to look at. Nothing is
     entered here, so the persistence audit should not treat it as a form. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page — Children of Promise</title>
<link rel="stylesheet" href="styles.css">
<style>
    body { background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sp-wrap { max-width: 1000px; margin: 0 auto; padding: 18px 16px 60px; }
    .sp-bar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px;
        padding: 12px 16px; margin-bottom: 16px;
    }
    .sp-bar select { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; }
    .sp-card {
        background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px;
        padding: 16px 18px; margin-bottom: 16px;
    }
    .sp-card h2 {
        font-size: 0.95rem; font-weight: 800; color: #1e293b; margin: 0 0 4px;
    }
    .sp-card .sp-sub {
        font-size: 0.76rem; color: #64748b; line-height: 1.6; margin-bottom: 12px;
    }
    .sp-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .sp-tile {
        flex: 1 1 210px; min-width: 190px; border: 1.5px solid #e2e8f0;
        border-radius: 9px; padding: 12px 14px; background: #f8fafc;
    }
    .sp-tile .lbl {
        font-size: 0.64rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.04em; color: #64748b; margin-bottom: 4px;
    }
    .sp-tile .val { font-size: 1.15rem; font-weight: 800; color: #1e293b; line-height: 1.2; }
    .sp-tile .note { font-size: 0.7rem; color: #64748b; margin-top: 5px; line-height: 1.5; }
    .sp-tile.good { background: #f0fdf4; border-color: #86efac; }
    .sp-tile.warn { background: #fffbeb; border-color: #fcd34d; }
    .sp-tile.bad  { background: #fef2f2; border-color: #fca5a5; }
    .sp-pill {
        display: inline-block; font-size: 0.68rem; font-weight: 700;
        padding: 2px 9px; border-radius: 11px; white-space: nowrap;
    }
    .sp-step {
        border: 1px solid #e2e8f0; border-left: 4px solid #2563eb; border-radius: 8px;
        padding: 11px 14px; margin-bottom: 9px; background: #fff;
    }
    .sp-step .t { font-size: 0.84rem; font-weight: 700; color: #1e293b; }
    .sp-step .d { font-size: 0.76rem; color: #475569; line-height: 1.6; margin-top: 4px; }
    .sp-step.done { border-left-color: #16a34a; background: #f0fdf4; }
    .sp-links { display: flex; flex-wrap: wrap; gap: 9px; }
    .sp-link {
        display: block; flex: 1 1 220px; min-width: 200px; text-decoration: none;
        border: 1.5px solid #e2e8f0; border-radius: 9px; padding: 11px 13px; background: #fff;
    }
    .sp-link:hover { border-color: #2563eb; background: #f8fbff; }
    .sp-link .n { font-size: 0.82rem; font-weight: 700; color: #1e293b; }
    .sp-link .s { font-size: 0.71rem; color: #64748b; margin-top: 3px; }
    .sp-src { font-size: 0.7rem; color: #64748b; margin-top: 10px; line-height: 1.6; }
    .sp-src a { color: #2563eb; }
</style>
</head>
<body>

<div class="sp-wrap">
    <div class="sp-bar">
        <strong style="color:#1e293b;font-size:0.9rem;">My Page</strong>
        <!-- The chooser is the director's control. A staff member sees their own name
             instead, because there is nothing for them to choose: the server sends
             them one record, their own. -->
        <select id="spStaff"><option value="">Loading…</option></select>
        <strong id="spWhoName" style="display:none;color:#1e293b;font-size:0.9rem;"></strong>
        <span id="spMsg" style="font-size:0.76rem;color:#64748b;"></span>
        <span id="spStaffActions" style="display:none;margin-left:auto;font-size:0.76rem;">
            <a href="#" id="spChangePw" style="color:#2563eb;font-weight:600;">Change my password</a>
            &nbsp;·&nbsp;
            <a href="#" id="spSignOut" style="color:#64748b;font-weight:600;">Sign out</a>
        </span>
        <span id="spBarNote" style="flex-basis:100%;font-size:0.72rem;color:#94a3b8;">
            Everything here comes from your staff record. If something is wrong, it is wrong
            in the record — tell Megan rather than working around it.
        </span>
    </div>

    <div id="spBody">
        <div class="sp-card"><div class="sp-sub">Loading your record…</div></div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<!-- The PAS worksheet store, so this page can tell which of your forms are done. -->
<script src="/pas/pas-store.js"></script>
<script>
/* ── One page per staff member ──────────────────────────────────────────────
   Answers the questions a member of staff actually has about their own standing:
   where my credentials are, whether my professional development hours are on track,
   what my learning plan says, and which of my forms are outstanding.

   Everything is read from the staff record, so this page never becomes a second
   place the truth is kept. Where a figure is missing it says so rather than showing
   a zero, because "we have not recorded it" and "you have none" are different.

   On credentials it deliberately stops short of reciting benchmark tables. Staff act
   on this for their careers, so it states only what can be sourced to Gateways and
   links out for the detail rather than inventing requirements. */

let STAFF = [];
let TRAINING = [];
let ROOMS = [];
let current = null;
/* Who the SERVER says is looking. Never inferred from the page, because what this
   page shows and what a person is allowed to change both hang off it. */
let WHO = null;
// Files for whoever is currently displayed, or null while they are being fetched.
let FILES = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Credential level out of the free-text credential fields. Same regex the PAS pages
   use, so this page and the ExceleRate maths cannot disagree. */
function credLevel(s, kind) {
    const src = [s.EceCredentials, s.Gateways].filter(Boolean).join(', ');
    const re = kind === 'ece' ? /ECE(?:\s*Credential)?\s*-?\s*Level\s*(\d)/i
        : kind === 'it' ? /(?:IT|ITC|Infant\s*\/?\s*Toddler)(?:\s*Credential)?\s*-?\s*Level\s*(\d)/i
        : /Director(?:\s*Credential)?\s*-?\s*Level\s*(III|II|I|\d)/i;
    const m = src.match(re);
    if (!m) return 0;
    if (kind === 'dir') return /^\d$/.test(m[1]) ? +m[1] : ({ I: 1, II: 2, III: 3 }[m[1].toUpperCase()] || 0);
    return +m[1];
}

// What the record says is still in progress, quoted back rather than paraphrased.
function pendingText(s) {
    const src = [s.EceCredentials, s.Gateways, s.Notes].filter(Boolean).join(' ');
    const m = src.match(/\b(?:pending|awaiting)\b[^.;]*/i);
    return m ? m[0].trim() : '';
}

const PD_REQUIRED = 20;

/* PD hours only count for the calendar year they were recorded against. A total with
   no year, or last year's year, is unknown rather than zero - reporting it as zero
   would accuse someone of having done nothing. */
function pdHours(s) {
    const v = String(s.PdHoursYtd || '').trim();
    if (v === '') return null;
    if (String(s.PdHoursYear || '').trim() !== String(new Date().getFullYear())) return null;
    const n = parseFloat(v);
    return isFinite(n) ? n : null;
}

function tile(cls, label, value, note) {
    return '<div class="sp-tile ' + cls + '">'
        + '<div class="lbl">' + esc(label) + '</div>'
        + '<div class="val">' + value + '</div>'
        + (note ? '<div class="note">' + note + '</div>' : '')
        + '</div>';
}

// ── credential next steps ─────────────────────────────────────────────────
/* Sourced, not invented:
     - ECE Level 1 is 16 online modules through i-learning or the CCR&R, needs no
       transcript and carries no fee, and is awarded automatically on completion.
     - ECE Levels 2-6 come from compiling education and experience, or from completing
       the coursework at an entitled institution.
     - The Infant Toddler Credential requires ECE entitlement as well.
   Anything more specific than that is left to the Gateways page rather than restated
   here, because a wrong benchmark would send someone down the wrong path. */
function eceSteps(s) {
    const ece = credLevel(s, 'ece');
    const steps = [];
    if (!ece) {
        steps.push({
            done: false, t: 'Start with the ECE Credential Level 1',
            d: 'Sixteen training modules, taken online through Gateways i-learning or locally '
             + 'through the CCR&amp;R. No fee, and no transcript needed. It is awarded automatically '
             + 'once all sixteen are complete and appears on your Professional Development Record. '
             + 'You need to be a Gateways Registry member first.'
        });
    } else {
        steps.push({
            done: true, t: 'ECE Credential Level ' + ece + ' held',
            d: 'Recorded on your staff record from the Gateways report.'
        });
        steps.push({
            done: false, t: 'Next: ECE Credential Level ' + (ece + 1),
            d: 'Levels 2 to 6 are earned either by compiling your education and experience, or by '
             + 'completing the required coursework at an entitled institution. Which route is '
             + 'shorter depends on the college credit you already hold, so this is worth working '
             + 'through with Megan rather than guessing.'
        });
    }
    return steps;
}

function itSteps(s) {
    const it = credLevel(s, 'it');
    const ece = credLevel(s, 'ece');
    const steps = [];
    if (it) {
        steps.push({
            done: true, t: 'Infant Toddler Credential Level ' + it + ' held',
            d: 'This is what the ExceleRate infant and toddler room requirement counts.'
        });
        return steps;
    }
    /* The dependency is the thing worth saying: an ITC cannot be awarded without ECE
       entitlement, so someone chasing both needs to know the order. */
    if (!ece) {
        steps.push({
            done: false, t: 'The ECE Credential comes first',
            d: 'The Infant Toddler Credential requires you to be entitled for the Gateways ECE '
             + 'Credential as well, so there is no route to the ITC that skips it. Start there.'
        });
    } else {
        steps.push({
            done: true, t: 'ECE entitlement in place',
            d: 'The Infant Toddler Credential requires ECE entitlement as well, and you have it.'
        });
    }
    steps.push({
        done: false, t: 'Infant Toddler Credential',
        d: 'For staff with training, education and experience with children from birth to age '
         + 'three. Apply through Gateways once the ECE side is in place.'
    });
    return steps;
}

// ── forms ─────────────────────────────────────────────────────────────────
function schoolYear() {
    const now = new Date();
    const start = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
    return start + '-' + (start + 1);
}

const MY_FORMS = [
    { key: 'pas_self_appraisal', scope: 'staff-year', href: '/pas/staff-self-appraisal.html',
      name: 'My Self-Appraisal', note: 'Your own reflection. Complete this before your review meeting.' },
    { key: 'pas_annual_appraisal', scope: 'staff-year', href: '/pas/annual-performance-appraisal.html',
      name: 'Annual Performance Appraisal', note: 'Completed with your supervisor at the end of the year.' },
    { key: 'pas_90_day_review', scope: 'staff', href: '/pas/90-day-review-form.html',
      name: '90-Day Introductory Review', note: 'One-off, in your first three months.' },
    { key: 'pas_classroom_observation', scope: 'staff-year', href: '/pas/classroom-observation-form.html',
      name: 'Classroom Observation', note: 'Completed by whoever observes your room.' },
    { key: 'pas_new_hire_checklist', scope: 'staff', href: '/pas/new-hire-checklist.html',
      name: 'Onboarding Checklist', note: 'One-off. Everything that had to be covered when you started.' },
    { key: 'pas_orientation_feedback', scope: 'staff', href: '/pas/orientation-feedback-form.html',
      name: 'Orientation Feedback', note: 'One-off. What you made of your own orientation.' }
];

function formState(f, staffId) {
    const key = f.scope === 'staff'
        ? f.key + '__staff' + staffId
        : f.key + '__staff' + staffId + '_' + schoolYear();
    return !!PasStore.storage.getItem(key);
}

// ── my files ──────────────────────────────────────────────────────────────
/* The personnel documents held for this person: transcript, Gateways report,
   application, work history, goal plan, W4, background check authorisation.

   Only files a human has confirmed as theirs appear. The filenames in the library
   cannot be trusted to say whose they are — one transcript is filed under a former
   surname, another has both names misspelt — and a guess that is wrong here means
   handing someone a colleague's W4. So the server proposes and the director
   confirms, and until then a file belongs to nobody.

   For the director this card is also where that confirming happens. */
function filesCard() {
    // The id is the target of the "My Files" entry on the portal landing page.
    let html = '<div class="sp-card" id="files"><h2>My files</h2>';

    if (!FILES) {
        return html + '<div class="sp-sub">Looking for your documents…</div></div>';
    }
    if (FILES.error) {
        return html + '<div class="sp-sub" style="color:#991b1b;">Could not read the document '
            + 'library: ' + esc(FILES.error) + '</div></div>';
    }
    /* "The library is not reachable" is not "you have no transcript". Someone told
       the second thing would go and order a replacement from their college. */
    if (FILES.libraryReachable === false) {
        return html + '<div class="sp-sub" style="color:#92400e;">The document library is not '
            + 'reachable from the server right now, so this cannot say what is on file. '
            + esc(FILES.reason || '') + '</div></div>';
    }

    const mine = FILES.mine || [];
    html += '<div class="sp-sub">Your own paperwork, as held by the centre. '
        + 'These open in your browser.</div>';

    if (mine.length) {
        html += '<div class="sp-links">' + mine.map(f =>
            '<a class="sp-link" href="/api/staff-file-download?path=' + encodeURIComponent(f.rel)
            + '" target="_blank" rel="noopener">'
            + '<div class="n">' + esc(f.category) + '</div>'
            + '<div class="s">' + esc(f.name) + '</div></a>').join('') + '</div>';
    } else {
        html += '<div class="sp-sub" style="color:#92400e;">Nothing is filed against you yet. '
            + 'If you have handed documents in, they may be in the library but not yet '
            + 'matched to your name — ask Megan to check.</div>';
    }

    // ── the director's confirming step ──
    if (WHO && WHO.director) {
        const suggested = FILES.suggestedForTarget || [];
        if (suggested.length) {
            html += '<div style="margin-top:14px;"><h2 style="font-size:0.86rem;">'
                + 'Looks like it belongs to this person</h2>'
                + '<div class="sp-sub">Read the filename before confirming. A firm match means '
                + 'both names line up; a weak one means only the first name did.</div>';
            suggested.forEach(f => {
                html += '<div class="sp-step" style="border-left-color:'
                    + (f.confidence === 'firm' ? '#16a34a' : '#d97706') + ';">'
                    + '<div class="t">' + esc(f.name) + '</div>'
                    + '<div class="d">' + esc(f.category) + ' &nbsp;·&nbsp; '
                    + (f.confidence === 'firm' ? 'firm match' : 'weak match — first name only')
                    + ' &nbsp; <a href="/api/staff-file-download?path=' + encodeURIComponent(f.rel)
                    + '" target="_blank" rel="noopener">open it</a>'
                    + ' &nbsp; <button type="button" class="sp-link-btn" data-rel="' + esc(f.rel)
                    + '" style="padding:3px 10px;font-size:0.72rem;font-weight:700;border:none;'
                    + 'border-radius:5px;background:#2563eb;color:#fff;cursor:pointer;">'
                    + 'This is theirs</button></div></div>';
            });
            html += '</div>';
        }

        const unassigned = FILES.unassigned || [];
        if (unassigned.length) {
            html += '<div style="margin-top:14px;"><h2 style="font-size:0.86rem;">'
                + 'Not filed against anyone (' + unassigned.length + ')</h2>'
                + '<div class="sp-sub">Until one of these is assigned, nobody sees it on their '
                + 'own page.</div>';
            unassigned.forEach(f => {
                const opts = STAFF.map(s => {
                    const g = (f.guesses || []).find(x => String(x.staffId) === String(s.Id));
                    return '<option value="' + s.Id + '">' + esc(s.Name)
                        + (g ? (g.confidence === 'firm' ? '  ✓ likely' : '  ~ maybe') : '')
                        + '</option>';
                }).join('');
                html += '<div class="sp-step">'
                    + '<div class="t">' + esc(f.name) + '</div>'
                    + '<div class="d">' + esc(f.category)
                    + ' &nbsp; <a href="/api/staff-file-download?path=' + encodeURIComponent(f.rel)
                    + '" target="_blank" rel="noopener">open it</a><br>'
                    + '<select class="sp-assign-who" data-rel="' + esc(f.rel)
                    + '" style="margin-top:6px;padding:4px 8px;font-size:0.78rem;">'
                    + '<option value="">— file it against —</option>' + opts + '</select> '
                    + '<button type="button" class="sp-assign-btn" data-rel="' + esc(f.rel)
                    + '" style="padding:4px 10px;font-size:0.72rem;font-weight:700;border:none;'
                    + 'border-radius:5px;background:#334155;color:#fff;cursor:pointer;">File it</button>'
                    + '</div></div>';
            });
            html += '</div>';
        }

        const nobody = FILES.matchesNobody || [];
        if (nobody.length) {
            html += '<div class="sp-sub" style="margin-top:12px;color:#92400e;">'
                + nobody.length + ' document' + (nobody.length > 1 ? 's match' : ' matches')
                + ' nobody on the current roster, which usually means a former member of '
                + 'staff: ' + nobody.map(f => esc(f.name)).join(', ') + '</div>';
        }
    }

    return html + '</div>';
}

// ── what this person can correct themselves ───────────────────────────────
/* The fields a person knows better than the office does: their transcript hours,
   registry number, credential levels and education. Seven of ten teaching records
   have no semester hours at all, and chasing fourteen people for them beats one
   person transcribing them.

   Role, room, FTE and programme are absent deliberately. Those are assignments,
   not facts about the person, and they feed the ratio and credential calculations
   the ExceleRate and PAS figures are built on. The server enforces the same list,
   so this form is a convenience and not the control. */
const EDU_OPTIONS = ['', 'High School/GED', 'Some College', "Associate's", "Bachelor's", "Master's", 'Doctorate'];
const TRANSCRIPT_OPTIONS = ['', 'On file with Gateways', 'Not submitted'];

function selfEditCard(s) {
    const mayEdit = WHO && (WHO.director || String(WHO.staffId) === String(s.Id));
    if (!mayEdit) return '';

    const field = (id, label, value, hint) =>
        '<div class="sp-tile" style="background:#fff;">'
        + '<div class="lbl"><label for="' + id + '">' + esc(label) + '</label></div>'
        + '<input id="' + id + '" value="' + esc(value || '') + '" '
        + 'style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #cbd5e1;'
        + 'border-radius:5px;font-size:0.88rem;font-family:inherit;">'
        + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>';

    const picker = (id, label, value, options, hint) =>
        '<div class="sp-tile" style="background:#fff;">'
        + '<div class="lbl"><label for="' + id + '">' + esc(label) + '</label></div>'
        + '<select id="' + id + '" style="width:100%;box-sizing:border-box;padding:6px 8px;'
        + 'border:1px solid #cbd5e1;border-radius:5px;font-size:0.88rem;font-family:inherit;">'
        + options.map(o => '<option value="' + esc(o) + '"'
            + (String(value || '') === o ? ' selected' : '') + '>'
            + (o === '' ? '— not recorded —' : esc(o)) + '</option>').join('')
        + '</select>'
        + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>';

    return '<div class="sp-card">'
        + '<h2>Keep my record right</h2>'
        + '<div class="sp-sub">These are the things you know better than the office does. '
        + 'Saving marks the record as needing Megan\u2019s check again, because these figures '
        + 'back the centre\u2019s compliance reporting.</div>'
        + '<div class="sp-grid">'
        + picker('edEducation', 'Highest completed education', s.Education, EDU_OPTIONS,
            'The highest level you actually finished. Coursework without a degree is "Some College".')
        + field('edRegistryId', 'Gateways Registry number', s.RegistryId,
            'The N-number on your Gateways record.')
        + field('edEce', 'Credentials held', s.EceCredentials,
            'For example "ECE Level 2, CDA". Leave off anything still pending.')
        + field('edGateways', 'Gateways credential', s.Gateways, 'As it appears on your Gateways record.')
        + field('edExperience', 'Years of experience', s.ExperienceYears, 'Decimals are fine, e.g. 9.5.')
        + field('edShTotal', 'Total semester hours', s.SemesterHoursTotal,
            'All college credit on your transcript.')
        + field('edShEce', 'Of those, early childhood hours', s.SemesterHoursEce,
            'These are the ones that move you up the credential levels.')
        + picker('edTranscript', 'Has Gateways got your transcript?', s.TranscriptOnFile,
            TRANSCRIPT_OPTIONS, 'Hours Gateways never received cannot count toward a credential.')
        + field('edPdHours', 'PD clock hours this year', s.PdHoursYtd, 'Against the 20 ExceleRate asks for.')
        + field('edPdYear', 'Which calendar year those hours are for', s.PdHoursYear,
            'So last year\u2019s total is not read as this year\u2019s.')
        + '</div>'
        + '<div style="margin-top:12px;display:flex;align-items:center;gap:12px;">'
        + '<button type="button" id="edSave" style="padding:9px 16px;border:none;border-radius:7px;'
        + 'background:#2563eb;color:#fff;font-size:0.85rem;font-weight:700;cursor:pointer;">'
        + 'Save my changes</button>'
        + '<span id="edMsg" style="font-size:0.78rem;"></span>'
        + '</div></div>';
}

// ── render ────────────────────────────────────────────────────────────────
function render() {
    const body = $('spBody');
    if (!current) { body.innerHTML = '<div class="sp-card"><div class="sp-sub">No staff record selected.</div></div>'; return; }
    const s = current;

    const rooms = [s.Classroom, s.SecondaryClassroom]
        .map(v => String(v || '').trim()).filter(Boolean).join(' and ');
    const hours = pdHours(s);
    const pending = pendingText(s);
    const shTotal = parseFloat(s.SemesterHoursTotal);
    const shEce = parseFloat(s.SemesterHoursEce);
    const transcriptMissing = String(s.TranscriptOnFile || '') === 'Not submitted';

    let html = '';

    // Who you are, from the record.
    html += '<div class="sp-card">'
        + '<h2>' + esc(s.Name) + '</h2>'
        + '<div class="sp-sub">' + esc(s.Role || 'Role not recorded')
        + (rooms ? ' \u00b7 ' + esc(rooms) : ' \u00b7 no classroom assigned')
        + (s.RegistryId ? ' \u00b7 Registry ' + esc(s.RegistryId) : '')
        + '</div>'
        + '<div class="sp-grid">'
        + tile(credLevel(s, 'ece') ? 'good' : 'warn', 'ECE Credential',
            credLevel(s, 'ece') ? 'Level ' + credLevel(s, 'ece') : 'Not yet held')
        + tile(credLevel(s, 'it') ? 'good' : '', 'Infant Toddler Credential',
            credLevel(s, 'it') ? 'Level ' + credLevel(s, 'it') : 'Not yet held')
        + tile(hours === null ? 'warn' : (hours >= PD_REQUIRED ? 'good' : 'warn'),
            'PD hours in ' + new Date().getFullYear(),
            hours === null ? 'Not recorded' : hours + ' of ' + PD_REQUIRED,
            hours === null
                ? 'Nothing recorded for this calendar year yet. That is not the same as none \u2014 '
                  + 'if you have done training, it needs adding to your record.'
                : (hours >= PD_REQUIRED
                    ? 'You have met the 20 clock hours ExceleRate asks for this year.'
                    : (PD_REQUIRED - hours) + ' more clock hours needed this calendar year.'))
        + tile(isFinite(shEce) ? '' : 'warn', 'College credit on file',
            isFinite(shTotal) ? shTotal + ' hrs' : 'Not recorded',
            isFinite(shEce) ? shEce + ' of them in early childhood'
                : 'Semester hours are what move you up the credential levels, so it is worth '
                  + 'getting your transcript on file.')
        + '</div>';

    if (transcriptMissing) {
        html += '<div class="sp-step" style="border-left-color:#dc2626;margin-top:12px;">'
            + '<div class="t">Your transcript has not reached Gateways</div>'
            + '<div class="d">College credit that Gateways has not received cannot count toward a '
            + 'credential level, however many hours you have earned. Sending the transcript is '
            + 'usually the single biggest step available.</div></div>';
    }
    if (pending) {
        html += '<div class="sp-step" style="border-left-color:#d97706;margin-top:12px;">'
            + '<div class="t">Something is in progress on your record</div>'
            + '<div class="d">Recorded as: \u201c' + esc(pending) + '\u201d. A credential that is '
            + 'pending does not count until it is awarded.</div></div>';
    }
    html += '</div>';

    // Credential routes.
    html += '<div class="sp-card">'
        + '<h2>Next steps \u2014 Preschool (ECE) Credential</h2>'
        + '<div class="sp-sub">The ECE Credential is what the ExceleRate preschool staff '
        + 'requirement counts.</div>'
        + eceSteps(s).map(st => '<div class="sp-step' + (st.done ? ' done' : '') + '">'
            + '<div class="t">' + (st.done ? '\u2713 ' : '') + st.t + '</div>'
            + '<div class="d">' + st.d + '</div></div>').join('')
        + '</div>';

    html += '<div class="sp-card">'
        + '<h2>Next steps \u2014 Infant Toddler Credential</h2>'
        + '<div class="sp-sub">Counted for staff working with children from birth to age three.</div>'
        + itSteps(s).map(st => '<div class="sp-step' + (st.done ? ' done' : '') + '">'
            + '<div class="t">' + (st.done ? '\u2713 ' : '') + st.t + '</div>'
            + '<div class="d">' + st.d + '</div></div>').join('')
        + '<div class="sp-src">Requirements above are from Gateways to Opportunity: '
        + '<a href="https://www.ilgateways.com/credentials/ece-credential" target="_blank" rel="noopener">'
        + 'ECE Credential</a> and '
        + '<a href="https://www.ilgateways.com/professional-development/higher-education-programs/483-becoming-entitled-itc" target="_blank" rel="noopener">'
        + 'becoming entitled for the ITC</a>. The level-by-level benchmarks are on those pages '
        + 'rather than repeated here, so what you read is always current. Content summarised for '
        + 'brevity \u2014 check the source before acting on it.</div>'
        + '</div>';

    // Training recorded against this person.
    const mine = TRAINING.filter(t => String(t.StaffId) === String(s.Id) && (t.CompletedDate || '').trim());
    html += '<div class="sp-card">'
        + '<h2>Training on your record</h2>'
        + '<div class="sp-sub">Completions recorded for ExceleRate and PICC PI9.</div>'
        + (mine.length
            ? '<div class="sp-grid">' + mine.map(t =>
                tile('good', t.TrainingKey === 'howERSWorks' ? 'How ERS Works'
                    : t.TrainingKey === 'ecers3' ? 'ECERS-3'
                    : t.TrainingKey === 'iters3' ? 'ITERS-3' : t.TrainingKey,
                    esc(t.CompletedDate))).join('') + '</div>'
            : '<div class="sp-sub" style="color:#92400e;">Nothing recorded yet. '
              + '\u201cHow ERS Works\u201d is the one ExceleRate requires of half the teaching staff.</div>')
        + '</div>';

    /* ── Their classroom ──
       The compliance work for a child is done on the roster, and until now there was
       no route from a staff member to their own room: they had to open the ISBE page
       and pick a room from a list of all of them. The link carries the room, so they
       land on their children rather than on whichever room was looked at last.

       Room names on a staff record are the exact dimClassrooms names (the staff card
       page uses a dropdown for precisely this reason), so an exact match is right
       here; anything unmatched is named without a link rather than guessed at. */
    const myRooms = [s.Classroom, s.SecondaryClassroom]
        .map(v => String(v || '').trim()).filter(Boolean)
        .map(name => {
            const room = ROOMS.find(r => String(r.Room || '').trim() === name);
            return { name: name, roomNumber: room ? String(room.RoomNumber) : null,
                     secondary: name === String(s.SecondaryClassroom || '').trim() };
        });

    html += '<div class="sp-card">'
        + '<h2>My classroom</h2>'
        + (myRooms.length
            ? '<div class="sp-sub">Your children\u2019s screenings, permission slips and parent '
              + 'interviews. Everything opens and saves here, and a signed paper copy can be '
              + 'checked in against the child.</div>'
              + '<div class="sp-links">'
              + myRooms.map(r => (r.roomNumber
                    ? '<a class="sp-link" href="isbe.html?view=classroom&room='
                      + encodeURIComponent(r.roomNumber) + '" target="_blank" rel="noopener">'
                    : '<div class="sp-link">')
                  + '<div class="n">' + esc(r.name)
                  + (r.secondary ? ' <span class="sp-pill" style="background:#f8fafc;color:#64748b;">'
                      + 'part time</span>' : '') + '</div>'
                  + '<div class="s">' + (r.roomNumber
                      ? 'Opens your room\u2019s checklist, one card per child.'
                      : 'This room name is not in the classroom list, so it cannot be opened '
                        + 'directly \u2014 worth correcting on the staff record.') + '</div>'
                  + (r.roomNumber ? '</a>' : '</div>')).join('')
              + '</div>'
            : '<div class="sp-sub">No classroom is recorded against your staff record, so there '
              + 'is no room checklist to open. If you are assigned to a room, it needs adding '
              + 'to your record.</div>')
        + '</div>';

    // Their own paperwork, then the parts of the record they can correct.
    html += filesCard();
    html += selfEditCard(s);

    // Their plan and their forms.
    html += '<div class="sp-card">'
        + '<h2>My learning plan and forms</h2>'
        + '<div class="sp-sub">These open with you already selected. Everything saves on screen \u2014 '
        + 'nothing here needs printing unless you want a signed paper copy.</div>'
        + '<div class="sp-links">'
        + '<a class="sp-link" href="/pas/individual-pd-plan.html?staffId=' + encodeURIComponent(s.Id) + '" target="_blank" rel="noopener">'
        + '<div class="n">My Professional Development Plan</div>'
        + '<div class="s">Your goals for the year, with mid-year and year-end reviews.</div></a>'
        + MY_FORMS.map(f => {
            const done = formState(f, s.Id);
            return '<a class="sp-link" href="' + f.href + '?staffId=' + encodeURIComponent(s.Id)
                + '" target="_blank" rel="noopener">'
                + '<div class="n">' + esc(f.name) + ' '
                + '<span class="sp-pill" style="background:' + (done ? '#f0fdf4' : '#f8fafc')
                + ';color:' + (done ? '#166534' : '#64748b') + ';">'
                + (done ? '\u2713 done' : 'not started') + '</span></div>'
                + '<div class="s">' + esc(f.note) + '</div></a>';
        }).join('')
        /* The staff survey is anonymous, so it cannot show done or not done against a
           name - saying so is better than leaving people wondering why it has no tick. */
        + '<a class="sp-link" href="/pas/staff-program-evaluation.html" target="_blank" rel="noopener">'
        + '<div class="n">Staff Program Evaluation <span class="sp-pill" '
        + 'style="background:#f8fafc;color:#64748b;">anonymous</span></div>'
        + '<div class="s">Your view of how the programme is run. Responses are saved under a '
        + 'number, not your name, so this cannot show whether you have done it.</div></a>'
        + '</div></div>';

    body.innerHTML = html;
    // Handlers are attached after every render, because the markup above replaces
    // the elements they belong to each time.
    wireCardActions();
}

/* Buttons inside the rendered cards: saving the editable fields, and the director's
   file assignment. Attached fresh each render rather than delegated, so a stale
   handler cannot act on a card that has been redrawn for a different person. */
function wireCardActions() {
    const save = $('edSave');
    if (save) save.addEventListener('click', saveMyRecord);

    document.querySelectorAll('.sp-link-btn').forEach(btn => {
        btn.addEventListener('click', () => assignFile(btn.getAttribute('data-rel'), current.Id, btn));
    });
    document.querySelectorAll('.sp-assign-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const rel = btn.getAttribute('data-rel');
            const sel = document.querySelector('.sp-assign-who[data-rel="' + rel.replace(/"/g, '\\"') + '"]');
            const who = sel ? sel.value : '';
            if (!who) { btn.textContent = 'Pick a name first'; setTimeout(() => btn.textContent = 'File it', 1800); return; }
            assignFile(rel, who, btn);
        });
    });
}

async function assignFile(rel, staffId, btn) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Filing…';
    try {
        const res = await apiFetch('/api/staff-file-link', {
            method: 'POST',
            body: JSON.stringify({ rel: rel, staffId: staffId })
        });
        const body = await res.json();
        if (!res.ok || !body.success) throw new Error(body.error || 'HTTP ' + res.status);
        // Re-read rather than patching the page, so what is shown is what was stored.
        await loadFiles(current.Id);
    } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Failed — ' + (e.message || 'try again');
        setTimeout(() => { btn.textContent = original; }, 2600);
    }
}

async function saveMyRecord() {
    const btn = $('edSave');
    const msg = $('edMsg');
    if (!current) return;

    const payload = {
        education: $('edEducation').value,
        registryId: $('edRegistryId').value.trim(),
        eceCredentials: $('edEce').value.trim(),
        gateways: $('edGateways').value.trim(),
        experienceYears: $('edExperience').value.trim(),
        semesterHoursTotal: $('edShTotal').value.trim(),
        semesterHoursEce: $('edShEce').value.trim(),
        transcriptOnFile: $('edTranscript').value,
        pdHoursYtd: $('edPdHours').value.trim(),
        pdHoursYear: $('edPdYear').value.trim()
    };

    /* Caught here because it is the mistake that makes the number meaningless: ECE
       hours are a subset of the total, so more of them than there are hours at all
       is a typo rather than a fact. */
    const total = parseFloat(payload.semesterHoursTotal);
    const ece = parseFloat(payload.semesterHoursEce);
    if (isFinite(total) && isFinite(ece) && ece > total) {
        msg.style.color = '#991b1b';
        msg.textContent = 'Early childhood hours cannot be more than your total hours.';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    msg.textContent = '';
    try {
        const res = await apiFetch('/api/staff/' + encodeURIComponent(current.Id), {
            method: 'PUT',
            body: JSON.stringify(payload)
        });
        const body = await res.json();
        if (!res.ok || !body.success) throw new Error(body.error || 'HTTP ' + res.status);

        // Keep the copy this page is drawing from in step with what was saved.
        Object.keys(payload).forEach(k => {
            const col = { education: 'Education', registryId: 'RegistryId',
                eceCredentials: 'EceCredentials', gateways: 'Gateways',
                experienceYears: 'ExperienceYears', semesterHoursTotal: 'SemesterHoursTotal',
                semesterHoursEce: 'SemesterHoursEce', transcriptOnFile: 'TranscriptOnFile',
                pdHoursYtd: 'PdHoursYtd', pdHoursYear: 'PdHoursYear' }[k];
            if (col) current[col] = payload[k];
        });
        msg.style.color = '#166534';
        msg.textContent = body.reviewCleared
            ? 'Saved. Megan will see it as needing a check.'
            : 'Saved.';
        // Redraw so the credential tiles and next steps reflect the new figures.
        setTimeout(render, 900);
    } catch (e) {
        msg.style.color = '#991b1b';
        msg.textContent = e.message || 'Could not save.';
        btn.disabled = false;
        btn.textContent = 'Save my changes';
    }
}

/* Fetches the files for whoever is on screen and redraws once they arrive.

   Kept out of load() because it runs again every time the director changes who they
   are looking at. Failure is recorded rather than thrown: a file listing that cannot
   be read must not blank the credential and classroom cards around it. */
async function loadFiles(staffId) {
    FILES = null;
    try {
        const res = await apiFetch('/api/staff-files?staffId=' + encodeURIComponent(staffId));
        FILES = res.ok ? await res.json() : { error: 'HTTP ' + res.status };
    } catch (e) {
        FILES = { error: e.message || 'could not reach the server' };
    }
    render();
}

async function load() {
    try {
        // Identity first, and on its own: everything below is shaped by the answer.
        WHO = (window.CofpAuth && CofpAuth.whoAmI) ? await CofpAuth.whoAmI() : null;

        const [sRes, tRes, rRes] = await Promise.all([
            apiFetch('/api/staff'),
            apiFetch('/api/staff-training').catch(() => null),
            // Rooms, so an assigned classroom name can be turned into the room number
            // the roster is keyed on. Optional: without it the classroom card simply
            // names the room instead of linking to it.
            apiFetch('/api/classrooms').catch(() => null)
        ]);
        if (!sRes.ok) throw new Error('staff records: HTTP ' + sRes.status);
        STAFF = await sRes.json();
        if (!Array.isArray(STAFF)) STAFF = [];
        STAFF = STAFF.filter(s => String(s.Name || '').trim() && !/^new teacher$/i.test(s.Name));
        TRAINING = tRes && tRes.ok ? await tRes.json() : [];
        if (!Array.isArray(TRAINING)) TRAINING = [];
        ROOMS = rRes && rRes.ok ? await rRes.json() : [];
        if (!Array.isArray(ROOMS)) ROOMS = [];

        // Form completion is read from the shared worksheet store.
        await PasStore.ready;

        const sel = $('spStaff');
        if (!STAFF.length) {
            sel.innerHTML = '<option value="">No staff records found</option>';
            $('spBody').innerHTML = '<div class="sp-card"><div class="sp-sub">No staff records to show.</div></div>';
            return;
        }
        sel.innerHTML = STAFF.map(s =>
            '<option value="' + s.Id + '">' + esc(s.Name) + '</option>').join('');
        const wanted = new URLSearchParams(location.search).get('staffId');
        if (wanted && STAFF.some(s => String(s.Id) === String(wanted))) sel.value = wanted;
        current = STAFF.find(s => String(s.Id) === String(sel.value)) || STAFF[0];
        sel.addEventListener('change', () => {
            current = STAFF.find(s => String(s.Id) === String(sel.value));
            render();
            loadFiles(current.Id);
        });

        /* A staff member gets their name where the chooser was. The server already
           sent them one record, so hiding the control is honesty about what they
           have rather than a restriction added on top of it — there is genuinely
           nothing else for them to look at. */
        if (WHO && WHO.director === false) {
            $('spStaff').style.display = 'none';
            $('spWhoName').style.display = '';
            $('spWhoName').textContent = WHO.name || (current && current.Name) || '';
            $('spStaffActions').style.display = '';
            $('spBarNote').textContent = 'This is your own record. You can correct your '
                + 'qualifications here; your room and role are set by Megan.';
        }

        render();
        if (current) loadFiles(current.Id);
    } catch (e) {
        $('spBody').innerHTML = '<div class="sp-card"><div class="sp-sub" style="color:#991b1b;">'
            + 'Could not load your record: ' + esc(e.message) + '</div></div>';
    }
}

/* Bar actions, for a staff member signed in as themselves. Attached once: these
   elements live in the page shell rather than the rendered body. */
$('spSignOut').addEventListener('click', e => {
    e.preventDefault();
    if (window.CofpAuth) CofpAuth.staffLogout();
    location.replace('/me');
});

/* Changing a password again later reuses the sign-in page rather than growing a
   second copy of the same form here. It already knows how to ask for the current
   one and enforce the same rules, and one implementation cannot drift from itself. */
$('spChangePw').addEventListener('click', e => {
    e.preventDefault();
    const current = prompt('Your current password:');
    if (!current) return;
    const next = prompt('Your new password (at least 10 characters):');
    if (!next) return;
    if (next.length < 10) return alert('That is under 10 characters, so it was not changed.');
    const again = prompt('Type the new one again:');
    if (next !== again) return alert('Those did not match, so nothing was changed.');
    CofpAuth.staffChangePassword(current, next)
        .then(() => alert('Changed. Use the new one next time you sign in.'))
        .catch(err => alert(err.message || 'Could not change it.'));
});

load();
</script>

</html>
