/* Wire the Admin tab: the upload button and, after a preview lands, the per-person
   Apply / Apply-all buttons. Attached fresh each render like the other cards. */
let ATTN_RESULTS = [];      // last preview, so Apply can resend the proposed values
function wireAdmin() {
    const btn = $('attnUpload');
    if (btn) btn.addEventListener('click', runAttainmentsPreview);
    // Apply buttons are wired when the preview is rendered (renderAttnResults).
}

async function runAttainmentsPreview() {
    const fileEl = $('attnFile');
    const msg = $('attnMsg');
    const out = $('attnResults');
    if (!fileEl || !fileEl.files || !fileEl.files.length) {
        if (msg) { msg.className = 'sp-savemsg bad'; msg.textContent = 'Choose the PDF first.'; }
        return;
    }
    const btn = $('attnUpload');
    if (btn) { btn.disabled = true; btn.textContent = 'Reading\u2026'; }
    if (msg) { msg.className = 'sp-savemsg'; msg.textContent = 'Uploading and reading the report\u2026'; }
    try {
        const form = new FormData();
        form.append('file', fileEl.files[0]);
        // Multipart: let the browser set the boundary; attach the token by hand.
        const headers = (window.CofpAuth && CofpAuth.personalHeaders) ? CofpAuth.personalHeaders() : {};
        delete headers['Content-Type'];
        const res = await fetch('/api/staff-attainments-preview', { method: 'POST', headers: headers, body: form });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
        ATTN_RESULTS = data.results || [];
        if (msg) { msg.className = 'sp-savemsg good'; msg.textContent = 'Read ' + data.count + ' record(s). Review below.'; }
        renderAttnResults();
    } catch (e) {
        if (msg) { msg.className = 'sp-savemsg bad'; msg.textContent = 'Could not read it: ' + (e.message || e); }
        if (out) out.innerHTML = '';
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Read & preview'; }
    }
}

function renderAttnResults() {
    const out = $('attnResults');
    if (!out) return;
    const changed = ATTN_RESULTS.filter(r => r.matched && r.changed);
    const noChange = ATTN_RESULTS.filter(r => r.matched && !r.changed);
    const unmatched = ATTN_RESULTS.filter(r => !r.matched);

    let html = '';
    if (changed.length) {
        html += '<div class="sp-attn-head">'
            + '<button type="button" id="attnApplyAll" class="sp-save">Looks good \u2014 apply all '
            + changed.length + '</button></div>';
        html += changed.map((r, i) => {
            const idx = ATTN_RESULTS.indexOf(r);
            return '<div class="sp-attn-card" data-i="' + idx + '">'
                + '<div class="sp-attn-name">' + esc(r.staffName || r.parsedName)
                + ' <span class="sp-pill">' + esc(r.registryId || '')
                + (r.matchBy === 'name' ? ' \u00b7 matched by name' : '') + '</span></div>'
                + attnDiff('Gateways credential', r.current.gateways, r.proposed.gateways)
                + attnDiff('Notes (pending)', r.current.notes, r.proposed.notes)
                + '<div class="sp-attn-actions">'
                + '<button type="button" class="sp-save attn-apply-one" data-i="' + idx + '">Apply this</button>'
                + '<span class="sp-savemsg attn-one-msg"></span>'
                + '</div></div>';
        }).join('');
    } else {
        html += '<div class="sp-step done"><div class="t">\u2713 Nothing to change</div>'
            + '<div class="d">Every matched record already agrees with the report.</div></div>';
    }
    if (noChange.length) {
        html += '<div class="sp-sub" style="margin-top:12px;">' + noChange.length
            + ' record(s) matched and already up to date.</div>';
    }
    if (unmatched.length) {
        html += '<div class="sp-step caution" style="margin-top:12px;"><div class="t">'
            + unmatched.length + ' not matched to a staff record</div><div class="d">'
            + unmatched.map(u => esc(u.parsedName || '(no name)') + ' (' + esc(u.registryId || 'no N#') + ')').join(', ')
            + '. These were in the report but no active staff record has that Registry number. '
            + 'Add the Registry number to their record, then re-run.</div></div>';
    }
    out.innerHTML = html;

    const applyAll = $('attnApplyAll');
    if (applyAll) applyAll.addEventListener('click', () => applyAttainments(changed.map(r => ATTN_RESULTS.indexOf(r))));
    out.querySelectorAll('.attn-apply-one').forEach(b => {
        b.addEventListener('click', () => applyAttainments([parseInt(b.getAttribute('data-i'), 10)], b));
    });
}

// One "before -> after" line, shown only when the value actually changes.
function attnDiff(label, before, after) {
    if (String(before || '') === String(after || '')) return '';
    return '<div class="sp-attn-diff"><div class="sp-attn-diff-lbl">' + esc(label) + '</div>'
        + '<div class="sp-attn-before">' + (before ? esc(before) : '<em>(empty)</em>') + '</div>'
        + '<div class="sp-attn-after">' + (after ? esc(after) : '<em>(cleared)</em>') + '</div></div>';
}

async function applyAttainments(indexes, btn) {
    const changes = indexes
        .map(i => ATTN_RESULTS[i])
        .filter(r => r && r.matched && r.staffId)
        .map(r => ({ staffId: r.staffId, gateways: r.proposed.gateways, notes: r.proposed.notes }));
    if (!changes.length) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Applying\u2026'; }
    try {
        const res = await myFetch('/api/staff-attainments-apply', {
            method: 'POST', body: JSON.stringify({ changes: changes })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        // Reflect applied rows in the loaded STAFF list so the outstanding view and
        // the rest of the page update without a full reload, then re-render.
        (data.applied || []).forEach(id => {
            const row = STAFF.find(x => String(x.Id) === String(id));
            const src = ATTN_RESULTS.find(r => String(r.staffId) === String(id));
            if (row && src) { row.Gateways = src.proposed.gateways; row.Notes = src.proposed.notes; src.changed = false; }
        });
        if (data.failed && data.failed.length) {
            alert('Applied ' + (data.applied || []).length + ', but ' + data.failed.length
                + ' failed: ' + data.failed.map(f => f.staffId + ' (' + f.error + ')').join('; '));
        }
        render();   // redraw; Admin tab shows the reduced outstanding list and preview
    } catch (e) {
        alert('Could not apply: ' + (e.message || e));
        if (btn) { btn.disabled = false; btn.textContent = 'Apply this'; }
    }
}

/* Buttons inside the rendered cards. Attached fresh each render rather than
   delegated, so a stale handler cannot act on a card that has been redrawn for a
   different person.

   The file-assignment handlers that used to live here went with the workbench to
   staff-files.html. */
function wireCardActions() {
    const save = $('edSave');
    if (save) save.addEventListener('click', saveMyRecord);

    // Cancel: discard nothing (the record is unchanged until Save), just leave the
    // edit view and return to Overview.
    const cancel = $('edCancel');
    if (cancel) cancel.addEventListener('click', () => {
        current = STAFF.find(x => String(x.Id) === String(current.Id)) || current;
        render();
        closeDetailsToOverview();
    });

    document.querySelectorAll('.sp-upbtn').forEach(btn => {
        btn.addEventListener('click', () => handIn(btn.getAttribute('data-key'), btn));
    });

    // Personal file cards: open through fetchStaffFile so the staff token travels.
    document.querySelectorAll('[data-file]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            fetchStaffFile(a.getAttribute('data-file'), a);
        });
    });
}

/* Open one of "my files" in a new tab, authenticated.

   The download endpoint checks the personal staff token, which only travels on a
   header myFetch adds — a plain link sends no headers, so it failed with "Sign in
   first". We fetch the bytes through myFetch, wrap them in a blob URL and open that,
   so the token authorises the request without ever appearing in the address bar. */
async function fetchStaffFile(rel, el) {
    const label = el ? el.querySelector('.n') : null;
    const original = label ? label.getAttribute('data-label') || null : null;
    try {
        const res = await myFetch('/api/staff-file-download?path=' + encodeURIComponent(rel));
        if (!res.ok) {
            let msg = 'HTTP ' + res.status;
            try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
            alert('Could not open that file: ' + msg);
            return;
        }
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        // Open in a new tab; revoke shortly after so the browser has grabbed it.
        window.open(objUrl, '_blank', 'noopener');
        setTimeout(() => URL.revokeObjectURL(objUrl), 60000);
    } catch (e) {
        alert('Could not open that file: ' + (e.message || e));
    }
}

/* Sends a missing document. Multipart, so this cannot go through apiFetch — that
   sets a JSON content type, and the browser has to set its own boundary here. The
   credentials are attached by hand for the same reason. */
async function handIn(key, btn) {
    const input = $('up_' + key);
    const msg = $('upmsg_' + key);
    // Captured, because the label differs between filling a gap and adding a version.
    const originalLabel = btn.textContent;
    if (!input || !input.files || !input.files.length) {
        msg.className = 'sp-upmsg warn';
        msg.textContent = 'Choose a file first.';
        return;
    }

    const file = input.files[0];
    // Checked here so the answer is instant; the server checks again and decides.
    if (file.size > 15 * 1024 * 1024) {
        msg.className = 'sp-upmsg bad';
        msg.textContent = 'That is over 15 MB. A PDF scan is usually much smaller.';
        return;
    }

    const form = new FormData();
    form.append('file', file, file.name);

    btn.disabled = true;
    btn.textContent = 'Sending…';
    msg.textContent = '';
    try {
        /* Personal credentials, so the upload is filed against the person whose page
           this is rather than resolving to the director on a shared browser. No
           Content-Type: the browser must set its own multipart boundary. */
        const headers = (window.CofpAuth && CofpAuth.personalHeaders)
            ? CofpAuth.personalHeaders() : {};
        delete headers['Content-Type'];
        const res = await fetch('/api/staff-file-upload?category=' + encodeURIComponent(key), {
            method: 'POST', headers: headers, body: form
        });
        const body = await res.json();
        if (!res.ok || !body.success) throw new Error(body.error || 'HTTP ' + res.status);
        msg.className = 'sp-upmsg good';
        msg.textContent = 'Sent. Megan will check it.';
        // Re-read so it appears in the list above, marked as waiting.
        await loadFiles(current.Id);
    } catch (e) {
        msg.className = 'sp-upmsg bad';
        msg.textContent = e.message || 'Could not send it.';
        btn.disabled = false;
        btn.textContent = originalLabel;
    }
}

async function saveMyRecord() {
    const btn = $('edSave');
    const msg = $('edMsg');
    if (!current) return;

    /* Gateways is derived from the credentials text rather than typed separately, so
       the two can no longer disagree. The staff-cards editor composes it the same way:
       the ECE level in "ECE Level 4, CDA" becomes "ECE Credential - Level 4". Absent an
       ECE level, the Gateways column is left as the record already has it. */
    const eceText = $('edEce').value.trim();
    const eceLvl = (eceText.match(/ECE(?:\s*Credential)?\s*-?\s*Level\s*(\d)/i) || [])[1];
    const gatewaysDerived = eceLvl
        ? 'ECE Credential - Level ' + eceLvl
        : (current.Gateways || '');

    const payload = {
        education: $('edEducation').value,
        registryId: $('edRegistryId').value.trim(),
        eceCredentials: eceText,
        gateways: gatewaysDerived,
        experienceYears: $('edExperience').value.trim(),
        semesterHoursTotal: $('edShTotal').value.trim(),
        semesterHoursEce: $('edShEce').value.trim(),
        transcriptOnFile: $('edTranscript').value,
        pdHoursYtd: $('edPdHours').value.trim(),
        pdHoursYear: $('edPdYear').value.trim()
    };

    /* Caught here because it is the mistake that makes the number meaningless: ECE
       hours are a subset of the total, so more of them than there are hours at all
       is a typo rather than a fact. */
    const total = parseFloat(payload.semesterHoursTotal);
    const ece = parseFloat(payload.semesterHoursEce);
    if (isFinite(total) && isFinite(ece) && ece > total) {
        msg.style.color = '#991b1b';
        msg.textContent = 'Early childhood hours cannot be more than your total hours.';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    msg.textContent = '';
    try {
        const res = await myFetch('/api/staff/' + encodeURIComponent(current.Id), {
            method: 'PUT',
            body: JSON.stringify(payload)
        });
        const body = await res.json();
        if (!res.ok || !body.success) throw new Error(body.error || 'HTTP ' + res.status);

        // Keep the copy this page is drawing from in step with what was saved.
        Object.keys(payload).forEach(k => {
            const col = { education: 'Education', registryId: 'RegistryId',
                eceCredentials: 'EceCredentials', gateways: 'Gateways',
                experienceYears: 'ExperienceYears', semesterHoursTotal: 'SemesterHoursTotal',
                semesterHoursEce: 'SemesterHoursEce', transcriptOnFile: 'TranscriptOnFile',
                pdHoursYtd: 'PdHoursYtd', pdHoursYear: 'PdHoursYear' }[k];
            if (col) current[col] = payload[k];
        });
        msg.style.color = '#166534';
        msg.textContent = body.reviewCleared
            ? 'Saved. Megan will see it as needing a check.'
            : 'Saved.';
        /* Leave the edit view after a beat, long enough to read the confirmation.
           "Where you stand" reappears under the name card on the redraw. Closing
           detailsOpen BEFORE the redraw is what stops wireDetailsToggle reopening
           the panel on the fresh markup. */
        setTimeout(() => {
            detailsOpen = false;
            render();
        }, 900);
    } catch (e) {
        msg.style.color = '#991b1b';
        msg.textContent = e.message || 'Could not save.';
        btn.disabled = false;
        btn.textContent = 'Save my changes';
    }
}

/* Fetches the files for whoever is on screen and redraws once they arrive.

   Kept out of load() because it runs again every time the director changes who they
   are looking at. Failure is recorded rather than thrown: a file listing that cannot
   be read must not blank the credential and classroom cards around it. */
async function loadFiles(staffId) {
    FILES = null;
    try {
        const res = await myFetch('/api/staff-files?staffId=' + encodeURIComponent(staffId));
        FILES = res.ok ? await res.json() : { error: 'HTTP ' + res.status };
    } catch (e) {
        FILES = { error: e.message || 'could not reach the server' };
    }
    render();
}

/* The school year in view, computed the same way isbe.html does (July rollover),
   so a form saved from My Classroom lands in the same year the ISBE roster shows. */
function currentSchoolYear() {
    const now = new Date();
    const y = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
    return y + '-' + (y + 1);
}

/* Register My Page with the shared form module. Called once, before any form is
   opened. CofpForms reads live data through these accessors, so it never holds a
   stale snapshot and never needs to know how My Page stores things.

   injectAssets is left on (the default) so the modal markup and CSS are added to
   this page — staff-portal.html does not ship them inline the way isbe.html does. */
let clsFormsReady = false;
function initClassroomForms() {
    if (clsFormsReady || !window.CofpForms) return;
    CofpForms.init({
        getStudents: () => CLS_STUDENTS,
        getClassrooms: () => ROOMS,
        getTracking: () => CLS_TRACKING,
        getScreening: () => CLS_SCREENING,
        getSignatures: () => CLS_SIGNATURES,
        setSignatures: sig => { CLS_SIGNATURES = sig || {}; },
        getYear: () => CLS_YEAR || currentSchoolYear(),
        apiFetch: (url, opts) => myFetch(url, opts),
        ChildForms: window.ChildForms,
        // After a save the module calls this so the open room re-renders with the
        // new tick, exactly as isbe.html's refreshActiveView does for its views.
        refreshActiveView: () => renderClassroomPanel(),
        // Print All in the classroom is scoped to the room on screen.
        classroomRoster: () => classroomRoster(activeClsRoom)
    });
    clsFormsReady = true;
}

/* Load the classroom dataset once, the first time the tab is opened. Mirrors the
   fetches isbe.html does in its init: students, tracking, screening, the signature
   index, and which forms exist (ChildForms). Anything optional degrades quietly —
   the checklist still works without screenings or signatures, it just cannot show
   deadlines or signed state. */
async function loadClassroomData() {
    if (clsState === 'loading' || clsState === 'ready') return;
    clsState = 'loading';
    CLS_YEAR = currentSchoolYear();
    try {
        initClassroomForms();
        const yq = url => url + (url.indexOf('?') === -1 ? '?' : '&') + 'year=' + encodeURIComponent(CLS_YEAR);
        const [sRes, tRes, scrRes] = await Promise.all([
            myFetch('/api/students'),
            myFetch(yq('/api/isbe-tracking')).catch(() => null),
            myFetch(yq('/api/screening-summary')).catch(() => null),
            // Which forms actually exist behind a tick, so "on paper?" shows from the
            // first render. Optional; ChildForms falls back to tick-only if absent.
            (window.ChildForms && ChildForms.load) ? ChildForms.load(CLS_YEAR, myFetch).catch(() => null) : Promise.resolve(),
            (window.CofpForms) ? CofpForms.loadSignatures(CLS_YEAR).then(s => { CLS_SIGNATURES = s || {}; }).catch(() => null) : Promise.resolve()
        ]);
        if (!sRes || !sRes.ok) throw new Error('students: HTTP ' + (sRes ? sRes.status : '—'));
        CLS_STUDENTS = await sRes.json();
        if (!Array.isArray(CLS_STUDENTS)) CLS_STUDENTS = [];
        CLS_TRACKING = {};
        if (tRes && tRes.ok) {
            const tData = await tRes.json();
            (Array.isArray(tData) ? tData : []).forEach(t => { CLS_TRACKING[t.StudentId] = t; });
        }
        CLS_SCREENING = {};
        if (scrRes && scrRes.ok) {
            try {
                const scr = await scrRes.json();
                if (Array.isArray(scr)) scr.forEach(s => {
                    if (!CLS_SCREENING[s.StudentId]) CLS_SCREENING[s.StudentId] = {};
                    CLS_SCREENING[s.StudentId][s.ScreeningType + '|' + s.Period] = s;
                });
            } catch (e) { /* additive */ }
        }
        clsState = 'ready';
    } catch (e) {
        console.error('[MY CLASSROOM] load failed', e);
        clsState = 'error';
        clsError = e.message;
    }
    renderClassroomPanel();
}

/* Active PFA/PI children in a room, most-relevant program only, sorted by name.
   Same rule as isbe.html's classroomRoster: only children in a tracked program
   have a checklist. */
function classroomRoster(roomNumber) {
    return CLS_STUDENTS
        .filter(s => (s.Active === 'Yes' || s.Active === 'YES')
            && String(s.RoomNumber) === String(roomNumber)
            && (s.PFA_PI_na === 'PFA' || s.PFA_PI_na === 'PI'))
        .sort(CofpForms.sortByName);
}

/* The soonest deadline affecting a child, so the most urgent card sorts first.
   Mirrors isbe.html's childUrgency. */
function classroomUrgency(s) {
    let worst = null;
    ['BegASQ', 'BegASE'].forEach(field => {
        if ((CLS_TRACKING[s.Id] || {})[field]) return;
        if (!CofpForms.isLateEnrollee(s, CLS_YEAR)) return;
        const type = field === 'BegASQ' ? 'ASQ-3' : 'ASQ:SE-2';
        const rec = (CLS_SCREENING[s.Id] || {})[type + '|Beginning'];
        const dl = CofpForms.screeningDeadline(s, rec && rec.ScreeningDate, CLS_YEAR);
        if (!dl) return;
        const rank = dl.state === 'overdue' ? 0 : dl.state === 'due' ? 1 : 2;
        if (worst === null || rank < worst) worst = rank;
    });
    return worst === null ? 3 : worst;
}

/* Redraw only the classroom panel in place, so a save or a room change does not
   rebuild the whole page (which would also collapse any open form). Falls back to
   a full render if the panel is not on screen. */
function renderClassroomPanel() {
    const panel = document.getElementById('sppanel_classroom');
    if (!panel) { if (current) render(); return; }
    panel.innerHTML = classroomSection(current);
    wireClassroom();
}

async function load() {
    try {
        // Identity first, and on its own: everything below is shaped by the answer.
        WHO = (window.CofpAuth && CofpAuth.whoAmI) ? await CofpAuth.whoAmI() : null;

        /* Nobody signed in — no personal token and no shared password. Send them to
           the one door rather than showing "could not load your record", which is
           what a visitor with no credentials used to get here. /me shows the sign-in
           form and, once they are in, sends them right back. This is the same gate
           the dashboard card leans on; having it here too means a saved link straight
           to this page still lands a stranger on the login rather than an error. */
        if (!WHO && !(window.CofpAuth && CofpAuth.signedIn && CofpAuth.signedIn())) {
            location.replace('/me');
            return;
        }

        const [sRes, tRes, rRes] = await Promise.all([
            myFetch('/api/staff'),
            myFetch('/api/staff-training').catch(() => null),
            // Rooms, so an assigned classroom name can be turned into the room number
            // the roster is keyed on. Optional: without it the classroom card simply
            // names the room instead of linking to it.
            myFetch('/api/classrooms').catch(() => null)
        ]);
        /* A 401 here means the sign-in has lapsed: the personal token expired (or the
           shared password is no longer stored), so the server rejected the request.
           whoAmI can still look "signed in" from a stale token, so the earlier guard
           does not catch this. Rather than strand the person on "HTTP 401", clear the
           dead token and send them back through the sign-in, which mints a fresh one
           and returns them here. */
        if (sRes.status === 401) {
            try { if (window.CofpAuth && CofpAuth.staffLogout) CofpAuth.staffLogout(); } catch (e) {}
            location.replace('/me');
            return;
        }
        if (!sRes.ok) throw new Error('staff records: HTTP ' + sRes.status);
        STAFF = await sRes.json();
        if (!Array.isArray(STAFF)) STAFF = [];
        STAFF = STAFF.filter(s => String(s.Name || '').trim() && !/^new teacher$/i.test(s.Name));
        TRAINING = tRes && tRes.ok ? await tRes.json() : [];
        if (!Array.isArray(TRAINING)) TRAINING = [];
        ROOMS = rRes && rRes.ok ? await rRes.json() : [];
        if (!Array.isArray(ROOMS)) ROOMS = [];

        // Form completion is read from the shared worksheet store.
        await PasStore.ready;

        /* A tab named in the address opens that tab. The dashboard has linked
           staff-portal.html#files since My Files was a separate entry, and ?tab= is
           accepted too so a link can carry both a person and a tab. Anything
           unrecognised is ignored rather than left on a blank page. */
        const askedTab = (new URLSearchParams(location.search).get('tab')
            || location.hash.replace(/^#/, '')).toLowerCase();
        if (SP_TABS.some(t => t.key === askedTab)) activeTab = askedTab;

        const sel = $('spStaff');
        if (!STAFF.length) {
            sel.innerHTML = '<option value="">No staff records found</option>';
            $('spBody').innerHTML = '<div class="sp-card"><div class="sp-sub">No staff records to show.</div></div>';
            return;
        }
        sel.innerHTML = STAFF.map(s =>
            '<option value="' + s.Id + '">' + esc(s.Name) + '</option>').join('');
        /* Which record to open on: an explicit ?staffId= first, then your own if the
           server told us who you are, and only then the top of the list. Without the
           middle step an administrator signed in as themselves lands on whoever comes
           first alphabetically, which is somebody else's page. */
        const wanted = new URLSearchParams(location.search).get('staffId');
        const mine = WHO && WHO.staffId;
        if (wanted && STAFF.some(s => String(s.Id) === String(wanted))) sel.value = wanted;
        else if (mine && STAFF.some(s => String(s.Id) === String(mine))) sel.value = String(mine);
        current = STAFF.find(s => String(s.Id) === String(sel.value)) || STAFF[0];
        sel.addEventListener('change', () => {
            current = STAFF.find(s => String(s.Id) === String(sel.value));
            render();
            loadFiles(current.Id);
        });

        applyIdentityToBar();

        render();
        if (current) loadFiles(current.Id);
    } catch (e) {
        $('spBody').innerHTML = '<div class="sp-card"><div class="sp-sub sp-err">'
            + 'Could not load your record: ' + esc(e.message) + '</div></div>';
    }
}

/* Who the bar says you are, and whether it offers the staff chooser.

   Two questions, decided separately, because conflating them was the bug. WHO.admin
   decides whether the chooser is any use; being in a PERSONAL session decides whether the
   sign-out and change-password links belong here.

   An administrator signed in as themselves needs both: the chooser, because they maintain
   everyone's records, and the personal links, because it is their own account. Keying the
   chooser off `director` alone meant Clete signing in as himself became an ordinary member
   of staff and lost the roster, which is what prompted this.

   For everybody else the chooser is hidden because it holds nothing — the server sent them
   exactly one record. That is honesty about what they have, not a restriction laid on top:
   the page could not show a colleague even if it tried.

   A named function rather than a few lines inside the loader, so the three cases can be
   tested rather than reasoned about. */
function applyIdentityToBar() {
    const isPersonal = !!(WHO && WHO.director === false);
    const mayChoose = !!(WHO && (WHO.director || WHO.admin));

    if (!mayChoose) {
        $('spStaff').style.display = 'none';
        $('spWhoName').style.display = '';
        $('spWhoName').textContent = (WHO && WHO.name) || (current && current.Name) || '';
        $('spBarNote').textContent = 'This is your own record. You can correct your '
            + 'qualifications here; your room and role are set by Megan.';
    } else if (isPersonal) {
        // Chooser kept, but say whose account it is, which matters on a shared screen.
        $('spWhoName').style.display = 'none';
        $('spBarNote').textContent = 'Signed in as ' + ((WHO && WHO.name) || 'an administrator')
            + '. Choose any member of staff above \u2014 including yourself.';
    }
    if (isPersonal) $('spStaffActions').style.display = 'inline';
    return { mayChoose: mayChoose, isPersonal: isPersonal };
}

/* ── Theme ──
   Remembered per browser rather than per person, because it is a property of the
   screen someone is looking at, not of their record. Applied before the record
   loads so the page never flashes light and then switches.

   Honours the operating system's setting on a first visit and then stops, because
   once somebody has chosen, that choice should stick even if they later change the
   system default. */
const THEME_KEY = 'copStaffTheme';

function prefersDark() {
    try {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
}

function applyTheme(dark) {
    document.body.classList.toggle('sp-dark', !!dark);
    const btn = $('spTheme');
    if (btn) {
        // Names what clicking does, not what is currently on.
        btn.textContent = dark ? '\u2600 Light mode' : '\u263e Dark mode';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    }
}

(function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* private browsing */ }
    applyTheme(saved === null ? prefersDark() : saved === 'dark');
})();

$('spTheme').addEventListener('click', () => {
    const dark = !document.body.classList.contains('sp-dark');
    applyTheme(dark);
    try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
});

/* Bar actions, for a staff member signed in as themselves. Attached once: these
   elements live in the page shell rather than the rendered body. */
$('spSignOut').addEventListener('click', e => {
    e.preventDefault();
    if (window.CofpAuth) CofpAuth.staffLogout();
    location.replace('/me');
});

/* Changing a password again later reuses the sign-in page rather than growing a
   second copy of the same form here. It already knows how to ask for the current
   one and enforce the same rules, and one implementation cannot drift from itself. */
$('spChangePw').addEventListener('click', e => {
    e.preventDefault();
    const current = prompt('Your current password:');
    if (!current) return;
    const next = prompt('Your new password (at least 10 characters):');
    if (!next) return;
    if (next.length < 10) return alert('That is under 10 characters, so it was not changed.');
    const again = prompt('Type the new one again:');
    if (next !== again) return alert('Those did not match, so nothing was changed.');
    CofpAuth.staffChangePassword(current, next)
        .then(() => alert('Changed. Use the new one next time you sign in.'))
        .catch(err => alert(err.message || 'Could not change it.'));
});

load();
</script>
