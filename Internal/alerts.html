<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; }
        .alerts-layout { display:flex;height:calc(100vh - 90px);align-items:flex-start;justify-content:center;padding:20px; }
        .alerts-wrapper { display:flex;flex-direction:column;max-height:calc(100vh - 130px);width:100%;max-width:900px; }
        .alerts-card { background:white;flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.2); }
        .alerts-header { padding:14px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px; }
        .alerts-header h2 { font-size:1rem;font-weight:800;color:#1e3a8a;margin:0; }
        .alerts-header span { font-size:0.78rem;color:#64748b; }
        .alerts-body { overflow-y:auto;flex:1;padding:20px 24px; }
        .alert-item { border-left:4px solid #e5e7eb;padding:14px 18px;margin-bottom:12px;background:#f8fafc;border-radius:0 8px 8px 0; }
        .alert-item.warning { border-left-color:#f59e0b; }
        .alert-item.info { border-left-color:#2563eb; }
        .alert-item.error { border-left-color:#dc2626; }
        .alert-title { font-weight:700;font-size:0.88rem;color:#1e293b;margin-bottom:6px; }
        .alert-detail { font-size:0.78rem;color:#64748b;line-height:1.5; }
        .alert-action { display:inline-block;margin-top:8px;font-size:0.75rem;font-weight:700;color:#2563eb;text-decoration:none; }
        .alert-action:hover { text-decoration:underline; }
        table { width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:8px; }
        th { text-align:left;padding:6px 8px;font-size:0.68rem;font-weight:700;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e5e7eb; }
        td { padding:6px 8px;border-bottom:1px solid #f3f4f6; }
        .empty-state { text-align:center;padding:48px 20px;color:#64748b; }
        .empty-state .icon { font-size:2.5rem;margin-bottom:12px; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>System Alerts &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="alerts-layout">
    <div class="alerts-wrapper">
        <div class="alerts-card">
            <div class="alerts-header">
                <h2>🔔 Alerts</h2>
                <span id="alertCount">Loading...</span>
            </div>
            <div class="alerts-body" id="alertsBody">
                <div class="empty-state"><div class="icon">⏳</div>Loading alerts...</div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
// AUTH, apiFetch, isTruthy, sortByName and CCAP_THRESHOLDS come from app.js.
async function init() {
    try {
        // Staff is fetched too, for the ExceleRate credential alert. It is allowed
        // to fail on its own so a staff problem never blanks the whole page.
        const [sRes, wRes, stRes] = await Promise.all([
            apiFetch('/api/students'),
            apiFetch('/api/waitinglist'),
            apiFetch('/api/staff').catch(() => null)
        ]);
        const students = await sRes.json();
        const waitlist = await wRes.json();
        let staff = [];
        try { if (stRes) staff = await stRes.json(); } catch (e) { staff = []; }
        renderAlerts(students, waitlist, staff);
    } catch(e) {
        document.getElementById('alertsBody').innerHTML = '<div class="empty-state"><div class="icon">❌</div>Failed to load: ' + e.message + '</div>';
    }
}

/* ExceleRate 4B(ii): at least 30% of infant and toddler staff must hold a Gateways
   Infant Toddler Credential at Level 2 or above.

   Written as a live calculation rather than a fixed reminder, so it disappears by
   itself once the requirement is comfortably met instead of becoming noise. It
   also carries the coursework leads, because the shortfall here cannot be fixed
   by paperwork: staff without infant and toddler coursework need a course.

   Ownership and administration are excluded from the count, per Genni. */
function infantToddlerCredentialAlert(staff) {
    const IT_ROOMS = ['Infant', 'Infants / Toddlers', '2 Year Olds / Toddlers'];
    const norm = s => String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean)
        .map(w => (w.length > 2 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w)).join('/');
    const serves = (p, room) => norm(p.Classroom) === norm(room) || norm(p.SecondaryClassroom) === norm(room);
    const itLv = p => { const m = (p.EceCredentials || '').match(/IT Level (\d)/i); return m ? +m[1] : 0; };

    const teaching = staff.filter(p => (p.StaffGroup || '') !== 'Ownership')
        .filter(p => /teacher|assistant/i.test(p.Role || ''));
    const inIt = teaching.filter(p => IT_ROOMS.some(r => serves(p, r)));
    if (!inIt.length) return '';

    const holders = inIt.filter(p => itLv(p) >= 2);
    const needed = Math.ceil(inIt.length * 0.3);
    const pct = Math.round(holders.length / inIt.length * 100);
    const short = needed - holders.length;

    // Nothing to say once there is margin above the threshold.
    if (short <= 0 && holders.length > needed) return '';

    const partTime = p => IT_ROOMS.some(r => norm(p.SecondaryClassroom) === norm(r))
        && !IT_ROOMS.some(r => norm(p.Classroom) === norm(r));
    const candidates = inIt.filter(p => itLv(p) < 2);

    const met = short <= 0;
    return `<div class="alert-item ${met ? 'warning' : 'danger'}">
        <div class="alert-title">🎓 Infant/toddler credential: ${holders.length} of ${inIt.length} staff (${pct}%) — ExceleRate 4B needs 30%</div>
        <div class="alert-detail">
            ${met
                ? `Currently met, but with no margin: ${needed} of ${inIt.length} required and ${holders.length} held.
                   ${holders.some(partTime)
                        ? 'It rests on a part-time assignment, so a single schedule change would drop you below the threshold.'
                        : ''}`
                : `<strong>Short by ${short}.</strong> This cannot be closed by submitting paperwork —
                   staff without infant and toddler coursework need to take a course.`}
        </div>
        <table>
            <thead><tr><th>Infant/toddler staff</th><th>Room</th><th>IT credential</th></tr></thead>
            <tbody>${inIt.map(p => `<tr>
                <td style="font-weight:600;">${p.Name || ''}${partTime(p) ? ' <span style="font-weight:400;color:#7c3aed;">(part time)</span>' : ''}</td>
                <td>${p.Classroom || p.SecondaryClassroom || ''}</td>
                <td style="${itLv(p) >= 2 ? 'color:#16a34a;font-weight:600;' : 'color:#b45309;'}">${itLv(p) ? 'Level ' + itLv(p) : 'none'}</td>
            </tr>`).join('')}</tbody>
        </table>
        <div class="alert-detail" style="margin-top:10px;">
            <strong>Self-paced / online coursework to look into</strong>
            ${candidates.length ? ` — for ${candidates.map(p => (p.Name || '').split(' ')[0]).join(', ')}` : ''}:
            <ul style="margin:6px 0 0 18px;">
                <li><strong>SWIC first.</strong> Tara, Paige and Sue already have records there, so credits and
                    transcripts stay in one place. Ask specifically for an infant/toddler course, not another
                    general early childhood one.</li>
                <li><a href="https://www.clcillinois.edu/programs/bssdv/early-childhood-education/infant-toddler-level-ii-career-certificate" target="_blank" rel="noopener">College of Lake County — Infant/Toddler Level 2 Certificate</a>.
                    Built so the coursework prepares you for the Gateways Level 2 credential. Check whether
                    credits transfer, since it is a different college.</li>
                <li><a href="https://acesonline.illinois.edu/program/infant-toddler-development-care-providers-certificate" target="_blank" rel="noopener">University of Illinois ACES Online — Infant Toddler Development for Care Providers</a>.
                    Online, includes an infant/toddler development course at Level 2.</li>
                <li>Confirm with <strong>credentials@ilgateways.com</strong> that a chosen course counts toward
                    the Infant Toddler Credential before anyone enrols and pays.</li>
            </ul>
        </div>
        <a class="alert-action" href="/staff/staff-cards.html">Open Staff Cards →</a>
    </div>`;
}

function renderAlerts(students, waitlist, staff) {
    const body = document.getElementById('alertsBody');
    let html = '';
    let count = 0;

    // 0. ExceleRate 4B infant/toddler credential shortfall
    const itAlert = infantToddlerCredentialAlert(staff || []);
    if (itAlert) { count++; html += itAlert; }

    // 1. CCAP Eligible families
    const ccapEligible = students.filter(s => {
        if (!isTruthy(s.Active) || s.Category === 'CCAP' || s.Category === 'Foster') return false;
        const inc = parseInt(s.HouseholdIncome) || 0, hh = parseInt(s.HouseholdSize) || 0;
        if (!inc || !hh) return false;
        return inc <= CCAP_THRESHOLDS[Math.max(0, Math.min(hh-1, 7))];
    }).sort(sortByName);
    if (ccapEligible.length) {
        count++;
        html += `<div class="alert-item warning">
            <div class="alert-title">💰 ${ccapEligible.length} families may qualify for CCAP</div>
            <div class="alert-detail">Based on 225% FPL thresholds. These families are not currently on CCAP but their income qualifies them.</div>
            <table>
                <thead><tr><th>Student</th><th>Room</th><th>Income</th><th>HH</th><th>Threshold</th><th></th></tr></thead>
                <tbody>${ccapEligible.map(s => {
                    const idx = Math.max(0, Math.min((parseInt(s.HouseholdSize)||1)-1, 7));
                    return `<tr>
                        <td style="font-weight:600;">${s.First_Name} ${s.Last_Name}</td>
                        <td>${s.Room||''}</td>
                        <td><input type="number" value="${s.HouseholdIncome||''}" id="inc_${s.Id}" style="width:75px;padding:2px 4px;border:1px solid #d1d5db;border-radius:3px;font-size:0.78rem;text-align:right;"></td>
                        <td><input type="number" value="${s.HouseholdSize||''}" id="hh_${s.Id}" min="1" max="15" style="width:45px;padding:2px 4px;border:1px solid #d1d5db;border-radius:3px;font-size:0.78rem;text-align:center;"></td>
                        <td style="color:#16a34a;font-weight:600;">$${CCAP_THRESHOLDS[idx].toLocaleString()}</td>
                        <td><button onclick="saveAlertIncome('${s.First_Name}','${s.Last_Name}','${s.Id}')" style="padding:3px 8px;background:#2563eb;color:white;border:none;border-radius:3px;font-size:0.68rem;font-weight:600;cursor:pointer;">Save</button></td>
                    </tr>`;
                }).join('')}</tbody>
            </table>
            <a class="alert-action" href="/staff/ccap.html">Open CCAP Report →</a>
        </div>`;
    }

    // 2. CCAP Renewals due / missing start date
    const ccapStudents = students.filter(s => isTruthy(s.Active) && s.Category === 'CCAP');
    const ccapDue = ccapStudents.filter(s => {
        if (!s.CCAPStartDate) return true;
        const start = new Date(s.CCAPStartDate);
        const renewal = new Date(start); renewal.setMonth(renewal.getMonth() + 12);
        return (renewal - new Date()) / (1000*60*60*24) <= 60;
    }).sort(sortByName);
    if (ccapDue.length) {
        count++;
        html += `<div class="alert-item warning">
            <div class="alert-title">🔄 ${ccapDue.length} CCAP renewal(s) due or missing start date</div>
            <div class="alert-detail">${ccapDue.map(s => {
                if (!s.CCAPStartDate) return s.First_Name + ' ' + s.Last_Name + ' (no start date)';
                const start = new Date(s.CCAPStartDate); const renewal = new Date(start); renewal.setMonth(renewal.getMonth()+12);
                const days = Math.ceil((renewal - new Date())/(1000*60*60*24));
                return s.First_Name + ' ' + s.Last_Name + ' (' + (days<=0?'OVERDUE':days+' days') + ')';
            }).join(', ')}</div>
            <a class="alert-action" href="/staff/ccap.html">Open CCAP Report →</a>
        </div>`;
    }

    // 3. Waiting list pending
    const wlPending = waitlist.filter(r => (!r.WaitlistStatus || r.WaitlistStatus === 'Pending' || r.WaitlistStatus === 'NULL') && r.WaitlistStatus !== 'Declined' && r.WaitlistStatus !== 'Enrolled');
    if (wlPending.length) {
        count++;
        html += `<div class="alert-item info">
            <div class="alert-title">📝 ${wlPending.length} children pending on the waiting list</div>
            <div class="alert-detail">New pre-enrollment submissions waiting to be reviewed and processed.</div>
            <a class="alert-action" href="/staff/waitinglist.html">Open Waiting List →</a>
        </div>`;
    }

    // 4. Missing income/HH data for PFA/PI students
    const missingIncome = students.filter(s => isTruthy(s.Active) && (s.PFA_PI_na === 'PFA' || s.PFA_PI_na === 'PI') && (!s.HouseholdIncome || !s.HouseholdSize)).sort(sortByName);
    if (missingIncome.length) {
        count++;
        html += `<div class="alert-item error">
            <div class="alert-title">⚠️ ${missingIncome.length} PFA/PI students missing income data</div>
            <div class="alert-detail">${missingIncome.map(s => s.First_Name + ' ' + s.Last_Name).join(', ')}</div>
            <a class="alert-action" href="/staff/benefits.html">Open Benefits Roster →</a>
        </div>`;
    }

    if (!html) {
        html = '<div class="empty-state"><div class="icon">✅</div><p style="font-size:1rem;font-weight:600;color:#16a34a;">All clear — no alerts right now</p></div>';
    }

    document.getElementById('alertCount').textContent = count ? count + ' active alert' + (count>1?'s':'') : 'No alerts';
    body.innerHTML = html;
}

async function saveAlertIncome(firstName, lastName, id) {
    const income = document.getElementById('inc_' + id).value;
    const hh = document.getElementById('hh_' + id).value;
    try {
        const res = await apiFetch('/api/students/' + encodeURIComponent(firstName) + '/' + encodeURIComponent(lastName), {
            method: 'PUT',
            body: JSON.stringify({ householdIncome: income, householdSize: hh })
        });
        const data = await res.json();
        if (data.success) {
            const btn = event.target;
            btn.textContent = '✓ Saved';
            btn.style.background = '#16a34a';
            setTimeout(() => { btn.textContent = 'Save'; btn.style.background = '#2563eb'; }, 2000);
        }
    } catch(e) { alert('Failed to save'); }
}

init();
</script>
</body>
</html>
