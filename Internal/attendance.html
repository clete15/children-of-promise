<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actual Attendance – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; }
        /* Left-aligned, but inset 15% from the left to match the sub-nav links above. */
        .at-layout { display:flex;align-items:flex-start;justify-content:flex-start;padding:20px 20px 20px 15%; }
        .at-wrapper { display:flex;max-height:calc(100vh - 130px);width:100%;max-width:1320px;box-shadow:0 4px 24px rgba(0,0,0,0.12);border-radius:12px; }
        .at-sidebar { width:200px;flex-shrink:0;background:var(--sp-surface-2);border:1px solid var(--sp-border);border-right:none;overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .at-sidebar button {
            display:block;width:100%;text-align:left;padding:11px 16px;border:none;cursor:pointer;
            background:transparent;font-size:0.86rem;font-weight:700;color:var(--sp-text);
            border-left:3px solid transparent;transition:background 0.15s;
        }
        .at-sidebar button:hover:not(.on) { background:var(--sp-surface); }
        .at-sidebar button.on { background:var(--sp-accent-soft);border-left-color:var(--sp-accent);color:var(--sp-accent); }
        .at-room-cap { font-size:0.72rem;font-weight:600;color:var(--sp-muted);margin-top:2px; }
        .at-card { background:var(--sp-surface);border:1px solid var(--sp-border);flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;max-height:calc(100vh - 130px); }
        .at-head { padding:12px 20px;border-bottom:1px solid var(--sp-border); }
        .at-title { font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary); }
        .at-body { overflow-y:auto;flex:1;padding:20px 24px; }
        .at-room-name { font-size:1.05rem;font-weight:800;color:var(--sp-text);margin-bottom:16px;text-align:center; }
        .at-chart { display:flex;align-items:flex-end;gap:14px;padding:0 8px; }
        .at-col { display:flex;flex-direction:column;align-items:center;gap:8px;flex:1; }
        .at-count { font-size:0.9rem;font-weight:800;color:var(--sp-text); }
        .at-bar-track {
            position:relative;width:100%;background:var(--sp-bad-bg);border:1px solid var(--sp-bad-br);
            border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;
        }
        .at-bar-fill { width:100%;background:var(--sp-accent);border-radius:6px 6px 0 0;transition:height 0.4s; }
        .at-over .at-bar-fill { background:var(--sp-bad-fg); }
        .at-day { font-size:0.84rem;font-weight:700;color:var(--sp-muted); }
        .at-legend { display:flex;gap:18px;margin-top:16px;justify-content:center;flex-wrap:wrap; }
        .at-legend > div { display:flex;align-items:center;gap:7px;font-size:0.8rem;color:var(--sp-text-2); }
        .at-swatch { width:15px;height:15px;border-radius:3px; }
        .at-empty { padding:40px;text-align:center;color:var(--sp-muted);font-size:0.9rem; }
        /* Actual / Projected toggle in the card header. */
        .at-toggle { display:inline-flex;border:1px solid var(--sp-border);border-radius:8px;overflow:hidden; }
        .at-tab {
            border:none;background:var(--sp-surface);color:var(--sp-text-2);cursor:pointer;
            font-size:0.78rem;font-weight:700;padding:6px 14px;transition:background 0.12s,color 0.12s;
        }
        .at-tab:hover:not(.on) { background:var(--sp-surface-2); }
        .at-tab.on { background:var(--sp-accent);color:#fff; }
        /* Projected-view extras (folded in from the old projected page). */
        .at-note { margin-top:14px;font-size:0.76rem;color:var(--sp-muted);text-align:center;line-height:1.5; }
        .at-over-flag { color:var(--sp-bad-fg);font-weight:800; }
        .at-count .at-over-n { color:var(--sp-bad-fg);font-weight:800; }
        /* ── Chart + roster comparison, side by side ──────────────────────────
           The day bars keep their width on the left; the two roster panels sit to the
           right and drop below on a narrow screen. */
        .at-split { display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap; }
        .at-split-chart { flex:0 0 340px;min-width:300px; }
        .at-rosters { flex:1 1 460px;min-width:320px;display:flex;gap:18px;flex-wrap:wrap; }

        /* Each roster is a self-contained card: header strip, scrollable table, footer. */
        .at-rcard {
            flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;
            background:var(--sp-surface);border:1px solid var(--sp-border);border-radius:12px;
            overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.04);
        }
        .at-rcard-head {
            display:flex;align-items:center;justify-content:space-between;gap:10px;
            padding:11px 14px;border-bottom:1px solid var(--sp-border);background:var(--sp-surface-2);
        }
        .at-rcard-title { font-size:0.82rem;font-weight:800;color:var(--sp-text);letter-spacing:0.01em; }
        .at-rcard-sub { font-size:0.68rem;font-weight:600;color:var(--sp-muted);margin-top:1px; }
        /* Capacity chip in the header: neutral when within capacity, red when a day is over. */
        .at-cap-chip {
            font-size:0.7rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;
            background:var(--sp-pill-bg,var(--sp-surface));color:var(--sp-muted);border:1px solid var(--sp-border);
        }
        .at-cap-chip.over { background:var(--sp-bad-bg);color:var(--sp-bad-fg);border-color:var(--sp-bad-br); }
        .at-cap-chip.ok   { background:var(--sp-good-bg);color:var(--sp-good-fg);border-color:var(--sp-good-br); }

        /* The scroll area so a long roster scrolls inside its own card, never the page. */
        .at-rscroll { overflow:auto;max-height:min(60vh,520px); }

        /* ── The table itself ── */
        .at-table { width:100%;border-collapse:separate;border-spacing:0;font-size:0.82rem; }
        .at-table thead th {
            position:sticky;top:0;z-index:1;background:var(--sp-surface-2);
            font-size:0.64rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;
            color:var(--sp-quiet);padding:8px 6px;border-bottom:1px solid var(--sp-border);
        }
        .at-table th.at-tc-name, .at-table td.at-tc-name { text-align:left;padding-left:14px; }
        .at-table th.at-tc-age,  .at-table td.at-tc-age  { text-align:right;padding-right:14px; }
        .at-table th.at-tc-day,  .at-table td.at-tc-day  { text-align:center;width:34px; }
        .at-table tbody td { padding:7px 6px;border-bottom:1px solid var(--sp-border); }
        .at-table tbody tr:last-child td { border-bottom:none; }
        .at-table tbody tr:nth-child(even) td { background:var(--sp-surface-2); }
        .at-table tbody tr:hover td { background:var(--sp-accent-soft); }
        .at-tc-name { font-weight:700;color:var(--sp-text);white-space:nowrap; }
        .at-tc-age { font-weight:600;color:var(--sp-muted);font-size:0.76rem;white-space:nowrap;font-variant-numeric:tabular-nums; }

        /* Weekday chip: a filled accent pill on days the child is in the room, a quiet
           hollow dot on days they are not — so the attendance pattern reads at a glance. */
        .at-chip {
            display:inline-flex;align-items:center;justify-content:center;
            width:24px;height:24px;border-radius:7px;font-size:0.66rem;font-weight:800;
        }
        .at-chip.on  { background:var(--sp-accent);color:#fff; }
        .at-chip.off { color:var(--sp-quiet); }
        .at-chip.off::after { content:'·';font-size:1rem;line-height:0; }

        /* Row accents: a child the projection moved IN (green left edge), or could not
           seat (red left edge + muted name). Kept to the name cell so the day chips stay
           legible rather than washing the whole row in colour. */
        .at-table tbody tr.at-moved-in td.at-tc-name { box-shadow:inset 3px 0 0 var(--sp-good-fg); color:var(--sp-good-fg); }
        .at-table tbody tr.at-overflow td.at-tc-name { box-shadow:inset 3px 0 0 var(--sp-bad-fg); color:var(--sp-bad-fg); }
        .at-table tbody tr.at-overflow td.at-tc-age::after { content:' · no seat';color:var(--sp-bad-fg);font-weight:700;font-size:0.66rem; }

        /* Totals footer — a distinct bar with per-day counts and the peak-vs-capacity. */
        .at-table tfoot td {
            position:sticky;bottom:0;background:var(--sp-surface-2);
            padding:9px 6px;border-top:2px solid var(--sp-border);
            font-weight:800;font-size:0.74rem;color:var(--sp-text);font-variant-numeric:tabular-nums;
        }
        .at-table tfoot td.at-tc-name { padding-left:14px;color:var(--sp-text-2);text-transform:uppercase;letter-spacing:0.03em;font-size:0.66rem; }
        .at-table tfoot td.at-tc-age  { padding-right:14px;text-align:right;color:var(--sp-muted);font-size:0.72rem; }
        .at-table tfoot td.at-dtot { text-align:center;color:var(--sp-text-2); }
        .at-table tfoot td.at-dtot.over { color:var(--sp-bad-fg); }

        .at-roster-empty { font-size:0.82rem;color:var(--sp-muted);padding:20px 14px;text-align:center; }
    </style>
</head>

<!-- Shared Enrollment Management sub-nav (see ems.html for the note). -->

<div class="at-layout">

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
/* Attendance by room — one page, two views the header toggle switches between:

     Actual    — enrolled children only. Data: /api/reports -> byRoomDaily. Each row is
                 [roomName, capacity, Mon..Fri] of daily counts from each enrolled child's
                 attending days.
     Projected — enrolled + the whole waiting list, re-seated youngest-first up the age
                 ladder. Data: /api/reports -> projectedAttendance, one row PER ROOM:
                 { roomNumber, room, capacity, occupancy:[Mon..Fri], overflow:[5] }.

   These were two separate pages (attendance.html / attendance-projected.html); they are
   merged here so the sub-nav has a single Attendance entry. Each view loads its own report
   section lazily the first time it is shown, then is cached for instant re-toggling. The
   sidebar and chart are shared; only the per-row shape and the legend/notes differ. */

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const CHART_H = 220;

let view = 'actual';                 // 'actual' | 'projected'
let activeRoom = 0;
const cache = { actual: null, projected: null };   // null = not yet loaded

function esc(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function n(v) { return parseInt(v, 10) || 0; }

/* Age as "Ny Mm Dd" from a birth date (preferred) or a fallback age-in-days. The roster
   compares actual vs projected ages, so the day precision matters — two children a few
   days apart can land either side of a capacity cutoff. */
function fmtAge(birthDate, ageDays) {
    const bd = String(birthDate || '').trim();
    let from = null;
    if (bd) { const t = Date.parse(bd); if (!isNaN(t)) from = new Date(t); }
    if (!from) {
        const d = parseInt(ageDays, 10);
        if (isNaN(d) || d < 0) return '—';
        from = new Date(Date.now() - d * 86400000);
    }
    const now = new Date();
    let years = now.getFullYear() - from.getFullYear();
    let months = now.getMonth() - from.getMonth();
    let days = now.getDate() - from.getDate();
    if (days < 0) {
        // Borrow days from the previous month (its own day count).
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonth; months--;
    }
    if (months < 0) { months += 12; years--; }
    if (years < 0) return '—';
    return years + 'y ' + months + 'm ' + days + 'd';
}

/* Normalise both report shapes to one internal per-room row so the sidebar and chart
   render identically regardless of view:
     { room, capacity, counts:[5], overflow:[5], roster:[...] } (overflow all-zero for actual) */
function actualRows(byRoomDaily, actualRoster) {
    // Match the per-room roster to each row by room name (both are in the same room order).
    const rosterByRoom = {};
    (actualRoster || []).forEach(r => { rosterByRoom[r.room] = r.roster || []; });
    // Columns: [Room, Capacity, Mon..Fri, Type, PfaPi]. Type/PfaPi drive the PI/PFA badge.
    return (byRoomDaily || []).map(r => ({
        room: r[0] || 'Unknown',
        capacity: parseInt(r[1]),                       // may be NaN — shown as '?'
        counts: [2, 3, 4, 5, 6].map(c => n(r[c])),
        overflow: [0, 0, 0, 0, 0],
        type: (r[7] || '').toString().trim().toUpperCase(),   // PI | PFA | INCCRA | (blank)
        pfaPi: n(r[8]),                                        // active PI/PFA kids in the room
        roster: rosterByRoom[r[0]] || [],
    }));
}
function projectedRows(projectedAttendance) {
    return (projectedAttendance || []).map(r => {
        // pfaPi is a per-day array of PI/PFA children seated in this room by the projection;
        // take the weekly peak, matching how the enrolled count is read in the actual view.
        const pfaPiDays = (r.pfaPi || [0, 0, 0, 0, 0]).map(n);
        return {
            room: r.room || 'Unknown',
            capacity: n(r.capacity),
            counts: (r.occupancy || []).map(n),
            overflow: (r.overflow || [0, 0, 0, 0, 0]).map(n),
            type: (r.type || '').toString().trim().toUpperCase(),
            pfaPi: Math.max(0, ...pfaPiDays),
            roster: r.roster || [],
        };
    });
}

function rows() { return cache[view] || []; }

/* The PI/PFA badge label for a room, named by the CHILDREN it holds (from the roster),
   not the room's own program. All the PI/PFA children PI -> "PI", all PFA -> "PFA", a mix
   (or unknown, e.g. roster not loaded) -> "PI/PFA". This is what makes an INCCRA room
   holding 3 PI children read "3 PI". */
function pfaPiLabel(r) {
    const progs = new Set();
    (r.roster || []).forEach(c => { if (c.program === 'PI' || c.program === 'PFA') progs.add(c.program); });
    if (progs.size === 1) return progs.values().next().value;   // all one program
    if (progs.size >= 2) return 'PI/PFA';                        // genuinely mixed
    // No per-child program available: fall back to the room's own program when it is PI/PFA.
    return (r.type === 'PI' || r.type === 'PFA') ? r.type : 'PI/PFA';
}

function renderSidebar() {
    const box = document.getElementById('atSidebar');
    box.innerHTML = rows().map((r, i) => {
        const cap = isNaN(r.capacity) ? '?' : r.capacity;
        // Peak across the week is the closest read on how many children the room holds,
        // since every child attends at least one day.
        const enrolled = Math.max(0, ...r.counts);
        const over = Math.max(0, ...r.overflow);
        const note = view === 'projected'
            ? `Capacity ${cap}${over ? ' · ' + over + ' over' : ''}`
            : `Capacity ${cap} &middot; ${enrolled} enrolled`;
        // Program count line, in BOTH views. Green when the room itself is a PI or PFA room
        // (those children belong there); red otherwise (INCCRA / n/a), flagging PI/PFA
        // children in a room that isn't theirs. The LABEL names what the CHILDREN are, read
        // from the roster: all PI -> "3 PI", all PFA -> "3 PFA", a mix -> "3 PI/PFA". So the
        // Toddlers room (INCCRA) holding 3 PI children reads "3 PI", not "3 PI/PFA".
        let badge = '';
        if (r.pfaPi > 0) {
            const roomIsPfaPi = (r.type === 'PI' || r.type === 'PFA');
            const color = roomIsPfaPi ? 'var(--sp-good-fg, #16a34a)' : 'var(--sp-bad-fg, #dc2626)';
            const label = pfaPiLabel(r);
            badge = `<div class="at-room-cap" style="color:${color};font-weight:700;">${r.pfaPi} ${label}</div>`;
        }
        return `<button id="atRoom${i}" onclick="showRoom(${i})">
            <div>${esc(r.room)}</div>
            <div class="at-room-cap">${note}</div>
            ${badge}
        </button>`;
    }).join('');
}

function showRoom(idx) {
    activeRoom = idx;
    rows().forEach((_, i) => {
        const btn = document.getElementById('atRoom' + i);
        if (btn) btn.classList.toggle('on', i === idx);
    });

    const r = rows()[idx];
    if (!r) return;
    const room = r.room;
    const capacity = Math.max(isNaN(r.capacity) ? 1 : r.capacity, 1);
    let anyOver = false;

    const cols = DAYS.map((day, i) => {
        const count = r.counts[i] || 0;
        const over = r.overflow[i] || 0;
        // Actual: over is "count exceeds capacity". Projected: over is the ladder overflow.
        const isOver = view === 'projected' ? over > 0 : count > capacity;
        if (isOver) anyOver = true;
        const fillH = Math.round(Math.min(count / capacity, 1) * CHART_H);
        const countLabel = (view === 'projected' && over)
            ? `${count}/${capacity}<br><span class="at-over-n">+${over} over</span>`
            : `${count}/${capacity}`;
        return `<div class="at-col${isOver ? ' at-over' : ''}">
            <div class="at-count">${countLabel}</div>
            <div class="at-bar-track" style="height:${CHART_H}px;">
                <div class="at-bar-fill" style="height:${fillH}px;"></div>
            </div>
            <div class="at-day">${day}</div>
        </div>`;
    }).join('');

    const fillLabel = view === 'projected' ? 'Projected (youngest-first fill)' : 'Enrolled (actual)';
    const legend = `<div class="at-legend">
        <div><span class="at-swatch" style="background:var(--sp-bad-bg);border:1px solid var(--sp-bad-br);"></span> Capacity (${capacity})</div>
        <div><span class="at-swatch" style="background:var(--sp-accent);"></span> ${fillLabel}</div>
    </div>`;

    const note = (view === 'projected' && anyOver)
        ? '<div class="at-note"><span class="at-over-flag">Over capacity — the age ladder cannot seat everyone on the flagged days. This only shows on Pre-School, the last room; the overflow are the oldest children.</span></div>'
        : '';

    document.getElementById('atBody').innerHTML = `
        <div class="at-room-name">${esc(room)}</div>
        <div class="at-split">
            <div class="at-split-chart">
                <div class="at-chart" style="height:${CHART_H + 56}px;">${cols}</div>
                ${legend}${note}
            </div>
            ${rosterPanel(room)}
        </div>`;
}

/* Find a room's row (by name) in a given view's cached rows. */
function roomInView(which, roomName) {
    return (cache[which] || []).find(r => r.room === roomName) || null;
}

/* The side-by-side Actual vs Projected roster for one room, youngest-first, with the
   ages that make the fill test meaningful. A child only in the projected list is a
   "moved in"; a waiting-list child and an unseated (overflow) child are flagged too. */
function rosterPanel(roomName) {
    const actual = roomInView('actual', roomName);
    const projected = roomInView('projected', roomName);
    const actualList = (actual && actual.roster) || [];
    const projList = (projected && projected.roster) || [];

    // Names currently in this room (actual), so the projected table can flag new arrivals.
    const actualNames = new Set(actualList.map(c => c.name));

    const DAY_LETTERS = ['M', 'T', 'W', 'T', 'F'];
    // Per-weekday totals across a roster — how many children occupy the room each day.
    const perDay = list => {
        const t = [0, 0, 0, 0, 0];
        list.forEach(c => { const d = c.days || [1, 1, 1, 1, 1]; for (let i = 0; i < 5; i++) if (d[i]) t[i]++; });
        return t;
    };

    // One table row per child: name, a weekday chip per day (filled when present), and age.
    // Row accents only: green = moved in by the projection, red = couldn't be seated.
    const rowHtml = (c, opts) => {
        opts = opts || {};
        // "Moved in" = seated here in the projection but NOT in the actual roster of this room.
        const movedIn = opts.markNew && !opts.markNew.has(c.name);
        const cls = [];
        if (movedIn && !c.overflow) cls.push('at-moved-in');
        if (c.overflow) cls.push('at-overflow');
        const dayCells = (c.days || [1, 1, 1, 1, 1]).map((on, i) =>
            `<td class="at-tc-day"><span class="at-chip ${on ? 'on' : 'off'}">${on ? DAY_LETTERS[i] : ''}</span></td>`).join('');
        return `<tr class="${cls.join(' ')}">
            <td class="at-tc-name">${esc(c.name)}</td>
            ${dayCells}
            <td class="at-tc-age">${esc(fmtAge(c.birthDate, c.ageDays))}</td>
        </tr>`;
    };

    // A roster card: header (title + capacity chip), the scrollable table, totals footer.
    const card = (title, list, cap, present, missingMsg, opts) => {
        if (!present) return cardShell(title, '', '<div class="at-roster-empty">Loading…</div>');
        if (!list.length) return cardShell(title, '', '<div class="at-roster-empty">' + missingMsg + '</div>');
        const td = perDay(list);
        const peak = Math.max(0, ...td);
        const capNum = (typeof cap === 'number' && !isNaN(cap)) ? cap : null;
        const over = capNum != null && peak > capNum;
        // Capacity chip in the header: green within capacity, red when a day exceeds it.
        const chipCls = capNum == null ? '' : (over ? 'over' : 'ok');
        const chip = `<span class="at-cap-chip ${chipCls}">${peak}${capNum != null ? '/' + capNum : ''} peak</span>`;
        const sub = `${list.length} ${list.length === 1 ? 'child this week' : 'children this week'}`;
        const body = list.map(c => rowHtml(c, opts)).join('');
        const dayTotals = td.map(v => `<td class="at-dtot${capNum != null && v > capNum ? ' over' : ''}">${v}</td>`).join('');
        const table = `<div class="at-rscroll"><table class="at-table">
            <thead><tr><th class="at-tc-name">Child</th>
                <th class="at-tc-day">M</th><th class="at-tc-day">T</th><th class="at-tc-day">W</th><th class="at-tc-day">T</th><th class="at-tc-day">F</th>
                <th class="at-tc-age">Age</th></tr></thead>
            <tbody>${body}</tbody>
            <tfoot><tr>
                <td class="at-tc-name">Per day</td>
                ${dayTotals}
                <td class="at-tc-age">${list.length} total</td>
            </tr></tfoot>
        </table></div>`;
        return cardShell(title, chip, table, sub);
    };

    const cardShell = (title, chip, inner, sub) => `
        <div class="at-rcard">
            <div class="at-rcard-head">
                <div><div class="at-rcard-title">${title}</div>${sub ? '<div class="at-rcard-sub">' + sub + '</div>' : ''}</div>
                ${chip || ''}
            </div>
            ${inner}
        </div>`;

    // Show only the roster for the current view: Actual shows the Actual card alone;
    // Projected shows the Projected card (its row accents still compare against Actual).
    const cards = view === 'projected'
        ? card('Projected \u2014 youngest-first', projList, projected && projected.capacity, !!projected,
               'No children seated here.', { markNew: actualNames })
        : card('Actual \u2014 now', actualList, actual && actual.capacity, !!actual,
               'No children currently in this room.', {});

    return `<div class="at-rosters">${cards}</div>`;
}

/* Fetch a single view's data (cached per view). The actual view also pulls its per-room
   roster; the projected rooms already carry their roster. */
async function fetchView(which) {
    if (cache[which]) return;
    if (which === 'actual') {
        const res = await apiFetch('/api/reports?only=byRoomDaily,actualRoster');
        const data = await res.json();
        cache.actual = actualRows(data && data.byRoomDaily, data && data.actualRoster);
    } else {
        const res = await apiFetch('/api/reports?only=projectedAttendance');
        const data = await res.json();
        cache.projected = projectedRows(data && data.projectedAttendance);
    }
}

/* Load what the current view needs, then render. BOTH datasets are loaded because the
   roster panel always compares actual vs projected for the selected room — the user's
   whole point is seeing what changed. The non-active dataset failing is non-fatal: the
   bars still render, the missing side of the roster just shows a short note. */
async function loadView() {
    const body = document.getElementById('atBody');
    if (cache[view]) { ensureOther(); renderCurrent(); return; }
    body.innerHTML = '<div class="at-empty">Loading…</div>';
    document.getElementById('atSidebar').innerHTML = '';
    try {
        await fetchView(view);
    } catch (e) {
        body.innerHTML = '<div class="at-empty">Could not load attendance: ' + esc(e && e.message ? e.message : e) + '</div>';
        return;
    }
    renderCurrent();
    ensureOther();
}

/* Load the OTHER view's data in the background so the roster comparison has both sides,
   then re-render the open room so the second column fills in when it arrives. */
function ensureOther() {
    const other = view === 'actual' ? 'projected' : 'actual';
    if (cache[other]) return;
    fetchView(other).then(() => { if (rows().length) showRoom(activeRoom); }).catch(() => {});
}

function renderCurrent() {
    const list = rows();
    if (!list.length) {
        document.getElementById('atSidebar').innerHTML = '';
        document.getElementById('atBody').innerHTML = view === 'projected'
            ? '<div class="at-empty">No projection data yet. Add rooms and waiting-list entries first.</div>'
            : '<div class="at-empty">No attendance data yet.</div>';
        return;
    }
    if (activeRoom >= list.length) activeRoom = 0;
    renderSidebar();
    showRoom(activeRoom);
}

function setView(v) {
    if (v === view) return;
    view = v;
    activeRoom = 0;
    document.getElementById('atTitle').textContent =
        (v === 'projected' ? 'Projected' : 'Actual') + ' Attendance by Room';
    const actualTab = document.getElementById('atTabActual');
    const projTab = document.getElementById('atTabProjected');
    actualTab.classList.toggle('on', v === 'actual');
    actualTab.setAttribute('aria-selected', String(v === 'actual'));
    projTab.classList.toggle('on', v === 'projected');
    projTab.setAttribute('aria-selected', String(v === 'projected'));
    loadView();
}

// Allow a direct link to the projected view (e.g. the old projected page redirects here
// with #projected). Default is the actual view.
if ((location.hash || '').toLowerCase().indexOf('projected') !== -1) {
    setView('projected');
} else {
    loadView();
}
</script>
</body>
</html>
