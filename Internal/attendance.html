<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actual Attendance – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; }
        /* Left-aligned, but inset 15% from the left to match the sub-nav links above. */
        /* Card on the left, the waiting-list filter (projected view only) to its right. */
        .at-layout { display:flex;align-items:flex-start;justify-content:flex-start;gap:18px;padding:20px 20px 20px 15%;flex-wrap:wrap; }
        .at-wrapper { display:flex;max-height:calc(100vh - 130px);flex:1 1 auto;min-width:0;max-width:1320px;box-shadow:0 4px 24px rgba(0,0,0,0.12);border-radius:12px; }
        /* The filter container beside the card; empty (and hidden) outside the projected view. */
        #atFilter:empty { display:none; }
        #atFilter { flex:0 0 260px;max-width:300px; }
        .at-sidebar { width:200px;flex-shrink:0;background:var(--sp-surface-2);border:1px solid var(--sp-border);border-right:none;overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .at-sidebar button {
            display:block;width:100%;text-align:left;padding:11px 16px;border:none;cursor:pointer;
            background:transparent;font-size:0.86rem;font-weight:700;color:var(--sp-text);
            border-left:3px solid transparent;transition:background 0.15s;
        }
        .at-sidebar button:hover:not(.on) { background:var(--sp-surface); }
        .at-sidebar button.on { background:var(--sp-accent-soft);border-left-color:var(--sp-accent);color:var(--sp-accent); }
        .at-room-cap { font-size:0.72rem;font-weight:600;color:var(--sp-muted);margin-top:2px; }
        .at-card { background:var(--sp-surface);border:1px solid var(--sp-border);flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;max-height:calc(100vh - 130px); }
        .at-head { padding:12px 20px;border-bottom:1px solid var(--sp-border); }
        .at-title { font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary); }
        .at-body { overflow-y:auto;flex:1;padding:14px 18px; }
        .at-room-name { font-size:1.02rem;font-weight:800;color:var(--sp-text);margin-bottom:3px;text-align:center; }
        /* Age range under the room title (e.g. "0 - 20 M" for a combined set). */
        .at-room-age { font-size:0.76rem;font-weight:700;color:var(--sp-muted);text-align:center;margin-bottom:8px;letter-spacing:0.02em; }
        /* Combine toggle for a paired room — a small pill button, centred under the title. */
        .at-combine { text-align:center;margin-bottom:12px; }
        .at-combine-btn {
            border:1px solid var(--sp-accent);background:transparent;color:var(--sp-accent);
            font-size:0.72rem;font-weight:700;padding:4px 12px;border-radius:999px;cursor:pointer;
            transition:background 0.12s,color 0.12s;
        }
        .at-combine-btn:hover { background:var(--sp-accent-soft); }
        .at-combine-btn.on { background:var(--sp-accent);color:#fff; }
        .at-chart { display:flex;align-items:flex-end;gap:14px;padding:0 8px; }
        .at-col { display:flex;flex-direction:column;align-items:center;gap:8px;flex:1; }
        .at-count { font-size:0.9rem;font-weight:800;color:var(--sp-text); }
        .at-bar-track {
            position:relative;width:100%;background:var(--sp-bad-bg);border:1px solid var(--sp-bad-br);
            border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;
        }
        .at-bar-fill { width:100%;background:var(--sp-accent);border-radius:6px 6px 0 0;transition:height 0.4s; }
        .at-over .at-bar-fill { background:var(--sp-bad-fg); }
        .at-day { font-size:0.84rem;font-weight:700;color:var(--sp-muted); }
        .at-legend { display:flex;gap:18px;margin-top:16px;justify-content:center;flex-wrap:wrap; }
        .at-legend > div { display:flex;align-items:center;gap:7px;font-size:0.8rem;color:var(--sp-text-2); }
        .at-swatch { width:15px;height:15px;border-radius:3px; }
        .at-empty { padding:40px;text-align:center;color:var(--sp-muted);font-size:0.9rem; }
        /* Actual / Projected toggle in the card header. */
        .at-toggle { display:inline-flex;border:1px solid var(--sp-border);border-radius:8px;overflow:hidden; }
        .at-tab {
            border:none;background:var(--sp-surface);color:var(--sp-text-2);cursor:pointer;
            font-size:0.78rem;font-weight:700;padding:6px 14px;transition:background 0.12s,color 0.12s;
        }
        .at-tab:hover:not(.on) { background:var(--sp-surface-2); }
        .at-tab.on { background:var(--sp-accent);color:#fff; }
        /* Projected-view extras (folded in from the old projected page). */
        .at-note { margin-top:14px;font-size:0.76rem;color:var(--sp-muted);text-align:center;line-height:1.5; }
        .at-over-flag { color:var(--sp-bad-fg);font-weight:800; }
        .at-count .at-over-n { color:var(--sp-bad-fg);font-weight:800; }
        /* ── Chart + roster comparison, side by side ──────────────────────────
           The day bars keep their width on the left; the two roster panels sit to the
           right and drop below on a narrow screen. */
        .at-split { display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap; }
        .at-split-chart { flex:0 0 300px;min-width:280px; }
        .at-rosters-wrap { flex:1 1 480px;min-width:340px;display:flex;flex-direction:column;gap:10px;min-width:0; }
        .at-rosters { display:flex;gap:14px;flex-wrap:nowrap;min-width:0; }
        /* Key for the pink second-room mark on a combined pair. */
        .at-side-legend { font-size:0.74rem;color:var(--sp-muted);display:flex;align-items:center;gap:7px;padding:2px 2px 0; }
        .at-side-legend strong { color:var(--sp-text-2);font-weight:700; }

        /* Each roster is a self-contained card: header strip, scrollable table, footer. */
        .at-rcard {
            flex:1 1 0;min-width:0;display:flex;flex-direction:column;
            background:var(--sp-surface);border:1px solid var(--sp-border);border-radius:12px;
            overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.04);
        }
        .at-rcard-head {
            display:flex;align-items:center;justify-content:space-between;gap:10px;
            padding:11px 14px;border-bottom:1px solid var(--sp-border);background:var(--sp-surface-2);
        }
        .at-rcard-title { font-size:0.82rem;font-weight:800;color:var(--sp-text);letter-spacing:0.01em; }
        .at-rcard-sub { font-size:0.68rem;font-weight:600;color:var(--sp-muted);margin-top:1px; }
        /* Capacity chip in the header: neutral when within capacity, red when a day is over. */
        .at-cap-chip {
            font-size:0.7rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;
            background:var(--sp-pill-bg,var(--sp-surface));color:var(--sp-muted);border:1px solid var(--sp-border);
        }
        .at-cap-chip.over { background:var(--sp-bad-bg);color:var(--sp-bad-fg);border-color:var(--sp-bad-br); }
        .at-cap-chip.ok   { background:var(--sp-good-bg);color:var(--sp-good-fg);border-color:var(--sp-good-br); }

        /* No internal scroll — the whole roster is shown. */
        .at-rscroll { overflow:visible; }

        /* ── The roster table — compact and calm ── */
        /* table-layout:fixed + the day columns' fixed widths let the Child column absorb all
           the slack and TRUNCATE, so the five day columns always fit inside the card instead
           of pushing Friday off the right edge. */
        .at-table { width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:0.8rem; }
        .at-table thead th {
            background:var(--sp-surface-2);
            font-size:0.6rem;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;
            color:var(--sp-quiet);padding:7px 3px;border-bottom:1px solid var(--sp-border);
        }
        /* The weekday header is the key to reading the grid, so give it emphasis: an accent
           tint band and accent-coloured day letters set it apart from the Child column. */
        .at-table thead th.at-tc-day {
            background:var(--sp-accent-soft);color:var(--sp-accent);font-size:0.64rem;
            border-bottom:2px solid var(--sp-accent);
        }
        .at-table th.at-tc-name, .at-table td.at-tc-name { text-align:left;padding-left:10px;width:auto; }
        .at-table th.at-tc-day,  .at-table td.at-tc-day  { text-align:center;width:22px; }
        .at-table tbody td { padding:3px 2px;border-bottom:1px solid var(--sp-border);vertical-align:middle; }
        .at-table tbody tr:last-child td { border-bottom:none; }
        .at-table tbody tr:nth-child(even) td { background:var(--sp-surface-2); }
        .at-table tbody tr:hover td { background:var(--sp-accent-soft); }
        /* Blank spacer row (holds a slot where this column has no child, so the other column
           stays lined up). Neutral — no stripe, no hover highlight. */
        .at-table tbody tr.at-blank td,
        .at-table tbody tr.at-blank:hover td,
        .at-table tbody tr.at-blank:nth-child(even) td { background:transparent; }
        /* Name on top, age (y/m/d) beneath — frees the Age column entirely. */
        .at-tc-name { color:var(--sp-text);white-space:nowrap;line-height:1.2;overflow:hidden; }
        /* The name row: name truncates with an ellipsis if long, the PI/PFA tag stays put. */
        .at-tc-name .nm { font-weight:700;font-size:0.82rem;display:flex;align-items:center;gap:4px;min-width:0; }
        .at-tc-name .nm .nmtxt { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0; }
        /* PI / PFA tag beside a name: green = in a program room (belongs), red = PI/PFA child
           sitting in a non-program (INCCRA) room. */
        .at-prog { font-size:0.6rem;font-weight:800;letter-spacing:0.03em;padding:1px 5px;border-radius:999px;vertical-align:middle; }
        .at-prog.ok  { color:var(--sp-good-fg,#16a34a);background:var(--sp-good-bg,rgba(22,163,74,0.14));border:1px solid var(--sp-good-br,rgba(22,163,74,0.4)); }
        .at-prog.bad { color:var(--sp-bad-fg,#dc2626);background:var(--sp-bad-bg,rgba(220,38,38,0.12));border:1px solid var(--sp-bad-br,rgba(220,38,38,0.4)); }
        .at-tc-name .ag { font-weight:600;color:var(--sp-muted);font-size:0.68rem;margin-top:1px;font-variant-numeric:tabular-nums; }

        /* Weekday mark: a plain "1" on days the child is in the room, blank otherwise. */
        .at-on { font-weight:700;color:var(--sp-text);font-size:0.78rem; }
        /* In a combined pair, a child who spills into the SECOND room that day: light pink
           "1" so the director can see which side of the room they fall on. */
        .at-on.at-room2 { color:#ec4899;background:rgba(236,72,153,0.16);border-radius:4px;padding:0 5px; }

        /* Row accents: moved in (green left edge) / couldn't seat (red left edge). */
        .at-table tbody tr.at-moved-in td.at-tc-name { box-shadow:inset 3px 0 0 var(--sp-good-fg); }
        .at-table tbody tr.at-moved-in td.at-tc-name .nm { color:var(--sp-good-fg); }
        .at-table tbody tr.at-overflow td.at-tc-name { box-shadow:inset 3px 0 0 var(--sp-bad-fg); }
        .at-table tbody tr.at-overflow td.at-tc-name .nm { color:var(--sp-bad-fg); }
        .at-table tbody tr.at-overflow td.at-tc-name .ag::after { content:' · no seat';color:var(--sp-bad-fg);font-weight:700; }
        /* Actual card: a child who is NOT in the projection (dropped / not seated) — red name. */
        .at-table tbody tr.at-dropped td.at-tc-name .nm { color:var(--sp-bad-fg); }

        /* Totals footer — a strong rule across the top sets it apart, and the per-day
           counts are bold. The total is its own standout number. */
        .at-table tfoot td {
            background:var(--sp-surface-2);padding:6px 2px 7px;
            border-top:2px solid var(--sp-text-2);
            font-weight:800;font-size:0.82rem;color:var(--sp-text);font-variant-numeric:tabular-nums;text-align:center;
        }
        .at-table tfoot td.at-tc-name { padding-left:12px;text-align:left;color:var(--sp-text-2);text-transform:uppercase;letter-spacing:0.04em;font-size:0.64rem;font-weight:800; }
        .at-table tfoot td.at-dtot.over { color:var(--sp-bad-fg); }

        .at-roster-empty { font-size:0.82rem;color:var(--sp-muted);padding:20px 14px;text-align:center; }

        /* ── Waiting-list filter (beside the Projected card) ──────────────────
           Each waiting-list child: first name, target room, requested start date, and a
           checkbox. Ticking seats them in the projection. */
        .at-filter {
            display:flex;flex-direction:column;
            background:var(--sp-surface);border:1px solid var(--sp-border);border-radius:12px;overflow:hidden;
            box-shadow:0 1px 2px rgba(0,0,0,0.04);
        }
        .at-filter-head {
            display:flex;align-items:center;justify-content:space-between;gap:8px;
            padding:12px 14px;border-bottom:1px solid var(--sp-border);
            background:linear-gradient(var(--sp-surface-2),var(--sp-surface));
        }
        .at-filter-title { font-size:0.86rem;font-weight:800;color:var(--sp-text);letter-spacing:0.01em; }
        /* How many of the waiting list are currently seated, as a pill. */
        .at-filter-count {
            font-size:0.68rem;font-weight:800;color:var(--sp-accent);background:var(--sp-accent-soft);
            border:1px solid var(--sp-accent);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;
        }
        .at-filter-sub {
            font-size:0.68rem;color:var(--sp-muted);padding:8px 14px;
            border-bottom:1px solid var(--sp-border);display:flex;align-items:center;justify-content:space-between;gap:8px;
        }
        .at-filter-actions { display:inline-flex;gap:10px;flex-shrink:0; }
        .at-filter-reset {
            font-size:0.66rem;font-weight:800;color:var(--sp-accent);background:none;border:none;cursor:pointer;
            padding:2px 4px;white-space:nowrap;
        }
        .at-filter-reset:hover { text-decoration:underline; }
        .at-filter-list { list-style:none;margin:0;padding:6px;overflow-y:auto; }
        .at-filter-item {
            display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;cursor:pointer;
            transition:background 0.1s;
        }
        .at-filter-item:hover { background:var(--sp-accent-soft); }
        .at-filter-item input {
            margin:0;accent-color:var(--sp-accent);width:16px;height:16px;flex-shrink:0;cursor:pointer;
        }
        /* An unticked child recedes: struck name, dimmed meta — clearly "not in the projection". */
        .at-filter-item.off { opacity:0.6; }
        .at-filter-item.off .at-filter-name { text-decoration:line-through;color:var(--sp-quiet); }
        .at-filter-body { min-width:0;line-height:1.3; }
        .at-filter-nameline { display:flex;align-items:center;gap:6px;min-width:0; }
        .at-filter-name { font-size:0.84rem;font-weight:700;color:var(--sp-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0; }
        /* Waiting-list priority score, a small pill next to the name. */
        .at-filter-score {
            flex:0 0 auto;font-size:0.66rem;font-weight:800;color:var(--sp-accent);
            background:var(--sp-accent-soft);border:1px solid var(--sp-accent);border-radius:999px;
            padding:1px 7px;font-variant-numeric:tabular-nums;
        }
        .at-filter-meta { font-size:0.68rem;color:var(--sp-muted);margin-top:2px;display:flex;align-items:center;gap:6px;white-space:nowrap; }
        /* The target room reads as a quiet tag; the dot separates it from the start date. */
        .at-filter-room { font-weight:700;color:var(--sp-text-2); }
        .at-filter-dot { color:var(--sp-quiet); }
        .at-filter-empty { font-size:0.8rem;color:var(--sp-muted);padding:18px 14px;text-align:center; }
    </style>
</head>

<!-- Shared Enrollment Management sub-nav (see ems.html for the note). -->

<script>
/* Attendance by room — one page, two views the header toggle switches between:

     Actual    — enrolled children only. Data: /api/reports -> byRoomDaily. Each row is
                 [roomName, capacity, Mon..Fri] of daily counts from each enrolled child's
                 attending days.
     Projected — enrolled + the whole waiting list, re-seated youngest-first up the age
                 ladder. Data: /api/reports -> projectedAttendance, one row PER ROOM:
                 { roomNumber, room, capacity, occupancy:[Mon..Fri], overflow:[5] }.

   These were two separate pages (attendance.html / attendance-projected.html); they are
   merged here so the sub-nav has a single Attendance entry. Each view loads its own report
   section lazily the first time it is shown, then is cached for instant re-toggling. The
   sidebar and chart are shared; only the per-row shape and the legend/notes differ. */

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const CHART_H = 220;

let view = 'actual';                 // 'actual' | 'projected'
let activeRoom = 0;
// When the active room is in a paired set, whether to COMBINE the pair into one view. The
// director can see one room alone or both merged, toggled per selection. Off by default:
// clicking a room shows just that room.
let combined = false;
const cache = { actual: null, projected: null };   // null = not yet loaded
// The full waiting-list roster (stable, for the filter list) — fetched once.
// Each: { id:'w'+Id, name, birthDate, ageDays, days:[5], program }.
let waitlistAll = null;
// Waiting-list filter keys ('w'+Id) that are UNCHECKED — excluded from the projection.
const excludedIds = new Set();

/* Paired room SETS, matching the server's PROJ_LADDER_UNITS pairs ({1 Infant,
   2 Infants/Toddlers} and {4 Toddlers/2yr, 5 2 Year Olds}): the two rooms of a set share an
   age band and a child flexes between them. The director can view either room on its own OR
   combine the pair into one merged view (a "Combine" toggle in the room header). Keyed by
   normalised room NAME (both views carry the name; only projected carries a number). */
const ROOM_SETS = [
    ['Infant', 'Infants / Toddlers'],
    ['Toddlers / 2 Year Olds', '2 Year Olds'],
    // View-only combine (not a server seating pair): the director can look at 2 & 3 Year Olds
    // alongside Pre-School. Youngest-first order so the first room fills first in the split.
    ['2 & 3 Year Olds', 'Pre-School'],
];
// Normalise a room name for matching: lowercase, collapse runs of spaces/slashes to one space.
function roomKey(name) {
    return String(name || '').toLowerCase().replace(/[\s/]+/g, ' ').trim();
}
// Build a lookup: normalised room name -> the normalised names of its full set (self first),
// or null when the room is not in any set.
const ROOM_SET_BY_KEY = (() => {
    const m = {};
    ROOM_SETS.forEach(set => {
        const keys = set.map(roomKey);
        keys.forEach(k => { m[k] = keys; });
    });
    return m;
})();
/* The sidebar-row indices that make up the set the room at `idx` belongs to, in age-ladder
   (youngest-first) order, filtered to rooms that actually exist in this view. A room in no
   set returns just [idx]. Combining a set means merging these rooms into one view, so the
   order is the ladder order, not "the clicked room first". */
function setIndices(idx) {
    const list = rows();
    const r = list[idx];
    if (!r) return [idx];
    const setKeys = ROOM_SET_BY_KEY[roomKey(r.room)];
    if (!setKeys) return [idx];
    // Map each set member name to its row index in this view, kept in set (ladder) order.
    const byKey = {};
    list.forEach((row, i) => { byKey[roomKey(row.room)] = i; });
    const ordered = setKeys.map(k => byKey[k]).filter(i => i != null);
    return ordered.length ? ordered : [idx];
}

/* Each room's age range in MONTHS, mirroring dimClassrooms.AgeRange (see
   Internal/setup_classrooms.sql / rename_rooms_2026.sql — the authoritative source). Keyed
   by normalised room name. {lo,hi} are inclusive month bounds; the optional `text` is the
   preferred label when the room is shown ON ITS OWN (so Pre-School reads "3 - 5 yrs" rather
   than "36 - 60 M"). When rooms are COMBINED, the month bounds drive one spanning label. */
const ROOM_AGE_RANGE = {
    [roomKey('Infant')]:                  { lo: 0,  hi: 12 },
    [roomKey('Infants / Toddlers')]:      { lo: 8,  hi: 20 },
    [roomKey('Toddlers')]:                { lo: 15, hi: 24 },
    [roomKey('Toddlers / 2 Year Olds')]:  { lo: 18, hi: 36 },
    [roomKey('2 Year Olds')]:             { lo: 24, hi: 36 },
    [roomKey('2 & 3 Year Olds')]:         { lo: 24, hi: 48 },
    [roomKey('Pre-School')]:              { lo: 36, hi: 60, text: '3 - 5 yrs' },
    [roomKey('Before and Afterschool')]:  { lo: 60, hi: 144, text: '5 - 12 yrs' },
};
/* A display age range for one or more rooms.
   - ONE room: its own preferred label (text when set, else "N - M M").
   - COMBINED rooms: span the lowest low to the highest high across them. Expressed in YEARS
     ("P - Q yrs") when the top of the span reaches 3 years (36 months) — e.g. 2 & 3 Year Olds
     (24-48) + Pre-School (36-60) → "2 - 5 yrs" — otherwise in months ("N - M M"). */
function ageRangeLabel(roomNames) {
    const defs = roomNames.map(nm => ROOM_AGE_RANGE[roomKey(nm)]).filter(Boolean);
    if (!defs.length) return '';
    // Single room: honour its own preferred label.
    if (defs.length === 1) return defs[0].text || (defs[0].lo + ' - ' + defs[0].hi + ' M');
    const bounds = defs.filter(d => d.lo != null);
    if (!bounds.length) {
        const uniq = Array.from(new Set(defs.map(d => d.text).filter(Boolean)));
        return uniq.join(' / ');
    }
    const lo = Math.min.apply(null, bounds.map(d => d.lo));
    const hi = Math.max.apply(null, bounds.map(d => d.hi));
    // Reads better in years when the span is whole years and reaches 3 (e.g. 24-60 → "2 - 5
    // yrs"); otherwise months (so 18-36 stays "18 - 36 M" rather than an awkward "1.5 - 3 yrs").
    if (hi >= 36 && lo % 12 === 0 && hi % 12 === 0) {
        return (lo / 12) + ' - ' + (hi / 12) + ' yrs';
    }
    return lo + ' - ' + hi + ' M';
}

function esc(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function n(v) { return parseInt(v, 10) || 0; }

/* Age as "Ny Mm Dd" from a birth date (preferred) or a fallback age-in-days. The roster
   compares actual vs projected ages, so the day precision matters — two children a few
   days apart can land either side of a capacity cutoff. */
function fmtAge(birthDate, ageDays) {
    const bd = String(birthDate || '').trim();
    let from = null;
    if (bd) { const t = Date.parse(bd); if (!isNaN(t)) from = new Date(t); }
    if (!from) {
        const d = parseInt(ageDays, 10);
        if (isNaN(d) || d < 0) return 'unknown';
        from = new Date(Date.now() - d * 86400000);
    }
    const now = new Date();
    let years = now.getFullYear() - from.getFullYear();
    let months = now.getMonth() - from.getMonth();
    let days = now.getDate() - from.getDate();
    if (days < 0) {
        // Borrow days from the previous month (its own day count).
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonth; months--;
    }
    if (months < 0) { months += 12; years--; }
    if (years < 0) return 'unknown';
    return years + 'y ' + months + 'm ' + days + 'd';
}

/* "2026-01-19" -> "Jan 19, 2026". Blank/invalid -> "—". */
function fmtDate(s) {
    const t = Date.parse(String(s || '').trim());
    if (isNaN(t)) return '\u2014';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* Normalise both report shapes to one internal per-room row so the sidebar and chart
   render identically regardless of view:
     { room, capacity, counts:[5], overflow:[5], roster:[...] } (overflow all-zero for actual) */
function actualRows(byRoomDaily, actualRoster) {
    // Match the per-room roster to each row by room name (both are in the same room order).
    const rosterByRoom = {};
    (actualRoster || []).forEach(r => { rosterByRoom[r.room] = r.roster || []; });
    // Columns: [Room, Capacity, Mon..Fri, Type, PfaPi]. Type/PfaPi drive the PI/PFA badge.
    return (byRoomDaily || []).map(r => ({
        room: r[0] || 'Unknown',
        capacity: parseInt(r[1]),                       // may be NaN — shown as '?'
        counts: [2, 3, 4, 5, 6].map(c => n(r[c])),
        overflow: [0, 0, 0, 0, 0],
        type: (r[7] || '').toString().trim().toUpperCase(),   // PI | PFA | INCCRA | (blank)
        pfaPi: n(r[8]),                                        // active PI/PFA kids in the room
        roster: rosterByRoom[r[0]] || [],
    }));
}
function projectedRows(projectedAttendance) {
    return (projectedAttendance || []).map(r => {
        // pfaPi is a per-day array of PI/PFA children seated in this room by the projection;
        // take the weekly peak, matching how the enrolled count is read in the actual view.
        const pfaPiDays = (r.pfaPi || [0, 0, 0, 0, 0]).map(n);
        return {
            room: r.room || 'Unknown',
            capacity: n(r.capacity),
            counts: (r.occupancy || []).map(n),
            overflow: (r.overflow || [0, 0, 0, 0, 0]).map(n),
            type: (r.type || '').toString().trim().toUpperCase(),
            pfaPi: Math.max(0, ...pfaPiDays),
            roster: r.roster || [],
        };
    });
}

function rows() { return cache[view] || []; }

/* The PI/PFA badge label for a room, named by the CHILDREN it holds (from the roster),
   not the room's own program. All the PI/PFA children PI -> "PI", all PFA -> "PFA", a mix
   (or unknown, e.g. roster not loaded) -> "PI/PFA". This is what makes an INCCRA room
   holding 3 PI children read "3 PI". */
function pfaPiLabel(r) {
    const progs = new Set();
    (r.roster || []).forEach(c => { if (c.program === 'PI' || c.program === 'PFA') progs.add(c.program); });
    if (progs.size === 1) return progs.values().next().value;   // all one program
    if (progs.size >= 2) return 'PI/PFA';                        // genuinely mixed
    // No per-child program available: fall back to the room's own program when it is PI/PFA.
    return (r.type === 'PI' || r.type === 'PFA') ? r.type : 'PI/PFA';
}

function renderSidebar() {
    const box = document.getElementById('atSidebar');
    box.innerHTML = rows().map((r, i) => {
        const cap = isNaN(r.capacity) ? '?' : r.capacity;
        // Peak across the week is the closest read on how many children the room holds,
        // since every child attends at least one day.
        const enrolled = Math.max(0, ...r.counts);
        const over = Math.max(0, ...r.overflow);
        const note = view === 'projected'
            ? `Capacity ${cap}${over ? ' · ' + over + ' over' : ''}`
            : `Capacity ${cap} &middot; ${enrolled} enrolled`;
        // Program count line, in BOTH views. Green when the room itself is a PI or PFA room
        // (those children belong there); red otherwise (INCCRA / n/a), flagging PI/PFA
        // children in a room that isn't theirs. The LABEL names what the CHILDREN are, read
        // from the roster: all PI -> "3 PI", all PFA -> "3 PFA", a mix -> "3 PI/PFA". So the
        // Toddlers room (INCCRA) holding 3 PI children reads "3 PI", not "3 PI/PFA".
        let badge = '';
        if (r.pfaPi > 0) {
            const roomIsPfaPi = (r.type === 'PI' || r.type === 'PFA');
            const color = roomIsPfaPi ? 'var(--sp-good-fg, #16a34a)' : 'var(--sp-bad-fg, #dc2626)';
            const label = pfaPiLabel(r);
            badge = `<div class="at-room-cap" style="color:${color};font-weight:700;">${r.pfaPi} ${label}</div>`;
        }
        return `<button id="atRoom${i}" onclick="showRoom(${i})">
            <div>${esc(r.room)}</div>
            <div class="at-room-cap">${note}</div>
            ${badge}
        </button>`;
    }).join('');
}

/* Whether the room at `idx` belongs to a paired set (so a Combine toggle makes sense). */
function isPairedRoom(idx) {
    const r = rows()[idx];
    return !!(r && ROOM_SET_BY_KEY[roomKey(r.room)]);
}

function showRoom(idx, keepCombined) {
    // Changing to a room that isn't in the SAME set as before resets the combine toggle, so a
    // fresh selection starts single. Staying within the set (or an explicit keep) preserves it.
    const prevSet = new Set(isPairedRoom(activeRoom) ? setIndices(activeRoom) : [activeRoom]);
    activeRoom = idx;
    if (!keepCombined && !prevSet.has(idx)) combined = false;
    if (!isPairedRoom(idx)) combined = false;   // a singleton can never be combined

    // Which rows this view shows: the whole set when combined, else just the clicked room.
    const group = (combined && isPairedRoom(idx)) ? setIndices(idx) : [idx];
    const groupSet = new Set(group);
    rows().forEach((_, i) => {
        const btn = document.getElementById('atRoom' + i);
        if (btn) btn.classList.toggle('on', groupSet.has(i));
    });

    const html = roomBlock(group);
    if (!html) return;
    document.getElementById('atBody').innerHTML = html;
}

/* Flip the combine toggle for the active paired set and re-render. */
function toggleCombine() {
    combined = !combined;
    showRoom(activeRoom, true);
}

/* Heading (+ age range) + chart + roster panel for a selected unit. `idxs` is the row
   indices of the one room, or of a whole set to COMBINE: per-day counts/overflow are
   summed, capacities added, the title joins the room names, and the roster spans every
   room. Returns '' if no row is present. */
function roomBlock(idxs) {
    const list = rows();
    const sel = idxs.map(i => list[i]).filter(Boolean);
    if (!sel.length) return '';

    const roomNames = sel.map(r => r.room);
    const title = roomNames.join(' + ');
    const capacity = Math.max(sel.reduce((s, r) => s + (isNaN(r.capacity) ? 0 : r.capacity), 0), 1);
    // Combined per-day occupancy + overflow across every room in the set.
    const counts = [0, 0, 0, 0, 0], overflow = [0, 0, 0, 0, 0];
    sel.forEach(r => { for (let d = 0; d < 5; d++) { counts[d] += (r.counts[d] || 0); overflow[d] += (r.overflow[d] || 0); } });

    let anyOver = false;
    const cols = DAYS.map((day, i) => {
        const count = counts[i] || 0;
        const over = overflow[i] || 0;
        // Actual: over is "count exceeds capacity". Projected: over is the ladder overflow.
        const isOver = view === 'projected' ? over > 0 : count > capacity;
        if (isOver) anyOver = true;
        const fillH = Math.round(Math.min(count / capacity, 1) * CHART_H);
        const countLabel = (view === 'projected' && over)
            ? `${count}/${capacity}<br><span class="at-over-n">+${over} over</span>`
            : `${count}/${capacity}`;
        return `<div class="at-col${isOver ? ' at-over' : ''}">
            <div class="at-count">${countLabel}</div>
            <div class="at-bar-track" style="height:${CHART_H}px;">
                <div class="at-bar-fill" style="height:${fillH}px;"></div>
            </div>
            <div class="at-day">${day}</div>
        </div>`;
    }).join('');

    const fillLabel = view === 'projected' ? 'Projected (youngest-first fill)' : 'Enrolled (actual)';
    const legend = `<div class="at-legend">
        <div><span class="at-swatch" style="background:var(--sp-bad-bg);border:1px solid var(--sp-bad-br);"></span> Capacity (${capacity})</div>
        <div><span class="at-swatch" style="background:var(--sp-accent);"></span> ${fillLabel}</div>
    </div>`;

    const note = (view === 'projected' && anyOver)
        ? '<div class="at-note"><span class="at-over-flag">Over capacity — the age ladder cannot seat everyone on the flagged days. This only shows on Pre-School, the last room; the overflow are the oldest children.</span></div>'
        : '';

    const ageRange = ageRangeLabel(roomNames);
    const ageLine = ageRange ? `<div class="at-room-age">${esc(ageRange)}</div>` : '';

    // Combine toggle — only for a paired room. "Combine with X" when viewing one room alone;
    // "Show separately" when the pair is merged. Clicking flips `combined` and re-renders.
    let combineToggle = '';
    if (isPairedRoom(activeRoom)) {
        const setIdx = setIndices(activeRoom);
        const partnerName = setIdx.map(i => (list[i] || {}).room).filter(nm => nm && roomKey(nm) !== roomKey(list[activeRoom].room))[0];
        const label = combined ? 'Show separately' : ('Combine with ' + (partnerName || 'pair'));
        combineToggle = `<div class="at-combine"><button type="button" class="at-combine-btn${combined ? ' on' : ''}" onclick="toggleCombine()">${esc(label)}</button></div>`;
    }

    return `
        <div class="at-room-name">${esc(title)}</div>
        ${ageLine}
        ${combineToggle}
        <div class="at-split">
            <div class="at-split-chart">
                <div class="at-chart" style="height:${CHART_H + 56}px;">${cols}</div>
                ${legend}${note}
            </div>
            ${rosterPanel(roomNames)}
        </div>`;
}

/* Find a room's row (by name) in a given view's cached rows. */
function roomInView(which, roomName) {
    return (cache[which] || []).find(r => r.room === roomName) || null;
}

/* The side-by-side Actual vs Projected roster for one room OR a combined set, youngest-first,
   with the ages that make the fill test meaningful. A child only in the projected list is a
   "moved in"; a waiting-list child and an unseated (overflow) child are flagged too.
   `roomNames` is one room, or every room of a set to merge — the rosters and capacities are
   unioned so a combined set reads as one list. */
function rosterPanel(roomNames) {
    if (typeof roomNames === 'string') roomNames = [roomNames];
    const actuals = roomNames.map(nm => roomInView('actual', nm)).filter(Boolean);
    const projecteds = roomNames.map(nm => roomInView('projected', nm)).filter(Boolean);
    const actual = actuals.length ? { capacity: actuals.reduce((s, r) => s + (r.capacity || 0), 0) } : null;
    const projected = projecteds.length ? { capacity: projecteds.reduce((s, r) => s + (r.capacity || 0), 0) } : null;
    // Union each side's children across the rooms, then sort youngest-first (as each room's
    // own roster already is), so the merged list reads like a single room's. Stamp each child
    // with its SOURCE ROOM's program type so a PI/PFA tag can be coloured by whether the child
    // sits in a program room (green = belongs) or not (red = PI/PFA child in an INCCRA room).
    //
    // A child who FLEXES between the two rooms of a combined pair is seated by the server as
    // TWO roster entries — one per room, each carrying only the days spent in THAT room. Left
    // un-merged they double the child up and each shows partial days, so the Projected count
    // disagrees with Actual (the bug Stella/Lei'Lani showed). Merge entries for the same child
    // into one, OR-ing their day arrays so the child's FULL week of attendance shows once; the
    // client's own per-day room split still colours which side each day falls on.
    const byAge = (a, b) => (a.ageDays || 0) - (b.ageDays || 0);
    const identKey = c => (c && c.id) ? ('id' + c.id) : ('nm' + String((c && c.name) || '').toLowerCase().trim());
    const flattenWithRoomType = rooms => {
        const order = [];           // keys in first-seen order
        const merged = {};          // key -> combined child
        rooms.forEach(r => {
            const roomType = (r.type || '').toString().trim().toUpperCase();
            (r.roster || []).forEach(c => {
                const k = identKey(c);
                if (!merged[k]) {
                    order.push(k);
                    merged[k] = Object.assign({ roomType: roomType }, c, { days: (c.days || [1, 1, 1, 1, 1]).slice() });
                } else {
                    const m = merged[k];
                    const d = c.days || [1, 1, 1, 1, 1];
                    for (let i = 0; i < 5; i++) if (d[i]) m.days[i] = 1;   // OR the attending days
                    m.overflow = m.overflow || !!c.overflow;
                    m.movedUnit = m.movedUnit || !!c.movedUnit;
                    // Prefer a PROGRAM room's type so the PI/PFA tag reads "in a program room".
                    if (roomType === 'PI' || roomType === 'PFA') m.roomType = roomType;
                }
            });
        });
        return order.map(k => merged[k]);
    };
    const actualList = flattenWithRoomType(actuals).sort(byAge);
    const projList = flattenWithRoomType(projecteds).sort(byAge);

    // Per-weekday totals across a roster — how many children occupy the room each day.
    const perDay = list => {
        const t = [0, 0, 0, 0, 0];
        list.forEach(c => { const d = c.days || [1, 1, 1, 1, 1]; for (let i = 0; i < 5; i++) if (d[i]) t[i]++; });
        return t;
    };

    // One table row per child: a two-line name cell (name over age y/m/d) then a weekday
    // chip per day. Row accents: green = moved in by the projection, red = couldn't seat.
    const rowHtml = (c, opts) => {
        opts = opts || {};
        // Green only for a genuine cross-UNIT move the server flagged — shifting between the
        // two rooms of a paired set is NOT a move and must not highlight. (opts.markGreen
        // gates this to the projected card only.)
        const movedIn = opts.markGreen && c.movedUnit;
        const cls = [];
        if (movedIn && !c.overflow) cls.push('at-moved-in');
        if (c.overflow) cls.push('at-overflow');
        // Actual card only: a child in Actual but NOT in Projected (opts.projKeys is the set
        // of projected children) — the projection didn't seat them. Flag the name red.
        if (opts.projKeys && !opts.projKeys.has(childKey(c))) cls.push('at-dropped');
        // In a COMBINED set, each attending child falls into the first OR second room of the
        // pair on a given day (fill the first room to capacity, then the next). `side[d]` is
        // 2 when this child spills into the SECOND room that day — mark its "1" light pink.
        const side = (opts.sideByKey && opts.sideByKey[childKey(c)]) || null;
        const dayCells = (c.days || [1, 1, 1, 1, 1]).map((on, d) => {
            if (!on) return '<td class="at-tc-day"></td>';
            const second = side && side[d] === 2;
            return `<td class="at-tc-day"><span class="at-on${second ? ' at-room2' : ''}">1</span></td>`;
        }).join('');
        // PI / PFA tag next to the name. GREEN when the child sits in a program room of their
        // kind (they belong there); RED when they're a PI/PFA child in a non-program room
        // (INCCRA / n/a) — the mismatch worth flagging.
        const prog = (c.program || '').toString().trim().toUpperCase();
        let tag = '';
        if (prog === 'PI' || prog === 'PFA') {
            const inProgramRoom = (c.roomType === 'PI' || c.roomType === 'PFA');
            tag = ` <span class="at-prog ${inProgramRoom ? 'ok' : 'bad'}">${prog}</span>`;
        }
        return `<tr class="${cls.join(' ')}">
            <td class="at-tc-name"><div class="nm"><span class="nmtxt">${esc(c.name)}</span>${tag}</div><div class="ag">${esc(fmtAge(c.birthDate, c.ageDays))}</div></td>
            ${dayCells}
        </tr>`;
    };

    // A child's identity across the two lists: the DB Id when present, else the name. Lets
    // us tell "the same child, in both columns" from "two different children".
    const childKey = c => (c && c.id) ? ('id' + c.id) : ('nm' + String((c && c.name) || '').toLowerCase().trim());
    // A spacer row that occupies the same height as a real one, so the OTHER column's child
    // on this slot stays lined up. Empty name + five empty day cells.
    const blankRow = () => `<tr class="at-blank"><td class="at-tc-name"><div class="nm">&nbsp;</div><div class="ag">&nbsp;</div></td><td></td><td></td><td></td><td></td><td></td></tr>`;

    /* Merge the two rosters into aligned SLOTS. Each slot is { a, p } (either may be null).

       Rule (settled): MATCHED children — those in BOTH columns — come first, each on its own
       aligned row, youngest-first. The one-sided children then go at the BOTTOM, zipped side
       by side: actual-only[i] shares a row with projected-only[i]. A blank spacer appears
       ONLY at the very bottom, where one side has more leftover children than the other —
       never above a filled row.

       This keeps every match lined up (an extra projected child like a waiting-list move-in
       drops to the bottom instead of shoving a blank in front of the matches), while two
       genuinely different leftover children still pair up on one row rather than each taking
       a row of its own. Pairing is by identity (childKey). */
    const alignedSlots = (aList, pList) => {
        const inA = {}; aList.forEach(a => { inA[childKey(a)] = true; });
        const inP = {}; pList.forEach(p => { inP[childKey(p)] = true; });

        const matched = [], actualOnly = [], projectedOnly = [];
        aList.forEach(a => { (inP[childKey(a)] ? matched : actualOnly).push(a); });
        pList.forEach(p => { if (!inA[childKey(p)]) projectedOnly.push(p); });

        const slots = [];
        // Matched block — the projected twin shares the row (same child, both columns).
        const pByKey = {}; pList.forEach(p => { pByKey[childKey(p)] = p; });
        matched.forEach(a => slots.push({ a, p: pByKey[childKey(a)] || a }));
        // One-sided tail at the bottom, zipped; blank fills whichever side runs out first.
        const tail = Math.max(actualOnly.length, projectedOnly.length);
        for (let i = 0; i < tail; i++) slots.push({ a: actualOnly[i] || null, p: projectedOnly[i] || null });
        return slots;
    };

    // Body for one side of an aligned pair of tables: render the slot's child for `side`
    // ('a' or 'p'), or a blank spacer where this side has no child on that slot.
    const alignedBody = (slots, side, opts) =>
        slots.map(s => s[side] ? rowHtml(s[side], opts) : blankRow()).join('');

    const card = (title, list, cap, present, missingMsg, opts, bodyOverride) => {
        if (!present) return cardShell(title, '', '<div class="at-roster-empty">Loading…</div>');
        if (!list.length) return cardShell(title, '', '<div class="at-roster-empty">' + missingMsg + '</div>');
        const td = perDay(list);
        const peak = Math.max(0, ...td);
        const capNum = (typeof cap === 'number' && !isNaN(cap)) ? cap : null;
        const over = capNum != null && peak > capNum;
        const chipCls = capNum == null ? '' : (over ? 'over' : 'ok');
        const chip = `<span class="at-cap-chip ${chipCls}">${peak}${capNum != null ? '/' + capNum : ''} peak</span>`;
        const sub = `${list.length} ${list.length === 1 ? 'child this week' : 'children this week'}`;
        // bodyOverride (aligned slot rows) when comparing side by side; else one row per child.
        const body = bodyOverride != null ? bodyOverride : list.map(c => rowHtml(c, opts)).join('');
        const dayTotals = td.map(v => `<td class="at-dtot${capNum != null && v > capNum ? ' over' : ''}">${v}</td>`).join('');
        const table = `<div class="at-rscroll"><table class="at-table">
            <thead><tr><th class="at-tc-name">Child</th>
                <th class="at-tc-day">M</th><th class="at-tc-day">T</th><th class="at-tc-day">W</th><th class="at-tc-day">Th</th><th class="at-tc-day">F</th></tr></thead>
            <tbody>${body}</tbody>
            <tfoot><tr><td class="at-tc-name">Per day \u00b7 ${list.length} total</td>${dayTotals}</tr></tfoot>
        </table></div>`;
        return cardShell(title, chip, table, sub);
    };

    const cardShell = (title, chip, inner, sub) => `
        <div class="at-rcard">
            <div class="at-rcard-head">
                <div><div class="at-rcard-title">${title}</div>${sub ? '<div class="at-rcard-sub">' + sub + '</div>' : ''}</div>
                ${chip || ''}
            </div>
            ${inner}
        </div>`;

    /* ── Which side of a COMBINED pair each child falls in, per day ──
       Only for a combined set (two rooms). For each weekday, split that day's children
       (roster order = youngest-first) between the two rooms: fill BOTH rooms to their own
       capacity first, then split any OVER-capacity children EVENLY, the first room taking
       the extra odd one. So on a day with 10 children in a 4+4 pair, each room runs 1 over
       → 5 in the first room (white) and 5 in the second (pink), rather than 4 white / 6 pink.
       Each child gets a [5] array: 1 = first room that day, 2 = second room, 0 = not in; the
       "1" is tinted pink when side[d] === 2. */
    const firstRoomName = roomNames[0];
    const secondRoomNm = roomNames.length > 1 ? roomNames[roomNames.length - 1] : '';
    const capOf = nm => (((roomInView('projected', nm) || roomInView('actual', nm) || {}).capacity) || 0);
    const cap1 = roomNames.length > 1 ? capOf(firstRoomName) : 0;
    const cap2 = roomNames.length > 1 ? capOf(secondRoomNm) : 0;
    // How many of a day's `total` children sit in the FIRST room (the rest are second room):
    // both rooms filled to capacity, then the overage split evenly (first room takes the odd).
    const firstRoomCountFor = total => {
        if (total <= cap1) return total;                 // all fit in room 1
        const over = total - cap1 - cap2;                // children beyond both rooms' capacity
        if (over <= 0) return cap1;                      // room 1 full, rest go to room 2
        return cap1 + Math.ceil(over / 2);               // split the overage, room 1 takes the odd one
    };
    const sideMap = list => {
        const m = {};
        if (!(roomNames.length > 1) || (!cap1 && !cap2)) return m;   // only meaningful when combined
        // First pass: how many children attend each weekday → the per-day room-1 cutoff.
        const totals = [0, 0, 0, 0, 0];
        list.forEach(c => { const d = c.days || [1, 1, 1, 1, 1]; for (let i = 0; i < 5; i++) if (d[i]) totals[i]++; });
        const cutoff = totals.map(firstRoomCountFor);    // children at index <= cutoff[d] are room 1
        const seen = [0, 0, 0, 0, 0];                    // running count placed so far that day
        list.forEach(c => {
            const days = c.days || [1, 1, 1, 1, 1];
            const side = [0, 0, 0, 0, 0];
            for (let d = 0; d < 5; d++) {
                if (!days[d]) continue;
                seen[d]++;
                side[d] = seen[d] <= cutoff[d] ? 1 : 2;
            }
            m[childKey(c)] = side;
        });
        return m;
    };
    const actualSide = sideMap(actualList);
    const projSide = sideMap(projList);

    // Actual view: just the Actual roster.
    // Projected view: Actual (left) and Projected (right). Both are age-sorted, and we LINE
    // UP a child that appears in both columns onto the same row (blank spacer where a child
    // is on one side only), so the eye can compare actual vs projected per child.
    // (Filter renders into #atFilter.)
    // A one-line key for the pink mark, shown only when a pair is combined.
    const sideLegend = (roomNames.length > 1 && (cap1 || cap2))
        ? `<div class="at-side-legend"><span class="at-on at-room2">1</span> = <strong>${esc(secondRoomNm)}</strong> that day (rooms fill evenly; over-capacity split between the two)</div>`
        : '';

    if (view === 'projected') {
        // The Actual card is FILTERED to only the children in Actual but NOT in Projected —
        // the ones the projection dropped/couldn't seat (shown with a red name). The Projected
        // card stays the full seated roster. No row-alignment: the two lists are independent.
        const projKeys = new Set(projList.map(childKey));
        const droppedList = actualList.filter(c => !projKeys.has(childKey(c)));
        const aOpts = { sideByKey: actualSide, projKeys: projKeys };
        const pOpts = { markGreen: true, sideByKey: projSide };
        const actualCard = card('Actual \u2014 not in projection', droppedList, null, !!actual,
                                 'Every current child fits the projection.', aOpts);
        const projCard = card('Projected \u2014 youngest-first', projList, projected && projected.capacity, !!projected,
                              'No children seated here.', pOpts);
        return `<div class="at-rosters-wrap"><div class="at-rosters">${actualCard}${projCard}</div>${sideLegend}</div>`;
    }
    const theCard = card('Actual \u2014 now', actualList, actual && actual.capacity, !!actual,
                         'No children currently in this room.', { sideByKey: actualSide });
    return `<div class="at-rosters-wrap"><div class="at-rosters">${theCard}</div>${sideLegend}</div>`;
}

/* The waiting-list roster filter, rendered OUTSIDE the attendance card into #atFilter.
   Every waiting-list child with their age-group, each with a checkbox. A child is seated
   in the projection only while CHECKED; unchecking excludes them and re-seats the rooms.
   Hidden entirely outside the projected view. */
function renderFilter() {
    const box = document.getElementById('atFilter');
    if (!box) return;
    if (view !== 'projected') { box.innerHTML = ''; return; }

    if (!waitlistAll) {
        box.innerHTML = `<div class="at-filter">
            <div class="at-filter-head"><span class="at-filter-title">Waiting list</span></div>
            <div class="at-filter-empty">Loading the waiting list\u2026</div>
        </div>`;
        return;
    }
    if (!waitlistAll.length) {
        box.innerHTML = `<div class="at-filter">
            <div class="at-filter-head"><span class="at-filter-title">Waiting list</span></div>
            <div class="at-filter-empty">No one on the waiting list.</div>
        </div>`;
        return;
    }
    const seated = waitlistAll.length - excludedIds.size;
    const items = waitlistAll.map(c => {
        const off = excludedIds.has(c.id);
        const start = c.startDate ? fmtDate(c.startDate) : '\u2014';
        return `<li class="at-filter-item${off ? ' off' : ''}">
            <input type="checkbox" ${off ? '' : 'checked'} onchange="toggleChild('${c.id}', this.checked)">
            <span class="at-filter-body">
                <span class="at-filter-nameline"><span class="at-filter-name">${esc(c.name)}</span>${(c.score !== '' && c.score != null) ? `<span class="at-filter-score" title="Waiting-list score">${esc(c.score)}</span>` : ''}</span>
                <span class="at-filter-meta"><span class="at-filter-room">${esc(c.room || '\u2014')}</span><span class="at-filter-dot">\u00b7</span>starts ${esc(start)}</span>
            </span>
        </li>`;
    }).join('');
    // Two quick actions: "Clear" unchecks everyone (none seated); "Show all" re-checks
    // everyone. Each shows only when it would do something.
    const clearBtn = seated > 0
        ? '<button type="button" class="at-filter-reset" onclick="clearFilter()">Clear</button>' : '';
    const showAllBtn = excludedIds.size
        ? '<button type="button" class="at-filter-reset" onclick="resetFilter()">Show all</button>' : '';
    box.innerHTML = `<div class="at-filter">
        <div class="at-filter-head">
            <span class="at-filter-title">Waiting list</span>
            <span class="at-filter-count">${seated}/${waitlistAll.length}</span>
        </div>
        <div class="at-filter-sub">
            <span>Tick a child to seat them in the projection.</span>
            <span class="at-filter-actions">${showAllBtn}${clearBtn}</span>
        </div>
        <ul class="at-filter-list">${items}</ul>
    </div>`;
}

/* Toggle a waiting-list child in/out of the projection, then re-fetch and re-render.
   Debounced so ticking through several children fires one fetch. Keys are 'w'+Id strings. */
let _filterTimer = null;
function toggleChild(id, checked) {
    id = String(id);
    if (!id) return;
    if (checked) excludedIds.delete(id); else excludedIds.add(id);
    renderFilter();   // reflect the strike-through immediately
    clearTimeout(_filterTimer);
    _filterTimer = setTimeout(reprojectAndRender, 180);
}

function resetFilter() {
    excludedIds.clear();
    renderFilter();
    clearTimeout(_filterTimer);
    _filterTimer = setTimeout(reprojectAndRender, 0);
}

/* Clear = uncheck every waiting-list child, so NONE are seated in the projection — the
   rooms show just the currently enrolled children. */
function clearFilter() {
    excludedIds.clear();
    (waitlistAll || []).forEach(c => excludedIds.add(c.id));
    renderFilter();
    clearTimeout(_filterTimer);
    _filterTimer = setTimeout(reprojectAndRender, 0);
}

async function reprojectAndRender() {
    try { await fetchProjected(); } catch (e) { /* keep the last projection on error */ }
    if (view === 'projected') renderCurrent();
}

/* Fetch a single view's data (cached per view). The actual view also pulls its per-room
   roster; the projected rooms already carry their roster. */
async function fetchView(which) {
    if (cache[which]) return;
    if (which === 'actual') {
        const res = await apiFetch('/api/reports?only=byRoomDaily,actualRoster');
        const data = await res.json();
        cache.actual = actualRows(data && data.byRoomDaily, data && data.actualRoster);
    } else {
        await fetchProjected();
    }
}

/* Fetch the projection, honouring the roster filter's excluded children. Always runs
   (not cached) so toggling a child re-seats the rooms. Also pulls the full waiting-list
   once, as the stable source for the filter list (so an unchecked child doesn't vanish). */
async function fetchProjected() {
    const ex = Array.from(excludedIds);
    const only = waitlistAll ? 'projectedAttendance' : 'projectedAttendance,waitlistChildren';
    const qs = '/api/reports?only=' + only + (ex.length ? '&excludeIds=' + ex.join(',') : '');
    const res = await apiFetch(qs);
    const data = await res.json();
    cache.projected = projectedRows(data && data.projectedAttendance);
    if (!waitlistAll && data && data.waitlistChildren) {
        waitlistAll = waitlistFromRows(data.waitlistChildren);
        // Default: every waiting-list child UNCHECKED (not seated). The director ticks the
        // ones to try. On this first build we exclude them all, then re-fetch the projection
        // so the opening view shows enrolled-only (== actual).
        const needReproject = waitlistAll.some(c => !excludedIds.has(c.id));
        waitlistAll.forEach(c => excludedIds.add(c.id));
        if (needReproject) { try { await fetchProjected(); } catch (e) {} }
    }
}

/* The waiting-list rows -> stable filter entries. Columns:
   [Id, ChildName, BirthDate, AgeGroup, DaysRequested, Score, StartDate].
   Ordered by requested START DATE (soonest first); entries with no start date fall to the
   BOTTOM. The target ROOM is derived from the age group the family applied for. */
function waitlistFromRows(rows) {
    const AGE_ROOM = { '0-2': 'Infant / Toddler', '2-3': '2 Year Old', '3-5': 'Pre-School', 'ba': 'Before & After' };
    // First name only; junk/placeholder names ("na", "unknown", blank) show as "??".
    const firstName = raw => {
        const first = String(raw || '').trim().split(/\s+/)[0] || '';
        return /^(na|n\/a|unknown|unk|\?+)$/i.test(first) || !first ? '\u2047' : first;  // ⁇
    };
    // A sort key from the start date: parseable date → its time (soonest = smallest);
    // missing/invalid → +Infinity so those rows sink to the bottom.
    const startKey = s => { const t = Date.parse(String(s || '').trim()); return isNaN(t) ? Infinity : t; };
    return (rows || []).map(r => ({
        id: 'w' + (parseInt(r[0], 10) || 0),
        name: firstName(r[1]),
        birthDate: String(r[2] || '').trim(),
        ageDays: (function () { const t = Date.parse(String(r[2] || '').trim()); return isNaN(t) ? Infinity : Math.floor((Date.now() - t) / 86400000); })(),
        room: AGE_ROOM[String(r[3] || '').trim()] || (r[3] || '\u2014'),
        score: String(r[5] == null ? '' : r[5]).trim(),   // waiting-list priority score
        startDate: String(r[6] || '').trim(),
    })).sort((a, b) => {
        const ka = startKey(a.startDate), kb = startKey(b.startDate);
        if (ka !== kb) return ka - kb;              // soonest start first; no-date last
        return (a.ageDays || 0) - (b.ageDays || 0); // tie-break youngest-first
    });
}

/* Load what the current view needs, then render. BOTH datasets are loaded because the
   roster panel always compares actual vs projected for the selected room — the user's
   whole point is seeing what changed. The non-active dataset failing is non-fatal: the
   bars still render, the missing side of the roster just shows a short note. */
async function loadView() {
    const body = document.getElementById('atBody');
    if (cache[view]) { ensureOther(); renderCurrent(); return; }
    body.innerHTML = '<div class="at-empty">Loading…</div>';
    document.getElementById('atSidebar').innerHTML = '';
    try {
        await fetchView(view);
    } catch (e) {
        body.innerHTML = '<div class="at-empty">Could not load attendance: ' + esc(e && e.message ? e.message : e) + '</div>';
        return;
    }
    renderCurrent();
    ensureOther();
}

/* Load the OTHER view's data in the background so the roster comparison has both sides,
   then re-render the open room so the second column fills in when it arrives. */
function ensureOther() {
    const other = view === 'actual' ? 'projected' : 'actual';
    if (cache[other]) return;
    fetchView(other).then(() => { if (rows().length) showRoom(activeRoom); }).catch(() => {});
}

function renderCurrent() {
    renderFilter();   // the waiting-list filter (shown only in the projected view)
    const list = rows();
    if (!list.length) {
        document.getElementById('atSidebar').innerHTML = '';
        document.getElementById('atBody').innerHTML = view === 'projected'
            ? '<div class="at-empty">No projection data yet. Add rooms and waiting-list entries first.</div>'
            : '<div class="at-empty">No attendance data yet.</div>';
        return;
    }
    if (activeRoom >= list.length) activeRoom = 0;
    renderSidebar();
    showRoom(activeRoom);
}

function setView(v) {
    if (v === view) return;
    view = v;
    activeRoom = 0;
    document.getElementById('atTitle').textContent =
        (v === 'projected' ? 'Projected' : 'Actual') + ' Attendance by Room';
    const actualTab = document.getElementById('atTabActual');
    const projTab = document.getElementById('atTabProjected');
    actualTab.classList.toggle('on', v === 'actual');
    actualTab.setAttribute('aria-selected', String(v === 'actual'));
    projTab.classList.toggle('on', v === 'projected');
    projTab.setAttribute('aria-selected', String(v === 'projected'));
    loadView();
}

// Allow a direct link to the projected view (e.g. the old projected page redirects here
// with #projected). Default is the actual view.
if ((location.hash || '').toLowerCase().indexOf('projected') !== -1) {
    setView('projected');
} else {
    loadView();
}
</script>

<!-- Header Deploy button. Same action and auth as the portal's deploy, living in the header
     next to the theme + Staff Portal buttons. Shown only to an IT admin (whoAmI().itAdmin,
     falling back to .admin on an older server); the server enforces checkITAdmin on
     /api/deploy regardless, so visibility is not authority. -->
<script>
(function () {
    function wire() {
        var btn = document.getElementById('hdrDeploy');
        if (!btn || !window.CofpAuth || !CofpAuth.whoAmI) return;
        CofpAuth.whoAmI().then(function (who) {
            if (!who) return;
            var show = (typeof who.itAdmin === 'boolean') ? who.itAdmin : !!who.admin;
            if (!show) return;
            btn.style.display = '';
            btn.addEventListener('click', function () {
                if (!confirm('Pull the latest code from GitHub?\n\nPage and script changes take effect when you reload. If server.js changed, use the Restart control afterward.')) return;
                var orig = btn.textContent;
                btn.disabled = true; btn.textContent = '\u23F3 Deploying\u2026';
                var hdrs = {};
                var t = CofpAuth.token && CofpAuth.token(); if (t) hdrs['X-Staff-Token'] = t;
                var basic = CofpAuth.header && CofpAuth.header(); if (basic) hdrs['Authorization'] = basic;
                fetch('/api/deploy', { method: 'POST', headers: hdrs })
                    .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j, status: res.status }; }); })
                    .then(function (r) {
                        if (r.ok && r.j && r.j.success !== false) { btn.textContent = '\u2713 Deployed'; }
                        else { throw new Error((r.j && r.j.error) || ('HTTP ' + r.status)); }
                    })
                    .catch(function (e) { btn.textContent = '\u2717 Failed'; alert('Deploy failed: ' + e.message); })
                    .finally(function () {
                        setTimeout(function () { btn.disabled = false; btn.textContent = orig; }, 3500);
                    });
            });
        }).catch(function () {});
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
    else wire();
})();
</script>
