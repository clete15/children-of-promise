<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Program – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('copStaffTheme');
                var dark = saved === null
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                    : saved === 'dark';
                if (dark) document.documentElement.classList.add('sp-dark');
            } catch (e) {}
        })();
    </script>
    <style>
        body.fp-page { background:var(--sp-bg);color:var(--sp-text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        .fp-layout { max-width:1180px;margin:0 auto;padding:18px 16px 60px; }
        .fp-topbar { display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sp-surface);border:1.5px solid var(--sp-border);border-radius:10px;padding:12px 16px;margin-bottom:16px; }
        .fp-back { display:inline-flex;align-items:center;gap:4px;font-size:0.82rem;font-weight:600;text-decoration:none;color:var(--sp-text-2);background:var(--sp-surface-2);border:1px solid var(--sp-border-in);border-radius:7px;padding:5px 11px; }
        .fp-back:hover { color:var(--sp-accent);border-color:var(--sp-accent); }
        .fp-brand { min-width:0; }
        .fp-brand strong { display:block;font-size:0.92rem;color:var(--sp-text); }
        .fp-brand span { display:block;font-size:0.76rem;color:var(--sp-muted);margin-top:2px; }
        .fp-theme { margin-left:auto;background:none;border:0;padding:4px 6px;cursor:pointer;font:inherit;font-size:0.82rem;font-weight:600;color:var(--sp-muted); }
        .fp-theme:hover { color:var(--sp-accent); }
        .fp-wrapper { width:100%; }
        .fp-sidebar { display:flex;gap:2px;margin-bottom:16px;border-bottom:1.5px solid var(--sp-border);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none; }
        .fp-sidebar::-webkit-scrollbar { display:none; }
        .fp-sidebar button { appearance:none;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;color:var(--sp-muted);cursor:pointer;font-family:inherit;font-size:0.88rem;font-weight:700;padding:10px 14px 11px;margin-bottom:-1.5px;white-space:nowrap;transition:color 0.12s,background 0.12s,border-color 0.12s; }
        .fp-sidebar button:hover { color:var(--sp-text);background:var(--sp-surface-2); }
        .fp-sidebar button.active { color:var(--sp-accent);border-bottom-color:var(--sp-accent); }
        .fp-sidebar button:focus-visible,.fp-theme:focus-visible,.fp-back:focus-visible,.fp-btn:focus-visible,.fp-filter:focus-visible,.fp-month-btn:focus-visible { outline:2px solid var(--sp-accent);outline-offset:2px; }
        .fp-sidebar .nav-label,.fp-sidebar .nav-sub { font:inherit;color:inherit; }
        .fp-card { background:var(--sp-surface);border:1.5px solid var(--sp-border);border-radius:10px;overflow:hidden; }
        .fp-header { padding:17px 20px 15px;border-bottom:1px solid var(--sp-border); }
        .fp-eyebrow { margin:0 0 3px;font-size:0.68rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--sp-accent); }
        .fp-header h1 { margin:0;font-size:1.12rem;font-weight:800;color:var(--sp-text); }
        .fp-body { padding:20px;min-height:360px; }
        .fp-loading,.fp-empty,.fp-error { padding:18px;border:1px solid var(--sp-border);border-radius:9px;background:var(--sp-surface-2);color:var(--sp-muted);font-size:0.86rem; }
        .fp-error { color:var(--sp-bad-fg);background:var(--sp-bad-bg);border-color:var(--sp-bad-br); }

        .fp-summary-grid { display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:18px; }
        .fp-stat { background:var(--sp-surface-2);border:1px solid var(--sp-border);border-radius:9px;padding:12px 14px; }
        .fp-stat-label { font-size:0.7rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--sp-muted); }
        .fp-stat-value { margin-top:4px;font-size:1.45rem;line-height:1;font-weight:800;color:var(--sp-text); }
        .fp-section { border:1px solid var(--sp-border);border-radius:10px;padding:15px 16px;background:var(--sp-surface); }
        .fp-section-head { margin-bottom:14px; }
        .fp-section-head h2 { margin:0;font-size:0.96rem;color:var(--sp-text); }
        .fp-section-head p { margin:4px 0 0;font-size:0.8rem;line-height:1.5;color:var(--sp-muted); }
        .fp-bar-row { display:grid;grid-template-columns:78px minmax(0,1fr) 32px;align-items:center;gap:10px;margin-top:10px; }
        .fp-bar-label { font-size:0.8rem;font-weight:700;color:var(--sp-text-2); }
        .fp-bar-track { height:10px;background:var(--sp-border);border-radius:999px;overflow:hidden; }
        .fp-bar-fill { height:100%;border-radius:999px;min-width:3px; }
        .fp-bar-fill.free { background:#16a34a; }.fp-bar-fill.reduced { background:#6366f1; }
        .fp-bar-fill.paid { background:#2563eb; }.fp-bar-fill.unknown { background:#94a3b8; }
        .fp-bar-count { text-align:right;font-size:0.8rem;font-weight:800;color:var(--sp-text); }

        .fp-roster-tools { display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap; }
        .fp-filters { display:flex;gap:6px;flex-wrap:wrap;min-width:0; }
        .fp-filter { appearance:none;border:1px solid var(--sp-border);border-radius:999px;background:var(--sp-surface-2);color:var(--sp-text-2);padding:6px 11px;font:inherit;font-size:0.74rem;font-weight:700;cursor:pointer; }
        .fp-filter:hover { border-color:var(--sp-accent);color:var(--sp-accent); }
        .fp-filter.active { background:var(--sp-accent);border-color:var(--sp-accent);color:#fff; }
        .fp-btn { appearance:none;border:1px solid var(--sp-border-in);border-radius:7px;background:var(--sp-surface-2);color:var(--sp-text-2);padding:7px 12px;font:inherit;font-size:0.76rem;font-weight:700;cursor:pointer;white-space:nowrap; }
        .fp-btn:hover { border-color:var(--sp-accent);color:var(--sp-accent); }
        .fp-btn-primary { background:var(--sp-accent);border-color:var(--sp-accent);color:#fff; }
        .fp-btn-primary:hover { background:var(--primary-dark);border-color:var(--primary-dark);color:#fff; }
        .fp-btn[disabled] { opacity:0.35;cursor:default; }
        .fp-table-wrap { overflow:auto;border:1px solid var(--sp-border);border-radius:9px; }
        .fp-table { width:100%;min-width:760px;border-collapse:collapse;font-size:0.8rem;table-layout:fixed; }
        .fp-table thead tr { background:var(--sp-surface-2);border-bottom:1.5px solid var(--sp-border); }
        .fp-table th { position:sticky;top:0;z-index:1;background:var(--sp-surface-2);padding:9px 8px;text-align:left;font-size:0.66rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;color:var(--sp-muted); }
        .fp-table th.center,.fp-table td.center { text-align:center; }
        .fp-table th.right,.fp-table td.right { text-align:right; }
        .fp-table td { padding:7px 8px;border-bottom:1px solid var(--sp-border);vertical-align:middle;color:var(--sp-text-2); }
        .fp-table tbody tr:last-child td { border-bottom:0; }
        .fp-table tbody tr.fp-band { background:var(--sp-surface-2); }
        .fp-table tbody tr:hover { background:var(--sp-accent-soft); }
        .fp-child-name { font-size:0.82rem;font-weight:700;color:var(--sp-text); }
        .fp-teacher { display:block;margin-top:2px;font-size:0.68rem;color:var(--sp-muted);font-weight:500;white-space:normal; }
        .fp-table select,.fp-table input { width:100%;box-sizing:border-box;padding:6px 7px;border:1px solid var(--sp-border-in);border-radius:6px;background:var(--sp-field-bg);color:var(--sp-text);font:inherit;font-size:0.76rem; }
        .fp-table input { text-align:right; }
        .fp-table .fp-hh { text-align:center; }
        .fp-table select:focus,.fp-table input:focus { outline:0;border-color:var(--sp-accent);box-shadow:0 0 0 2px rgba(37,99,235,0.12); }
        .fp-frp { display:inline-flex;align-items:center;justify-content:center;min-width:62px;padding:3px 8px;border-radius:999px;font-size:0.68rem;font-weight:800; }
        .fp-frp.free { color:var(--sp-good-fg);background:var(--sp-good-bg); }
        .fp-frp.reduced { color:var(--sp-warn-fg);background:var(--sp-warn-bg); }
        .fp-frp.paid,.fp-frp.unknown { color:var(--sp-muted);background:var(--sp-surface-2);border:1px solid var(--sp-border); }
        .fp-save { min-width:54px;padding:5px 9px; }

        .fp-picker { max-width:620px;margin:0 auto; }
        .fp-picker-intro { margin:0 0 16px;font-size:0.86rem;line-height:1.6;color:var(--sp-muted); }
        .fp-month-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px; }
        .fp-month-btn { appearance:none;padding:15px 12px;border-radius:9px;border:1px solid var(--sp-border);background:var(--sp-surface-2);color:var(--sp-text-2);cursor:pointer;font:inherit;text-align:left;transition:border-color 0.12s,background 0.12s; }
        .fp-month-btn:hover { border-color:var(--sp-accent);background:var(--sp-accent-soft); }
        .fp-month-btn.recommended { border:1.5px solid var(--sp-accent);background:var(--sp-accent-soft); }
        .fp-month-name { display:block;font-size:0.86rem;font-weight:800;color:var(--sp-text); }
        .fp-month-year { display:block;margin-top:3px;font-size:0.72rem;color:var(--sp-muted); }
        .fp-month-note { display:block;margin-top:7px;font-size:0.63rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--sp-accent); }
        .fp-menu-frame { width:100%;height:calc(100vh - 250px);min-height:700px;border:0;border-radius:8px;background:var(--sp-surface); }

        @media (max-width:780px) {
            .fp-layout { padding:12px 10px 36px; }
            .fp-topbar { padding:10px 12px;margin-bottom:12px; }
            .fp-brand span { display:none; }
            .fp-sidebar { margin-bottom:12px; }
            .fp-sidebar button { font-size:0.8rem;padding:9px 11px 10px; }
            .fp-card { border-radius:9px; }
            .fp-header { padding:14px 15px 12px; }
            .fp-body { padding:14px;min-height:300px; }
            .fp-summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .fp-roster-tools { display:block; }
            .fp-filters { flex-wrap:nowrap;overflow-x:auto;padding-bottom:7px;scrollbar-width:none; }
            .fp-filters::-webkit-scrollbar { display:none; }
            .fp-roster-tools .fp-btn { margin-top:5px; }
            .fp-menu-frame { height:800px;min-height:800px; }
        }
        @media (max-width:440px) {
            .fp-theme { width:100%;margin-left:0;text-align:left;padding-left:0; }
            .fp-summary-grid { grid-template-columns:1fr 1fr;gap:7px; }
            .fp-stat { padding:10px 11px; }
            .fp-month-grid { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body class="fp-page">

<div class="fp-layout">
    <div class="fp-topbar">
        <a class="fp-back" href="/staff/">&#8592; Staff Portal</a>
        <div class="fp-brand">
            <strong>Food Program</strong>
            <span>Roster eligibility, monthly forms, and weekly menus</span>
        </div>
        <button type="button" id="spTheme" class="fp-theme" aria-pressed="false" title="Switch between light and dark"></button>
    </div>
    <div class="fp-wrapper">
        <nav class="fp-sidebar" role="tablist" aria-label="Food Program sections">
            <button class="active" role="tab" aria-selected="true" id="navFood" onclick="showPanel('food')">
                <span class="nav-label">Overview</span>
            </button>
            <button role="tab" aria-selected="false" id="navRoster" onclick="showPanel('roster')">
                <span class="nav-sub">Full Roster</span>
            </button>
            <button role="tab" aria-selected="false" id="navCount" onclick="showPanel('countPicker')">
                <span class="nav-sub">Monthly Count Sheets</span>
            </button>
            <button role="tab" aria-selected="false" id="navMenus" onclick="showPanel('menus')">
                <span class="nav-sub">Weekly Menus</span>
            </button>
            <button role="tab" aria-selected="false" id="navRecap" onclick="showPanel('recapPicker')">
                <span class="nav-sub">Total Meal Recap</span>
            </button>
        </nav>
        <main class="fp-card">
            <div class="fp-header">
                <p class="fp-eyebrow">Food Program</p>
                <h1 id="fpTitle">Overview</h1>
            </div>
            <div class="fp-body" id="fpBody">
                <div class="fp-loading">Loading food program data&hellip;</div>
            </div>
        </main>
    </div>
</div>

<div id="foodPrintFrame" style="display:none;"></div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
// AUTH, apiFetch, isTruthy, students and classrooms come from app.js.
let currentPanel = 'food';
const fpEsc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

async function init() {
    try {
        const [sRes, cRes] = await Promise.all([
            apiFetch('/api/students'),
            apiFetch('/api/classrooms')
        ]);
        students = await sRes.json();
        classrooms = await cRes.json();
        showPanel('food');
    } catch (e) {
        document.getElementById('fpBody').innerHTML = '<div class="fp-error">Could not load food program data: ' + e.message + '</div>';
    }
}

function showPanel(panel) {
    currentPanel = panel;
    document.querySelectorAll('.fp-sidebar button').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
    });
    if (panel === 'food') {
        document.getElementById('navFood').classList.add('active');
        document.getElementById('navFood').setAttribute('aria-selected', 'true');
        document.getElementById('fpTitle').textContent = 'Overview';
        renderFoodReport();
    } else if (panel === 'roster') {
        document.getElementById('navRoster').classList.add('active');
        document.getElementById('navRoster').setAttribute('aria-selected', 'true');
        document.getElementById('fpTitle').textContent = 'Full Roster';
        renderFullRoster();
    } else if (panel === 'menus') {
        document.getElementById('navMenus').classList.add('active');
        document.getElementById('navMenus').setAttribute('aria-selected', 'true');
        document.getElementById('fpTitle').textContent = 'Weekly Menus';
        document.getElementById('fpBody').innerHTML = '<iframe class="fp-menu-frame" title="Weekly Menu Planner" src="/staff/menus.html?embedded=1"></iframe>';
    } else if (panel === 'countPicker') {
        document.getElementById('navCount').classList.add('active');
        document.getElementById('navCount').setAttribute('aria-selected', 'true');
        document.getElementById('fpTitle').textContent = 'Monthly Count Sheets';
        const now = new Date();
        const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        const months = [];
        for (let i = -2; i <= 6; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            months.push(d);
        }
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        document.getElementById('fpBody').innerHTML = `
            <div class="fp-picker">
                <p class="fp-picker-intro">Select a month to generate attendance and meal participation sheets for every classroom.</p>
                <div class="fp-month-grid">
                    ${months.map(d => {
                        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
                        const isNext = d.getMonth() === nextMonth.getMonth() && d.getFullYear() === nextMonth.getFullYear();
                        return `<button class="fp-month-btn${isNext?' recommended':''}" onclick="printFoodCountSheets('${key}')">
                            <span class="fp-month-name">${monthNames[d.getMonth()]}</span>
                            <span class="fp-month-year">${d.getFullYear()}</span>
                            ${isNext?'<span class="fp-month-note">Next month</span>':''}
                        </button>`;
                    }).join('')}
                </div>
            </div>`;
    } else if (panel === 'recapPicker') {
        document.getElementById('navRecap').classList.add('active');
        document.getElementById('navRecap').setAttribute('aria-selected', 'true');
        document.getElementById('fpTitle').textContent = 'Total Meal Recap';
        const now = new Date();
        const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        const months = [];
        for (let i = -2; i <= 6; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            months.push(d);
        }
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        document.getElementById('fpBody').innerHTML = `
            <div class="fp-picker">
                <p class="fp-picker-intro">Select a month to generate Total Meal Recap sheets for Breakfast, Lunch, and PM Snack with classroom rows.</p>
                <div class="fp-month-grid">
                    ${months.map(d => {
                        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
                        const isNext = d.getMonth() === nextMonth.getMonth() && d.getFullYear() === nextMonth.getFullYear();
                        return `<button class="fp-month-btn${isNext?' recommended':''}" onclick="printMealRecap('${key}')">
                            <span class="fp-month-name">${monthNames[d.getMonth()]}</span>
                            <span class="fp-month-year">${d.getFullYear()}</span>
                            ${isNext?'<span class="fp-month-note">Next month</span>':''}
                        </button>`;
                    }).join('')}
                </div>
            </div>`;
    }
}

function renderFoodReport() {
    const active = students.filter(s => isTruthy(s.Active));
    const free = active.filter(s => s.F_R_P_Food === 'Free').length;
    const reduced = active.filter(s => s.F_R_P_Food === 'Reduced').length;
    const paid = active.filter(s => s.F_R_P_Food === 'Paid').length;
    const unknown = active.length - free - reduced - paid;
    const max = Math.max(free, reduced, paid, unknown, 1);

    function stat(label, count) {
        return '<div class="fp-stat"><div class="fp-stat-label">' + label
            + '</div><div class="fp-stat-value">' + count + '</div></div>';
    }
    function bar(label, count, cls) {
        const pct = Math.round(count / max * 100);
        return '<div class="fp-bar-row"><div class="fp-bar-label">' + label + '</div>'
            + '<div class="fp-bar-track"><div class="fp-bar-fill ' + cls
            + '" style="width:' + Math.max(pct, 1) + '%"></div></div>'
            + '<div class="fp-bar-count">' + count + '</div></div>';
    }

    document.getElementById('fpBody').innerHTML =
        '<div class="fp-summary-grid">'
        + stat('Active children', active.length)
        + stat('Free', free)
        + stat('Reduced', reduced)
        + stat('Paid', paid)
        + '</div>'
        + '<section class="fp-section"><div class="fp-section-head">'
        + '<h2>Meal eligibility distribution</h2>'
        + '<p>Current Free, Reduced, and Paid classifications across the active roster.</p>'
        + '</div>'
        + bar('Free', free, 'free')
        + bar('Reduced', reduced, 'reduced')
        + bar('Paid', paid, 'paid')
        + bar('Unknown', unknown, 'unknown')
        + '</section>';
}

function renderFullRoster() {
    const active = students.filter(s => isTruthy(s.Active));
    const frpClass = v => v === 'Free' ? 'free' : v === 'Reduced' ? 'reduced' : v === 'Paid' ? 'paid' : 'unknown';
    const roomOpts = classrooms.map(r => `<option value="${fpEsc(r.RoomNumber)}">${fpEsc(r.Room)}</option>`).join('');
    const rooms = [...new Set(active.map(s => s.Room || 'Unknown'))];
    const filterRoom = window._fpFilterRoom || 'All';
    const filtered = filterRoom === 'All' ? active : active.filter(s => (s.Room || 'Unknown') === filterRoom);

    let filterHtml = '<div class="fp-roster-tools"><div class="fp-filters">'
        + `<button type="button" class="fp-filter${filterRoom==='All'?' active':''}" onclick="window._fpFilterRoom='All';renderFullRoster()">All (${active.length})</button>`;
    rooms.forEach(rm => {
        const cnt = active.filter(s => (s.Room || 'Unknown') === rm).length;
        const roomArg = fpEsc(JSON.stringify(rm));
        filterHtml += `<button type="button" class="fp-filter${filterRoom===rm?' active':''}" onclick="window._fpFilterRoom=${roomArg};renderFullRoster()">${fpEsc(rm)} (${cnt})</button>`;
    });
    filterHtml += '</div><button type="button" class="fp-btn fp-btn-primary" onclick="exportFoodExcel()">&#8595; Export CSV</button></div>';

    document.getElementById('fpBody').innerHTML = filterHtml + `
        <div class="fp-table-wrap">
        <table class="fp-table">
            <colgroup>
                <col style="width:220px;">
                <col style="width:170px;">
                <col style="width:90px;">
                <col style="width:110px;">
                <col style="width:70px;">
                <col style="width:75px;">
            </colgroup>
            <thead><tr>
                <th>Name</th>
                <th>Room</th>
                <th class="center">F/R/P</th>
                <th class="right">Income</th>
                <th class="center">HH</th>
                <th class="center">Save</th>
            </tr></thead>
            <tbody>${(() => {
                let lastRoom = ''; let roomIdx = 0;
                return filtered.map((s, i) => {
                    if (s.Room !== lastRoom) { if (lastRoom) roomIdx++; lastRoom = s.Room; }
                    return `<tr class="${roomIdx % 2 ? 'fp-band' : ''}">
                <td><span class="fp-child-name">${fpEsc(s.Last_Name)}, ${fpEsc(s.First_Name)}</span><span class="fp-teacher">${fpEsc(s.TeacherDescription || 'No teacher listed')}</span></td>
                <td><select id="frRoom_${i}" onchange="markFRChanged(${i})">${roomOpts}</select></td>
                <td class="center"><span class="fp-frp ${frpClass(s.F_R_P_Food)}" id="frFRP_${i}">${fpEsc(s.F_R_P_Food || 'Unknown')}</span></td>
                <td><input type="number" aria-label="Household income for ${fpEsc(s.First_Name)} ${fpEsc(s.Last_Name)}" id="frIncome_${i}" value="${fpEsc(s.HouseholdIncome || '')}" onchange="markFRChanged(${i})"></td>
                <td><input class="fp-hh" type="number" aria-label="Household size for ${fpEsc(s.First_Name)} ${fpEsc(s.Last_Name)}" id="frHH_${i}" value="${fpEsc(s.HouseholdSize || '')}" min="1" max="15" onchange="markFRChanged(${i})"></td>
                <td class="center"><button type="button" class="fp-btn fp-btn-primary fp-save" id="frSave_${i}" onclick="saveFRRow(${i})" disabled>Save</button></td>
            </tr>`;
                }).join('');
            })()}</tbody>
        </table></div>`;
    // Set room dropdowns after the generated controls exist.
    filtered.forEach((s, i) => {
        const sel = document.getElementById('frRoom_' + i);
        if (sel) sel.value = s.RoomNumber || '';
    });
}

function markFRChanged(i) {
    const btn = document.getElementById('frSave_' + i);
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
}

async function saveFRRow(i) {
    const active = students.filter(s => isTruthy(s.Active));
    const filterRoom = window._fpFilterRoom || 'All';
    const filtered = filterRoom === 'All' ? active : active.filter(s => (s.Room || 'Unknown') === filterRoom);
    const s = filtered[i];
    if (!s) return;
    const newIncome = document.getElementById('frIncome_' + i).value;
    const newHH = document.getElementById('frHH_' + i).value;
    const newRoom = document.getElementById('frRoom_' + i).value;
    const btn = document.getElementById('frSave_' + i);
    btn.disabled = true; btn.textContent = '…';
    try {
        const res = await apiFetch('/api/students/' + encodeURIComponent(s.First_Name) + '/' + encodeURIComponent(s.Last_Name), {
            method: 'PUT', body: JSON.stringify({ householdIncome: newIncome, householdSize: newHH, roomNumber: newRoom })
        });
        const data = await res.json();
        if (data.success) {
            s.HouseholdIncome = newIncome;
            s.HouseholdSize = newHH;
            s.RoomNumber = newRoom;
            const cr = classrooms.find(c => String(c.RoomNumber) === String(newRoom));
            if (cr) s.Room = cr.Room;
            // Refresh F/R/P from server
            const sRes = await apiFetch('/api/students');
            const allStudents = await sRes.json();
            const updated = allStudents.find(x => x.First_Name === s.First_Name && x.Last_Name === s.Last_Name);
            if (updated) {
                s.F_R_P_Food = updated.F_R_P_Food;
                const frpEl = document.getElementById('frFRP_' + i);
                const frpClass = v => v === 'Free' ? 'free' : v === 'Reduced' ? 'reduced' : v === 'Paid' ? 'paid' : 'unknown';
                if (frpEl) {
                    frpEl.textContent = updated.F_R_P_Food || 'Unknown';
                    frpEl.className = 'fp-frp ' + frpClass(updated.F_R_P_Food);
                }
            }
            students = allStudents;
            btn.style.opacity = '0.3';
        } else { btn.disabled = false; btn.style.opacity = '1'; }
    } catch (e) { btn.disabled = false; btn.style.opacity = '1'; }
    finally { btn.textContent = 'Save'; }
}

function exportFoodExcel() {
    const active = students.filter(s => isTruthy(s.Active));
    const headers = ['First Name','Last Name','Room','Teacher','F/R/P','Income','HH Size'];
    let csv = headers.join(',') + '\n';
    active.forEach(s => {
        csv += [
            '"' + (s.First_Name||'') + '"',
            '"' + (s.Last_Name||'') + '"',
            '"' + (s.Room||'') + '"',
            '"' + (s.TeacherDescription||'') + '"',
            '"' + (s.F_R_P_Food||'') + '"',
            s.HouseholdIncome||'',
            s.HouseholdSize||''
        ].join(',') + '\n';
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Food_Program_Roster_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
}

function printFoodCountSheets(monthKey) {
    if (!monthKey) { showPanel('countPicker'); return; }
    const parts = monthKey.split('-');
    const year = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1;

    const active = students.filter(s => isTruthy(s.Active));
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const monthYear = monthNames[month] + ' ' + year;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const meals = ['Breakfast', 'Lunch', 'PM Snack'];
    const weekendDays = [];
    for (let d = 1; d <= daysInMonth; d++) { if ([0,6].includes(new Date(year, month, d).getDay())) weekendDays.push(d); }

    const roomGroups = {};
    // Track each room's RoomNumber so the sheets print youngest-first (room-number order,
    // the roster's age ordering) rather than alphabetically by room name.
    const roomNum = {};
    active.forEach(s => {
        const room = s.Room || 'Room ' + s.RoomNumber;
        if (!roomGroups[room]) roomGroups[room] = [];
        roomGroups[room].push(s);
        if (roomNum[room] === undefined) { const n = parseInt(s.RoomNumber, 10); roomNum[room] = isNaN(n) ? Infinity : n; }
    });
    const roomsInAgeOrder = Object.keys(roomGroups).sort((a, b) => (roomNum[a] - roomNum[b]) || a.localeCompare(b));

    let html = '<!DOCTYPE html><html><head><style>';
    html += '@page{size:landscape;margin:0.2in}body{font-family:Arial,sans-serif;margin:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}';
    html += '.sheet{page-break-after:always;padding:6px}.sheet:last-child{page-break-after:auto}';
    html += 'table{border-collapse:collapse;width:100%;font-size:9px;table-layout:fixed}th,td{border:1px solid #000;padding:3px 2px;text-align:center}';
    html += 'th{background:#d9d9d9;font-size:8px;font-weight:bold}.name-col{text-align:left;min-width:140px;font-size:9px;white-space:nowrap;padding-left:4px;font-weight:bold}';
    html += '.frp-col{font-weight:bold;width:20px;background:#f0f0f0}.day-col{width:18px;min-width:18px}.day-col.weekend{background:#808080!important}';
    html += '.total-col{width:38px;background:#d9d9d9;font-weight:bold}.total-col-free{width:30px;background:#d9d9d9;font-weight:bold;border-left:3px solid #000}';
    html += '.totals-row td{font-weight:bold;font-size:8px;background:#e8e8e8}.separator-row td{border-top:3px solid #000}';
    html += '.header{text-align:center;margin-bottom:4px}.header h2{margin:0;font-size:14px}.meta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;padding:0 4px}.meta span{font-weight:bold}';
    html += '</style></head><body>';

    const order = {'free':0,'reduced':1,'paid':2};
    roomsInAgeOrder.forEach(room => {
        const roomStudents = [...roomGroups[room]].sort((a,b) => {
            const av = order[(a.F_R_P_Food||'').trim().toLowerCase()] !== undefined ? order[(a.F_R_P_Food||'').trim().toLowerCase()] : 2;
            const bv = order[(b.F_R_P_Food||'').trim().toLowerCase()] !== undefined ? order[(b.F_R_P_Food||'').trim().toLowerCase()] : 2;
            return av !== bv ? av - bv : (a.Last_Name||'').localeCompare(b.Last_Name||'');
        });

        // Attendance sheet
        html += '<div class="sheet"><div class="header"><h2>DAILY ATTENDANCE RECORD</h2></div>';
        html += '<div class="meta"><span>Site: Children of Promise</span><span>Month/Year: '+monthYear+'</span></div>';
        html += '<div class="meta"><span>Classroom: '+room+'</span></div>';
        html += '<table><thead><tr><th class="name-col">Child\'s Full Name</th>';
        for(let d=1;d<=daysInMonth;d++){html+='<th class="day-col'+(weekendDays.includes(d)?' weekend':'')+'">'+d+'</th>';}
        html += '<th class="total-col-free">Total</th><th class="total-col">Total Hrs</th></tr></thead><tbody>';
        roomStudents.forEach((s,i)=>{html+='<tr><td class="name-col">'+(i+1)+'. '+s.Last_Name+', '+s.First_Name+'</td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="day-col'+(weekendDays.includes(d)?' weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td></tr>';});
        for(let e=roomStudents.length;e<19;e++){html+='<tr><td class="name-col">'+(e+1)+'.</td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="day-col'+(weekendDays.includes(d)?' weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td></tr>';}
        html+='<tr class="totals-row separator-row"><td class="name-col"><strong>Daily Total</strong></td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="'+(weekendDays.includes(d)?'weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td></tr></tbody></table></div>';

        // Meal sheets
        meals.forEach(meal => {
            html += '<div class="sheet"><div class="header"><h2>MEAL PARTICIPATION RECORD</h2></div>';
            html += '<div class="meta"><span>Site: Children of Promise</span><span>Month/Year: '+monthYear+'</span></div>';
            html += '<div class="meta"><span>Classroom: '+room+'</span><span>Program: ☑ Child Care Center</span><span>Meal Service: ☑ '+meal+'</span></div>';
            html += '<table><thead><tr><th class="name-col">Child\'s Full Name</th><th class="frp-col">F/R/P</th>';
            for(let d=1;d<=daysInMonth;d++)html+='<th class="day-col'+(weekendDays.includes(d)?' weekend':'')+'">'+d+'</th>';
            html += '<th class="total-col-free">Free</th><th class="total-col">Red</th><th class="total-col">Paid</th></tr></thead><tbody>';
            roomStudents.forEach((s,i)=>{const frp=(s.F_R_P_Food||'P').charAt(0).toUpperCase();html+='<tr><td class="name-col">'+(i+1)+'. '+s.Last_Name+', '+s.First_Name+'</td><td class="frp-col">'+frp+'</td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="day-col'+(weekendDays.includes(d)?' weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';});
            for(let e=roomStudents.length;e<19;e++){html+='<tr><td class="name-col">'+(e+1)+'.</td><td class="frp-col"></td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="day-col'+(weekendDays.includes(d)?' weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';}
            html+='<tr class="totals-row separator-row"><td class="name-col"><strong>Daily Totals</strong></td><td></td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="'+(weekendDays.includes(d)?'weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';
            ['Free Daily Totals','Reduced Daily Totals','Paid Daily Totals'].forEach(label=>{html+='<tr class="totals-row"><td class="name-col">'+label+'</td><td></td>';for(let d=1;d<=daysInMonth;d++)html+='<td class="'+(weekendDays.includes(d)?'weekend':'')+'"></td>';html+='<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';});
            html += '</tbody></table><div style="font-size:7px;text-align:right;margin-top:3px;color:#666;">ISBE 68-75 (9/13)</div></div>';
        });
    });
    html += '</body></html>';

    let frame = document.getElementById('foodPrintFrame');
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.id = 'foodPrintFrame';
    frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;';
    document.body.appendChild(frame);
    frame.contentDocument.open();
    frame.contentDocument.write(html);
    frame.contentDocument.close();
    setTimeout(() => frame.contentWindow.print(), 500);
}
