    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; }
        /* Left-aligned, but inset 15% from the left to match the sub-nav links above. */
        .at-layout { display:flex;align-items:flex-start;justify-content:flex-start;padding:20px 20px 20px 15%; }
        .at-wrapper { display:flex;max-height:calc(100vh - 130px);width:100%;max-width:980px;box-shadow:0 4px 24px rgba(0,0,0,0.12);border-radius:12px; }
        .at-sidebar { width:210px;flex-shrink:0;background:var(--sp-surface-2);border:1px solid var(--sp-border);border-right:none;overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .at-sidebar button {
            display:block;width:100%;text-align:left;padding:11px 16px;border:none;cursor:pointer;
            background:transparent;font-size:0.86rem;font-weight:700;color:var(--sp-text);
            border-left:3px solid transparent;transition:background 0.15s;
        }
        .at-sidebar button:hover:not(.on) { background:var(--sp-surface); }
        .at-sidebar button.on { background:var(--sp-accent-soft);border-left-color:var(--sp-accent);color:var(--sp-accent); }
        .at-room-cap { font-size:0.72rem;font-weight:600;color:var(--sp-muted);margin-top:2px; }
        .at-card { background:var(--sp-surface);border:1px solid var(--sp-border);flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;max-height:calc(100vh - 130px); }
        .at-head { padding:12px 20px;border-bottom:1px solid var(--sp-border); }
        .at-title { font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary); }
        .at-room-name { font-size:1.05rem;font-weight:800;color:var(--sp-text);margin-bottom:4px;text-align:center; }
        .at-room-sub { font-size:0.78rem;color:var(--sp-muted);text-align:center;margin-bottom:16px; }
        .at-body { overflow-y:auto;flex:1;padding:20px 24px; }
        .at-chart { display:flex;align-items:flex-end;gap:14px;padding:0 8px; }
        .at-col { display:flex;flex-direction:column;align-items:center;gap:8px;flex:1; }
        .at-count { font-size:0.84rem;font-weight:800;color:var(--sp-text);text-align:center;line-height:1.25; }
        .at-count .at-wl { color:var(--sp-accent);font-weight:800; }
        /* Single solid fill, bottom-aligned — identical to Actual Attendance. */
        .at-bar-track {
            position:relative;width:100%;background:var(--sp-bad-bg);border:1px solid var(--sp-bad-br);
            border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;
        }
        .at-bar-fill { width:100%;background:var(--sp-accent);border-radius:6px 6px 0 0;transition:height 0.4s; }
        .at-over .at-bar-fill { background:var(--sp-bad-fg); }
        .at-day { font-size:0.84rem;font-weight:700;color:var(--sp-muted); }
        .at-legend { display:flex;gap:18px;margin-top:16px;justify-content:center;flex-wrap:wrap; }
        .at-legend > div { display:flex;align-items:center;gap:7px;font-size:0.8rem;color:var(--sp-text-2); }
        .at-swatch { width:15px;height:15px;border-radius:3px; }
        .at-swatch-wait { background:repeating-linear-gradient(45deg,var(--sp-accent) 0 4px,var(--sp-accent-soft) 4px 8px); }
        .at-count .at-over-n { color:var(--sp-bad-fg);font-weight:800; }
        .at-note { margin-top:14px;font-size:0.76rem;color:var(--sp-muted);text-align:center;line-height:1.5; }
        .at-over-flag { color:var(--sp-bad-fg);font-weight:800; }
        .at-empty { padding:40px;text-align:center;color:var(--sp-muted);font-size:0.9rem; }
    </style>
</head>
<body>

</style>
<div class="em-subnav-wrap">
    <nav class="em-subnav" aria-label="Enrollment management">

        <a href="/staff/ems.html">Enrolled Students</a>
        <a href="/staff/benefits.html">Benefits &amp; Eligibility</a>
        <a href="/staff/attendance.html">Actual Attendance</a>
        <a href="/staff/attendance-projected.html" class="on" aria-current="page">Projected Attendance</a>
    </nav>

<div class="at-layout">
    <div class="at-wrapper">
        <div class="at-sidebar" id="atSidebar"></div>
        <div class="at-card">
            <div class="at-head">
                <div class="at-title">Projected Attendance by Room - if all children on waiting list enroll today</div>
            </div>
            <div class="at-body" id="atBody">
                <div class="at-empty">Loading…</div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
/* Projected attendance — an exact replica of Actual Attendance, one room at a time, but
   showing the rooms AFTER the waiting list is folded in and everyone is re-seated by age.

   The server (/api/reports -> projectedAttendance) takes every child — enrolled plus the
   whole waiting list — and re-seats them in two passes. First, PFA children go straight into
   Pre-School regardless of age (PFA is the grant preschool program, not an age band), up to
   its capacity. Then everyone else is re-seated youngest-first up an age ladder of rooms: the
   youngest fill the first room (Infant), and as they age up they shift into the next room,
   older children moving up to fill any open slots, finally spilling into whatever Pre-School
   seats PFA did not take. Each room fills only to its DCFS capacity. "Over capacity" only
   appears once the last room in the ladder (Pre-School) is full. Because the PFA 2s and 3s
   are pulled up into Pre-School, the 2 & 3 Year Olds room shows the empty seats they would
   otherwise have filled. Before & Afterschool is a separate program, never on the ladder.

   The server returns one row PER ROOM (same per-room shape as Actual Attendance):
     { roomNumber, room, capacity, occupancy:[Mon..Fri], overflow:[5] }
   This page renders it with the same sidebar + single chart as attendance.html — a plain
   solid fill (everyone is treated as enrolled in this projection). A room the ladder
   overflows is flagged red. */

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const CHART_H = 220;
let rooms = [];
let activeRoom = 0;

function esc(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function n(v) { return parseInt(v, 10) || 0; }

function renderSidebar() {
    const box = document.getElementById('atSidebar');
    box.innerHTML = rooms.map((r, i) => {
        const over = Math.max.apply(null, (r.overflow || [0]).map(n));
        const tag = over ? ' · ' + over + ' over' : '';
        return `<button id="atRoom${i}" onclick="showRoom(${i})">
            <div>${esc(r.room || 'Unknown')}</div>
            <div class="at-room-cap">Capacity ${n(r.capacity)}${tag}</div>
        </button>`;
    }).join('');
}

function showRoom(idx) {
    activeRoom = idx;
    rooms.forEach((_, i) => {
        const btn = document.getElementById('atRoom' + i);
        if (btn) btn.classList.toggle('on', i === idx);
    });

    const r = rooms[idx];
    const room = r.room || 'Unknown';
    const capacity = Math.max(n(r.capacity), 1);
    let anyOver = false;

    const cols = DAYS.map((day, i) => {
        const occ = n(r.occupancy[i]);
        const over = n((r.overflow || [])[i]);
        if (over) anyOver = true;
        // Solid fill scaled to the room's own DCFS capacity — identical to Actual Attendance.
        const fillH = Math.round(Math.min(occ / capacity, 1) * CHART_H);
        return `<div class="at-col${over ? ' at-over' : ''}">
            <div class="at-count">${occ}/${capacity}${over ? `<br><span class="at-over-n">+${over} over</span>` : ''}</div>
            <div class="at-bar-track" style="height:${CHART_H}px;">
                <div class="at-bar-fill" style="height:${fillH}px;"></div>
            </div>
            <div class="at-day">${day}</div>
        </div>`;
    }).join('');

    const legend = `<div class="at-legend">
        <div><span class="at-swatch" style="background:var(--sp-bad-bg);border:1px solid var(--sp-bad-br);"></span> Capacity (${capacity})</div>
        <div><span class="at-swatch" style="background:var(--sp-accent);"></span> Projected (youngest-first fill)</div>
    </div>`;

    const note = anyOver
        ? '<div class="at-note"><span class="at-over-flag">Over capacity — the age ladder cannot seat everyone on the flagged days. This only shows on Pre-School, the last room; the overflow are the oldest children.</span></div>'
        : '';

    document.getElementById('atBody').innerHTML = `
        <div class="at-room-name">${esc(room)}</div>
        <div class="at-chart" style="height:${CHART_H + 56}px;">${cols}</div>
        ${legend}${note}`;
}

async function load() {
    try {
        const res = await apiFetch('/api/reports');
        const data = await res.json();
        rooms = (data && data.projectedAttendance) || [];
        if (!Array.isArray(rooms) || !rooms.length) {
            document.getElementById('atBody').innerHTML =
                '<div class="at-empty">No projection data yet. Add rooms and waiting-list entries first.</div>';
            return;
        }
        renderSidebar();
        showRoom(0);
    } catch (e) {
        document.getElementById('atBody').innerHTML =
            '<div class="at-empty">Could not load projected attendance: ' + esc(e.message) + '</div>';
    }
}

load();
</script>
<!-- Floating Deploy/Restart widget while this area is under active development. -->
<script src="deploy-widget.js"></script>
</body>
</html>
