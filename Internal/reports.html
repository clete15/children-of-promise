<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(to right, #5585e0 0%, #2563eb 10%, #1e3a8a 100%); min-height: 100vh; }
        .rp-layout { display:flex;align-items:flex-start;justify-content:center;padding:20px; }
        .rp-wrapper { display:flex;max-height:calc(100vh - 130px);width:100%;max-width:1100px; }
        .rp-sidebar { width:180px;flex-shrink:0;background:rgba(255,255,255,0.12);overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .rp-sidebar button, .rp-sidebar a { display:block;width:100%;text-align:left;padding:12px 16px;border:none;cursor:pointer;background:transparent;transition:background 0.15s;text-decoration:none; }
        .rp-sidebar button.active { background:rgba(255,255,255,0.2); }
        .rp-sidebar button:hover:not(.active), .rp-sidebar a:hover { background:rgba(255,255,255,0.1); }
        .rp-sidebar .label { font-size:0.82rem;font-weight:700;color:white; }
        .rp-sidebar .sub { padding:10px 16px 10px 28px; }
        .rp-sidebar .sub .label { font-size:0.75rem;font-weight:600;color:rgba(255,255,255,0.8); }
        .rp-divider { border-top:1px solid rgba(255,255,255,0.15);margin:8px 0; }
        .rp-card { background:white;flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;box-shadow:0 4px 24px rgba(0,0,0,0.2);max-height:calc(100vh - 130px); }
        .rp-body { overflow-y:auto;flex:1;padding:20px 24px; }
        .rp-title { font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--primary);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border); }
        .rp-btn { padding:6px 14px;color:white;border:none;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer; }
        .rp-btn.green { background:#16a34a; }
        .rp-btn.blue { background:var(--primary); }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Reports &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <a class="header-back" href="/staff/">← Staff Portal</a>
</header>

<div class="rp-layout">
    <div class="rp-wrapper">
        <div class="rp-sidebar">
            <button class="active" id="rptBtn-attendance" onclick="selectReport('attendance')"><div class="label">📊 Attendance</div></button>
            <button id="rptBtn-program" onclick="selectReport('program')"><div class="label">📋 Program Type</div></button>
            <button id="rptBtn-paytype" onclick="selectReport('paytype')"><div class="label">💳 Pay Type</div></button>
            <button id="rptBtn-ccap" onclick="selectReport('ccap')"><div class="label">💰 CCAP</div></button>
            <button id="rptBtn-summer" onclick="selectReport('summer')"><div class="label">☀️ Summer Program</div></button>
            <div class="rp-divider"></div>
            <button id="rptBtn-food" onclick="selectReport('food')"><div class="label">🍽️ Food Program</div></button>
            <button class="sub" onclick="toggleFoodDetail()"><div class="label">✏️ Income Detail</div></button>
            <button class="sub" onclick="toggleFoodRoster()"><div class="label">📋 Full Roster</div></button>
            <button class="sub" onclick="printFoodCountSheets()"><div class="label">🖨️ Monthly Count Sheets</div></button>
            <a class="sub" href="/staff/menus.html"><div class="label">🍽️ Weekly Menus</div></a>
        </div>

        <div class="rp-card">
            <div class="rp-body">
                <div id="rptEnrollment">
                    <div class="rp-title">Projected Attendance by Room</div>
                    <div style="display:flex;gap:0;min-height:320px;">
                        <div id="rptRoomSidebar" style="width:180px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;"></div>
                        <div id="rptRoomChartArea" style="flex:1;padding:16px 20px;"><div>Loading…</div></div>
                    </div>
                </div>
                <div id="rptFood" style="display:none;"><div class="rp-title">Food Program</div><div>Loading…</div></div>
                <div id="rptProgram" style="display:none;"><div class="rp-title">Program Type</div><div>Loading…</div></div>
                <div id="rptPayType" style="display:none;"><div class="rp-title">Pay Type</div><div>Loading…</div></div>
                <div id="rptCcap" style="display:none;"><div class="rp-title">CCAP</div><div>Loading…</div></div>
                <div id="rptSummer" style="display:none;"><div class="rp-title">☀️ Summer Program Sign-Ups</div><div>Loading…</div></div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
let rptDailyData = [];
let rptActiveRoom = 0;
let activeReport = 'attendance';
let foodDetailData = [];

const REPORT_IDS = {
    attendance: 'rptEnrollment', food: 'rptFood', program: 'rptProgram',
    paytype: 'rptPayType', ccap: 'rptCcap', summer: 'rptSummer',
};

const frpColor = v => v === 'Free' ? '#16a34a' : v === 'Reduced' ? '#d97706' : '#64748b';

async function init() {
    await Promise.all([loadClassrooms(), loadStudents()]);
    await loadReports();
}

function selectReport(name) {
    activeReport = name;
    Object.entries(REPORT_IDS).forEach(([key, id]) => {
        const el = document.getElementById(id);
        if (el) el.style.display = key === name ? 'block' : 'none';
        const btn = document.getElementById('rptBtn-' + key);
        if (btn) btn.classList.toggle('active', key === name);
    });
}

async function loadReports() {
    try {
        const res = await apiFetch('/api/reports');
        const data = await res.json();
        renderRptEnrollment(data.byRoomDaily);
        renderRptBars('rptFood', 'Food Program', data.byFood, ['Free','Reduced','Paid','Unknown']);
        foodDetailData = data.foodDetail || [];
        renderRptBars('rptProgram', 'Program Type', data.byProgram, null);
        renderRptBars('rptPayType', 'Pay Type', data.byPayType, null);
        renderRptCcap(data.ccapEligible);
        renderRptSummer(data.summerProgram);
    } catch (e) {
        Object.values(REPORT_IDS).forEach(id => {
            const el = document.getElementById(id);
            const loading = el && el.querySelector('div:last-child');
            if (loading) loading.textContent = 'Failed to load.';
        });
    }
}

// ── ATTENDANCE ──
function renderRptEnrollment(daily) {
    if (!daily || !daily.length) { document.getElementById('rptRoomChartArea').innerHTML = 'No data.'; return; }
    rptDailyData = daily;
    document.getElementById('rptRoomSidebar').innerHTML = daily.map((r, i) =>
        `<button onclick="showRptRoomChart(${i})" id="rptRsBtn${i}"
            style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:0.8rem;font-weight:600;color:var(--text);border-left:3px solid transparent;transition:background 0.15s;">
            ${r[0] || 'Unknown'}
        </button>`
    ).join('');
    showRptRoomChart(0);
}

function showRptRoomChart(idx) {
    rptActiveRoom = idx;
    rptDailyData.forEach((_, i) => {
        const btn = document.getElementById(`rptRsBtn${i}`);
        if (!btn) return;
        const on = i === idx;
        btn.style.background = on ? '#eff6ff' : 'none';
        btn.style.borderLeftColor = on ? 'var(--primary)' : 'transparent';
        btn.style.color = on ? 'var(--primary)' : 'var(--text)';
    });
    const r = rptDailyData[idx];
    const room = r[0] || 'Unknown';
    const capacity = parseInt(r[1] || 1);
    const days = ['Mon','Tue','Wed','Thu','Fri'];
    const counts = [parseInt(r[2]||0), parseInt(r[3]||0), parseInt(r[4]||0), parseInt(r[5]||0), parseInt(r[6]||0)];
    const chartH = 200;
    const cols = days.map((day, i) => {
        const count = counts[i];
        const fillH = Math.round(Math.min(count / capacity, 1) * chartH);
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;">
            <div style="font-size:0.78rem;font-weight:700;color:var(--text);">${count}/${capacity}</div>
            <div style="position:relative;width:100%;height:${chartH}px;background:#fecaca;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;">
                <div style="width:100%;height:${fillH}px;background:var(--primary);border-radius:6px 6px 0 0;transition:height 0.4s;"></div>
            </div>
            <div style="font-size:0.78rem;font-weight:700;color:var(--text-muted);">${day}</div>
        </div>`;
    }).join('');
    document.getElementById('rptRoomChartArea').innerHTML = `
        <div style="font-size:0.9rem;font-weight:800;color:var(--text);margin-bottom:12px;text-align:center;">${room}</div>
        <div style="display:flex;align-items:flex-end;gap:12px;height:${chartH + 50}px;padding:0 8px;">${cols}</div>
        <div style="display:flex;gap:16px;margin-top:12px;justify-content:center;">
            <div style="display:flex;align-items:center;gap:6px;font-size:0.72rem;"><div style="width:14px;height:14px;background:#fecaca;border-radius:3px;"></div> Capacity (${capacity})</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:0.72rem;"><div style="width:14px;height:14px;background:var(--primary);border-radius:3px;"></div> Projected</div>
        </div>`;
}

// ── BAR CHARTS (Food / Program / Pay Type) ──
function renderRptBars(cardId, title, rows, order) {
    const card = document.getElementById(cardId);
    if (!rows || !rows.length) {
        card.innerHTML = `<div class="rp-title">${title}</div><div style="color:var(--text-muted);font-size:0.85rem;">No data.</div>`;
        return;
    }
    const sorted = order ? order.map(o => rows.find(r => r[0] === o) || [o, 0]) : rows;
    const max = Math.max(...sorted.map(r => parseInt(r[1] || 0)));
    card.innerHTML = `<div class="rp-title">${title}</div>` + sorted.map(r => {
        const label = r[0] || 'Unknown';
        const val = parseInt(r[1] || 0);
        const pct = max ? Math.round(val / max * 100) : 0;
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div style="font-size:0.8rem;font-weight:600;color:var(--text);min-width:100px;">${label}</div>
            <div style="flex:1;background:#e2e8f0;border-radius:4px;height:18px;overflow:hidden;">
                <div style="height:100%;width:${Math.max(pct,4)}%;background:var(--primary);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;">
                    <span style="font-size:0.68rem;font-weight:700;color:white;">${val}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── FOOD PROGRAM: editable income detail ──
function toggleFoodDetail() {
    selectReport('food');
    const existing = document.getElementById('foodDetailTable');
    if (existing) { existing.remove(); return; }
    if (!foodDetailData.length) return;
    window._foodRooms = [...new Set(foodDetailData.map(r => r[0] || 'Unknown'))];
    window._foodFilterRoom = 'All';
    renderFoodDetailTable();
}

function renderFoodDetailTable() {
    const card = document.getElementById('rptFood');
    const existing = document.getElementById('foodDetailTable');
    if (existing) existing.remove();
    const rooms = window._foodRooms || [];
    const filterRoom = window._foodFilterRoom || 'All';
    const filtered = filterRoom === 'All' ? foodDetailData : foodDetailData.filter(r => (r[0] || 'Unknown') === filterRoom);
    const chip = (label, on, action) =>
        `<button onclick="${action}" style="padding:4px 10px;border-radius:5px;border:none;font-size:0.72rem;cursor:pointer;background:${on?'var(--primary)':'#e2e8f0'};color:${on?'white':'var(--text)'};font-weight:600;white-space:nowrap;">${label}</button>`;

    const table = document.createElement('div');
    table.id = 'foodDetailTable';
    table.style.cssText = 'margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;';
    table.innerHTML = `
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;gap:8px;overflow-x:auto;">
            ${chip(`All (${foodDetailData.length})`, filterRoom === 'All', `window._foodFilterRoom='All';renderFoodDetailTable()`)}
            ${rooms.map(rm => {
                const cnt = foodDetailData.filter(r => (r[0]||'Unknown') === rm).length;
                return chip(`${rm} (${cnt})`, filterRoom === rm, `window._foodFilterRoom='${rm}';renderFoodDetailTable()`);
            }).join('')}
        </div>
        <div style="max-height:350px;overflow:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:0.75rem;">
            <thead><tr style="background:#f8fafc;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1;">
                <th style="padding:8px 12px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);min-width:140px;">Room</th>
                <th style="padding:8px 12px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);min-width:130px;">Name</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);width:80px;">Income</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);width:45px;">HH</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);width:55px;">F/R/P</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Benefits</th>
                <th style="padding:8px 6px;text-align:center;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);width:40px;">Save</th>
            </tr></thead>
            <tbody>${filtered.map((r, i) => `<tr style="border-bottom:1px solid var(--border);white-space:nowrap;">
                <td style="padding:6px 12px;font-size:0.73rem;">${r[0] || '—'}</td>
                <td style="padding:6px 12px;font-weight:600;font-size:0.73rem;">${r[1]}, ${r[2]}</td>
                <td style="padding:4px 6px;"><input type="number" id="fdInc_${i}" value="${r[3] || ''}" onchange="markFoodDetailChanged(${i})" style="width:70px;padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:0.7rem;"></td>
                <td style="padding:4px 6px;"><input type="number" id="fdHH_${i}" value="${r[4] || ''}" min="1" max="15" onchange="markFoodDetailChanged(${i})" style="width:36px;padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:0.7rem;"></td>
                <td style="padding:6px 8px;font-weight:700;color:${frpColor(r[5])};">${r[5] || '—'}</td>
                <td style="padding:6px 8px;font-size:0.7rem;">${r[6] || '—'}</td>
                <td style="padding:4px 6px;text-align:center;"><button id="fdSave_${i}" onclick="saveFoodDetailRow(${i})" disabled style="padding:3px 6px;background:var(--primary);color:white;border:none;border-radius:3px;font-size:0.63rem;font-weight:700;cursor:pointer;opacity:0.3;">Save</button></td>
            </tr>`).join('')}</tbody>
        </table></div>`;
    card.appendChild(table);
}

function markFoodDetailChanged(i) {
    const btn = document.getElementById('fdSave_' + i);
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
}

async function saveFoodDetailRow(i) {
    const filterRoom = window._foodFilterRoom || 'All';
    const filtered = filterRoom === 'All' ? foodDetailData : foodDetailData.filter(r => (r[0] || 'Unknown') === filterRoom);
    const r = filtered[i];
    if (!r) return;
    const newIncome = document.getElementById('fdInc_' + i)?.value || '';
    const newHH = document.getElementById('fdHH_' + i)?.value || '';
    const btn = document.getElementById('fdSave_' + i);
    btn.disabled = true; btn.textContent = '…';
    try {
        // foodDetail columns: [Room, Last_Name, First_Name, Income, HHSize, FRP, Benefits]
        const res = await apiFetch('/api/students/' + encodeURIComponent(r[2]) + '/' + encodeURIComponent(r[1]), {
            method: 'PUT', body: JSON.stringify({ householdIncome: newIncome, householdSize: newHH })
        });
        const data = await res.json();
        if (data.success) {
            r[3] = newIncome;
            r[4] = newHH;
            showNotification(r[2] + ' ' + r[1] + ' updated', 'success');
            btn.style.opacity = '0.3';
        } else {
            showNotification('Update failed', 'error');
            btn.disabled = false; btn.style.opacity = '1';
        }
    } catch (e) {
        showNotification('Network error', 'error');
        btn.disabled = false; btn.style.opacity = '1';
    } finally { btn.textContent = 'Save'; }
}

// ── FOOD PROGRAM: read-only full roster ──
function toggleFoodRoster() {
    selectReport('food');
    const card = document.getElementById('rptFood');
    const existing = document.getElementById('foodRosterTable');
    if (existing) { existing.remove(); return; }
    const activeStudents = students.filter(s => isTruthy(s.Active)).sort(sortByRoomThenName);
    const div = document.createElement('div');
    div.id = 'foodRosterTable';
    div.style.cssText = 'margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;';
    div.innerHTML = `<div style="max-height:450px;overflow:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:0.75rem;">
            <thead><tr style="background:#f8fafc;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1;">
                <th style="padding:8px 12px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">First Name</th>
                <th style="padding:8px 12px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Last Name</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">PFA/PI</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Room</th>
                <th style="padding:8px 8px;text-align:left;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">F/R/P</th>
                <th style="padding:8px 8px;text-align:right;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">Income</th>
                <th style="padding:8px 8px;text-align:center;font-size:0.63rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);">HH Size</th>
            </tr></thead>
            <tbody>${activeStudents.map(s => `<tr style="border-bottom:1px solid var(--border);">
                <td style="padding:6px 12px;font-size:0.73rem;">${s.First_Name}</td>
                <td style="padding:6px 12px;font-weight:600;font-size:0.73rem;">${s.Last_Name}</td>
                <td style="padding:6px 8px;font-size:0.73rem;">${s.PFA_PI_na || '—'}</td>
                <td style="padding:6px 8px;font-size:0.73rem;">${s.Room || s.RoomNumber || '—'}</td>
                <td style="padding:6px 8px;font-weight:700;color:${frpColor(s.F_R_P_Food)};">${s.F_R_P_Food || '—'}</td>
                <td style="padding:6px 8px;text-align:right;font-size:0.73rem;">${s.HouseholdIncome ? '$' + Number(s.HouseholdIncome).toLocaleString() : '—'}</td>
                <td style="padding:6px 8px;text-align:center;font-size:0.73rem;">${s.HouseholdSize || '—'}</td>
            </tr>`).join('')}</tbody>
        </table></div>`;
    card.appendChild(div);
}

// ── FOOD PROGRAM: monthly ISBE count sheets (print) ──
function printFoodCountSheets() {
    const now = new Date();
    const defaultMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const input = prompt('Enter month (YYYY-MM):', defaultMonth);
    if (!input) return;
    const parts = input.split('-');
    const year = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1;
    if (isNaN(year) || isNaN(month) || month < 0 || month > 11) { alert('Invalid month format. Use YYYY-MM'); return; }

    const activeStudents = students.filter(s => isTruthy(s.Active));
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const monthYear = monthNames[month] + ' ' + year;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const meals = ['Breakfast', 'Lunch', 'PM Snack'];

    const weekendDays = [];
    for (let d = 1; d <= daysInMonth; d++) {
        const dow = new Date(year, month, d).getDay();
        if (dow === 0 || dow === 6) weekendDays.push(d);
    }

    const roomGroups = {};
    activeStudents.forEach(s => {
        const room = s.Room || 'Room ' + s.RoomNumber;
        if (!roomGroups[room]) roomGroups[room] = [];
        roomGroups[room].push(s);
    });

    let html = '<!DOCTYPE html><html><head><title>Meal Participation Records - ' + monthYear + '</title><style>';
    html += '@page { size: landscape; margin: 0.2in; }';
    html += 'body { font-family: Arial, sans-serif; margin: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }';
    html += '.sheet { page-break-after: always; padding: 6px; }';
    html += '.sheet:last-child { page-break-after: auto; }';
    html += '.header { text-align: center; margin-bottom: 4px; }';
    html += '.header h2 { margin: 0; font-size: 14px; }';
    html += '.meta { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; padding: 0 4px; }';
    html += '.meta span { font-weight: bold; }';
    html += 'table { border-collapse: collapse; width: 100%; font-size: 9px; }';
    html += 'th, td { border: 1px solid #000; padding: 3px 2px; text-align: center; }';
    html += 'th { background: #d9d9d9; font-size: 8px; font-weight: bold; }';
    html += '.name-col { text-align: left; min-width: 140px; font-size: 9px; white-space: nowrap; padding-left: 4px; font-weight: bold; }';
    html += '.frp-col { font-weight: bold; width: 20px; background: #f0f0f0; }';
    html += '.day-col { width: 18px; min-width: 18px; }';
    html += '.day-col.weekend { background: #808080 !important; }';
    html += '.total-col { width: 30px; background: #d9d9d9; font-weight: bold; }';
    html += '.total-col-free { width: 30px; background: #d9d9d9; font-weight: bold; border-left: 3px solid #000; }';
    html += '.totals-row td { font-weight: bold; font-size: 8px; background: #e8e8e8; }';
    html += '.totals-row .name-col { background: #d0d0d0; }';
    html += '.frp-totals-row td { font-weight: bold; font-size: 8px; background: #f5f5f5; }';
    html += '.frp-totals-row .name-col { font-weight: bold; }';
    html += '.separator-row td { border-top: 3px solid #000; }';
    html += '</style></head><body>';

    const dayCells = (extraClass) => {
        let out = '';
        for (let d = 1; d <= daysInMonth; d++) {
            const we = weekendDays.includes(d) ? ' weekend' : '';
            out += '<td class="' + (extraClass ? extraClass + we : we.trim()) + '"></td>';
        }
        return out;
    };
    const dayHeaders = () => {
        let out = '';
        for (let d = 1; d <= daysInMonth; d++) {
            out += '<th class="day-col' + (weekendDays.includes(d) ? ' weekend' : '') + '">' + d + '</th>';
        }
        return out;
    };

    Object.keys(roomGroups).sort().forEach(room => {
        // ISBE meal sheets group by F/R/P (Free, Reduced, Paid), then by last name.
        const order = { 'free': 0, 'reduced': 1, 'paid': 2 };
        const rank = s => {
            const v = order[(s.F_R_P_Food || '').trim().toLowerCase()];
            return v !== undefined ? v : 2;
        };
        const roomStudents = [...roomGroups[room]].sort((a, b) => {
            const d = rank(a) - rank(b);
            return d !== 0 ? d : (a.Last_Name || '').localeCompare(b.Last_Name || '');
        });

        // Daily attendance sheet
        html += '<div class="sheet">';
        html += '<div class="header"><h2>DAILY ATTENDANCE RECORD</h2></div>';
        html += '<div class="meta"><span>Site: Children of Promise</span><span>Month/Year: ' + monthYear + '</span></div>';
        html += '<div class="meta"><span>Classroom: ' + room + '</span></div>';
        html += '<table><thead><tr><th class="name-col">Child\'s Full Name</th>' + dayHeaders();
        html += '<th class="total-col-free">Total</th></tr></thead><tbody>';
        roomStudents.forEach((s, i) => {
            html += '<tr><td class="name-col">' + (i+1) + '. ' + s.Last_Name + ', ' + s.First_Name + '</td>';
            html += dayCells('day-col') + '<td class="total-col-free"></td></tr>';
        });
        for (let e = roomStudents.length; e < 19; e++) {
            html += '<tr><td class="name-col">' + (e+1) + '.</td>' + dayCells('day-col') + '<td class="total-col-free"></td></tr>';
        }
        html += '<tr class="totals-row separator-row"><td class="name-col"><strong>Daily Total</strong></td>';
        html += dayCells('') + '<td class="total-col-free"></td></tr>';
        html += '</tbody></table></div>';

        // One meal participation sheet per meal service
        meals.forEach(meal => {
            html += '<div class="sheet">';
            html += '<div class="header"><h2>MEAL PARTICIPATION RECORD</h2></div>';
            html += '<div class="meta"><span>Site: Children of Promise</span><span>Month/Year: ' + monthYear + '</span></div>';
            html += '<div class="meta"><span>Classroom: ' + room + '</span><span>Program: ☑ Child Care Center</span><span>Meal Service: ☑ ' + meal + '</span></div>';
            html += '<table><thead><tr><th class="name-col">Child\'s Full Name</th><th class="frp-col">F/R/P</th>' + dayHeaders();
            html += '<th class="total-col-free">Free</th><th class="total-col">Red</th><th class="total-col">Paid</th></tr></thead><tbody>';
            roomStudents.forEach((s, i) => {
                const frp = (s.F_R_P_Food || 'P').charAt(0).toUpperCase();
                html += '<tr><td class="name-col">' + (i+1) + '. ' + s.Last_Name + ', ' + s.First_Name + '</td>';
                html += '<td class="frp-col">' + frp + '</td>' + dayCells('day-col');
                html += '<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';
            });
            for (let e = roomStudents.length; e < 19; e++) {
                html += '<tr><td class="name-col">' + (e+1) + '.</td><td class="frp-col"></td>' + dayCells('day-col');
                html += '<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';
            }
            html += '<tr class="totals-row separator-row"><td class="name-col"><strong>Daily Totals</strong></td><td></td>';
            html += dayCells('') + '<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';
            ['Free Daily Totals','Reduced Daily Totals','Paid Daily Totals'].forEach(label => {
                html += '<tr class="frp-totals-row"><td class="name-col">' + label + '</td><td></td>';
                html += dayCells('') + '<td class="total-col-free"></td><td class="total-col"></td><td class="total-col"></td></tr>';
            });
            html += '</tbody></table>';
            html += '<div style="font-size:7px;text-align:right;margin-top:3px;color:#666;">ISBE 68-75 (9/13)</div>';
            html += '</div>';
        });
    });

    html += '</body></html>';

    // Print through a hidden iframe so pop-up blockers don't interfere.
    let frame = document.getElementById('foodPrintFrame');
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.id = 'foodPrintFrame';
    frame.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;';
    document.body.appendChild(frame);
    frame.contentDocument.open();
    frame.contentDocument.write(html);
    frame.contentDocument.close();
    setTimeout(() => { frame.contentWindow.print(); }, 500);
}

function toggleCollapse(bodyId, headerEl) {
    const body = document.getElementById(bodyId);
    if (!body) return;
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? 'block' : 'none';
    const arrow = headerEl.querySelector('.arrow');
    if (arrow) arrow.textContent = hidden ? '▼' : '▶';
}

function exportCCAPReport() {
    let csv = 'CCAP INCOME THRESHOLDS (225% FPL)\nHH Size\tMax Annual Income\tMax Monthly\n';
    CCAP_THRESHOLDS.forEach((t, i) => { csv += (i+1) + '\t' + t + '\t' + Math.round(t/12) + '\n'; });
    csv += '\nCCAP ELIGIBLE STUDENTS (Not Currently on CCAP)\nFirst Name\tLast Name\tRoom\tIncome\tHH Size\tThreshold\n';
    students.filter(isCCAPEligible).sort(sortByName).forEach(s => {
        const idx = Math.max(1, Math.min(parseInt(s.HouseholdSize)||1, 8)) - 1;
        csv += s.First_Name + '\t' + s.Last_Name + '\t' + (s.Room||'') + '\t' + (s.HouseholdIncome||'') + '\t' + (s.HouseholdSize||'') + '\t' + CCAP_THRESHOLDS[idx] + '\n';
    });
    const blob = new Blob([csv], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CCAP_Report_' + new Date().toISOString().split('T')[0] + '.xls';
    a.click();
    URL.revokeObjectURL(url);
}

// CCAP eligibility runs 12 months from the start date; warn inside 60 days.
function ccapRenewalStatus(startDate) {
    if (!startDate) return '<span style="color:#dc2626;font-weight:700;">No date set</span>';
    const renewal = new Date(startDate);
    renewal.setMonth(renewal.getMonth() + 12);
    const daysUntil = Math.ceil((renewal - new Date()) / (1000*60*60*24));
    if (daysUntil <= 0) return '<span style="color:#dc2626;font-weight:700;">OVERDUE</span>';
    if (daysUntil <= 60) return `<span style="color:#d97706;font-weight:700;">${daysUntil} days</span>`;
    return `<span style="color:#16a34a;">${daysUntil} days</span>`;
}

async function saveCCAPDate(firstName, lastName, dateValue) {
    try {
        const res = await apiFetch('/api/students/' + encodeURIComponent(firstName) + '/' + encodeURIComponent(lastName), {
            method: 'PUT', body: JSON.stringify({ ccapStartDate: dateValue })
        });
        const data = await res.json();
        if (data.success) {
            const s = students.find(x => x.First_Name === firstName && x.Last_Name === lastName);
            if (s) s.CCAPStartDate = dateValue;
            showNotification('CCAP date saved for ' + firstName + ' ' + lastName, 'success');
        } else { showNotification('Failed to save', 'error'); }
    } catch (e) { showNotification('Network error', 'error'); }
}
