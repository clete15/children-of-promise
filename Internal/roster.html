<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Roster – Children Of Promise</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--sp-bg); color: var(--sp-text); min-height: 100vh; margin: 0; }
        /* Themed to match the other Enrollment Management pages: 15% left inset, theme
           surfaces, dark-mode aware. (Was a fixed blue gradient with hardcoded white.) */
        .rr-layout { display:flex;align-items:flex-start;justify-content:flex-start;padding:20px 20px 20px 15%; }
        .rr-wrapper { display:flex;max-height:calc(100vh - 130px);width:100%;max-width:960px;box-shadow:0 4px 24px rgba(0,0,0,0.12);border-radius:12px; }
        .rr-sidebar { width:190px;flex-shrink:0;background:var(--sp-surface-2);border:1px solid var(--sp-border);border-right:none;overflow-y:auto;padding:8px 0;border-radius:12px 0 0 12px; }
        .rr-sidebar button { display:block;width:100%;text-align:left;padding:10px 16px;border:none;border-left:3px solid transparent;cursor:pointer;background:transparent;transition:background 0.15s,border-color 0.15s; }
        .rr-sidebar button.active { background:var(--sp-accent-soft);border-left-color:var(--sp-accent); }
        .rr-sidebar button.active div { color:var(--sp-accent); }
        .rr-sidebar button:hover:not(.active) { background:var(--sp-surface); }
        .rr-sidebar button div { font-size:0.82rem;font-weight:700;color:var(--sp-text); }
        .rr-card { background:var(--sp-surface);border:1px solid var(--sp-border);flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:0 12px 12px 0;max-height:calc(100vh - 130px); }
        .rr-header { padding:14px 20px;border-bottom:1px solid var(--sp-border);display:flex;align-items:center;gap:16px; }
        .rr-title { font-size:1rem;font-weight:800;color:var(--sp-text); }
        .rr-teacher { font-size:0.75rem;color:var(--sp-accent);font-weight:600;flex:1; }
        .rr-toggle { display:flex;align-items:center;gap:6px;font-size:0.75rem;font-weight:600;color:var(--sp-muted);cursor:pointer;white-space:nowrap; }
        .rr-toggle input { width:auto;accent-color:var(--sp-accent); }
        .rr-grid { overflow:auto; }

        /* Roster table */
        .rr-grid table { border-collapse:collapse;font-size:0.8rem;width:100%; }
        .rr-grid thead tr { border-bottom:2px solid var(--sp-border);position:sticky;top:0;z-index:1;background:var(--sp-surface-2); }
        .rr-grid th { padding:8px 6px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--sp-muted); }
        .rr-grid th.student { padding:8px 12px;text-align:left;min-width:140px;max-width:180px; }
        .rr-grid th.day { text-align:center;width:38px; }
        .rr-grid tbody tr { border-bottom:1px solid var(--sp-border); }
        .rr-grid tbody tr:hover { background:var(--sp-surface-2); }
        .rr-grid td { padding:5px 6px; }
        .rr-grid td.day { padding:7px 8px;text-align:center; }
        .rr-grid td.day input { width:auto;accent-color:var(--sp-accent); }
        .rr-grid td.student { padding:7px 12px;max-width:180px;overflow:hidden;text-overflow:ellipsis; }
        .rr-name { font-weight:600;color:var(--sp-text);white-space:nowrap; }
        .rr-age { font-size:0.68rem;color:var(--sp-muted); }
        .rr-grid select { padding:3px 4px;border:1px solid var(--sp-border-in);border-radius:4px;font-size:0.74rem;color:var(--sp-text);background:var(--sp-field-bg);width:100%; }
        .btn-row-save { padding:3px 8px;background:var(--sp-accent);color:white;border:none;border-radius:4px;font-size:0.7rem;font-weight:700;cursor:pointer;opacity:0.3; }
        .btn-row-save:not([disabled]) { opacity:1; }
        .rr-grid tfoot tr { background:var(--sp-surface-2);border-top:2px solid var(--sp-border); }
        .rr-total-label { padding:7px 12px;font-size:0.65rem;font-weight:700;color:var(--sp-accent);text-transform:uppercase;letter-spacing:0.05em; }
        .rr-total { padding:7px 8px;text-align:center;font-size:0.85rem;font-weight:800;color:var(--sp-accent); }
        .rr-empty { padding:24px;color:var(--sp-muted);font-size:0.88rem; }

        /* PI / PFA count under a room name, and the PI / PFA tag beside a child. Same rule
           and same colours as the attendance page: green = the child is in a PI or PFA room
           (they belong there), red = a PI/PFA child sitting in a room that is not one.
           Selectors are deliberately specific so the active-room blue does not recolour them. */
        .rr-sidebar button .rr-cnt { font-size:0.7rem;font-weight:700;margin-top:2px; }
        .rr-sidebar button .rr-cnt.ok  { color:var(--sp-good-fg,#16a34a); }
        .rr-sidebar button .rr-cnt.bad { color:var(--sp-bad-fg,#dc2626); }
        .rr-prog { display:inline-block;margin-left:6px;font-size:0.6rem;font-weight:800;letter-spacing:0.03em;padding:1px 5px;border-radius:999px;vertical-align:middle; }
        .rr-prog.ok  { color:var(--sp-good-fg,#16a34a);background:var(--sp-good-bg,rgba(22,163,74,0.14));border:1px solid var(--sp-good-br,rgba(22,163,74,0.4)); }
        .rr-prog.bad { color:var(--sp-bad-fg,#dc2626);background:var(--sp-bad-bg,rgba(220,38,38,0.12));border:1px solid var(--sp-bad-br,rgba(220,38,38,0.4)); }

        /* Roster as of a past date */
        .rr-asof-pick { display:flex;align-items:center;gap:6px;font-size:0.75rem;font-weight:600;color:var(--sp-muted);white-space:nowrap; }
        .rr-asof-pick input { padding:3px 6px;border:1px solid var(--sp-border-in);border-radius:4px;font-size:0.75rem;color:var(--sp-text);background:var(--sp-field-bg); }
        .rr-tool { padding:4px 10px;border:1.5px solid var(--sp-border);border-radius:6px;background:var(--sp-surface);color:var(--sp-text-2);font-size:0.72rem;font-weight:700;cursor:pointer;white-space:nowrap; }
        .rr-tool:hover { border-color:var(--sp-accent);color:var(--sp-accent); }
        .rr-tool:focus-visible, .rr-asof-pick input:focus-visible { outline:2px solid var(--sp-accent);outline-offset:2px; }
        .rr-asof-bar { display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--sp-border);background:var(--sp-accent-soft);font-size:0.78rem;color:var(--sp-text); }
        .rr-asof-bar[hidden] { display:none; }
        .rr-asof-bar.err { background:rgba(220,38,38,0.1);color:#b91c1c; }
        .rr-asof-bar .sp { flex:1; }
        .rr-check { text-align:center;font-weight:700; }
        .rr-sr { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand-link" href="/staff/">
        <img src="logo-sm.png" alt="Children Of Promise">
        <div class="brand-text">
            <h1>Children Of Promise</h1>
            <p>Room Roster &nbsp;·&nbsp; Millstadt, IL</p>
        </div>
    </a>
    <div class="header-actions">
        <button type="button" class="header-theme-btn" id="spTheme" aria-pressed="false">☾ Dark mode</button>
        <a class="header-back" href="/staff/">← Staff Portal</a>
    </div>
</header>

<!-- Shared Enrollment Management sub-nav (see ems.html for the note). The room
     definitions + teacher assignment chart split off into Classrooms & Staffing;
     this page is now the per-room student roster only. -->
<style>
    .em-subnav {
        display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
        max-width: 1400px; margin: 0; padding: 10px 20px 0 15%;
    }
    .em-subnav a {
        font-size: 0.9rem; font-weight: 700; text-decoration: none; color: var(--sp-text-2);
        padding: 8px 15px; border-radius: 8px 8px 0 0; border-bottom: 3px solid transparent;
        transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .em-subnav a:hover { color: var(--sp-text); background: var(--sp-surface-2); }
    .em-subnav a.on { color: var(--sp-accent); border-bottom-color: var(--sp-accent); }
    .em-subnav-wrap { border-bottom: 1.5px solid var(--sp-border); }
</style>
<div class="em-subnav-wrap">
    <nav class="em-subnav" aria-label="Enrollment management">
        <a href="/staff/waitinglist.html">Waiting List</a>
        <a href="/staff/ems.html">Enrolled Students</a>
        <a href="/staff/attendance.html">Attendance</a>
        <a href="/staff/benefits.html">Benefits &amp; Eligibility</a>
        <a href="/staff/roster.html" class="on" aria-current="page">Room Roster</a>
        <a href="/staff/rooms.html">Classrooms &amp; Staffing</a>
        <a href="/staff/scheduler.html">Staff Scheduler</a>
    </nav>
</div>

<div class="rr-layout">
    <div class="rr-wrapper">
        <div class="rr-sidebar" id="rosterSidebar"></div>

        <div class="rr-card">
            <div class="rr-header">
                <div class="rr-title" id="rosterRoomTitle"></div>
                <div class="rr-teacher" id="rosterRoomTeacher"></div>
                <label class="rr-toggle" id="rosterActiveOnlyWrap">
                    <input type="checkbox" id="rosterActiveOnly" checked onchange="renderRosterRoom()">
                    Active only
                </label>
                <label class="rr-asof-pick" for="rosterAsOf">Roster as of
                    <input type="date" id="rosterAsOf" aria-describedby="rosterAsOfHelp">
                </label>
            </div>
            <span id="rosterAsOfHelp" class="rr-sr">Pick a past date to see who was enrolled that day, in the room and program they had then.</span>

            <div class="rr-asof-bar" id="rosterAsOfBar" role="status" hidden></div>

            <div class="rr-grid" id="rosterStudentGrid"></div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="/staff/auth.js"></script>
<script>
let rosterStudents = [];
let activeRosterRoomNum = null;

async function init() {
    await Promise.all([loadClassrooms(), loadStudents()]);
    setupAsOf();
    buildRoster();
}

// ── ROSTER AS OF A PAST DATE ──
// asOfDate is null for today (the normal, editable roster). Otherwise asOfKids holds the
// children enrolled on that day, with the room, days and program they had then.
let asOfDate = null;
let asOfKids = null;

function localTodayIso() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function escHtml(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
}

function setupAsOf() {
    const input = document.getElementById('rosterAsOf');
    input.max = localTodayIso();
    input.value = localTodayIso();
    input.addEventListener('change', () => setAsOf(input.value));
}

async function setAsOf(value) {
    const bar = document.getElementById('rosterAsOfBar');
    const today = localTodayIso();
    if (!value || value >= today) {        // today (or cleared) = the normal live roster
        asOfDate = null; asOfKids = null;
        document.getElementById('rosterAsOf').value = today;
        bar.hidden = true; bar.className = 'rr-asof-bar';
        document.getElementById('rosterActiveOnlyWrap').hidden = false;
        buildRoster();
        return;
    }
    bar.hidden = false; bar.className = 'rr-asof-bar';
    bar.textContent = 'Loading the roster for ' + fmtDate(value) + '…';
    try {
        const res = await apiFetch('/api/roster-as-of?date=' + encodeURIComponent(value));
        if (res.status === 401) throw new Error('Your session has expired. Sign in again.');
        const d = await res.json().catch(() => ({}));
        if (!res.ok || !d.ok) throw new Error(d.error || ('HTTP ' + res.status));
        asOfDate = value;
        asOfKids = (d.children || []).map(k => ({
            Id: k.Id, First_Name: k.First_Name, Last_Name: k.Last_Name, Birth_date: k.Birth_date,
            Start_Date: k.Start_Date, RoomNumber: k.RoomNumber, Room: k.Room, Active: 'Yes',
            PFA_PI_na: k.Program, Monday: k.Monday, Tuesday: k.Tuesday, Wednesday: k.Wednesday,
            Thursday: k.Thursday, Friday: k.Friday,
        }));
        document.getElementById('rosterActiveOnlyWrap').hidden = true;
        bar.innerHTML = '<span class="sp"><strong>Roster as of ' + escHtml(fmtDate(value)) + '</strong> &middot; '
            + asOfKids.length + ' enrolled. Read only. Each child is shown in the room and program they had that day.</span>'
            + '<button type="button" class="rr-tool" id="asOfCsv">Download CSV (all rooms)</button>'
            + '<button type="button" class="rr-tool" id="asOfPrint">Print (all rooms)</button>'
            + '<button type="button" class="rr-tool" id="asOfBack">Back to today</button>';
        document.getElementById('asOfCsv').addEventListener('click', downloadAsOfCsv);
        document.getElementById('asOfPrint').addEventListener('click', printAsOf);
        document.getElementById('asOfBack').addEventListener('click', () => setAsOf(''));
        buildRoster();
    } catch (e) {
        // A failed read must never look like an empty roster.
        asOfDate = null; asOfKids = null;
        bar.className = 'rr-asof-bar err';
        bar.textContent = 'Could not load the roster for ' + fmtDate(value) + ': ' + (e.message || e)
            + '. Nothing is missing; this is a read problem. The roster below is today\u2019s.';
        document.getElementById('rosterActiveOnlyWrap').hidden = false;
        buildRoster();
    }
}

// The children the sidebar counts and the table draw from: today's, or the as-of snapshot.
function rosterSource() { return asOfKids || students; }

function roomNameOf(k) {
    const cr = getClassroom(k.RoomNumber);
    return cr ? cr.Room : (k.Room || ('Room ' + (k.RoomNumber || '?')));
}
function asOfSorted() {
    const order = {};
    rosterRooms().forEach((r, i) => { order[String(r.RoomNumber)] = i; });
    return asOfKids.slice().sort((a, b) =>
        ((order[String(a.RoomNumber)] ?? 999) - (order[String(b.RoomNumber)] ?? 999)) || sortByName(a, b));
}
const DAY_KEYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

function downloadAsOfCsv() {
    if (!asOfKids) return;
    // Quote every cell, and defuse anything a spreadsheet would run as a formula.
    const cell = v => {
        let s = String(v == null ? '' : v);
        if (/^[=+\-@]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
    };
    const head = ['Room', 'Last name', 'First name', 'Birth date', 'Start date', 'Program', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    const lines = [head.map(cell).join(',')].concat(asOfSorted().map(k => [
        roomNameOf(k), k.Last_Name, k.First_Name, k.Birth_date, k.Start_Date, k.PFA_PI_na || '',
    ].concat(DAY_KEYS.map(d => isTruthy(k[d]) ? 'Y' : '')).map(cell).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Roster as of ' + asOfDate + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

function printAsOf() {
    if (!asOfKids) return;
    const groups = [];
    asOfSorted().forEach(k => {
        const room = roomNameOf(k);
        let g = groups.find(x => x.room === room);
        if (!g) groups.push(g = { room, kids: [] });
        g.kids.push(k);
    });
    const body = groups.map(g => '<h2>' + escHtml(g.room) + ' <small>(' + g.kids.length + ')</small></h2>'
        + '<table><thead><tr><th>Child</th><th>Program</th>' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map(d => '<th>' + d + '</th>').join('')
        + '</tr></thead><tbody>' + g.kids.map(k => '<tr><td>' + escHtml(k.Last_Name + ', ' + k.First_Name) + '</td><td>'
            + escHtml(k.PFA_PI_na || '') + '</td>' + DAY_KEYS.map(d => '<td>' + (isTruthy(k[d]) ? '&#10003;' : '') + '</td>').join('')
            + '</tr>').join('') + '</tbody></table>').join('');
    const html = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Roster as of ' + escHtml(asOfDate) + '</title>'
        + '<style>body{font-family:Arial,sans-serif;margin:24px;color:#000}h1{font-size:18px}h2{font-size:14px;margin:18px 0 6px}'
        + 'small{font-weight:normal;color:#444}table{border-collapse:collapse;width:100%;font-size:12px}'
        + 'th,td{border:1px solid #999;padding:4px 6px;text-align:left}th:nth-child(n+3),td:nth-child(n+3){text-align:center;width:40px}'
        + 'h2{break-after:avoid}table{break-inside:auto}</style></head><body>'
        + '<h1>Children Of Promise &mdash; roster as of ' + escHtml(fmtDate(asOfDate)) + ' (' + asOfKids.length + ' enrolled)</h1>'
        + body + '</body></html>';
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const w = window.open(url, '_blank');
    if (!w) showNotification('Allow pop-ups for this site to print the roster.', 'error');
    else setTimeout(() => { try { w.print(); } catch (e) { /* user prints from the tab */ } }, 600);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// Read-only table for one room on the as-of date.
function renderAsOfRoom(rn, cr) {
    const grid = document.getElementById('rosterStudentGrid');
    const kids = asOfKids.filter(k => String(k.RoomNumber) === String(rn)).sort(sortByName);
    if (!kids.length) {
        grid.innerHTML = '<div class="rr-empty">No children were enrolled in this room on ' + escHtml(fmtDate(asOfDate)) + '.</div>';
        return;
    }
    const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    grid.innerHTML = '<table><caption class="rr-sr">' + escHtml((cr ? cr.Room : rn) + ' as of ' + fmtDate(asOfDate)) + '</caption>'
        + '<thead><tr><th class="student" scope="col">Student</th>' + dayLabels.map(d => '<th class="day" scope="col">' + d + '</th>').join('')
        + '<th scope="col" style="width:80px;">Program</th></tr></thead><tbody>'
        + kids.map(k => '<tr><td class="student"><div class="rr-name">' + escHtml(k.Last_Name + ', ' + k.First_Name) + progTagHtml(k, cr) + '</div>'
            + '<div class="rr-age">Started ' + escHtml(k.Start_Date || '?') + '</div></td>'
            + DAY_KEYS.map(d => '<td class="day rr-check">' + (isTruthy(k[d]) ? '<span aria-label="attends">&#10003;</span>' : '<span class="rr-sr">no</span>') + '</td>').join('')
            + '<td>' + escHtml(k.PFA_PI_na || '--') + '</td></tr>').join('')
        + '</tbody><tfoot><tr><td class="rr-total-label">Daily Total</td>'
        + DAY_KEYS.map(d => '<td class="rr-total">' + kids.filter(k => isTruthy(k[d])).length + '</td>').join('')
        + '<td></td></tr></tfoot></table>';
}

/* Children who were already inactive when the history began (7 Nov 2026) have no leaving
   date, so past rosters before then leave them off. Filling those in is parked for now; the
   server side is still there if it is wanted later: GET /api/history/missing-end-dates lists
   them and POST /api/history/end-date { id, lastDay } records one (see enrollment-history.js). */

// ── PI / PFA marking (same rule as the attendance page) ──
// A child's program is PFA_PI_na; only PI and PFA children are marked. A room is a
// "program room" when its own Type is PI or PFA. Green = belongs, red = does not.
function childProgram(s) {
    const p = String(s.PFA_PI_na || '').trim().toUpperCase();
    return (p === 'PI' || p === 'PFA') ? p : '';
}
function isProgramRoom(cr) {
    const t = String((cr && cr.Type) || '').trim().toUpperCase();
    return t === 'PI' || t === 'PFA';
}
// The small PI/PFA pill beside a child's name ('' for anyone who is neither).
function progTagHtml(s, cr, tagId) {
    const prog = childProgram(s);
    if (!prog) return tagId ? `<span id="${tagId}"></span>` : '';
    const ok = isProgramRoom(cr);
    const why = ok ? `${prog} child in a PI or PFA room`
                   : `${prog} child in a room that is not a PI or PFA room`;
    return `<span${tagId ? ` id="${tagId}"` : ''} class="rr-prog ${ok ? 'ok' : 'bad'}" title="${why}" aria-label="${why}">${prog}</span>`;
}

// ── SIDEBAR ──
// Under each room name: how many ACTIVE PI/PFA children are in it, green when the room is
// a PI/PFA room and red when it is not. The label names what the children are ("3 PI",
// "3 PFA", or "3 PI/PFA" for a mix), exactly as the attendance sidebar does. Rooms with
// no PI/PFA children show nothing.
function roomProgramCount(rn) {
    const kids = rosterSource().filter(s => String(s.RoomNumber) === String(rn) && isTruthy(s.Active) && childProgram(s));
    if (!kids.length) return '';
    const progs = new Set(kids.map(childProgram));
    const label = progs.size === 1 ? [...progs][0] : 'PI/PFA';
    const ok = isProgramRoom(getClassroom(rn));
    const why = ok ? `${kids.length} ${label} in a PI or PFA room`
                   : `${kids.length} ${label} in a room that is not a PI or PFA room`;
    return `<div class="rr-cnt ${ok ? 'ok' : 'bad'}" title="${why}" aria-label="${why}">${kids.length} ${label}</div>`;
}

/* Room order on this page: INCCRA rooms first, then PI, then PFA, then anything else
   (Before and Afterschool), each group youngest to oldest. /api/classrooms already returns
   the rooms youngest-first (the server's age ladder), and a stable sort keeps that order
   inside each group. Grouped by the room's program TYPE, not its name. */
const ROSTER_PROGRAM_ORDER = { INCCRA: 0, PI: 1, PFA: 2 };
function rosterRooms() {
    const grp = r => {
        const t = String(r.Type || '').trim().toUpperCase();
        return t in ROSTER_PROGRAM_ORDER ? ROSTER_PROGRAM_ORDER[t] : 3;
    };
    return classrooms.map((r, i) => ({ r, i }))
        .sort((a, b) => (grp(a.r) - grp(b.r)) || (a.i - b.i))
        .map(x => x.r);
}

function renderRosterSidebar() {
    const sidebar = document.getElementById('rosterSidebar');
    const rooms = rosterRooms().map(r => r.RoomNumber);
    if (!activeRosterRoomNum && rooms.length) activeRosterRoomNum = rooms[0];
    sidebar.innerHTML = rooms.map(rn => {
        const cr = getClassroom(rn);
        const isActive = String(activeRosterRoomNum) === String(rn);
        return `<button class="${isActive ? 'active' : ''}" onclick="selectRosterRoom('${rn}')">
            <div>${cr ? cr.Room : rn}</div>
            ${roomProgramCount(rn)}
        </button>`;
    }).join('');
}

function buildRoster() {
    renderRosterSidebar();
    renderRosterRoom();
}

function selectRosterRoom(rn) {
    activeRosterRoomNum = rn;
    buildRoster();
}

// ── ROSTER TABLE ──
function renderRosterRoom() {
    const rn = activeRosterRoomNum;
    const cr = getClassroom(rn);
    document.getElementById('rosterRoomTitle').textContent = cr ? cr.Room : (rn || '');
    document.getElementById('rosterRoomTeacher').textContent = cr ? cr.TeacherDescription : '';
    if (asOfKids) return renderAsOfRoom(rn, cr);   // a past date: read-only snapshot

    const activeOnly = document.getElementById('rosterActiveOnly')?.checked !== false;
    rosterStudents = students
        .filter(s => String(s.RoomNumber) === String(rn) && (!activeOnly || isTruthy(s.Active)))
        .sort(sortByName);

    const grid = document.getElementById('rosterStudentGrid');
    if (!rosterStudents.length) {
        grid.innerHTML = '<div class="rr-empty">No students found.</div>';
        return;
    }

    const roomOpts = rosterRooms().map(r => `<option value="${r.RoomNumber}">${r.Room}</option>`).join('');
    const dayKeys = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
    const dayLabels = ['Mon','Tue','Wed','Thu','Fri'];

    grid.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th style="width:160px;">Room</th>
                    <th class="student">Student</th>
                    ${dayLabels.map(d => `<th class="day">${d}</th>`).join('')}
                    <th style="width:80px;">Program</th>
                    <th style="width:52px;">Active</th>
                    <th style="width:44px;text-align:center;">Save</th>
                </tr>
            </thead>
            <tbody>
                ${rosterStudents.map((s, i) => {
                    const dd = (id, opts) => `<select id="${id}" onchange="markRosterChanged(${i})">${opts}</select>`;
                    const dayChecks = dayKeys.map((k, di) =>
                        `<td class="day"><input type="checkbox" id="rDay${i}_${di}" ${isTruthy(s[k]) ? 'checked' : ''} onchange="markRosterChanged(${i})"></td>`
                    ).join('');
                    return `<tr>
                        <td>${dd('rosterRoom' + i, roomOpts)}</td>
                        <td class="student">
                            <div class="rr-name">${s.Last_Name}, ${s.First_Name}${progTagHtml(s, cr, 'rosterTag' + i)}</div>
                            <div class="rr-age">${ageInMonthsDays(s.Birth_date)}</div>
                        </td>
                        ${dayChecks}
                        <td>${dd('rosterPfaPiNa' + i,
                            '<option value="">--</option>' +
                            `<option value="PFA" ${s.PFA_PI_na === 'PFA' ? 'selected' : ''}>PFA</option>` +
                            `<option value="PI" ${s.PFA_PI_na === 'PI' ? 'selected' : ''}>PI</option>` +
                            `<option value="INCCRA" ${s.PFA_PI_na === 'INCCRA' ? 'selected' : ''}>INCCRA</option>`)}</td>
                        <td>${dd('rosterActive' + i,
                            `<option value="Yes" ${isTruthy(s.Active) ? 'selected' : ''}>Yes</option>` +
                            `<option value="No" ${!isTruthy(s.Active) ? 'selected' : ''}>No</option>`)}</td>
                        <td style="text-align:center;">
                            <button class="btn-row-save" id="rosterSave${i}" onclick="saveRosterRow(${i})" disabled>Save</button>
                        </td>
                    </tr>`;
                }).join('')}
            </tbody>
            <tfoot>
                <tr>
                    <td></td>
                    <td class="rr-total-label">Daily Total</td>
                    ${dayKeys.map((k, di) => {
                        const total = rosterStudents.filter(s => isTruthy(s[k])).length;
                        return `<td class="rr-total" id="dayTotal${di}">${total}</td>`;
                    }).join('')}
                    <td colspan="3"></td>
                </tr>
            </tfoot>
        </table>`;

    // Selects need their value set after render (option lists are built from data).
    rosterStudents.forEach((s, i) => {
        const sel = document.getElementById(`rosterRoom${i}`);
        if (sel) sel.value = s.RoomNumber || '';
    });
}

function ageInMonthsDays(birthDate) {
    if (!birthDate) return '';
    const bd = new Date(birthDate);
    if (isNaN(bd)) return '';
    const now = new Date();
    let months = (now.getFullYear() - bd.getFullYear()) * 12 + (now.getMonth() - bd.getMonth());
    let days = now.getDate() - bd.getDate();
    if (days < 0) {
        months--;
        const prev = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prev.getDate();
    }
    return `${months}m ${days}d`;
}

function markRosterChanged(i) {
    const btn = document.getElementById(`rosterSave${i}`);
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
    // Recompute daily totals from the live checkboxes.
    ['Monday','Tuesday','Wednesday','Thursday','Friday'].forEach((k, di) => {
        let total = 0;
        rosterStudents.forEach((s, si) => {
            const cb = document.getElementById(`rDay${si}_${di}`);
            total += cb ? (cb.checked ? 1 : 0) : (isTruthy(s[k]) ? 1 : 0);
        });
        const cell = document.getElementById(`dayTotal${di}`);
        if (cell) cell.textContent = total;
    });
}

async function saveRosterRow(i) {
    const s = rosterStudents[i];
    const newRoom    = document.getElementById(`rosterRoom${i}`)?.value || s.RoomNumber || '';
    const newPayType = s.Category || '';
    const newPfaPiNa = document.getElementById(`rosterPfaPiNa${i}`)?.value || s.PFA_PI_na || '';
    const newActive  = document.getElementById(`rosterActive${i}`)?.value || s.Active || 'Yes';
    const btn = document.getElementById(`rosterSave${i}`);
    // Marking a child inactive: ask when they left, so a roster for any past day is right.
    let lastDayAttended = null;
    if (isTruthy(s.Active) && newActive === 'No') {
        lastDayAttended = await askLastDay(`${s.First_Name} ${s.Last_Name}`);
        if (!lastDayAttended) return;           // cancelled: nothing is saved
    }
    btn.disabled = true; btn.textContent = '…';

    const frpFood = computeFRP({
        income: s.HouseholdIncome,
        householdSize: s.HouseholdSize,
        benefits: s.PublicBenefits || '',
        isFoster: newPayType === 'Foster',
        isMilitary: isTruthy(s.Military),
        isPFA: newPfaPiNa === 'PFA',
    });

    const body = {
        firstName: s.First_Name, lastName: s.Last_Name,
        birthDate: s.Birth_date, startDate: s.Start_Date,
        cityTown: s.City_Town, daysOld: s.Days_Old,
        roomNumber: newRoom,
        active: newActive, category: newPayType,
        monday:    document.getElementById(`rDay${i}_0`)?.checked || false,
        tuesday:   document.getElementById(`rDay${i}_1`)?.checked || false,
        wednesday: document.getElementById(`rDay${i}_2`)?.checked || false,
        thursday:  document.getElementById(`rDay${i}_3`)?.checked || false,
        friday:    document.getElementById(`rDay${i}_4`)?.checked || false,
        pfaPiNa: newPfaPiNa, frpFood: frpFood,
        lastDayAttended: lastDayAttended,
        id: s.Id,   // update exactly this child, not anyone who shares the name
        iep: isTruthy(s.IEP), military: isTruthy(s.Military),
        householdIncome: s.HouseholdIncome || '',
        householdSize: s.HouseholdSize || '',
        publicBenefits: s.PublicBenefits || '',
    };

    try {
        const res = await apiFetch(`/api/students/${encodeURIComponent(s.First_Name)}/${encodeURIComponent(s.Last_Name)}`, {
            method: 'PUT', body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
            Object.assign(rosterStudents[i], {
                RoomNumber: newRoom, Category: newPayType,
                PFA_PI_na: newPfaPiNa, Active: newActive, F_R_P_Food: frpFood,
            });
            btn.style.opacity = '0.4';
            // Refresh ONLY the room counts and this child's tag. Redrawing the table would
            // throw away unsaved edits on the other rows, and a moved child's row stays
            // put until the next load, as it always has.
            renderRosterSidebar();
            const tag = document.getElementById(`rosterTag${i}`);
            if (tag) tag.outerHTML = progTagHtml(s, getClassroom(newRoom), `rosterTag${i}`);
            showNotification(`${s.First_Name} ${s.Last_Name} updated`, 'success');
        } else {
            showNotification('Update failed: ' + (data.error || ''), 'error');
            btn.disabled = false;
        }
    } catch (e) {
        showNotification('Network error', 'error');
        btn.disabled = false;
    } finally {
        btn.textContent = 'Save';
    }
}

init();
</script>
